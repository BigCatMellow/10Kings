<title>Regions and Geography</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: an atlas board. One column per region (plus Port, the Spine, the border towns and the world as a whole); cards grouped under headings that later parts add to, so the board grows downward; connections are chips on the card, drawn as lines only for the selected card. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1c2420; --muted: #5c6863; --line: #d3d9d5; --lane: #e8ece8;
  --focus: #0f766e; --inferred: #9a6b1f;
  --r-northwind: #3f6f9f; --r-ironcrest: #a4522f; --r-greenvale: #5f9433; --r-highridge: #b98f22; --r-deepwood: #2e6a4d; --r-sunplains: #d0702a; --r-port: #6c4f9c; --r-spine: #7b6f64; --r-borderlands: #5c6863; --r-across: #5c6863;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
    --focus: #3cc4b3; --inferred: #e0a852;
    --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
  --focus: #3cc4b3; --inferred: #e0a852;
  --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 20px 40px; max-width: 1640px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; margin-bottom: 10px; }
.eyebrow { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.count { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.count b { font-family: var(--font-display); font-size: 1.3rem; margin-right: 4px; }
@media (max-width: 600px) { .counts { gap: 4px; } .count { padding: 2px 7px; font-size: 12px; } .count b { font-size: 1rem; } h1 { font-size: 1.8rem; } }
.controls { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 10px 0 12px; font-size: 13px; color: var(--muted); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.controls input[type=checkbox] { accent-color: var(--focus); }
.controls input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 200px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 82vh; }
.lanes { position: relative; display: flex; gap: 12px; padding: 10px; width: max-content; align-items: stretch; }
.lane { width: 208px; flex: none; background: var(--lane); border-radius: 8px; padding: 0 8px 10px; position: relative; } /* no z-index: cards must stack above the link lines, which sit above the lanes */
.lane > h3 { position: sticky; top: 0; z-index: 3; margin: 0 -8px 8px; padding: 9px 10px 7px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; background: var(--lane); border-radius: 8px 8px 0 0; border-top: 4px solid var(--lc); }
.section { margin-top: 10px; }
.section > h4 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; padding: 8px 9px 9px; margin-bottom: 8px; cursor: pointer; position: relative; z-index: 2; transition: opacity .15s, box-shadow .15s; }
.card:hover { box-shadow: 0 2px 10px rgb(0 0 0 / .1); }
.card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.card .k { display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .n { display: block; font-weight: 700; font-size: 14px; line-height: 1.25; margin: 1px 0 3px; }
.card .t { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
.card.region .n { font-family: var(--font-display); font-size: 19px; letter-spacing: .01em; }
.card.minor { padding: 6px 9px; border-style: dashed; border-left-style: solid; }
.card.minor .n { font-weight: 600; font-size: 13px; margin: 0; }
.chips { display: grid; gap: 4px; margin-top: 7px; }
.chiprow { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
.chiprow b { font-weight: 600; color: var(--muted); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1.2; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.chip small { font-size: 10px; color: var(--muted); }
.chip.inferred small { color: inherit; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dc); flex: none; }
.chip.likely, .chip.working { border-style: dashed; }
.chip.possible { border-style: dotted; }
.chip.inferred { border: 1px dashed var(--inferred); color: var(--inferred); background: transparent; }
.hide-inferred .chip.inferred, .hide-inferred .chiprow.inferred { display: none; }
svg.links { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg.links path { fill: none; stroke: var(--focus); stroke-width: 2; opacity: .85; }
svg.links path.inferred { stroke: var(--inferred); stroke-dasharray: 4 4; }
svg.links path.likely, svg.links path.working { stroke-dasharray: 8 5; }
svg.links path.possible { stroke-dasharray: 2 5; }
.board.focus .card:not(.hot) { opacity: .28; }
.card.sel { box-shadow: 0 0 0 3px var(--focus); }
.card.dimmed { display: none; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 86vh; overflow: auto; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 2px 0 6px; line-height: 1.05; text-wrap: balance; }
.panel h4 { font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.panel dl { margin: 8px 0 0; }
.panel dt { font-size: 12px; color: var(--muted); }
.panel dd { margin: 0 0 6px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conn { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
.conn.inferred { border-left-color: var(--inferred); }
.conn button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.conn button:hover { text-decoration-color: var(--focus); }
.conn q { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.conn a { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.tag.inferred { color: var(--inferred); border-color: var(--inferred); }
.panel a { color: var(--focus); }
.status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.below section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.below h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 8px; }
.below ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

ue}, {"id": "mountain", "label": "Spine and Underpass", "default": true}, {"id": "trade", "label": "Trade (stated)", "default": true}, {"id": "trade-inferred", "label": "Trade (inferred)", "default": false}, {"id": "landmass", "label": "Continents", "default": false}], "kinds": {"landmass": "Continent", "region": "Region", "hub": "Neutral city", "mountains": "Mountain system", "underground": "Underground network", "border-town": "Border town", "name-bank": "Unplaced name"}, "nodes": [{"id": "western", "kind": "landmass", "label": "Western Continent", "status": "Working canon", "text": "One of three broad landmasses. The wiki does not say which regions sit on it; Ironcrest is described as 'western upland country'.", "src": "Geography-and-Connections.md#macro-geography", "part": "Geography", "lane": "across", "section": "Continents", "short_text": "One of three landmasses."}, {"id": "northern", "kind": "landmass", "label": "Northern Continent", "status": "Working canon", "text": "One of three broad landmasses. Northwind 'occupies much of the Northern Continent and associated coasts and islands'.", "src": "Geography-and-Connections.md#macro-geography", "part": "Geography", "lane": "across", "section": "Continents", "short_text": "One of three landmasses."}, {"id": "eastern", "kind": "landmass", "label": "Eastern Continent", "status": "Working canon", "text": "One of three broad landmasses. The wiki does not say which regions sit on it; Sunplains is 'southern/eastern country'.", "src": "Geography-and-Connections.md#macro-geography", "part": "Geography", "lane": "across", "section": "Continents", "short_text": "One of three landmasses."}, {"id": "northwind", "kind": "region", "label": "Northwind", "status": "Working canon", "text": "Cold northern coasts, islands, sheltered inland valleys and old clan territories. Settlements cluster at harbors, bays, rivers, fisheries and routes south.", "src": "Regions/Northwind.md", "facts": {"Terrain": "cold seas, seasonal storms, rocky coasts, sheltered coves, some partially freezing waters, inland routes toward Highridge", "Exports": "fish, salt and preserved foods, furs and animal products, ships and maritime capacity", "Imports": "grain, metal goods, medicines, warmer-climate produce", "Pressures": "shifting fish stocks, rising piracy, convoy agreements with Port, accusations that clans cooperate with raiders", "Seasons": "in winter, northern routes become unreliable (Trade and Dependencies)"}, "part": "Geography", "lane": "northwind", "section": "Geography", "short_text": "Cold coasts, islands and clan valleys; harbors and fisheries."}, {"id": "ironcrest", "kind": "region", "label": "Ironcrest", "status": "Working canon", "text": "Much of the western upland country: mineral-rich hills, stream valleys, wooded slopes, pasture and farmland around old mining and metalworking centers.", "src": "Regions/Ironcrest.md", "facts": {"Terrain": "mineral hills, stream valleys, wooded slopes, pasture; eastern and southeastern edges grade into Greenvale, Highridge and parts of Deepwood", "Exports": "ores, metalwork, tools, weapons, industrial craft capacity", "Imports": "substantial food in industrial districts, timber and fuel, seasonal labor, some luxuries", "Pressures": "labor unrest, covert metal shipments, pressure to expand Underpass access, fears of weapon stockpiling"}, "part": "Geography", "lane": "ironcrest", "section": "Geography", "short_text": "Western uplands: mines, streams, pasture and forges."}, {"id": "greenvale", "kind": "region", "label": "Greenvale", "status": "Working canon", "text": "The largest major agricultural heartland: broad temperate lowlands with comparatively reliable rainfall and productive soils, market towns, rivers, orchards, wetlands, mills and estates.", "src": "Regions/Greenvale.md", "facts": {"Terrain": "temperate lowlands and rolling country; grades into Ironcrest foothills, Highridge routes, Deepwood margins and warmer Sunplains country", "Exports": "grain, produce, livestock products, textiles and other agricultural goods", "Imports": "metal tools, preservation salt, shipping and caravan access", "Pressures": "an unusually abundant harvest or new high-yield seed strain, collapsing prices, land consolidation, co-ops against estates"}, "part": "Geography", "lane": "greenvale", "section": "Geography", "short_text": "The largest farming heartland: broad temperate lowlands."}, {"id": "highridge", "kind": "region", "label": "Highridge Plateau", "status": "Working canon", "text": "A highland crossroads: routes that avoid or cross parts of the Spine converge here. Exposed uplands, sheltered valleys, steep passes and towns at water and route junctions.", "src": "Regions/Highridge-Plateau.md", "facts": {"Terrain": "exposed uplands, sheltered valleys, steep passes, seasonal streams, grazing country, caravan corridors", "Exports": "route access, caravan services, brokerage, arbitration, credit, records and specialist knowledge", "Imports": "many lowland and coastal goods", "Pressures": "caravan attacks, manipulated route closures, accusations of corrupt militia or toll officials, contested infrastructure"}, "part": "Geography", "lane": "highridge", "section": "Geography", "short_text": "Highland crossroads where routes around the Spine meet.", "short": "Highridge"}, {"id": "deepwood", "kind": "region", "label": "Deepwood", "status": "Working canon", "text": "A major forest region: old-growth and managed woodland, river valleys, wetlands, clearings, forest-edge towns, timber districts and restricted areas.", "src": "Regions/Deepwood.md", "facts": {"Terrain": "old-growth and managed forest, river valleys, wetlands, clearings; routes into foothills and possibly Underpass entrances", "Exports": "timber, herbs and medicinals, dyes, forest products, specialist ecological knowledge", "Imports": "selected metal tools, salt, grain and urban goods", "Pressures": "logging beyond accepted limits, fungal disease, isolationists against reformers, hidden-route crime"}, "part": "Geography", "lane": "deepwood", "section": "Geography", "short_text": "Old-growth and managed forest, rivers and wetlands."}, {"id": "sunplains", "kind": "region", "label": "Sunplains", "status": "Working canon", "text": "Warmer, drier southern and eastern country of city-states, irrigated basins, orchard belts, grazing country and coast. Water law is politically important.", "src": "Regions/Sunplains.md", "facts": {"Terrain": "dry plains, river valleys, irrigated basins, orchard belts, grazing country, coast, scrub, some fertile deltas", "Exports": "orchard and irrigated crops, oils and wines where appropriate, craft and luxury goods, southern maritime access", "Imports": "selected timber, metal, furs and northern goods", "Pressures": "drought fears, private control of canals, city-state blocs forming and breaking"}, "part": "Geography", "lane": "sunplains", "section": "Geography", "short_text": "Warm, dry south and east: city-states, orchards, irrigation."}, {"id": "port", "kind": "hub", "label": "Port", "status": "Working canon", "text": "The major neutral commercial city. It matters for its network position and institutions, not as the only harbor. Its exact site isn't fixed; it belongs to no kingdom.", "src": "Places/Port.md", "facts": {"Exports": "shipping access, repair, warehousing, processing, finance, arbitration, information, neutral exchange", "Imports": "significant food and raw-material inflows", "Why it stays central": "network effects: agents, credit, warehouses, courts and translators are already there", "Position": "not fixed; its site should give 'a position convenient to both northern and southern sea routes' and 'access to inland rivers or roads'", "Territory": "unsettled: Frostbay Way is described 'if Port is territorially separate'"}, "part": "Geography", "lane": "port", "section": "Geography", "short_text": "The major neutral commercial city."}, {"id": "spine", "kind": "mountains", "label": "The Spine", "status":   $("sections").innerHTML = partNames.length > 1 ? "Show: " + partNames.map((s) => `<label><input type="checkbox" data-part="${esc(s)}" checked> ${esc(s)}</label>`).join(" ") : "";

  // how each connection reads from each end
  const phr = (e, fromSide) => fromSide ? (e.chip || e.type) : (e.chipBack || e.chip || e.type);

  // build lanes
  const lanesEl = $("lanes");
  const cardEls = {};
  DATA.lanes.forEach((l) => {
    const lane = document.createElement("div");
    lane.className = "lane"; lane.style.setProperty("--lc", colorVar(l.id));
    lane.innerHTML = `<h3>${esc(l.label)}</h3>`;
    const inLane = DATA.nodes.filter((n) => n.lane === l.id);
    [...new Set(inLane.map((n) => n.section))].forEach((sec) => {
      const s = document.createElement("div");
      s.className = "section"; s.dataset.part = partOf(inLane.find((n) => n.section === sec));
      s.innerHTML = `<h4>${esc(sec)}</h4>`;
      inLane.filter((n) => n.section === sec).forEach((n) => s.appendChild(card(n)));
      lane.appendChild(s);
    });
    lanesEl.appendChild(lane);
  });

  function chipsFor(n) {
    const rows = {};
    DATA.edges.forEach((e) => {
      let other, label;
      if (e.from === n.id) { other = e.to; label = phr(e, true); }
      else if (e.to === n.id) { other = e.from; label = phr(e, false); }
      else return;
      if (e.hideChipOn && e.hideChipOn.includes(n.id)) return;
      const o = byId[other];
      if (e.basis !== "inferred") (rows[label] = rows[label] || { chips: [], allInferred: true }).allInferred = false;
      const cls = [e.basis === "inferred" ? "inferred" : "", e.certainty && e.certainty !== "established" ? e.certainty : ""].join(" ");
      const extra = e.goods && e.chipGoods !== false ? ` <small class="g">${esc(e.goods)}</small>` : "";
      (rows[label] = rows[label] || { chips: [], allInferred: true }).chips.push(`<span class="chip ${cls}" style="--dc:${nodeColor(o)}"><i></i>${esc(o.short || o.label)}${extra}${e.certainty && e.certainty !== "established" ? ` <small>(${esc(e.certainty)})</small>` : ""}</span>`);
    });
    return Object.entries(rows).map(([label, r]) => `<span class="chiprow${r.allInferred ? " inferred" : ""}"><b>${esc(label)}</b>${r.chips.join("")}</span>`).join("");
  }
  function card(n) {
    const b = document.createElement("button");
    b.type = "button";
    const minor = n.minor ? " minor" : "";
    b.className = `card ${n.kind}${minor}`;
    b.style.setProperty("--lc", nodeColor(n));
    b.dataset.id = n.id;
    const chips = n.minor ? "" : chipsFor(n);
    b.innerHTML = n.minor ? `<span class="n">${esc(n.label)}</span>` :
      `<span class="k">${esc(DATA.kinds[n.kind])}</span><span class="n">${esc(n.label)}</span><span class="t">${esc(n.short_text || n.text)}</span>${chips ? `<span class="chips">${chips}</span>` : ""}`;
    b.addEventListener("click", () => select(n.id));
    cardEls[n.id] = b;
    return b;
  }

  // lines for the selected card only
  const board = $("board"), svg = $("links");
  function drawLinks(id) {
    svg.innerHTML = "";
    if (!id) return;
    const W = lanesEl.scrollWidth, H = lanesEl.scrollHeight;
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const base = lanesEl.getBoundingClientRect();
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    const a = box(cardEls[id]);
    DATA.edges.forEach((e) => {
      if (e.from !== id && e.to !== id) return;
      if (e.basis === "inferred" && !$("optInferred").checked) return;
      const other = e.from === id ? e.to : e.from;
      const el = cardEls[other];
      if (!el || el.offsetParent === null) return;
      const b = box(el);
      const right = b.x > a.x + a.w / 2;
      const sameLane = Math.abs(b.x - a.x) < 20;
      let d;
      if (sameLane) {
        const x = a.x + a.w, y1 = a.y + a.h / 2, y2 = b.y + b.h / 2;
        d = `M${x},${y1} C${x + 40},${y1} ${x + 40},${y2} ${x},${y2}`;
      } else {
        const sx = right ? a.x + a.w : a.x, sy = a.y + Math.min(a.h / 2, 40);
        const tx = right ? b.x : b.x + b.w, ty = b.y + Math.min(b.h / 2, 40);
        const dx = Math.max(40, Math.abs(tx - sx) / 2.5) * (right ? 1 : -1);
        d = `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
      }
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("class", `${e.basis === "inferred" ? "inferred" : ""} ${e.certainty || ""}`);
      svg.appendChild(p);
    });
  }

  let current = null;
  function select(id) {
    current = id;
    Object.values(cardEls).forEach((c) => c.classList.remove("hot", "sel"));
    board.classList.toggle("focus", !!id);
    if (!id) { drawLinks(null); intro(); return; }
    const n = byId[id];
    cardEls[id].classList.add("hot", "sel");
    const conns = DATA.edges.filter((e) => (e.from === id || e.to === id) && (e.basis === "stated" || $("optInferred").checked));
    conns.forEach((e) => { const o = e.from === id ? e.to : e.from; cardEls[o] && cardEls[o].classList.add("hot"); });
    drawLinks(id);
    const groups = {};
    DATA.edges.filter((e) => e.from === id || e.to === id).forEach((e) => { (groups[e.group || e.layer] = groups[e.group || e.layer] || []).push(e); });
    const facts = n.facts ? `<dl>${Object.entries(n.facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
    const layerName = Object.fromEntries((DATA.layers || []).map((l) => [l.id, l.label]));
    const html = Object.entries(groups).map(([g, es]) => `<h4>${esc(layerName[g] || g)}</h4><ul>${es.map((e) => {
      const other = e.from === id ? e.to : e.from;
      const lab = e.from === id ? e.type : (e.chipBack || e.type);
      return `<li class="conn ${e.basis}"><span>${esc(lab)} </span><button type="button" data-go="${other}">${esc(byId[other].label)}</button>${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " (" + esc(a.note) + ")" : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])} · ${esc(laneOf[n.lane].label)}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span><p>${esc(n.text)}</p>${facts}${html}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToCard(b.dataset.go); }));
  }
  function scrollToCard(id) {
    const el = cardEls[id]; if (!el) return;
    const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.left < br.left || r.right > br.right || r.top < br.top || r.bottom > br.bottom)
      board.scrollBy({ left: r.left - br.left - br.width / 3, top: r.top - br.top - 60, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function intro() {
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2><p>${esc(DATA.intro || "")}</p>`;
  }
  board.addEventListener("click", (ev) => { if (!ev.target.closest(".card")) select(null); });

  // search
  $("q").addEventListener("input", () => {
    const q = $("q").value.trim().toLowerCase();
    Object.entries(cardEls).forEach(([id, el]) => { const n = byId[id]; el.classList.toggle("dimmed", !!q && !(n.label + " " + n.text).toLowerCase().includes(q)); });
    if (current) drawLinks(current);
  });
  // toggles
  $("optInferred").addEventListener("change", () => { board.classList.toggle("hide-inferred", !$("optInferred").checked); if (current) select(current); });
  board.classList.add("hide-inferred");
  document.querySelectorAll("input[data-part]").forEach((c) => { c.addEventListener("change", () => {
    document.querySelectorAll(`.section[data-part="${CSS.escape(c.dataset.part)}"]`).forEach((s) => { s.hidden = !c.checked; });
    if (current) drawLinks(current);
  }); });
  window.addEventListener("resize", () => { if (current) drawLinks(current); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) drawLinks(current); });

  $("gaps").innerHTML = (DATA.gaps || []).map((g) => `<li>${esc(g)}</li>`).join("");
  select(null);
})();
</script>

 trimmings and stale bread become valuable calories.", "short_text": "Roasted bones simmered all day into a meal.", "facts": {"Why it exists": "Bones, trimmings and stale bread become valuable calories.", "Key ingredients": "Roasted marrow or joint bones; charred onion; dried mushroom; thyme or sage; water; salt; stale bread or grain.", "Method": "Bones are roasted by the hearth, then barely simmered for much of the day with water, onion and mushrooms. Laboring households don't skim all the fat, and bread crumbs or cooked grain turn it into a meal."}, "part": "Food"}, {"id": "d-forge-fired-sausages", "kind": "dish", "label": "Forge-Fired Sausages", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#6-forge-fired-sausages", "text": "Sausage turns scraps into portable, preservable protein.", "short_text": "Scraps turned into portable, smokable sausage.", "facts": {"Why it exists": "Sausage turns scraps into portable, preservable protein.", "Key ingredients": "Chopped goat, pork-like livestock or game; fat; salt; dried allium; rock thyme; pepper-like pungent seed; cleaned casing.", "Method": "Meat and fat are chopped rather than finely ground in poorer districts, seasoned, and poached or gently heated first. Some are eaten fresh; others hang in a smokehouse. Work stalls split smoked sausages and sear them on iron plates."}, "part": "Food"}, {"id": "d-smoked-meat-and-root-pie", "kind": "dish", "label": "Smoked Meat and Root Pie", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#7-smoked-meat-and-root-pie", "text": "A portable meal for shifts, travel and winter storage.", "short_text": "A sturdy hand pie for shifts, travel and winter.", "facts": {"Why it exists": "A portable meal for shifts, travel and winter storage.", "Key ingredients": "Coarse grain pastry; smoked meat; cooked roots; onion; thick broth or gravy; hard cheese if available.", "Method": "Leftover stew meat and roots are bound with reduced broth, shaped into thick hand pies and baked in a communal oven or lidded iron pan. The crust is meant to be sturdy, not delicate."}, "part": "Food"}, {"id": "d-ember-nuts", "kind": "dish", "label": "Ember Nuts", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#8-ember-nuts", "text": "Roasted in a heavy pan near the hearth and tossed with salt, toasted grain dust and fat.", "short_text": "Hearth-roasted street nuts.", "facts": {"Key ingredients": "Nuts; salt; toasted grain dust; a little rendered fat.", "Method": "Roasted in a heavy pan near the hearth and tossed with salt, toasted grain dust and fat.", "Variations": "Imported spice makes this ordinary street food noticeably more expensive."}, "part": "Food"}, {"id": "d-salt-fish-and-barley-porridge", "kind": "dish", "label": "Salt-Fish and Barley Porridge", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#1-salt-fish-and-barley-porridge", "text": "Preserved fish stretches a grain breakfast through winter.", "short_text": "A winter breakfast stretched with preserved fish.", "facts": {"Why it exists": "Preserved fish stretches a grain breakfast through winter.", "Key ingredients": "Barley or oats; water or light fish broth; soaked salt fish; leek or onion; root vegetable; dill-like herb; rendered animal fat or butter.", "Method": "Salt fish is soaked and rinsed. Grain simmers until nearly soft, roots and alliums go in, and the fish is added near the end so it stays in flakes, with a little fat stirred through."}, "part": "Food"}, {"id": "d-hearthfire-fish-and-root-bake", "kind": "dish", "label": "Hearthfire Fish and Root Bake", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#2-hearthfire-fish-and-root-bake", "text": "The evening meal uses the same masonry hearth that warms the house.", "short_text": "Supper baked in the house-warming hearth's falling heat.", "facts": {"Why it exists": "The evening meal uses the same masonry hearth that warms the house.", "Key ingredients": "Whole cod-like fish, haddock-like fish or char; thin-sliced turnip, parsnip or potato-like roots; coarse grain crumbs; sea salt; kelp; dill-like herbs; tart berries or imported sour fruit.", "Method": "The oven is fired earlier for bread and heat. Roots go into a clay dish with fat and a little broth, the fish rests on top under crumbs and herbs, and it cooks in falling heat rather than fierce flame.", "Serving": "Tart berry mash is spooned over at the table."}, "part": "Food"}, {"id": "d-frostbound-fish-stew", "kind": "dish", "label": "Frostbound Fish Stew", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#3-frostbound-fish-stew", "text": "A communal pot turns small fish, kelp and roots into a substantial supper.", "short_text": "A communal hearth pot replenished all day.", "facts": {"Why it exists": "A communal pot turns small fish, kelp and roots into a substantial supper.", "Key ingredients": "Fresh and/or smoked fish; fish stock; kelp; roots; onion; barley; seal fat, butter or other local cooking fat; juniper-like herb.", "Method": "Roots and barley begin first, kelp and smoked fish flavor the broth, and fresh fish goes in only near the end. The pot stays hot at the central hearth and is replenished during the day.", "Note": "Correction to early brainstorming: chilling cooked stew in snow can preserve it but doesn't \"gelatinize\" fish broth. Thick versions come from barley, collagen-rich fish parts or reduction."}, "part": "Food"}, {"id": "d-frosted-mead-cakes", "kind": "dish", "label": "Frosted Mead Cakes", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#4-frosted-mead-cakes", "text": "A durable oat cake that turns scarce sweetness into travel food.", "short_text": "Honey-glazed oat cakes for travel.", "facts": {"Why it exists": "A durable oat cake that turns scarce sweetness into travel food.", "Key ingredients": "Coarse oats; honey; small beer or mead; butter or rendered fat; salt.", "Method": "A stiff oat batter is cooked on a griddle or baking stone and brushed with honey while hot. In winter they cool rapidly outdoors, setting the glaze.", "Serving": "They travel well with cheese, smoked fish or berry paste."}, "part": "Food"}, {"id": "d-snow-dried-fish-cakes", "kind": "dish", "label": "Snow-Dried Fish Cakes", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#5-snow-dried-fish-cakes", "text": "Fish is flaked into root mash, bound with grain meal, formed into patties, chilled and fried on a hearth griddle.", "short_text": "Salt fish and root mash fried as patties.", "facts": {"Key ingredients": "Soaked salt fish; mashed roots; oat or barley meal; egg when available; onion; herbs; cooking fat.", "Method": "Fish is flaked into root mash, bound with grain meal, formed into patties, chilled and fried on a hearth griddle.", "Serving": "Coastal households serve them with fermented berry relish or pickled kelp."}, "part": "Food"}, {"id": "d-kelp-crisps", "kind": "dish", "label": "Kelp Crisps", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#6-kelp-crisps", "text": "Rinsed, lightly salted, dried on racks and briefly toasted near the hearth.", "short_text": "Dried, toasted kelp for snacking and seasoning.", "facts": {"Key ingredients": "Clean kelp; a little salt.", "Method": "Rinsed, lightly salted, dried on racks and briefly toasted near the hearth.", "Serving": "A snack, soup garnish and travel seasoning."}, "part": "Food"}, {"id": "d-pickled-winter-roots", "kind": "dish", "label": "Pickled Winter Roots", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#7-pickled-winter-roots", "text": "Packed in salt brine and allowed to sour.", "short_text": "Roots soured in salt brine.", "facts": {"Key ingredients": "Turnip, beet-like roots, carrot-like roots and onion; salt brine.", "Method": "Packed in salt brine and allowed to sour.", "Variations": "Better-off households add berry vinegar, honey or imported spice."}, "part": "Food"}, {"id": "d-aurora-berry-preserve", "kind": "dish", "label": "Aurora Berry Preserve", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#8-aurora-berry-preserve", "text": "Berries are simmered with honey or malt syrup until thick.", "short_text": "Berries cooked thick with honey or malt.", "facts": {"Key ingredients": "Berries; honey or malt syrup; festival jars may include mead.", "Method": "Berries are simmered with honey or malt syrup until thick.", "Variations": "In lean households the preserve stays sharply sour; festival jars use more sweetener and may include mead."}, "part": "Food"}, {"id": "d-fresh-morning-bread-and-milk", "kind": "dish", "label": "Fresh Morning Bread and Milk", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#1-fresh-morning-bread-and-milk", "text": "Bread ties the workday to the shared oven schedule.", "short_text": "Bread from the shared oven, eaten warm.", "facts": {"Why it exists": "Bread ties the workday to the shared oven schedule.", "Key ingredients": "Wheat-like flour, often blended with barley; starter or yeast; water or milk; salt; butter or nut oil.", "Method": "Dough is mixed before dawn or the night before, carried to a shared oven, and baked after the fire is raked down.", "Serving": "Eaten warm with milk, curds, butter or preserves. Day-old bread becomes soup thickener or field food."}, "part": "Food"}, {"id": "d-braided-honey-and-grain-loaf", "kind": "dish", "label": "Braided Honey and Grain Loaf", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#2-braided-honey-and-grain-loaf", "text": "Braiding makes a familiar loaf ceremonial without requiring luxury ingredients.", "short_text": "An everyday loaf made ceremonial by braiding.", "facts": {"Why it exists": "Braiding makes a familiar loaf ceremonial without requiring luxury ingredients.", "Key ingredients": "Wheat and barley flour; warm milk; honey; starter or yeast; butter; salt.", "Method": "A soft enriched dough is kneaded, risen, braided from three ropes, brushed with milk or butter and baked during a communal oven cycle.", "Variations": "Festival versions add nuts, dried fruit or seed."}, "part": "Food"}, {"id": "d-harvest-stew", "kind": "dish", "label": "Harvest Stew", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#3-harvest-stew", "text": "The recipe changes with whatever the village has in quantity.", "short_text": "Whatever the village has plenty of, in one pot.", "facts": {"Why it exists": "The recipe changes with whatever the village has in quantity.", "Key ingredients": "Beans or barley; onion; carrots, squash, greens, roots; chicken, goat or pork-like meat when affordable; garden herbs; broth; vinegar, cider or cultured dairy for acidity.", "Method": "Meat, if used, is browned. Beans or grain and sturdy vegetables simmer first, delicate vegetables and greens go in later, and fresh herbs finish the pot.", "Variations": "Communal versions accept contributions from multiple households."}, "part": "Food"}, {"id": "d-orchard-fire-roasted-fowl", "kind": "dish", "label": "Orchard-Fire Roasted Fowl", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#4-orchard-fire-roasted-fowl", "text": "A celebratory roast that makes direct use of orchard pruning wood and cider.", "short_text": "A celebratory bird roasted over pruning wood.", "facts": {"Why it exists": "A celebratory roast that makes direct use of orchard pruning wood and cider.", "Key ingredients": "Duck, goose, chicken or game bird; salt; sage, thyme or fennel-like herbs; cider; honey; apples, pears or plums.", "Method": "Orchard wood burns down to clean coals. The salted bird turns slowly over indirect heat, basted with cider, with honey added late so it doesn't burn, while fruit roasts in a pan beneath and catches the drippings."}, "part": "Food"}, {"id": "d-farmers-midday-mash", "kind": "dish", "label": "Farmer's Midday Mash", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#5-farmers-midday-mash", "text": "Barley cooks slowly until soft, milk and butter enrich it, and nuts and herbs are stirred in.", "short_text": "Buttered barley carried out to the fields.", "facts": {"Key ingredients": "Cracked barley; milk or water; butter; hazelnuts or walnuts; thyme or sage; salt.", "Method": "Barley cooks slowly until soft, milk and butter enrich it, and nuts and herbs are stirred in.", "Serving": "Carried to the fields in covered crocks or eaten at midday tables."}, "part": "Food"}, {"id": "d-orchard-hand-pies", "kind": "dish", "label": "Orchard Hand Pies", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#6-orchard-hand-pies", "text": "Filled, sealed and baked during the communal oven's falling heat.", "short_text": "Thick-crusted pies with sweet or savory fillings.", "facts": {"Key ingredients": "Thick pastry; fillings such as apple and soft cheese, pear and onion, beans and herbs, chicken and leek, or plum and honey.", "Method": "Filled, sealed and baked during the communal oven's falling heat.", "Variations": "Plum and honey for sweet versions."}, "part": "Food"}, {"id": "d-roasted-grain-clusters", "kind": "dish", "label": "Roasted Grain Clusters", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#7-roasted-grain-clusters", "text": "Mixed, pressed into clusters and dried in a cooling oven.", "short_text": "Honey-bound grain and nuts, a field snack.", "facts": {"Key ingredients": "Leftover cooked grain or toasted cereal; honey; nuts; seeds.", "Method": "Mixed, pressed into clusters and dried in a cooling oven.", "Serving": "A common field snack."}, "part": "Food"}, {"id": "d-herbed-farm-cheese", "kind": "dish", "label": "Herbed Farm Cheese", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#8-herbed-farm-cheese", "text": "Curds are drained, salted and mixed with meadow herbs.", "short_text": "Fresh curds with meadow herbs.", "facts": {"Key ingredients": "Fresh curds; salt; meadow herbs.", "Method": "Curds are drained, salted and mixed with meadow herbs.", "Variations": "Some are eaten soft; others are pressed and aged for winter."}, "part": "Food"}, {"id": "d-caravan-flatbread-with-spiced-butter", "kind": "dish", "label": "Caravan Flatbread with Spiced Butter", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#1-caravan-flatbread-with-spiced-butter", "text": "A dough stiff enough to travel rests while camp is made. Thin rounds are slapped onto a hot stone, griddle or clay-oven wall and brushed while hot with fermented butter mixed with crushed spice.", "short_text": "Thin rounds slapped on a hot stone at camp.", "facts": {"Key ingredients": "Hardy plateau flour; water; salt; starter or yeast, or unleavened; fermented yak-like butter; cumin/coriander-like seeds, dried herbs or pungent spice.", "Method": "A dough stiff enough to travel rests while camp is made. Thin rounds are slapped onto a hot stone, griddle or clay-oven wall and brushed while hot with fermented butter mixed with crushed spice."}, "part": "Food"}, {"id": "d-caravan-curry-spiced-caravan-pot", "kind": "dish", "label": "Caravan Curry / Spiced Caravan Pot", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#2-caravan-curry--spiced-caravan-pot", "text": "\"Curry\" is a real-world analogy; in the setting it's better understood as a family of thick, spiced caravan stews.", "short_text": "A family of thick spiced stews cooked beside the camp brazier.", "facts": {"Why it exists": "\"Curry\" is a real-world analogy; in the setting it's better understood as a family of thick, spiced caravan stews.", "Key ingredients": "Goat, yak-like meat or legumes; onion/garlic-like aromatics; dried ginger-like root where traded; cumin/coriander-like seed; dried chile/pepper analogue depending on trade; cultured dairy, broth or nut paste; dried fruit in richer versions.", "Method": "Meat is browned in a heavy pot, whole spices toast in the fat, liquid and legumes or meat go in, and the pot simmers beside the brazier while camp work continues. Sour dairy or fruit brightens it at the end.", "Variations": "Richer versions add dried fruit."}, "part": "Food"}, {"id": "d-wind-dumplings", "kind": "dish", "label": "Wind Dumplings", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#3-wind-dumplings", "text": "Small filled rounds sit in stacked steam trays over one boiling pot, the lowest trays usually holding sturdier dumplings and the upper trays vegetables or lighter fillings.", "short_text": "Filled dumplings steamed in stacked trays.", "facts": {"Key ingredients": "Wheat or barley dough; minced goat/yak-like meat or lentils; onion; herbs; fermented dairy; optional imported spice.", "Method": "Small filled rounds sit in stacked steam trays over one boiling pot, the lowest trays usually holding sturdier dumplings and the upper trays vegetables or lighter fillings.", "Serving": "Served communally with sour dairy, broth or a chile-like condiment."}, "part": "Food"}, {"id": "d-plateau-noodle-soup", "kind": "dish", "label": "Plateau Noodle Soup", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#4-plateau-noodle-soup", "text": "Noodles cook in broth with dried meat, greens, onion and roots.", "short_text": "Hand-cut noodles in broth with dried meat.", "facts": {"Key ingredients": "Hand-cut or pulled noodles; broth; dried meat; greens; onion; root vegetables.", "Method": "Noodles cook in broth with dried meat, greens, onion and roots.", "Variations": "Market versions add trade spices and fresh herbs that remote villages don't have."}, "part": "Food"}, {"id": "d-caravan-skewers", "kind": "dish", "label": "Caravan Skewers", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#5-caravan-skewers", "text": "The point is speed and portability, not giant feast portions.", "short_text": "Small marinated skewers, fast and portable.", "facts": {"Why it exists": "The point is speed and portability, not giant feast portions.", "Key ingredients": "Small pieces of meat; sour dairy or vinegar; spice; salt.", "Method": "Marinated, then quickly cooked over a brazier."}, "part": "Food"}, {"id": "d-spice-rice-grain-pilaf", "kind": "dish", "label": "Spice Rice / Grain Pilaf", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#6-spice-rice--grain-pilaf", "text": "The grain is toasted in fat, simmered in broth, and dried fruit and nuts are folded in.", "short_text": "Toasted grain with fruit and nuts.", "facts": {"Key ingredients": "Imported rice or another long-grain cereal where affordable, otherwise local wheat berries, millet or barley; fat; broth; dried fruit; nuts.", "Method": "The grain is toasted in fat, simmered in broth, and dried fruit and nuts are folded in.", "Variations": "Where rice or another long-grain cereal isn't affordable, the same technique uses local wheat berries, millet or barley."}, "part": "Food"}, {"id": "d-lentil-fritters", "kind": "dish", "label": "Lentil Fritters", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#7-lentil-fritters", "text": "Common market food because the batter can be mixed in advance.", "short_text": "Small fried pulse cakes, common market food.", "facts": {"Why it exists": "Common market food because the batter can be mixed in advance.", "Key ingredients": "Soaked pulses; onion; herbs; spice.", "Method": "Mashed, shaped small and shallow-fried in a brazier pan."}, "part": "Food"}, {"id": "d-mushroom-simmered-broth", "kind": "dish", "label": "Mushroom-Simmered Broth", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#1-mushroom-simmered-broth", "text": "A ceramic pot is set beside, not over, fierce flame. Roots and alliums soften gently, mushrooms simmer only long enough to flavor the broth, and strong herbs are used sparingly.", "short_text": "A gentle mushroom broth cooked beside the flame.", "facts": {"Key ingredients": "Mixed edible mushrooms; leek/onion-like allium; light vegetable or game stock; wild thyme; root trimmings; salt.", "Method": "A ceramic pot is set beside, not over, fierce flame. Roots and alliums soften gently, mushrooms simmer only long enough to flavor the broth, and strong herbs are used sparingly.", "Serving": "May be served alone or over grain or root cakes."}, "part": "Food"}, {"id": "d-guardian-stew", "kind": "dish", "label": "Guardian Stew", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#2-guardian-stew", "text": "The name fits ceremonial or communal versions; ordinary households make simpler descendants.", "short_text": "A slow clay-pot stew; the name fits ceremonial or communal versions.", "facts": {"Why it exists": "The name fits ceremonial or communal versions; ordinary households make simpler descendants.", "Key ingredients": "Venison, boar or domestic meat; mushrooms; roots; onion; forest herbs; stock; a little honey or fermented fruit paste.", "Method": "Meat is lightly browned in a clay pot if fat is available, roots and stock go in, and the pot cooks for hours in low embers or a banked earth hearth. Mushrooms go in later, and fermented fruit or honey balances the broth."}, "part": "Food"}, {"id": "d-whispering-leaf-wraps", "kind": "dish", "label": "Whispering Leaf Wraps", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#3-whispering-leaf-wraps", "text": "Leaves are softened over steam or hot water and wrapped around a filling that is cooked or partially cooked first, then tied with fiber. The packets steam in a covered pit above hot stones, kept from the ash by leaves and brush.", "short_text": "Leaf packets steamed in a pit over hot stones.", "facts": {"Key ingredients": "Cooked grain; mushrooms; chestnuts or hazelnuts; greens; fish, fowl or shredded game when available; broad edible, non-toxic wrapping leaves.", "Method": "Leaves are softened over steam or hot water and wrapped around a filling that is cooked or partially cooked first, then tied with fiber. The packets steam in a covered pit above hot stones, kept from the ash by leaves and brush.", "Serving": "Packets are opened at the table."}, "part": "Food"}, {"id": "d-clay-sealed-forest-roast", "kind": "dish", "label": "Clay-Sealed Forest Roast", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#4-clay-sealed-forest-roast", "text": "Wrapped in leaves, coated in clean cooking clay and set among hot stones. The hardened clay is cracked away after cooking.", "short_text": "Meat or fish baked inside a clay shell.", "facts": {"Key ingredients": "A bird, fish or small cut of meat; leaves; clean cooking clay.", "Method": "Wrapped in leaves, coated in clean cooking clay and set among hot stones. The hardened clay is cracked away after cooking.", "Note": "The clay is a vessel, not an ingredient."}, "part": "Food"}, {"id": "d-night-ember-root-soup", "kind": "dish", "label": "Night-Ember Root Soup", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#5-night-ember-root-soup", "text": "Roots roast at the edge of the hearth, are peeled and mashed into mushroom broth, thickened with crushed chestnut and simmered overnight in banked heat. Berry ferment goes in just before serving.", "short_text": "Roasted-root soup simmered overnight in banked heat.", "facts": {"Key ingredients": "Roasted parsnip/turnip/carrot-like roots; chestnut; mushroom stock; mild wild herbs; fermented berry paste.", "Method": "Roots roast at the edge of the hearth, are peeled and mashed into mushroom broth, thickened with crushed chestnut and simmered overnight in banked heat. Berry ferment goes in just before serving.", "Note": "Replaces the earlier brainstorm name \"Nightshade Ember Soup,\" which implied unsafe ingredients."}, "part": "Food"}, {"id": "d-acorn-or-chestnut-cakes", "kind": "dish", "label": "Acorn or Chestnut Cakes", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#6-acorn-or-chestnut-cakes", "text": "Mixed and cooked on a stone or griddle.", "short_text": "Seasonal griddle cakes of nut meal.", "facts": {"Key ingredients": "Tannin-leached acorn meal or chestnut flour; grain flour; water; honey.", "Method": "Mixed and cooked on a stone or griddle.", "Note": "Seasonal foods, not universal staples."}, "part": "Food"}, {"id": "d-fermented-forest-fruit-paste", "kind": "dish", "label": "Fermented Forest Fruit Paste", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#7-fermented-forest-fruit-paste", "text": "The paste works as acid, condiment and preservation method.", "short_text": "Soured fruit used as acid, condiment and preserve.", "facts": {"Why it exists": "The paste works as acid, condiment and preservation method.", "Key ingredients": "Berries or plums; a little salt or sweetener.", "Method": "Lightly salted or sweetened and allowed to sour in crocks."}, "part": "Food"}, {"id": "d-olive-flatbread-and-soft-cheese", "kind": "dish", "label": "Olive Flatbread and Soft Cheese", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#1-olive-flatbread-and-soft-cheese", "text": "Rested dough cooks in thin rounds on a griddle or hot oven floor and is brushed with oil after baking.", "short_text": "Oiled flatbread with cheese and olives alongside.", "facts": {"Key ingredients": "Wheat/barley flour; water; yeast or starter, or unleavened; olive-like oil; chopped olives where available; soft goat or sheep cheese; herbs.", "Method": "Rested dough cooks in thin rounds on a griddle or hot oven floor and is brushed with oil after baking.", "Serving": "Cheese, olives and herbs are served alongside rather than always baked in."}, "part": "Food"}, {"id": "d-orchard-pear-clay-pot-braise", "kind": "dish", "label": "Orchard-Pear Clay-Pot Braise", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#2-orchard-pear-clay-pot-braise", "text": "Meat is lightly browned in the clay pot, onion and spice cook in the oil, and meat, fruit and a little broth are layered. The covered pot sits over low heat so trapped steam does most of the work; honey goes in late.", "short_text": "Meat and fruit braised in trapped steam.", "facts": {"Key ingredients": "Lamb, goat or poultry; onion; pear or quince-like fruit; oil; cinnamon-like bark; cumin-like seed; saffron-like luxury spice only in wealthy versions; honey; broth.", "Method": "Meat is lightly browned in the clay pot, onion and spice cook in the oil, and meat, fruit and a little broth are layered. The covered pot sits over low heat so trapped steam does most of the work; honey goes in late.", "Variations": "Saffron-like luxury spice appears only in wealthy versions.", "Serving": "Served with bread or grain."}, "part": "Food"}, {"id": "d-honey-drizzled-nut-pastries", "kind": "dish", "label": "Honey-Drizzled Nut Pastries", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#3-honey-drizzled-nut-pastries", "text": "Dough is rolled or stretched thin, layered with fat and nuts, baked crisp in a communal or household oven, and warm honey syrup is poured over after baking.", "short_text": "Thin nut-filled layers soaked in honey syrup.", "facts": {"Key ingredients": "Thin rolled dough; nuts; honey; spicebark; butter or oil.", "Method": "Dough is rolled or stretched thin, layered with fat and nuts, baked crisp in a communal or household oven, and warm honey syrup is poured over after baking.", "Variations": "Festival versions can be elaborate; everyday versions are simpler folded pastries."}, "part": "Food"}, {"id": "d-grain-and-herb-salad", "kind": "dish", "label": "Grain and Herb Salad", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#4-grain-and-herb-salad", "text": "The cooked grain is cooled and tossed with the rest.", "short_text": "Cooled grain tossed with herbs, oil and fruit.", "facts": {"Key ingredients": "Cracked wheat, barley or couscous-like granules; cucumber-like vegetables; herbs; onion; oil; sour fruit or vinegar; dried or fresh orchard fruit.", "Method": "The cooked grain is cooled and tossed with the rest."}, "part": "Food"}, {"id": "d-herb-crusted-coastal-fish", "kind": "dish", "label": "Herb-Crusted Coastal Fish", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#5-herb-crusted-coastal-fish", "text": "Fish is rubbed with oil, herbs and crumbs, then baked in a clay dish or grilled over clean coals, and finished with sour fruit, vinegar or reduction.", "short_text": "Crumb-crusted fish with a sour finish.", "facts": {"Key ingredients": "Fish; oil; herbs; coarse grain crumbs; sour fruit, vinegar or pomegranate-like reduction.", "Method": "Fish is rubbed with oil, herbs and crumbs, then baked in a clay dish or grilled over clean coals, and finished with sour fruit, vinegar or reduction."}, "part": "Food"}, {"id": "d-fava-like-bean-purée", "kind": "dish", "label": "Fava-Like Bean Purée", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#6-fava-like-bean-purée", "text": "The pulses are mashed with oil, allium, salt and something sour.", "short_text": "Mashed pulses eaten with flatbread.", "facts": {"Key ingredients": "Cooked pulses; oil; garlic-like allium; salt; sour fruit or vinegar.", "Method": "The pulses are mashed with oil, allium, salt and something sour.", "Serving": "Eaten with flatbread and raw or grilled vegetables."}, "part": "Food"}, {"id": "d-orchard-pilaf", "kind": "dish", "label": "Orchard Pilaf", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#7-orchard-pilaf", "text": "The grain is toasted in oil and cooked with broth, nuts and dried fruit.", "short_text": "Toasted grain with broth, nuts and dried fruit.", "facts": {"Key ingredients": "Rice where trade and irrigation support it, local grain elsewhere; oil; broth; nuts; dried fruit.", "Method": "The grain is toasted in oil and cooked with broth, nuts and dried fruit.", "Variations": "Wealthier versions use expensive aromatic spice."}, "part": "Food"}, {"id": "d-blacksmiths-forged-harvest-stew", "kind": "dish", "label": "Blacksmith's / Forged Harvest Stew", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#blacksmiths--forged-harvest-stew", "text": "Greenvale produce regularly feeds upland work towns; Ironcrest smoke and browning alter the farm stew.", "short_text": "Greenvale's farm stew, browned and smoked the Ironcrest way.", "facts": {"Why it exists": "Greenvale produce regularly feeds upland work towns; Ironcrest smoke and browning alter the farm stew.", "Key ingredients": "Smoked goat, pork-like meat or boar; barley; onion; carrots, parsnips, turnips; apple or pear; thyme; broth; cider vinegar; optional nuts.", "Method": "Meat is browned hard in an iron pot and onion charred at the hearth's edge; barley and broth simmer with the meat, Greenvale roots and orchard fruit go in later, and vinegar finishes the pot.", "Variations": "Nuts appear mainly in better-off or festival versions."}, "part": "Food"}, {"id": "d-iron-grain-herbed-bread", "kind": "dish", "label": "Iron-Grain Herbed Bread", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#iron-grain-herbed-bread", "text": "Greenvale bakers adapt their softer communal loaves to Ironcrest's darker flours, toasted grain and lidded-pot baking. Ironcrest households adopt Greenvale herbs and longer fermentation.", "short_text": "Each side's bread borrowing from the other.", "facts": {"Key ingredients": "Ironcrest's darker flours and toasted grain; Greenvale herbs.", "Method": "Greenvale bakers adapt their softer communal loaves to Ironcrest's darker flours, toasted grain and lidded-pot baking. Ironcrest households adopt Greenvale herbs and longer fermentation."}, "part": "Food"}, {"id": "d-forge-and-plateau-kebabs", "kind": "dish", "label": "Forge and Plateau Kebabs", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forge-and-plateau-kebabs", "text": "Highridge caravan cooks bring sour marinades and layered spice to Ironcrest's fast iron-plate and charcoal cooking.", "short_text": "Highridge marinades on Ironcrest skewers and charcoal.", "facts": {"Why it exists": "Highridge caravan cooks bring sour marinades and layered spice to Ironcrest's fast iron-plate and charcoal cooking.", "Key ingredients": "Goat, boar or other upland meat; sour dairy, vinegar or tart fruit; cumin/coriander-like seed; dried pungent spice; onion; salt; flatbread.", "Method": "Small pieces marinate in sour liquid and spice, are skewered tightly and grilled over a clean charcoal brazier on Ironcrest metal skewers with Highridge seasoning.", "Serving": "Wrapped in plateau-style flatbread with Ironcrest pickles."}, "part": "Food"}, {"id": "d-smoked-iron-grain-flatbread", "kind": "dish", "label": "Smoked Iron-Grain Flatbread", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#smoked-iron-grain-flatbread", "text": "The flatbread is topped and finished on a hot stone or iron plate.", "short_text": "Plateau flatbread topped with Ironcrest smoked meat.", "facts": {"Key ingredients": "Highridge-style flatbread; Ironcrest smoked meat; onions; curd cheese; a restrained amount of imported spice.", "Method": "The flatbread is topped and finished on a hot stone or iron plate."}, "part": "Food"}, {"id": "d-icefire-brined-fish", "kind": "dish", "label": "Icefire Brined Fish", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#icefire-brined-fish", "text": "Northwind fish preservation meets Highridge caravan seasoning and drying.", "short_text": "Northwind-cured fish with a crust of plateau spice.", "facts": {"Why it exists": "Northwind fish preservation meets Highridge caravan seasoning and drying.", "Key ingredients": "Firm fish; salt brine; kelp; juniper-like herb; crushed plateau spices; rendered fat or butter.", "Method": "Fish is brined cold, rinsed and air-dried until tacky, pressed with a thin layer of crushed spice, then cold- or warm-smoked depending on storage needs.", "Serving": "Highridge traders often brush it with spiced butter when reheating."}, "part": "Food"}, {"id": "d-icy-caravan-fish-pot", "kind": "dish", "label": "Icy Caravan Fish Pot", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#icy-caravan-fish-pot", "text": "The salt fish simmers briefly in the sauce, added late so it doesn't fall apart.", "short_text": "Salt fish simmered in a Highridge-style sauce.", "facts": {"Key ingredients": "Soaked salt fish; a Highridge-style aromatic legume or dairy sauce.", "Method": "The salt fish simmers briefly in the sauce, added late so it doesn't fall apart.", "Serving": "Eaten with flatbread or grain.", "Note": "It doesn't require modern coconut milk."}, "part": "Food"}, {"id": "d-frost-and-spice-fish-cakes", "kind": "dish", "label": "Frost and Spice Fish Cakes", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#frost-and-spice-fish-cakes", "text": "Shaped into cakes, seasoned with plateau spice and shallow-fried.", "short_text": "Northwind fish cakes seasoned with plateau spice.", "facts": {"Key ingredients": "Salt fish; mashed root; onion; barley meal; imported plateau spice.", "Method": "Shaped into cakes, seasoned with plateau spice and shallow-fried.", "Serving": "Sour dairy or fermented berry relish accompanies them."}, "part": "Food"}, {"id": "d-shadow-hearth-porridge", "kind": "dish", "label": "Shadow Hearth Porridge", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#shadow-hearth-porridge", "text": "Greenvale grain becomes the stable carbohydrate; Deepwood contributes mushrooms, nuts and low-ember technique.", "short_text": "Greenvale grain cooked the Deepwood way, with mushrooms and nuts.", "facts": {"Why it exists": "Greenvale grain becomes the stable carbohydrate; Deepwood contributes mushrooms, nuts and low-ember technique.", "Key ingredients": "Cracked wheat or barley; mushroom broth; roasted root; chestnut or hazelnut; thyme; optional milk or honey.", "Method": "Grain begins in a clay pot, ember-roasted root is mashed into the liquid, mushrooms and nuts go in, and the pot cooks slowly beside the fire.", "Variations": "Greenvale households may finish it with milk; Deepwood households more often use nut paste or broth."}, "part": "Food"}, {"id": "d-wild-orchard-tartlets", "kind": "dish", "label": "Wild Orchard Tartlets", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#wild-orchard-tartlets", "text": "The point is sweet-earthy balance, not dessert-level sweetness.", "short_text": "Greenvale pastry around Deepwood mushrooms and nuts.", "facts": {"Why it exists": "The point is sweet-earthy balance, not dessert-level sweetness.", "Key ingredients": "Greenvale pastry; Deepwood mushrooms, herbs and nuts; a little apple or pear.", "Method": "The pastry encloses the filling."}, "part": "Food"}, {"id": "d-forest-harvest-salad", "kind": "dish", "label": "Forest Harvest Salad", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-harvest-salad", "text": "The greens, roots and apple meet the mushrooms and nuts under a honey-vinegar dressing.", "short_text": "Farm greens and apple with forest mushrooms and nuts.", "facts": {"Key ingredients": "Cultivated greens; radish-like roots; orchard apple; lightly cooked forest mushrooms; nuts; honey-vinegar dressing.", "Method": "The greens, roots and apple meet the mushrooms and nuts under a honey-vinegar dressing."}, "part": "Food"}, {"id": "d-harvest-orchard-salad", "kind": "dish", "label": "Harvest Orchard Salad", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#harvest-orchard-salad", "text": "The greens and vegetables are combined with the fruit, oil and herbs and dressed with sour fruit.", "short_text": "Greenvale greens with Sunplains fruit and oil.", "facts": {"Key ingredients": "Fresh Greenvale greens and vegetables; Sunplains figs or pomegranate-like fruit; oil; mint-like herbs; sour-fruit dressing.", "Method": "The greens and vegetables are combined with the fruit, oil and herbs and dressed with sour fruit."}, "part": "Food"}, {"id": "d-sunlit-orchard-grain", "kind": "dish", "label": "Sunlit Orchard Grain", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#sunlit-orchard-grain", "text": "The grain is dressed in oil and sour fruit, then mixed with vegetables, herbs, dried fig and nuts.", "short_text": "Greenvale grain dressed Sunplains-style; travels to markets and crews.", "facts": {"Key ingredients": "Greenvale cracked grain or couscous-like wheat; Sunplains oil and sour fruit; cucumber-like vegetables; herbs; dried fig; nuts.", "Method": "The grain is dressed in oil and sour fruit, then mixed with vegetables, herbs, dried fig and nuts.", "Serving": "It travels well to markets and harvest crews."}, "part": "Food"}, {"id": "d-forest-blossom-tart", "kind": "dish", "label": "Forest Blossom Tart", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-blossom-tart", "text": "Sunplains pastry technique and orchard sweetness absorb Deepwood nuts, forest fruit and earthy aromatics.", "short_text": "Sunplains pastry with Deepwood nuts and forest fruit.", "facts": {"Why it exists": "Sunplains pastry technique and orchard sweetness absorb Deepwood nuts, forest fruit and earthy aromatics.", "Key ingredients": "Thin or short pastry; fig, pear or plum; chestnut or hazelnut; mild forest herb; honey; cinnamon-like spicebark.", "Method": "Fruit is chopped with toasted nuts and herbs, baked in a shallow pastry in a Sunplains oven or under a clay baking cover, and brushed with honey afterward.", "Variations": "Border versions may include a small savory mushroom component."}, "part": "Food"}, {"id": "d-forest-orchard-medley", "kind": "dish", "label": "Forest-Orchard Medley", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-orchard-medley", "text": "Mushrooms and wild greens are gently cooked in oil, then finished with orchard fruit, sour juice or vinegar, and herbs.", "short_text": "Mushrooms and greens in oil, finished with fruit and acid.", "facts": {"Key ingredients": "Mushrooms; wild greens; Sunplains oil; orchard fruit; sour citrus-like juice or vinegar; herbs.", "Method": "Mushrooms and wild greens are gently cooked in oil, then finished with orchard fruit, sour juice or vinegar, and herbs."}, "part": "Food"}, {"id": "d-forest-citrus-creamed-grain", "kind": "dish", "label": "Forest-Citrus Creamed Grain", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-citrus-creamed-grain", "text": "The grain is slowly fed hot broth, mushrooms are added during cooking, and bright orchard acid goes in at the finish.", "short_text": "Grain slowly fed broth, with mushrooms and a bright finish.", "facts": {"Key ingredients": "A locally available grain; hot broth; mushrooms; orchard acid.", "Method": "The grain is slowly fed hot broth, mushrooms are added during cooking, and bright orchard acid goes in at the finish.", "Real-world inspiration": "Risotto-like technique, without requiring rice to be universal."}, "part": "Food"}, {"id": "d-plateau-orchard-clay-pot", "kind": "dish", "label": "Plateau Orchard Clay Pot", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#plateau-orchard-clay-pot", "text": "Highridge spice layering meets Sunplains steam-trapping clay braise.", "short_text": "Highridge spice layering in a Sunplains clay braise.", "facts": {"Why it exists": "Highridge spice layering meets Sunplains steam-trapping clay braise.", "Key ingredients": "Goat or lamb; onion; dried apricot or raisin-like fruit; pear or quince; cumin-like seed; cinnamon-like bark; broth; oil or butter.", "Method": "Meat is browned, spices toast in fat, fruit and broth are layered in a covered clay pot, and it cooks slowly until tender.", "Serving": "Plateau flatbread or grain accompanies it."}, "part": "Food"}, {"id": "d-highridge-orchard-pilaf", "kind": "dish", "label": "Highridge Orchard Pilaf", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#highridge-orchard-pilaf", "text": "The grain is toasted in fat, simmered with broth and spice, then finished with dried Sunplains fruit and nuts.", "short_text": "Toasted grain with spice, finished with Sunplains fruit.", "facts": {"Key ingredients": "Long grain, millet, wheat berries or barley; fat; broth; spice; dried Sunplains fruit; nuts.", "Method": "The grain is toasted in fat, simmered with broth and spice, then finished with dried Sunplains fruit and nuts."}, "part": "Food"}, {"id": "a-guardian-stew", "kind": "adaptation", "label": "Guardian Stew, away from home", "short": "Guardian Stew abroad", "status": "Provisional (illustrative)", "lane": "deepwood", "section": "Away from home", "src": "Culture/Food-Diaspora-and-Adaptation.md#guardian-stew", "text": "A Deepwood stew whose identity comes from slow cooking, forest aromatics and a communal serving ritual. A diaspora version might keep the method and occasion while its pantry changes with each host region.", "short_text": "How the stew might change in each host region while its method and occasion survive.", "facts": {"What survives": "A diaspora version might keep the method and occasion.", "What changes": "The pantry might: cultivated roots, dairy or orchard acidity may enter in Greenvale; dried aromatics and portable grains may become normal in Highridge; preserved fish or brined vegetables may alter it in Northwind; pulses, oil and fresh herbs may reshape it in Sunplains; smoke and dense grain may make it heavier in Ironcrest; in Port, several of these descendants can coexist and eventually cross-pollinate.", "Caution": "None of these versions should be treated as automatically canonical dishes. The example demonstrates the mechanism."}, "part": "Food"}, {"id": "a-forgefire-roast", "kind": "adaptation", "label": "Forgefire Roast", "short": "Forgefire Roast", "status": "Provisional (illustrative)", "lane": "ironcrest", "section": "Away from home", "src": "Culture/Food-Diaspora-and-Adaptation.md#forgefire-roast", "text": "An Ironcrest preparation identified by hard browning, smoke and a communal work-day context, which might migrate into Sunplains.", "short_text": "Hard-browned Ironcrest work-day food that might move to Sunplains.", "facts": {"What survives": "The idea of the food: it should be deeply browned and served after collective labor.", "What changes": "The Sunplains host version could use a different meat, oil, acid and herb set.", "Caution": "Illustrative, on a page that is a working design method, not a fixed menu of canon dishes."}, "part": "Food"}], "edges": [{"from": "northwind", "to": "northern", "layer": "landmass", "type": "lies on", "basis": "stated", "quote": "Northwind occupies much of the Northern Continent and associated coasts and islands.", "src": "Regions/Northwind.md#geography", "chip": "Continent", "chipBack": "Regions on it", "part": "Geography"}, {"from": "ironcrest", "to": "greenvale", "layer": "border", "type": "borders", "certainty": "established", "basis": "stated", "quote": "Repeatedly used in border-town discussions. Upland/mineral country grades into productive foothill and lowland agriculture.", "src": "Geography-and-Connections.md#ironcrest--greenvale", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "greenvale", "to": "sunplains", "layer": "border", "type": "borders", "certainty": "established", "basis": "stated", "quote": "Repeatedly used. Temperate mixed farmland transitions toward warmer, drier agriculture with orchards, vineyards, irrigation systems, and southern trade.", "src": "Geography-and-Connections.md#greenvale--sunplains", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "deepwood", "to": "highridge", "layer": "border", "type": "borders", "c chipNoteBack": "or corridor", "part": "Geography"}, {"from": "greenvale", "to": "deepwood", "layer": "border", "type": "borders", "certainty": "working", "basis": "stated", "quote": "Strong ecological logic and repeatedly discussed as field-to-forest transition, including historical encroachment. Treat as a direct border unless the final map contradicts it.", "src": "Geography-and-Connections.md#greenvale--deepwood", "also": [{"quote": "Deepwood forest margins", "src": "Regions/Greenvale.md#geography"}], "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "deepwood", "to": "sunplains", "layer": "border", "type": "borders", "certainty": "likely", "basis": "stated", "quote": "Likely a southern forest transition into drier woodland and cultivated Sunplains.", "src": "Geography-and-Connections.md#deepwood--sunplains", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "greenvale", "to": "highridge", "layer": "border", "type": "borders", "certainty": "likely", "basis": "stated", "quote": "Likely. Highridge trade must reach the eastern agricultural interior somewhere. The exact length of border is not settled.", "src": "Geography-and-Connections.md#greenvale--highridge", "also": [{"quote": "Its boundaries grade into: Ironcrest foothills; Highridge routes; Deepwood forest margins; warmer Sunplains country.", "src": "Regions/Greenvale.md#geography", "note": "The Greenvale page states this plainly; Geography and Connections calls it only likely."}], "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "highridge", "to": "sunplains", "layer": "border", "type": "borders or corridor", "certainty": "possible", "basis": "stated", "quote": "Possible through southern caravan routes. Could be a direct boundary, a narrow corridor, or mediated through Greenvale/Deepwood. Do not assume until the map is locked.", "src": "Geography-and-Connections.md#highridge--sunplains", "chip": "Borders", "chipBack": "Borders", "chipNote": ither page puts the dish in the town.", "src": "Places/Border-Towns.md#icestep-summit--northwind--highridge", "chip": "Border dishes", "chipBack": "Border town", "part": "Food"}, {"from": "icestep", "to": "d-frost-and-spice-fish-cakes", "layer": "food-town", "type": "sits on the same border as", "basis": "inferred", "quote": "Icestep Summit — Northwind / Highridge (Border Towns); the dish is filed under Northwind–Highridge (Border Fusions). Neither page puts the dish in the town.", "src": "Places/Border-Towns.md#icestep-summit--northwind--highridge", "chip": "Border dishes", "chipBack": "Border town", "part": "Food"}, {"from": "harveston", "to": "d-harvest-orchard-salad", "layer": "food-town", "type": "sits on the same border as", "basis": "inferred", "quote": "Harveston Vale — Greenvale / Sunplains (Border Towns), with \"foods and festivals built around several harvest calendars\"; the dish is filed under Greenvale–Sunplains (Border Fusions). Neither page puts the dish in the town.", "src": "Places/Border-Towns.md#harveston-vale--greenvale--sunplains", "chip": "Border dishes", "chipBack": "Border town", "also": [{"quote": "foods and festivals built around several harvest calendars", "src": "Places/Border-Towns.md#harveston-vale--greenvale--sunplains"}], "part": "Food"}, {"from": "harveston", "to": "d-sunlit-orchard-grain", "layer": "food-town", "type": "sits on the same border as", "basis": "inferred", "quote": "Harveston Vale — Greenvale / Sunplains (Border Towns), with \"foods and festivals built around several harvest calendars\"; the dish is filed under Greenvale–Sunplains (Border Fusions). Neither page puts the dish in the town.", "src": "Places/Border-Towns.md#harveston-vale--greenvale--sunplains", "chip": "Border dishes", "chipBack": "Border town", "also": [{"quote": "foods and festivals built around several harvest calendars", "src": "Places/Border-Towns.md#harveston-vale--greenvale--sunplains"}], "part": "Food"}, {"from": "greenvale-food", "to": "f-root-cellar-night", "layer": "food-festival", "type": "may be eaten at", "basis": "inferred", "quote": "Greenvale celebrations include preserved foods opened from previous harvests (Food); Root Cellar Night can center on stored food, family stories and remembrance of old scarcity (Festivals). Neither page links the two.", "src": "Culture/Food.md#greenvale", "chip": "Festivals", "chipBack": "Food", "also": [{"quote": "stored food, family stories and remembrance of old scarcity", "src": "Culture/Festivals-and-Seasonal-Life.md#greenvale"}], "part": "Food"}, {"from": "greenvale-food", "to": "f-harvest-home", "layer": "food-festival", "type": "may be eaten at", "basis": "inferred", "quote": "Greenvale celebrations center on abundance, storage, first harvests and seed exchange (Greenvale), and include first-fruit and first-grain rites (Food); Harvest Home can combine celebration with redistribution, seed exchange and public accounting of surplus (Festivals). Neither page names a dish, and the same rites could as easily belong to Grain Ripening.", "src": "Regions/Greenvale.md#food", "chip": "Festivals", "chipBack": "Food", "also": [{"quote": "Harvest Home can combine celebration with redistribution, seed exchange and public accounting of surplus", "src": "Culture/Festivals-and-Seasonal-Life.md#greenvale"}, {"quote": "first-fruit/first-grain rites", "src": "Culture/Food.md#greenvale"}], "part": "Food"}, {"from": "greenvale-food", "to": "ironcrest-food", "layer": "food-import", "type": "trades food with", "basis": "stated", "quote": "metal, tools, timber, food, animals, fuel, labor, and investment move both ways", "src": "Geography-and-Connections.md#ironcrest--greenvale", "chip": "Imports from", "chipBack": "Supplies", "goods": "food (moves both ways)", "part": "Food"}], "gaps": [{"part": "Geography", "title": "Part 1: Regions and Geography", "items": ["No named cities inside any of the six regions. Port and the border towns are the only named settlements; every region page describes 'cities' only in general.", "Only one region is placed on a continent (Northwind, Northern Continent). Which regions sit on the Western and Eastern Continents is not stated.", "Port's site and territory are not fixed. The wiki lists conditions its site should meet (convenient to northern and southern sea routes, access to inland rivers or roads) and describes Frostbay Way 'if Port is territorially separate'.", "Five region borders aren't established: Ironcrest–Highridge (likely), Greenvale–Highridge (likely), Deepwood–Sunplains (likely), Highridge–Sunplains (possible), and Greenvale–Deepwood (treated as a direct border unless the map contradicts it). Deepwood–Ironcrest is established as a relationship but only as a 'direct or near-direct' frontier.", "The region pages and Geography and Connections disagree on certainty: the Greenvale and Ironcrest pages state their Highridge borders plainly, while Geography and Connections calls them likely.", "Five region pairs have no border town: Ironcrest–Highridge, Greenvale–Deepwood, Deepwood–Sunplains, Greenvale–Highridge and Highridge–Sunplains.", "The wiki doesn't say which regions the Spine touches (only Highridge is tied to it) or which kingdoms hold Underpass entrances.", "No rivers, passes or Underpass entrances are named (history mentions provisional 'Ridge Pass Toll Wars'). Geography and Connections lists what the finished map should show: rivers, passes, Underpass entrances, caravan roads, seasonal closures, sea routes, old roads, pilgrimage paths, smuggling corridors.", "Directions are thin: Ironcrest west, Northwind north, Sunplains south and east, and Greenvale as 'the eastern agricultural interior' (from Highridge's point of view).", "Border Towns and World Overview carry no status label; the Border Towns page calls its six towns 'established working examples'.", "Seven names sit in the border-town name bank, unplaced."]}, {"part": "Culture", "title": "Part 2: Culture", "items": ["Five culture pages carry no status label: Architecture, Language and Thought, Naming, Culture and Influence (whose title reads 'Cultural Inspiration'), and Border Towns.", "Region culture is written twice: each region page has its own inspiration, language and architecture sections, and the Culture pages repeat them across regions. It's two owners for one concept. They agree in substance, but the lists already differ in detail: Highridge is 'probably the most multilingual settled region' on its region page but only 'likely highly multilingual' in Language and Thought; Ironcrest's speech list differs (ordered, attempted, completed, inspected, guaranteed versus completed, inspected, merely claimed); Architecture lists Deepwood longhouses flatly where the region page says they may appear depending on climate.", "Half the festivals (14 of 28) are names in the calendar with no description.", "No named languages, dialects or scripts anywhere; naming languages and personal-name systems are still open, and several character names stay provisional until they're settled.", "The nomads have no name, no named circuits, families, camps or stopping places. The page says 'the nomads' shouldn't be one culture, but only one mobile people is sketched.", "Deepwood–Sunplains is the only culture mix described (forest raised floors with courtyard shade) where Part 1 found no border town.", "Three border towns have no speech, festival or building detail: Icestep Summit, Darkroot Gulch and Frostbay Way (Frostbay's identity items are listed: Northwind seafaring, Port credit and trade law, ship repair, immigrant merchants, seasonal labor). The Icestep building and speech links and the Stonefield building link are inferred from the general border examples in Architecture and Language and Thought.", "The Spine and Underpass have peoples (Underpass families born underground, pilgrimage traditions, old toll states) but no culture described.", "No in-world sayings about border towns, Spine or Underpass peoples, or the nomads; Greenvale and Sunplains have no hiring shortcut.", "Most region-and-season cells in the festival calendar are blank; the page says only that no major shared festival was defined there (Port has nothing from late spring to late summer).", "No festivals are named for border towns, nomads or fairs, though Harveston Vale keeps festivals built around several harvest calendars and the nomad page mentions moving between fairs and Port's major fairs.", "Port's 'occupations found nowhere else at the same scale' aren't named.", "Root Cellar Night remembers the Seven-year Blight; it will connect when Part 5 (History) is built.", "Religion (Part 4) is only hinted at here: Solstice Lanterns says different faiths explain it differently, Port has blended religious practice, and several festivals imply rites. They'll connect when Part 4 is built."]}, {"part": "Food", "title": "Part 3: Food", "items": ["**No dish is tied to a named festival.** Four recipes mention unnamed \"festival versions\" (Braided Honey and Grain Loaf, Aurora Berry Preserve, Honey-Drizzled Nut Pastries, Blacksmith's / Forged Harvest Stew), and the festivals page names no dishes. Every dish card's Festival row says \"none stated\". The only festival links drawn are two inferred ones for Greenvale (Root Cellar Night, Harvest Home). The pairing of Forged Harvest Stew with Forge Reawakening exists only in the Sunday Morning stories, which are not canon. Name echoes (Aurora Berry Preserve and Aurora Nights; Harvest Stew and Harvest Home) are not links either.", "**Port has no dishes.** Food lists six kinds of Port kitchen (dock-worker, ship, merchant, immigrant neighborhood, street and religious), and the diaspora page gives Port a cooking bias (borrowing, ship food, imported condiments), but there is no Port recipe book and no Port staples, techniques, meals, celebrations or drinks on record. Lean Vigil \"can mark the anxiety of winter shipping and food supply\" but names no food.", "**Deepwood–Ironcrest border food has no dishes.** The Ironcrest page says its border food \"blends strongly with Greenvale and Deepwood\", and Darkroot Gulch sits on that border, but Border Fusions has no Deepwood–Ironcrest section.", "**Three border towns have no border dishes.** Twilighthollow (Deepwood / Highridge), Frostbay Way (Northwind / Port) and Darkroot Gulch (Deepwood / Ironcrest) have no matching section in Border Fusions.", "**Four fusion pairings have no named town, and their borders aren't settled.** Ironcrest–Highridge (likely a border or a short mountain corridor), Greenvale–Deepwood (a working border), Deepwood–Sunplains (likely) and Highridge–Sunplains (unsettled: a border, a corridor, or mediated through Greenvale or Deepwood) have dishes but no border town on record. Border Fusions says that where adjacency changes, those dishes should be treated as trade-route or diaspora dishes. Greenvale–Highridge has a likely border but no dishes.", "**Border-town links are inferred.** Border Fusions doesn't say which town eats which dish; the seven dishes linked to Stonefield Forge, Harveston Vale and Icestep Summit are matched by border pair only.", "**The diaspora model has no dishes of its own on the wiki.** Food Diaspora and Adaptation gives the three-stage model and two illustrative paths (Guardian Stew, Forgefire Roast), and says the host-region versions shouldn't be treated as automatically canonical dishes. Forgefire Roast has no recipe in the Ironcrest book. Diaspora dishes worked out in earlier sessions (such as Forager's Crock, Wildwood Turnover and Listening / Caravan Broth) aren't on any wiki page, so they aren't on the board.", "**Most food imports are unsourced.** Only three are named as imports (Greenvale grain to Ironcrest; Greenvale flour and Sunplains oils or fruit possibly reaching Northwind's wealthier ports), plus food moving both ways between Ironcrest and Greenvale. Border dishes name a few origins in passing (plateau spice in Icefire Brined Fish; Sunplains oil, figs and dried fruit in Sunlit Orchard Grain, Forest-Orchard Medley, Harvest Orchard Salad and Highridge Orchard Pilaf), but Highridge's markets, Sunplains' \"spices from trade\" and Deepwood's \"trade grain and salt\" don't say where the food comes from.", "**Deepwood has no class or variation note** comparable to the other regions', and Port and border cuisine lack most cuisine facts.", "**Food as plot mechanics is stated but not mapped.** Food says shortages, grain prices, fish seasons and road closures should be usable as plot; those links belong to Parts 4 and 7."]}], "parts": [{"part": 1, "short": "Geography", "title": "Regions and Geography"}, {"part": 2, "short": "Culture", "title": "Culture"}, {"part": 3, "short": "Food", "title": "Food"}], "schema": {"landmass": {"rows": [{"label": "Regions on it", "always": true, "part": "Geography"}], "facts": []}, "region": {"rows": [{"label": "Continent", "always": true, "part": "Geography"}, {"label": "Borders", "always": true, "part": "Geography"}, {"label": "Border towns", "always": true, "part": "Geography"}, {"label": "Sea partner of", "always": true, "part": "Geography"}, {"label": "Spine & Underpass", "always": true, "part": "Geography"}, {"label": "Sends", "always": true, "part": "Geography"}, {"label": "Gets", "always": true, "part": "Geography"}, {"label": "Trades with", "always": true, "part": "Geography"}, {"label": "Likely sends", "always": false, "part": "Geography"}, {"label": "Likely gets", "always": false, "part": "Geography"}, {"label": "Nomad circuit", "always": false, "part": "Culture"}], "facts": [{"key": "Terrain", "always": true, "part": "Geography"}, {"key": "Exports", "always": true, "part": "Geography"}, {"key": "Imports", "always": true, "part": "Geography"}, {"key": "Pressures", "always": true, "part": "Geography"}, {"key": "Seasons", "always": true, "part": "Geography"}]}, "hub": {"rows": [{"label": "Sea partners", "always": true, "part": "Geography"}, {"label": "In its sphere", "always": ions", "always": false, "part": "Food"}, {"key": "Serving", "always": false, "part": "Food"}, {"key": "Real-world inspiration", "always": false, "part": "Food"}, {"key": "Note", "always": false, "part": "Food"}]}, "adaptation": {"rows": [{"label": "Starts from", "always": true, "part": "Food"}, {"label": "Home cuisine", "always": true, "part": "Food"}, {"label": "Could move to", "always": true, "part": "Food"}], "facts": [{"key": "What survives", "always": true, "part": "Food"}, {"key": "What changes", "always": true, "part": "Food"}, {"key": "Caution", "always": true, "part": "Food"}]}}, "repo": "https://github.com/BigCatMellow/10Kings/blob/main/wiki/"};
(function () {
  if (!DATA) return;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gh = (p) => DATA.repo + p;
  const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
  const laneOf = Object.fromEntries(DATA.lanes.map((l) => [l.id, l]));
  const colorVar = (laneId) => `var(--r-${laneId})`;
  const nodeColor = (n) => colorVar(n.lane);
  const SCHEMA = DATA.schema || {};
  const partOn = Object.fromEntries(DATA.parts.map((p) => [p.short, true]));
  const inferredOn = () => $("optInferred").checked;
  const visibleEdge = (e) => partOn[byId[e.from].part] && partOn[byId[e.to].part] && (e.basis === "stated" || inferredOn());

  $("eyebrow").textContent = DATA.eyebrow || "Atlas";
  $("title").textContent = DATA.title;
  $("sub").textContent = DATA.subtitle || "";
  const stated = DATA.edges.filter((e) => e.basis === "stated").length;
  $("counts").innerHTML = DATA.parts.map((p) => `<span class="count"><b>${DATA.nodes.filter((n) => n.part === p.short).length}</b>${esc(p.short.toLowerCase())}</span>`).join("") +
    `<span class="count"><b>${DATA.edges.length}</b>connections (${stated} stated)</span>`;
  $("parts").innerHTML = DATA.parts.length > 1 ? "Show: " + DATA.parts.map((p) => `<label title="Part ${p.part}: ${esc(p.title)}"><input type="checkbox" data-part="${esc(p.short)}" checked> ${esc(p.short)}</label>`).join("") : "";

  // each end of a connection: which row it sits in, and a short note
  const end = (e, fromSide) => fromSide ? { row: e.chip || e.type, note: e.chipNote } : { row: e.chipBack || e.chip || e.type, note: e.chipNoteBack };

  // columns → section headings (in part order) → cards
  const lanesEl = $("lanes");
  const cardEls = {}, laneEls = {};
  DATA.lanes.forEach((l) => {
    const lane = document.createElement("div");
    lane.className = "lane"; lane.style.setProperty("--lc", colorVar(l.id));
    lane.innerHTML = `<h3>${esc(l.label)}</h3>`;
    const inLane = DATA.nodes.filter((n) => n.lane === l.id);
    [...new Set(inLane.map((n) => n.part + "\u0000" + n.section))].forEach((key) => {
      const [part, sec] = key.split("\u0000");
      const items = inLane.filter((n) => n.part === part && n.section === sec);
      const s = document.createElement("div");
      s.className = "section"; s.dataset.part = part;
      s.innerHTML = `<button type="button" class="sechead" aria-expanded="true"><span class="chev" aria-hidden="true">▸</span>${esc(sec)} <span class="num">${items.length}</span></button><div class="cards"></div>`;
      const box = s.querySelector(".cards");
      items.forEach((n) => box.appendChild(card(n)));
      s.querySelector(".sechead").addEventListener("click", (ev) => {
        const open = s.classList.toggle("shut") === false;
        ev.currentTarget.setAttribute("aria-expanded", String(open));
        if (current) drawLinks(current);
      });
      lane.appendChild(s);
    });
    laneEls[l.id] = lane;
    lanesEl.appendChild(lane);
  });

  function chipsFor(n) {
    const layout = (SCHEMA[n.kind] || { rows: [] }).rows;
    const skip = n.skip_rows || [];
    const rows = Object.fromEntries(layout.map((r) => [r.label, []]));
    DATA.edges.forEach((e) => {
      let other, side;
      if (e.from === n.id) { other = e.to; side = end(e, true); }
      else if (e.to === n.id) { other = e.from; side = end(e, false); }
      else return;
      if (e.hideChipOn && e.hideChipOn.includes(n.id)) return;
      const o = byId[other];
      const cert = e.certainty && e.certainty !== "established" ? e.certainty : "";
      const cls = [e.basis === "inferred" ? "inferred" : "", cert].join(" ");
      const goods = e.goods && e.chipGoods !== false ? ` <small>${esc(e.goods)}</small>` : "";
      const notes = [side.note, cert].filter(Boolean).join(", ");
      (rows[side.row] = rows[side.row] || []).push(`<span class="chip ${cls}" data-basis="${e.basis}" style="--dc:${nodeColor(o)}"><i></i><span>${esc(o.short || o.label)}${goods}${notes ? ` <small>(${esc(notes)})</small>` : ""}</span></span>`);
    });
    return layout.filter((r) => !skip.includes(r.label) && (rows[r.label].length || r.always)).map((r) =>
      `<span class="chiprow" data-rowpart="${esc(r.part)}"${r.always ? " data-always" : ""}><b>${esc(r.label)}</b>${rows[r.label].length ? rows[r.label].join("") + `<span class="none" hidden>none stated</span>` : `<span class="none">none stated</span>`}</span>`).join("");
  }
  function card(n) {
    const c = document.createElement("div");
    c.className = `card ${n.kind}${n.minor ? " minor" : ""}`;
    c.style.setProperty("--lc", nodeColor(n));
    c.dataset.id = n.id;
    const k = esc(DATA.kinds[n.kind]) + (n.when ? ` · ${esc(n.when)}` : "");
    const chips = chipsFor(n);
    const text = n.minor ? "" : `<span class="t">${esc(n.short_text || n.text)}</span>`;
    const hasBody = !!(text || chips);
    c.innerHTML = `<div class="head"><button type="button" class="pick"><span class="k">${k}</span><span class="n">${esc(n.label)}</span></button>` +
      (hasBody ? `<button type="button" class="tog" aria-expanded="false" aria-label="Show details for ${esc(n.label)}"><span class="chev" aria-hidden="true">▸</span></button>` : "") +
      `</div>` + (hasBody ? `<div class="body" hidden>${text}${chips ? `<span class="chips">${chips}</span>` : ""}</div>` : "");
    c.querySelector(".pick").addEventListener("click", () => select(n.id));
    if (hasBody) c.querySelector(".tog").addEventListener("click", () => { setOpen(c, c.querySelector(".body").hidden); if (current) drawLinks(current); });
    cardEls[n.id] = c;
    return c;
  }
  function setOpen(c, open) {
    const body = c.querySelector(".body"), tog = c.querySelector(".tog");
    if (!body) return;
    body.hidden = !open;
    tog.setAttribute("aria-expanded", String(open));
    tog.setAttribute("aria-label", `${open ? "Hide" : "Show"} details for ${byId[c.dataset.id].label}`);
  }
  let allOpen = false;
  function expandAll(open) {
    allOpen = open;
    Object.values(cardEls).forEach((c) => setOpen(c, open));
    $("expandAll").textContent = open ? "Close all cards" : "Open all cards";
    if (current) drawLinks(current);
  }
  window.atlasExpandAll = expandAll;
  $("expandAll").addEventListener("click", () => expandAll(!allOpen));

  // what's showing: parts, inferred links, search
  function refresh() {
    const q = $("q").value.trim().toLowerCase();
    document.querySelectorAll(".section").forEach((s) => { s.hidden = !partOn[s.dataset.part]; });
    Object.entries(cardEls).forEach(([id, el]) => {
      const n = byId[id];
      const hay = [n.label, n.text, n.when || "", ...Object.values(n.facts || {})].join(" ").toLowerCase();
      el.classList.toggle("dimmed", !!q && !hay.includes(q));
    });
    // tags describe their own card, so they stay when the other end's part is off; inferred ones wait for the box
    document.querySelectorAll(".chip").forEach((c) => { c.hidden = c.dataset.basis === "inferred" && !inferredOn(); });
    document.querySelectorAll(".chiprow").forEach((r) => {
      const hasChips = !!r.querySelector(".chip"), anyShown = !!r.querySelector(".chip:not([hidden])");
      // an "always" row whose only tags are hidden inferred ones still says so, instead of vanishing
      r.hidden = !hasChips ? !partOn[r.dataset.rowpart] : anyShown ? false : !("always" in r.dataset) || !partOn[r.dataset.rowpart];
      const none = r.querySelector(".none");
      if (none && hasChips) none.hidden = anyShown;
    });
    Object.values(laneEls).forEach((l) => { l.hidden = !l.querySelector(".section:not([hidden])"); });
    document.querySelectorAll("#gaps [data-part]").forEach((g) => { g.hidden = !partOn[g.dataset.part]; });
    if (current && !partOn[byId[current].part]) select(null); else if (current) select(current);
  }
  window.atlasShowOnly = (short) => { Object.keys(partOn).forEach((k) => { partOn[k] = k === short; }); document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; }); refresh(); };

  // lines for the selected card only
  const board = $("board"), svg = $("links");
  function drawLinks(id) {
    svg.innerHTML = "";
    if (!id) return;
    const W = lanesEl.scrollWidth, H = lanesEl.scrollHeight;
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const base = lanesEl.getBoundingClientRect();
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    const a = box(cardEls[id]);
    DATA.edges.forEach((e) => {
      if (e.from !== id && e.to !== id) return;
      if (!visibleEdge(e)) return;
      const other = e.from === id ? e.to : e.from;
      const el = cardEls[other];
      if (!el || el.offsetParent === null) return;
      const b = box(el);
      const right = b.x > a.x + a.w / 2;
      const sameLane = Math.abs(b.x - a.x) < 20;
      const ya = a.y + Math.min(a.h / 2, 24), yb = b.y + Math.min(b.h / 2, 24);
      let d;
      if (sameLane) {
        const x = a.x + a.w;
        d = `M${x},${ya} C${x + 40},${ya} ${x + 40},${yb} ${x},${yb}`;
      } else {
        const sx = right ? a.x + a.w : a.x, tx = right ? b.x : b.x + b.w;
        const dx = Math.max(40, Math.abs(tx - sx) / 2.5) * (right ? 1 : -1);
        d = `M${sx},${ya} C${sx + dx},${ya} ${tx - dx},${yb} ${tx},${yb}`;
      }
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("class", `${e.basis === "inferred" ? "inferred" : ""} ${e.certainty || ""}`);
      svg.appendChild(p);
    });
  }

  let current = null;
  const layerName = Object.fromEntries((DATA.layers || []).map((l) => [l.id, l.label]));
  const pageName = (s) => s.split("#")[0].split("/").pop().replace(/\.md$/, "").replace(/-/g, " ");
  function select(id) {
    current = id;
    Object.values(cardEls).forEach((c) => c.classList.remove("hot", "sel"));
    board.classList.toggle("focus", !!id);
    if (!id) { drawLinks(null); intro(); return; }
    const n = byId[id];
    cardEls[id].classList.add("hot", "sel");
    DATA.edges.filter((e) => (e.from === id || e.to === id) && visibleEdge(e)).forEach((e) => { const o = e.from === id ? e.to : e.from; cardEls[o] && cardEls[o].classList.add("hot"); });
    drawLinks(id);
    const groups = {};
    DATA.edges.filter((e) => e.from === id || e.to === id).forEach((e) => { (groups[e.group || e.layer] = groups[e.group || e.layer] || []).push(e); });
    const fs = n.fact_src || {}, fv = n.facts || {};
    const layout = ((SCHEMA[n.kind] || {}).facts || []).filter((f) => fv[f.key] || f.always);
    const facts = layout.length ? `<dl>${layout.map((f) => fv[f.key]
      ? `<dt>${esc(f.key)}</dt><dd>${esc(fv[f.key])}${fs[f.key] ? `<a class="src" href="${gh(fs[f.key])}" target="_blank" rel="noopener">source</a>` : ""}</dd>`
      : `<dt>${esc(f.key)}</dt><dd class="missing">Not in the wiki yet.</dd>`).join("")}</dl>` : "";
    const html = Object.entries(groups).map(([g, es]) => `<h4>${esc(layerName[g] || g)}</h4><ul>${es.map((e) => {
      const other = e.from === id ? e.to : e.from;
      const lab = e.from === id ? e.type : (e.chipBack || e.type);
      return `<li class="conn ${e.basis}"><span>${esc(lab)} </span><button type="button" data-go="${other}">${esc(byId[other].label)}</button>${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " (" + esc(a.note) + ")" : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    const see = (n.see || []).length ? ` · also on ${n.see.map((s) => `<a href="${gh(s)}" target="_blank" rel="noopener">${esc(pageName(s))}</a>`).join(", ")}` : "";
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])}${n.when ? " · " + esc(n.when) : ""} · ${esc(laneOf[n.lane].label)}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span><p>${esc(n.text)}</p>${facts}${html}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>${see}`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToCard(b.dataset.go); }));
  }
  function scrollToCard(id) {
    const el = cardEls[id]; if (!el) return;
    const sec = el.closest(".section");
    if (sec && sec.classList.contains("shut")) { sec.classList.remove("shut"); sec.querySelector(".sechead").setAttribute("aria-expanded", "true"); drawLinks(current); }
    const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.left < br.left || r.right > br.right || r.top < br.top || r.bottom > br.bottom)
      board.scrollBy({ left: r.left - br.left - br.width / 3, top: r.top - br.top - 60, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function intro() {
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2><p>${esc(DATA.intro || "")}</p>`;
  }
  board.addEventListener("click", (ev) => { if (!ev.target.closest(".card") && !ev.target.closest(".sechead")) select(null); });

  $("q").addEventListener("input", refresh);
  $("optInferred").addEventListener("change", refresh);
  document.querySelectorAll("input[data-part]").forEach((c) => c.addEventListener("change", () => { partOn[c.dataset.part] = c.checked; refresh(); }));
  window.addEventListener("resize", () => { if (current) drawLinks(current); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) drawLinks(current); });

  $("gaps").innerHTML = DATA.gaps.filter((g) => g.items.length).map((g) => `<div data-part="${esc(g.part)}"><h3>${esc(g.title)}</h3><ul>${g.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  select(null);
  refresh();
})();
</script>

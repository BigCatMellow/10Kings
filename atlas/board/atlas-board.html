<title>The Atlas</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: an atlas board. One column per region (plus Port, the Spine, the border towns and the world as a whole); cards grouped under headings that later parts add to, so the board grows downward.
   Cards collapse to kind + name; open, they show a summary and connection rows. Every card of a kind shows the same rows in the same order (the part's card_schema), with "none stated" where the wiki gives nothing.
   Lines are drawn only for the selected card. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1c2420; --muted: #5c6863; --line: #d3d9d5; --lane: #e8ece8;
  --focus: #0f766e; --inferred: #9a6b1f;
  --r-northwind: #3f6f9f; --r-ironcrest: #a4522f; --r-greenvale: #5f9433; --r-highridge: #b98f22; --r-deepwood: #2e6a4d; --r-sunplains: #d0702a; --r-port: #6c4f9c; --r-spine: #7b6f64; --r-borderlands: #5c6863; --r-across: #5c6863;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
    --focus: #3cc4b3; --inferred: #e0a852;
    --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
  --focus: #3cc4b3; --inferred: #e0a852;
  --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.wrap { padding-inline: 16px; padding-block: 20px 40px; max-width: 1640px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; margin-bottom: 10px; }
.eyebrow { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.count { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.count b { font-family: var(--font-display); font-size: 1.3rem; margin-right: 4px; }
@media (max-width: 600px) { .counts { gap: 4px; } .count { padding: 2px 7px; font-size: 12px; } .count b { font-size: 1rem; } h1 { font-size: 1.8rem; } }
.controls { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 10px 0 12px; font-size: 13px; color: var(--muted); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.controls input[type=checkbox] { accent-color: var(--focus); }
.controls input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--focus); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.parts { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 82vh; }
.lanes { position: relative; display: flex; gap: 12px; padding: 10px; width: max-content; align-items: stretch; }
.lane { width: 208px; flex: none; background: var(--lane); border-radius: 8px; padding: 0 8px 10px; position: relative; } /* no z-index: cards must stack above the link lines, which sit above the lanes */
.lane > h3 { position: sticky; top: 0; z-index: 3; margin: 0 -8px 4px; padding: 9px 10px 7px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; background: var(--lane); border-radius: 8px 8px 0 0; border-top: 4px solid var(--lc); }
.section { margin-top: 8px; }
.sechead { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 2px 0 6px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; }
.sechead:hover { color: var(--ink); }
.sechead:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sechead .num { font-family: var(--font-body); letter-spacing: 0; font-weight: 400; font-size: 11px; }
.chev { display: inline-block; width: 10px; transition: transform .15s; flex: none; }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.section.shut .cards { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; margin-bottom: 6px; position: relative; z-index: 2; transition: opacity .15s, box-shadow .15s; }
.card:hover { box-shadow: 0 2px 10px rgb(0 0 0 / .1); }
.card .head { display: flex; align-items: stretch; }
.card .pick { flex: 1; min-width: 0; display: block; text-align: left; background: none; border: 0; padding: 7px 4px 7px 9px; cursor: pointer; border-radius: 6px 0 0 6px; }
.card .pick:focus-visible, .card .tog:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.card .tog { flex: none; width: 30px; background: none; border: 0; border-left: 1px solid transparent; cursor: pointer; color: var(--muted); border-radius: 0 6px 6px 0; font-size: 12px; }
.card .tog:hover { color: var(--ink); background: var(--bg); }
.card .k { display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .n { display: block; font-weight: 700; font-size: 14px; line-height: 1.25; margin-top: 1px; }
.card .body { padding: 0 9px 9px; }
.card .t { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
.card.region .n { font-family: var(--font-display); font-size: 19px; letter-spacing: .01em; }
.card.minor { border-style: dashed; border-left-style: solid; }
.card.minor .pick { padding-block: 5px; }
.card.minor .n { font-weight: 600; font-size: 13px; }
.card.minor .k { font-size: 10px; }
.card.saying .n { font-style: italic; font-weight: 600; }
.chip[hidden], .chiprow[hidden], .section[hidden], .lane[hidden], .card .body[hidden], [data-part][hidden] { display: none; }
.chips { display: grid; gap: 4px; margin-top: 7px; }
.chiprow { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
.chiprow b { font-weight: 600; color: var(--muted); margin-right: 2px; }
.chiprow .none { font-style: italic; opacity: .8; }
.chip { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; line-height: 1.2; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.chip small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.chip.inferred small { color: inherit; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dc); flex: none; }
.chip.likely, .chip.working { border-style: dashed; }
.chip.possible { border-style: dotted; }
.chip.inferred { border: 1px dashed var(--inferred); color: var(--inferred); background: transparent; }
svg.links { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg.links path { fill: none; stroke: var(--focus); stroke-width: 2; opacity: .85; }
svg.links path.inferred { stroke: var(--inferred); stroke-dasharray: 4 4; }
svg.links path.likely, svg.links path.working { stroke-dasharray: 8 5; }
svg.links path.possible { stroke-dasharray: 2 5; }
.board.focus .card:not(.hot) { opacity: .28; }
.card.sel { box-shadow: 0 0 0 3px var(--focus); }
.card.dimmed { display: none; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 86vh; overflow: auto; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 2px 0 6px; line-height: 1.05; text-wrap: balance; }
.panel h4 { font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.panel dl { margin: 8px 0 0; }
.panel dt { font-size: 12px; color: var(--muted); }
.panel dd { margin: 0 0 6px; }
.panel dd.missing { color: var(--muted); font-style: italic; }
.panel .src { font-size: 12px; margin-left: 4px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conn { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
.conn.inferred { border-left-color: var(--inferred); }
.conn button { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.conn button:hover { text-decoration-color: var(--focus); }
.conn q { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.conn a { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.tag.inferred { color: var(--inferred); border-color: var(--inferred); }
.panel a { color: var(--focus); }
.status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.below section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.below h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 8px; }
.below h3 { font-family: var(--font-display); font-size: 1rem; margin: 12px 0 6px; letter-spacing: .02em; }
.below h3:first-of-type { margin-top: 0; }
.below ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
@media (prefers-reduced-motion: reduce) { .card, .chev { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>

  </div>
</div>

ons": "Nothing specific to this region. The wiki gives only a general pattern: passes reopen unevenly in spring, heat and water pressure rise in warmer regions in summer, harvest and storms collide in autumn, and northern routes become unreliable in winter."}, "lane": "highridge", "section": "Geography", "short_text": "Highland crossroads where routes around the Spine meet.", "short": "Highridge", "fact_src": {"Seasons": "Economy/Trade-and-Dependencies.md#seasonal-stress"}, "part": "Geography"}, {"id": "deepwood", "kind": "region", "label": "Deepwood", "status": "Working canon", "text": "A major forest region: old-growth and managed woodland, river valleys, wetlands, clearings, forest-edge towns, timber districts and restricted areas.", "src": "Regions/Deepwood.md", "facts": {"Terrain": "old-growth and managed forest, river valleys, wetlands, clearings; routes into foothills and possibly Underpass entrances", "Exports": "timber, herbs and medicinals, dyes, forest products, specialist ecological knowledge", "Imports": "selected metal tools, salt, grain and urban goods", "Pressures": "logging beyond accepted limits, fungal disease, isolationists against reformers, hidden-route crime", "Seasons": "Nothing specific to this region. The wiki gives only a general pattern: passes reopen unevenly in spring, heat and water pressure rise in warmer regions in summer, harvest and storms collide in autumn, and northern routes become unreliable in winter."}, "lane": "deepwood", "section": "Geography", "short_text": "Old-growth and managed forest, rivers and wetlands.", "fact_src": {"Seasons": "Economy/Trade-and-Dependencies.md#seasonal-stress"}, "part": "Geography"}, {"id": "sunplains", "kind": "region", "label": "Sunplains", "status": "Working canon", "text": "Warmer, drier southern and eastern country of city-states, irrigated basins, orchard belts, grazing country and coast. Water law is politically important.", "src": "Regions/Sunplains.md", "facts": {"Terrain": "dry plains, river valleys, irrigated basins, orchard belts, grazing country, coast, scrub, some fertile deltas", "Exports": "orchard and irrigated crops, oils and wines where appropriate, craft and luxury goods, southern maritime access", "Imports": "selected timber, metal, furs and northern goods", "Pressures": "drought fears, private control of canals, city-state blocs forming and breaking", "Seasons": "Nothing specific to this region. The wiki gives only a general pattern: passes reopen unevenly in spring, heat and water pressure rise in warmer regions in summer, harvest and storms collide in autumn, and northern routes become unreliable in winter."}, "lane": "sunplains", "section": "Geography", "short_text": "Warm, dry south and east: city-states, orchards, irrigation.", "fact_src": {"Seasons": "Economy/Trade-and-Dependencies.md#seasonal-stress"}, "part": "Geography"}, {"id": "port", "kind": "hub", "label": "Port", "status": "Working canon", "text": "The major neutral commercial city. It matters for its network position and institutions, not as the only harbor. Its exact site isn't fixed; it belongs to no kingdom.", "src": "Places/Port.md", "facts": {"Exports": "shipping access, repair, warehousing, processing, finance, arbitration, information, neutral exchange", "Imports": "significant food and raw-material inflows", "Why it stays central": "network effects: agents, credit, warehouses, courts and translators are already there", "Position": "not fixed; its site should give 'a position convenient to both northern and southern sea routes' and 'access to inland rivers or roads'", "Territory": "unsettled: Frostbay Way is described 'if Port is territorially separate'"}, "lane": "port", "section": "Geography", "short_text": "The major neutral commercial city.", "part": "Geography"}, {"id": "spine", "kind": "mountains", "label": "The Spine", "status": "Working canon", "text": "The central mountain system the world's geography and transport are organized around. Passes, saddles, inhabited valleys, mining districts, old fortifications and hidden routes. Geologically active.", "src": "Places/The-Spine.md", "facts": {"Seasons": "in spring, roads and passes reopen unevenly (Trade and Dependencies)", "Touches": "Highridge is the only region the wiki ties to it by name"}, "lane": "spine", "section": "Geography", "short_text": "The central mountain system everything routes around.", "part": "Geography"}, {"id": "underpass", "kind": "underground", "label": "The Underpass", "status": "Working canon", "text": "Caves, fault passages, tunnels, settlements and trade routes beneath parts of the Spine. Not one road, not wholly mapped; authority is fragmented.", "src": "Places/The-Underpass.md", "facts": {"Functional adjacency": "two places not close on the surface may trade intensely because a reliable tunnel branch connects them", "Claims": "surface kingdoms claim some entrances and sections but rarely control the entire network", "Named entrances": "none yet"}, "lane": "spine", "section": "Geography", "short_text": "Caves, tunnels and settlements beneath parts of the Spine.", "part": "Geography"}, {"id": "stonefield", "kind": "border-town", "label": "Stonefield Forge", "status": "Established working example", "text": "Where mineral foothills grade into farmland: mixed farming and craft households, metal repair for farms, labor migration both ways, disputes over water, smoke, timber and land.", "src": "Places/Border-Towns.md#stonefield-forge--ironcrest--greenvale", "lane": "borderlands", "section": "Geography", "short_text": "Mineral foothills meet farmland: craft households, farm metal repair, labor moving both ways.", "part": "Geography"}, {"id": "harveston", "kind": "border-town", "label": "Harveston Vale", "status": "Established working example", "text": "Where mixed farmland meets orchard and irrigation country: grain plus fruit, mixed water law, festivals built around several harvest calendars.", "src": "Places/Border-Towns.md#harveston-vale--greenvale--sunplains", "lane": "borderlands", "section": "Geography", "part": "Geography"}, {"id": "twilighthollow", "kind": "border-town", "label": "Twilighthollow", "status": "Established working example", "text": "Where forest uplands meet plateau routes: herbs meet caravan trade; rangers, traders, herders and guides; disputes over timber, roads and conservation.", "src": "Places/Border-Towns.md#twilighthollow--deepwood--highridge", "lane": "borderlands", "section": "Geography", "short_text": "Forest uplands meet plateau routes: herbs meet caravan trade.", "part": "Geography"}, {"id": "icestep", "kind": "border-town", "label": "Icestep Summit", "status": "Established working example", "text": "A cold pass town where maritime supply routes meet plateau caravans.", "src": "Places/Border-Towns.md#icestep-summit--northwind--highridge", "lane": "borderlands", "section": "Geography", "part": "Geography"}, {"id": "darkroot", "kind": "border-town", "label": "Darkroot Gulch", "status": "Established working example", "text": "A forested mineral frontier shaped by logging, charcoal, ore, repair and conflict over extraction.", "src": "Places/Border-Towns.md#darkroot-gulch--deepwood--ironcrest", "lane": "borderlands", "section": "Geography", "part": "Geography"}, {"id": "frostbay", "kind": "border-town", "label": "Frostbay Way", "status": "Established working example", "text": "Best treated as a coastal corridor or secondary port in Port's sphere: Northwind seafaring, Port credit and trade law, ship repair, immigrant merchants, seasonal labor.", "src": "Places/Border-Towns.md#frostbay-way--northwind--port-influence-zone", "lane": "borderlands", "section": "Geography", "short_text": "A coastal corridor or secondary port in Port’s sphere.", "part": "Geography"}, {"id": "nb-coalglen", "kind": "name-bank", "label": "Coalglen Meadows", "status": "Provisional name", "text": "A name from earlier brainstorming, kept in a name bank until the map and naming systems are finalized. Not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-helios", "kind": "name-bank", "label": "Helios Orchard", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-snowbreaker", "kind": "name-bank", "label": "Snowbreaker Quay", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-mosspeak", "kind": "name-bank", "label": "Mosspeak Rise", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-emberhaven", "kind": "name-bank", "label": "Emberhaven Cross", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-goldendunes", "kind": "name-bank", "label": "Golden Dunes Shore", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "nb-reedveil", "kind": "name-bank", "label": "Reedveil Bend", "status": "Provisional name", "text": "Name bank; not placed.", "src": "Places/Border-Towns.md#other-provisional-names", "lane": "across", "section": "Unplaced names", "minor": true, "part": "Geography"}, {"id": "northwind-culture", "kind": "culture", "label": "Northwind culture", "short": "Northwind culture", "status": "Working canon", "lane": "northwind", "section": "Culture", "text": "Colder than most of the known world and unusually maritime, but its people aren't uniformly fishers or stoic seafarers. Conversations can be sensitive to who is included, who witnessed something, and how certain a plan really is.", "short_text": "Speech that marks who's included and who saw it; port neighborhoods built above flood or storm lines.", "src": "Regions/Northwind.md", "facts": {"Aim": "Avoid turning Northwind into generic Vikings.", "Inspiration": "Scottish and Irish island communities; Icelandic, Faroese, Scandinavian and North Atlantic maritime cultures; Ainu, Japanese, Korean, Aleut, Inuit and other northern and coastal societies; fishing societies built around seasonal risk, preservation and cooperative labor. Avoid generic 'Viking culture.'", "Speech": "May include an inclusive and an exclusive 'we', strong evidential markers, directional vocabulary tied to coast, wind and slope, and future forms that stress conditions. Conversations become sensitive to who is included, who witnessed something, and how certain a plan really is.", "Building": "Large ports with stone breakwaters, dock districts, timber warehouses, fish markets, smokehouses, boatyards, public halls and shrines, built above flood or storm lines. Fishing towns with small docks, communal work yards, drying racks, storage pits and steep-roofed or earth-insulated homes depending on climate. Remote families build for insulation and repairability from driftwood, stone, turf, timber, clay, hide, reeds and imported iron.", "Place names": "Coastal geography, bays, islands, currents, lineages, seasonal sites."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#northwind", "Inspiration": "Regions/Northwind.md#cultural-inspirations", "Speech": "Regions/Northwind.md#language", "Building": "Regions/Northwind.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#northwind-languages", "Culture/Architecture.md#northwind", "Culture/Culture-and-Influence.md#northwind"], "part": "Culture"}, {"id": "ironcrest-culture", "kind": "culture", "label": "Ironcrest culture", "short": "Ironcrest culture", "status": "Working canon", "lane": "ironcrest", "section": "Culture", "text": "Places unusually high value on demonstrated skill, accountability for work, reputation over generations, apprenticeship, mutual aid in dangerous trades and practical literacy. There's a long tension between craft pride and concentrated ownership.", "short_text": "Skill, accountability and apprenticeship; speech that asks who's responsible.", "src": "Regions/Ironcrest.md", "facts": {"Aim": "Should feel like a place where generations of upland settlement, ore extraction, specialized crafts, dangerous labor, merchant capital and repeated political consolidation produced a distinctive culture; not 'Celtic miners' or 'Yemeni foundries'.", "Values": "Demonstrated skill; accountability for work; reputation over generations; apprenticeship; mutual aid in dangerous trades; practical literacy such as contracts, weights, measures and records. Mine owners, guild masters, workers, small smiths, merchants and rural communities don't necessarily want the same future.", "Inspiration": "Scottish, Welsh and Appalachian mining communities; Andean highland mining settlements; Ethiopian and Yemeni upland stone architecture; Japanese and Chinese craft-lineage traditions; Balkan and Central European mountain towns. It shouldn't resemble any one of them directly.", "Speech": "May habitually distinguish whether something was ordered, attempted, completed, inspected or guaranteed: close attention to responsibility and proof, without making every Ironcrest person blunt or emotionless.", "Building": "Older urban cores may contain dark local stone, narrow lanes, fortified compounds, cisterns, market courts, guild halls, and neighborhoods layered around mines or river crossings. Workshops run on water wheels, bellows, cranes, hand and animal power. Towns exist for several reasons at once; homes show mixed economies (a miner may keep goats, a smith may farm part of the year).", "Place names": "Older upland and river names beneath later mining, fort, family and guild names."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#ironcrest", "Values": "Regions/Ironcrest.md#cultural-character", "Inspiration": "Regions/Ironcrest.md#cultural-influences", "Speech": "Regions/Ironcrest.md#language", "Building": "Regions/Ironcrest.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#ironcrest-languages", "Culture/Architecture.md#ironcrest", "Culture/Culture-and-Influence.md#ironcrest"], "part": "Culture"}, {"id": "greenvale-culture", "kind": "culture", "label": "Greenvale culture", "short": "Greenvale culture", "status": "Working canon", "lane": "greenvale", "section": "Culture", "text": "The largest major agricultural heartland, but not one endless field: market towns, pasture, rivers, orchards, mills, estates, tenant villages and cities. Speech may reinforce attention to process, inheritance and long-term obligation.", "short_text": "Speech built around process and stewardship; granaries, mills and farm compounds.", "src": "Regions/Greenvale.md", "facts": {"Inspiration": "Andean cooperative agriculture; South and Southeast Asian irrigation communities; Irish rural social traditions; Indigenous seed stewardship in the Americas; Eastern European mixed farming; village-compound and commons systems worldwide.", "Aim": "A heavily inhabited agricultural country, not a pastoral postcard.", "Speech": "May distinguish beginning, ongoing, recurring, interrupted, completed and seasonal work, and personal property from land or resources held in stewardship for family or community.", "Building": "Agricultural cities are market, milling, storage, craft and legal centers, not giant villages: granaries, mills, river quays, dense working-class districts, wealthy landowning quarters, caravan yards. Towns vary: raised floors on floodplains, earthen or timber compounds in drier towns, cooperative villages around common storage and wells. Farmsteads are mixed-purpose complexes.", "Place names": "Rivers, soils, old settlements, family lands, markets, former estates."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#greenvale", "Inspiration": "Regions/Greenvale.md#cultural-inspirations", "Speech": "Regions/Greenvale.md#language", "Building": "Regions/Greenvale.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#greenvale-languages", "Culture/Architecture.md#greenvale", "Culture/Culture-and-Influence.md#greenvale"], "part": "Culture"}, {"id": "highridge-culture", "kind": "culture", "label": "Highridge culture", "short": "Highridge culture", "status": "Working canon", "lane": "highridge", "section": "Culture", "text": "A highland crossroads, not simply 'the merchant region': routes that avoid or cross the Spine converge here. People used to bargaining across languages notice what a promise actually commits someone to.", "short_text": "Probably the most multilingual settled region; speech that pins down what a promise commits you to.", "src": "Regions/Highridge-Plateau.md", "facts": {"Aim": "Its defining history is its role as intermediary, so cultural borrowing should be especially visible.", "Inspiration": "Tibetan and Himalayan plateau communities; Andean highlands; Central Asian caravan societies; Persian and Silk Road caravanserai networks; Caucasus trade communities; mountain markets across Asia and South America.", "Speech": "Probably the most multilingual settled region. Trade forms stress condition, obligation, evidence, quotation, weights, dates, routes and exceptions, so people notice what a promise actually commits someone to.", "Building": "Cities layered around markets, caravan yards, stables, cisterns, temples, meeting halls and arbitration halls, with terraces and retaining walls; neighborhoods show generations of settled foreign merchants. Pass towns with fortified gates, inns, animal yards, repair shops, public scales and toll or customs houses.", "Place names": "Route names, passes, wells, caravan families, old toll sites, names translated from several languages."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#highridge-plateau", "Inspiration": "Regions/Highridge-Plateau.md#cultural-inspirations", "Speech": "Regions/Highridge-Plateau.md#language", "Building": "Regions/Highridge-Plateau.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#highridge-languages", "Culture/Architecture.md#highridge", "Culture/Culture-and-Influence.md#highridge-plateau"], "part": "Culture"}, {"id": "deepwood-culture", "kind": "culture", "label": "Deepwood culture", "short": "Deepwood culture", "status": "Working canon", "lane": "deepwood", "section": "Culture", "text": "People who have developed institutions for living with, using and defending the forest. It shouldn't be written as an undifferentiated mystical wilderness.", "short_text": "Speech with precise words for forest, water and sign; towns that may use longhouses and raised floors.", "src": "Regions/Deepwood.md", "facts": {"Aim": "Avoid the 'mystical forest people' monoculture.", "Inspiration": "Amazonian forest societies; Dayak and Bornean longhouse communities; Japanese managed woodland traditions; Indigenous North American forest societies; Baltic, Slavic, Finnic and Celtic woodland cultures; historical forest economies worldwide.", "Speech": "May mark agency or animacy grammatically, with precise words for forest age, water state, animal sign, plant succession, cutting rights, regrowth, and inherited versus directly observed knowledge. Environmental attention without implying supernatural wisdom.", "Building": "Cities still look like cities: markets, river docks, workshops, religious compounds, poor neighborhoods, roads and boardwalks; a city may grow around existing tree stands or waterways rather than a geometric plan. Many towns are specialized (river trade, forest products, hunting, timber, medicine, border exchange); longhouses, raised floors, covered walkways and courtyards may appear depending on climate. Remote homes: some raised for wet ground, others partly dug into slopes.", "Place names": "Waterways, groves, species, older peoples, landmarks that may not be obvious to outsiders."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#deepwood", "Inspiration": "Regions/Deepwood.md#cultural-inspirations", "Speech": "Regions/Deepwood.md#language", "Building": "Regions/Deepwood.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#deepwood-languages", "Culture/Architecture.md#deepwood", "Culture/Culture-and-Influence.md#deepwood"], "part": "Culture"}, {"id": "sunplains-culture", "kind": "culture", "label": "Sunplains culture", "short": "Sunplains culture", "status": "Working canon", "lane": "sunplains", "section": "Culture", "text": "The warmer, generally drier south and east of old city-states, irrigated farming, orchards, coastal exchange and civic competition; not to be reduced to wine, olive oil and festivals. Its speech helps explain why political speech is a craft and public humiliation can matter politically.", "short_text": "Rhetoric, status and saving face; courtyard cities that each look different.", "src": "Regions/Sunplains.md", "facts": {"Aim": "Its civic competition should be as important as climate.", "Inspiration": "Maghrebi and Levantine societies; Anatolian, Persian, Iberian, Greek and southern Italian dry-climate traditions; South Asian irrigation and market cultures; Andean and other South American arid and coastal agriculture; city-states and merchant republics globally.", "Speech": "Urban languages may carry formal status registers, public and private speech differences, elaborate rhetoric and legal argument, and forms for indirect refusal and saving face.", "Building": "City-states with dense walled cores, courtyard houses, shaded streets, cisterns, fountains, markets, assembly spaces, garden districts, elite estates and crowded poor quarters; different cities should look meaningfully different. Small towns may center on a spring, irrigation gate, market, estate, shrine or harbor. Farmsteads with thick walls, courtyards, shade, roof terraces and water storage.", "Place names": "Old city-state names, founders, civic ideals, waterworks, forts, ports, estates."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#sunplains", "Inspiration": "Regions/Sunplains.md#cultural-inspirations", "Speech": "Regions/Sunplains.md#language", "Building": "Regions/Sunplains.md#settlement-and-architecture", "Place names": "Culture/Naming.md#regional-direction"}, "see": ["Culture/Language-and-Thought.md#sunplains-languages", "Culture/Architecture.md#sunplains", "Culture/Culture-and-Influence.md#sunplains"], "part": "Culture"}, {"id": "port-culture", "kind": "culture", "label": "Port culture", "short": "Port culture", "status": "Working canon", "lane": "port", "section": "Culture", "text": "Port is its own culture, not merely six regional quarters. Generations of migration have made mixed families, native dialects, neighborhood cuisines, blended religious practice and people who identify as Port-born first.", "short_text": "Its own culture, not six regional quarters; people who call themselves Port-born first.", "src": "Places/Port.md#culture", "facts": {"Aim": "Neighborhoods whose cultures are several generations removed from their ancestral regions and no longer fit clean categories.", "Mixing": "Mixed families; native Port dialects; neighborhood cuisines; blended religious practices; occupations found nowhere else at the same scale; people who identify as Port-born first.", "Speech": "Native Port speech, trade pidgins and creoles, heritage languages, guild jargons, religious registers and neighborhood dialects. A third-generation Port family shouldn't sound like diluted Northwind or Sunplains.", "Building": "Layers from every region, made its own style by high land value, fire rules, warehouses, docks, mixed materials, vertical additions, foreign quarters and rebuilding after fires and storms.", "Place names": "Layers upon layers: an old geographic name, an official charter name, district nicknames, immigrant neighborhood names, merchant terminology."}, "fact_src": {"Aim": "Culture/Culture-and-Influence.md#cultural-blending", "Mixing": "Places/Port.md#culture", "Speech": "Culture/Language-and-Thought.md#port", "Building": "Culture/Architecture.md#port", "Place names": "Culture/Naming.md#regional-direction"}, "see": [], "part": "Culture"}, {"id": "borderlands-culture", "kind": "culture", "label": "Border-town culture", "short": "Border-town culture", "status": "No status label", "lane": "borderlands", "section": "Culture", "text": "Border towns aren't diluted versions of two cultures; over generations they become cultures of their own. Marriage crosses political lines, children grow up bilingual, guild jurisdictions overlap, law gets negotiated, and loyalty may be local before regional.", "short_text": "Not two cultures watered down: over generations, cultures of their own.", "src": "Places/Border-Towns.md#principle", "facts": {"Aim": "Border populations shouldn't look like half of one culture plus half of another. Over generations they develop their own institutions, accents, marriage patterns, foods, building types, jokes, prejudices and identities.", "Speech": "First-generation bilingual adults may code-switch; second and third generations often create stable mixed dialects and combine habits, which can make them unusually effective mediators (not wiser, just practiced at what must be said explicitly).", "Building": "Adaptive, not decorative fusion.", "Place names": "Often two accepted names, one name translated differently by each side, a hybrid name, an old political name nobody uses officially, or family names crossing linguistic lines.", "Mixing": "Younger generations may speak stable hybrid dialects, reject their grandparents' political labels, combine religious practices, marry across older divisions, treat regional feuds as absurd, or revive pre-Convergence identities: natural political wild cards.", "Story use": "If kingdoms argue in old categories while border populations have already made new identities, the political map is lagging behind lived reality."}, "fact_src": {"Speech": "Culture/Language-and-Thought.md#border-generations", "Building": "Culture/Architecture.md#border-towns", "Place names": "Culture/Naming.md#border-names", "Mixing": "Places/Border-Towns.md#generational-change", "Story use": "Places/Border-Towns.md#story-function", "Aim": "Culture/Culture-and-Influence.md#cultural-blending"}, "see": [], "skip_rows": ["Mixes with", "Border towns"], "part": "Culture"}, {"id": "nomads", "kind": "people", "label": "Nomads and itinerant peoples", "short": "Nomads", "status": "Working area, not yet fixed canon", "lane": "across", "section": "Culture", "src": "Culture/Nomads.md", "text": "A favored idea the project wants to explore: a mobile people with significant Appalachian cultural influence, grounded in this world's actual mobility needs. One possible form is a network of related traveling households moving on circuits rather than wandering. Different mobile peoples can exist; 'the nomads' shouldn't be one culture.", "short_text": "An Appalachian-influenced mobile people, possibly moving on seasonal circuits; useful to everyone, trusted by almost no one.", "facts": {"Why they move": "Possible reasons: livestock between upland and lowland pasture; itinerant repair, metal, wood, basket, leather or musical trades; caravan support; seasonal farm labor; pilgrimage; fairs; hunting and trapping circuits; river or boat communities; families displaced by pre-Convergence border wars.", "Appalachian influence": "Social, not costume: dense kin networks, family reputations, ballads as archives, route knowledge in hard upland terrain, portable crafts, repair and reuse, mutual aid outside institutions, suspicion of distant authorities, creditors, monopolies and outsiders who extract wealth then leave, humor and storytelling as social weapons, strong attachment to places. Historical Appalachia wasn't generally nomadic, so this is combined with genuinely mobile traditions: transhumant pastoralism, itinerant crafts, caravan peoples, seasonal work circuits and traveling religious communities.", "Rights": "In the possible circuit form, families may own no kingdom-scale territory but hold traditional stopping rights, springs, pasture agreements, camps, shrines and market privileges recognized by old custom.", "What they carry": "Songs, news, tools, marriages, rumors, contraband, religious ideas, prices, missing-person information. Useful to everyone and fully trusted by almost no one.", "Who wants them": "The Council would want their information networks without letting them become independent infrastructure. The Villain could use them as couriers, witnesses or unwitting carriers of chosen rumors. Wurdren could plausibly know them better than elite characters. (Parts 4 and 6 will connect these.)", "Don't": "Make them automatically criminal or mystical wanderers with no economy; caricature Appalachian influence; make all mobile groups ethnically identical; assume mobility means no attachment to place."}, "fact_src": {"Why they move": "Culture/Nomads.md#why-mobile-peoples-exist-here", "Appalachian influence": "Culture/Nomads.md#appalachian-influenced-concept", "Rights": "Culture/Nomads.md#a-possible-form", "What they carry": "Culture/Nomads.md#political-role", "Who wants them": "Culture/Nomads.md#political-role", "Don't": "Culture/Nomads.md#do-not"}, "see": ["Culture/Culture-and-Influence.md#nomads-and-itinerant-peoples"], "part": "Culture"}, {"id": "ironcrest-saying", "kind": "saying", "label": "“Iron hands, iron hearts.”", "status": "Provisional scene texture", "lane": "ironcrest", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: toughness becoming cruelty. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies toughness becoming cruelty.", "facts": {"Employers' biased shortcut": "Ironcrest workers are stereotyped as better metalworkers. Reality may contradict it; show counterexamples. A stereotype should create tension, opportunity or injustice, not become a rule of the world."}, "fact_src": {"Employers' biased shortcut": "Culture/Regional-Social-Dynamics.md#hiring-prejudice"}, "part": "Culture"}, {"id": "northwind-saying", "kind": "saying", "label": "“Cold water, cold blood.”", "status": "Provisional scene texture", "lane": "northwind", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: maritime hardness becoming callousness. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies maritime hardness becoming callousness.", "facts": {"Employers' biased shortcut": "Northwind sailors are assumed to be safer hires for ship work. Reality may contradict it; show counterexamples. A stereotype should create tension, opportunity or injustice, not become a rule of the world."}, "fact_src": {"Employers' biased shortcut": "Culture/Regional-Social-Dynamics.md#hiring-prejudice"}, "part": "Culture"}, {"id": "greenvale-saying", "kind": "saying", "label": "“Soft as Greenvale butter.”", "status": "Provisional scene texture", "lane": "greenvale", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: agricultural comfort becoming weakness. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies agricultural comfort becoming weakness.", "facts": {}, "fact_src": {}, "part": "Culture"}, {"id": "highridge-saying", "kind": "saying", "label": "“Every road leads to Highridge's pocket.”", "status": "Provisional scene texture", "lane": "highridge", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: intermediaries profit from everyone. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies intermediaries profit from everyone.", "facts": {"Employers' biased shortcut": "Highridge-trained clerks or Port polyglots may be preferred for translation and records. Reality may contradict it; show counterexamples. A stereotype should create tension, opportunity or injustice, not become a rule of the world."}, "fact_src": {"Employers' biased shortcut": "Culture/Regional-Social-Dynamics.md#hiring-prejudice"}, "part": "Culture"}, {"id": "deepwood-saying", "kind": "saying", "label": "“Gone to the trees.”", "status": "Provisional scene texture", "lane": "deepwood", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: outsiders treating seclusion as irrationality. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies outsiders treating seclusion as irrationality.", "facts": {"Employers' biased shortcut": "Deepwood-trained healers can command prestige for some specialties. Reality may contradict it; show counterexamples. A stereotype should create tension, opportunity or injustice, not become a rule of the world."}, "fact_src": {"Employers' biased shortcut": "Culture/Regional-Social-Dynamics.md#hiring-prejudice"}, "part": "Culture"}, {"id": "sunplains-saying", "kind": "saying", "label": "“Golden tongue, copper coin.”", "status": "Provisional scene texture", "lane": "sunplains", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: polished rhetoric hiding little substance. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies polished rhetoric hiding little substance.", "facts": {}, "fact_src": {}, "part": "Culture"}, {"id": "port-saying", "kind": "saying", "label": "“Every ship lands at Port, none stay.”", "status": "Provisional scene texture", "lane": "port", "section": "Culture", "src": "Culture/Regional-Social-Dynamics.md#example-sayings", "text": "What the speaker implies: a city used by outsiders and abandoned. Something particular people might say or expect, never an objective description. It can be affectionate, hostile, self-mocking or obsolete depending on who says it.", "short_text": "Implies a city used by outsiders and abandoned.", "facts": {"Employers' biased shortcut": "Displaced Port workers may be offered the hardest work because employers assume they have fewer alternatives. Port polyglots (like Highridge-trained clerks) may be preferred for translation and records. Reality may contradict it; show counterexamples. A stereotype should create tension, opportunity or injustice, not become a rule of the world."}, "fact_src": {"Employers' biased shortcut": "Culture/Regional-Social-Dynamics.md#hiring-prejudice"}, "part": "Culture"}, {"id": "f-forge-reawakening", "kind": "festival", "label": "Forge Reawakening", "when": "Early spring", "status": "Provisional", "lane": "ironcrest", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#ironcrest", "text": "Can mark foundries returning from winter maintenance; apprenticeship judgments, remembrance of dead workers and the ceremonial relighting of fires can reinforce labor identity.", "part": "Culture"}, {"id": "f-foundry-week", "kind": "festival", "label": "Foundry Week", "when": "Midsummer", "status": "Provisional", "lane": "ironcrest", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Midsummer) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-ember-remembrance", "kind": "festival", "label": "Ember Remembrance", "when": "Late autumn", "status": "Provisional", "lane": "ironcrest", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#ironcrest", "text": "Works better as a solemn memorial than a spectacle: banked fires, names on memorial walls and a rare interruption of commerce.", "part": "Culture"}, {"id": "f-coal-ember-vigil", "kind": "festival", "label": "Coal Ember Vigil", "when": "Midwinter", "status": "Provisional", "lane": "ironcrest", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Midwinter) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-ice-breaking", "kind": "festival", "label": "Ice Breaking", "when": "Early spring", "status": "Provisional", "lane": "northwind", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#northwind", "text": "Can mark the safe return of seasonal navigation; boat inspection, first launches and rights to contested fishing grounds can turn survival practice into public ritual.", "part": "Culture"}, {"id": "f-first-catch", "kind": "festival", "label": "First Catch", "when": "Late spring", "status": "Provisional", "lane": "northwind", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Late spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-aurora-nights", "kind": "festival", "label": "Aurora Nights", "when": "Late summer", "status": "Provisional", "lane": "northwind", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#northwind", "text": "Offers a quieter counterpoint to Northwind's rough public image: family stories, ancestor traditions, betrothals and beliefs tied to the lights. Supernatural explanations are beliefs, not proof.", "part": "Culture"}, {"id": "f-last-sail", "kind": "festival", "label": "Last Sail", "when": "Late autumn", "status": "Provisional", "lane": "northwind", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Late autumn) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-long-dark-feast", "kind": "festival", "label": "Long Dark Feast", "when": "Midwinter", "status": "Provisional", "lane": "northwind", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Midwinter) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-sowing-days", "kind": "festival", "label": "Sowing Days", "when": "Early spring", "status": "Provisional", "lane": "greenvale", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-grain-ripening", "kind": "festival", "label": "Grain Ripening", "when": "Late summer", "status": "Provisional", "lane": "greenvale", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Late summer) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-harvest-home", "kind": "festival", "label": "Harvest Home", "when": "Early autumn", "status": "Provisional", "lane": "greenvale", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#greenvale", "text": "Can combine celebration with redistribution, seed exchange and public accounting of surplus.", "part": "Culture"}, {"id": "f-root-cellar-night", "kind": "festival", "label": "Root Cellar Night", "when": "Midwinter", "status": "Provisional", "lane": "greenvale", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#greenvale", "text": "Can be intimate rather than civic: stored food, family stories and remembrance of old scarcity such as the Seven-year Blight.", "part": "Culture"}, {"id": "f-pass-opening", "kind": "festival", "label": "Pass Opening", "when": "Early spring", "status": "Provisional", "lane": "highridge", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-caravan-blessing", "kind": "festival", "label": "Caravan Blessing", "when": "Late spring", "status": "Provisional", "lane": "highridge", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Late spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-midsummer-debates", "kind": "festival", "label": "Midsummer Debates", "when": "Midsummer", "status": "Provisional", "lane": "highridge", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#highridge", "text": "Can make rhetoric a public competitive craft, without implying every Highridge resident is a philosopher.", "part": "Culture"}, {"id": "f-ledger-closing", "kind": "festival", "label": "Ledger Closing", "when": "Late autumn", "status": "Provisional", "lane": "highridge", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#highridge", "text": "Can mark the end of a fiscal or trade cycle: debts settled, renegotiated or publicly disputed before a brief period of relief.", "part": "Culture"}, {"id": "f-silent-thaw", "kind": "festival", "label": "Silent Thaw", "when": "Early spring", "status": "Provisional", "lane": "deepwood", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-canopy-vigil", "kind": "festival", "label": "Canopy Vigil", "when": "Midsummer", "status": "Provisional", "lane": "deepwood", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#deepwood", "text": "Can center on restraint and attention: reduced work, quiet observation and later community interpretation.", "part": "Culture"}, {"id": "f-gathering-quiet", "kind": "festival", "label": "Gathering Quiet", "when": "Early autumn", "status": "Provisional", "lane": "deepwood", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early autumn) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-deep-silence", "kind": "festival", "label": "Deep Silence", "when": "Midwinter", "status": "Provisional", "lane": "deepwood", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#deepwood", "text": "Can vary dramatically by community: some may treat it as spiritual practice; others as old custom, ecological rule or a holiday they barely observe.", "part": "Culture"}, {"id": "f-blossom-markets", "kind": "festival", "label": "Blossom Markets", "when": "Early spring", "status": "Provisional", "lane": "sunplains", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-festival-of-patrons", "kind": "festival", "label": "Festival of Patrons", "when": "Midsummer", "status": "Provisional", "lane": "sunplains", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#sunplains", "text": "Can turn civic generosity into competition among houses, guilds and cities.", "part": "Culture"}, {"id": "f-wine-crush", "kind": "festival", "label": "Wine Crush", "when": "Early autumn", "status": "Provisional", "lane": "sunplains", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early autumn) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-solstice-lanterns", "kind": "festival", "label": "Solstice Lanterns", "when": "Midwinter", "status": "Provisional", "lane": "sunplains", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#sunplains", "text": "Can mix family, neighborhood and civic meanings; different faiths may explain the same public practice differently.", "part": "Culture"}, {"id": "f-tide-return", "kind": "festival", "label": "Tide Return", "when": "Early spring", "status": "Provisional", "lane": "port", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#seasonal-calendar", "text": "Named in the seasonal calendar (Early spring) only; no description yet.", "minor": true, "part": "Culture"}, {"id": "f-three-moon-festival", "kind": "festival", "label": "Three Moon Festival", "when": "Early autumn", "status": "Provisional", "lane": "port", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#port", "text": "Most useful when it belongs to Port rather than serving as a generic 'all cultures' event: its power can come from the city showing that incompatible groups can occupy one civic space.", "part": "Culture"}, {"id": "f-lean-vigil", "kind": "festival", "label": "Lean Vigil", "when": "Midwinter", "status": "Provisional", "lane": "port", "section": "Festivals", "src": "Culture/Festivals-and-Seasonal-Life.md#port", "text": "Can mark the anxiety of winter shipping and food supply, without asserting that Port literally has no local food or defenses.", "part": "Culture"}], "edges": [{"from": "northwind", "to": "northern", "layer": "landmass", "type": "lies on", "basis": "stated", "quote": "Northwind occupies much of the Northern Continent and associated coasts and islands.", "src": "Regions/Northwind.md#geography", "chip": "Continent", "chipBack": "Regions on it", "part": "Geography"}, {"from": "ironcrest", "to": "greenvale", "layer": "border", "type": "borders", "certainty": "established", "basis": "stated", "quote": "Repeatedly used in border-town discussions. Upland/mineral country grades into productive foothill and lowland agriculture.", "src": "Geography-and-Connections.md#ironcrest--greenvale", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "greenvale", "to": "sunplains", "layer": "border", "type": "borders", "certainty": "established", "basis": "stated", "quote": "Repeatedly used. Temperate mixed farmland transitions toward warmer, drier agriculture with orchards, vineyards, irrigation systems, and southern trade.", "src": "Geography-and-Connections.md#greenvale--sunplains", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "deepwood", "to": "highridge", "layer": "border", "type": "borders", "certainty": "established", "basis": "stated", "quote": "Repeatedly used. Forested uplands thin toward exposed plateau routes.", "src": "Geography-and-Connections.md#deepwood--highridge", "chip": "Borders", "chipBack": "Borders", "part": "Geography"}, {"from": "deepwood", "to": "ironcrest", "layer": "border", "type": "borders (direct or near-direct)", "certainty": "established", "basis": "stated", "quote": "This implies at least one direct or near-direct frontier, probably where Ironcrest's eastern or southeastern uplands meet a western arm idge (likely), Greenvale–Highridge (likely), Deepwood–Sunplains (likely), Highridge–Sunplains (possible), and Greenvale–Deepwood (treated as a direct border unless the map contradicts it). Deepwood–Ironcrest is established as a relationship but only as a 'direct or near-direct' frontier.", "The region pages and Geography and Connections disagree on certainty: the Greenvale and Ironcrest pages state their Highridge borders plainly, while Geography and Connections calls them likely.", "Five region pairs have no border town: Ironcrest–Highridge, Greenvale–Deepwood, Deepwood–Sunplains, Greenvale–Highridge and Highridge–Sunplains.", "The wiki doesn't say which regions the Spine touches (only Highridge is tied to it) or which kingdoms hold Underpass entrances.", "No rivers, passes or Underpass entrances are named (history mentions provisional 'Ridge Pass Toll Wars'). Geography and Connections lists what the finished map should show: rivers, passes, Underpass entrances, caravan roads, seasonal closures, sea routes, old roads, pilgrimage paths, smuggling corridors.", "Directions are thin: Ironcrest west, Northwind north, Sunplains south and east, and Greenvale as 'the eastern agricultural interior' (from Highridge's point of view).", "Border Towns and World Overview carry no status label; the Border Towns page calls its six towns 'established working examples'.", "Seven names sit in the border-town name bank, unplaced."]}, {"part": "Culture", "title": "Part 2: Culture", "items": ["Five culture pages carry no status label: Architecture, Language and Thought, Naming, Culture and Influence (whose title reads 'Cultural Inspiration'), and Border Towns.", "Region culture is written twice: each region page has its own inspiration, language and architecture sections, and the Culture pages repeat them across regions. It's two owners for one concept. They agree in substance, but the lists already differ in detail: Highridge is 'probably the most multilingual settled region' on its re ound nowhere else at the same scale' aren't named.", "Root Cellar Night remembers the Seven-year Blight; it will connect when Part 5 (History) is built.", "Religion (Part 4) is only hinted at here: Solstice Lanterns says different faiths explain it differently, Port has blended religious practice, and several festivals imply rites. They'll connect when Part 4 is built."]}], "parts": [{"part": 1, "short": "Geography", "title": "Regions and Geography"}, {"part": 2, "short": "Culture", "title": "Culture"}], "schema": {"landmass": {"rows": [{"label": "Regions on it", "always": true, "part": "Geography"}], "facts": []}, "region": {"rows": [{"label": "Continent", "always": true, "part": "Geography"}, {"label": "Borders", "always": true, "part": "Geography"}, {"label": "Border towns", "always": true, "part": "Geography"}, {"label": "Sea partner of", "always": true, "part": "Geography"}, {"label": "Spine & Underpass", "always": true, "part": "Geography"}, {"label": "Sends", "always": true, "part": "Geography"}, {"label": "Gets", "always": true, "part": "Geography"}, {"label": "Trades with", "always": true, "part": "Geography"}, {"label": "Likely sends", "always": false, "part": "Geography"}, {"label": "Likely gets", "always": false, "part": "Geography"}, {"label": "Nomad circuit", "always": false, "part": "Culture"}], "facts": [{"key": "Terrain", "always": true, "part": "Geography"}, {"key": "Exports", "always": true, "part": "Geography"}, {"key": "Imports", "always": true, "part": "Geography"}, {"key": "Pressures", "always": true, "part": "Geography"}, {"key": "Seasons", "always": true, "part": "Geography"}]}, "hub": {"rows": [{"label": "Sea partners", "always": true, "part": "Geography"}, {"label": "In its sphere", "always": true, "part": "Geography"}, {"label": "Nomad circuit", "always": false, "part": "Culture"}], "facts": [{"key": "Position", "always": true, "part": "Geography"}, {"key": "Territory", "always": true, "part": "Geography"}, {"key": "Exports", "always": true, "part": "Geography"}, {"key": "Imports", "always": true, "part": "Geography"}, {"key": "Why it stays central", "always": true, "part": "Geography"}]}, "mountains": {"rows": [{"label": "Spine & Underpass", "always": true, "part": "Geography"}, {"label": "Regions", "always": true, "part": "Geography"}], "facts": [{"key": "Touches", "always": true, "part": "Geography"}, {"key": "Seasons", "always": true, "part": "Geography"}]}, "underground": {"rows": [{"label": "Spine & Underpass", "always": true, "part": "Geography"}, {"label": "Regions", "always": true, "part": "Geography"}], "facts": [{"key": "Functional adjacency", "always": true, "part": "Geography"}, {"key": "Claims", "always": true, "part": "Geography"}, {"key": "Named entrances", "always": true, "part": "Geography"}]}, "border-town": {"rows": [{"label": "Between", "always": true, "part": "Geography"}, {"label": "Culture", "always": true, "part": "Culture"}], "facts": []}, "name-bank": {"rows": [], "facts": []}, "culture": {"rows": [{"label": "Mixes with", "always": true, "part": "Culture"}, {"label": "Border towns", "always": true, "part": "Culture"}], "facts": [{"key": "Aim", "always": true, "part": "Culture"}, {"key": "Values", "always": true, "part": "Culture"}, {"key": "Inspiration", "always": true, "part": "Culture"}, {"key": "Speech", "always": true, "part": "Culture"}, {"key": "Building", "always": true, "part": "Culture"}, {"key": "Place names", "always": true, "part": "Culture"}, {"key": "Mixing", "always": false, "part": "Culture"}, {"key": "Story use", "always": false, "part": "Culture"}]}, "saying": {"rows": [], "facts": [{"key": "Employers' biased shortcut", "always": false, "part": "Culture"}]}, "festival": {"rows": [], "facts": []}, "people": {"rows": [{"label": "Circuit may include", "always": true, "part": "Culture"}], "facts": [{"key": "Why they move", "always": true, "part": "Culture"}, {"key": "Appalachian influence", "always": true, "part": "Culture"}, {"key": "Rights", "always": true, "part": "Culture"}, {"key": "What they carry", "always": true, "part": "Culture"}, {"key": "Who wants them", "always": true, "part": "Culture"}, {"key": "Don't", "always": true, "part": "Culture"}]}}, "repo": "https://github.com/BigCatMellow/10Kings/blob/main/wiki/"};
(function () {
  if (!DATA) return;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gh = (p) => DATA.repo + p;
  const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
  const laneOf = Object.fromEntries(DATA.lanes.map((l) => [l.id, l]));
  const colorVar = (laneId) => `var(--r-${laneId})`;
  const nodeColor = (n) => colorVar(n.lane);
  const SCHEMA = DATA.schema || {};
  const partOn = Object.fromEntries(DATA.parts.map((p) => [p.short, true]));
  const inferredOn = () => $("optInferred").checked;
  const visibleEdge = (e) => partOn[byId[e.from].part] && partOn[byId[e.to].part] && (e.basis === "stated" || inferredOn());

  $("eyebrow").textContent = DATA.eyebrow || "Atlas";
  $("title").textContent = DATA.title;
  $("sub").textContent = DATA.subtitle || "";
  const stated = DATA.edges.filter((e) => e.basis === "stated").length;
  $("counts").innerHTML = DATA.parts.map((p) => `<span class="count"><b>${DATA.nodes.filter((n) => n.part === p.short).length}</b>${esc(p.short.toLowerCase())}</span>`).join("") +
    `<span class="count"><b>${DATA.edges.length}</b>connections (${stated} stated)</span>`;
  $("parts").innerHTML = DATA.parts.length > 1 ? "Show: " + DATA.parts.map((p) => `<label title="Part ${p.part}: ${esc(p.title)}"><input type="checkbox" data-part="${esc(p.short)}" checked> ${esc(p.short)}</label>`).join("") : "";

  // each end of a connection: which row it sits in, and a short note
  const end = (e, fromSide) => fromSide ? { row: e.chip || e.type, note: e.chipNote } : { row: e.chipBack || e.chip || e.type, note: e.chipNoteBack };

  // columns → section headings (in part order) → cards
  const lanesEl = $("lanes");
  const cardEls = {}, laneEls = {};
  DATA.lanes.forEach((l) => {
    const lane = document.createElement("div");
    lane.className = "lane"; lane.style.setProperty("--lc", colorVar(l.id));
    lane.innerHTML = `<h3>${esc(l.label)}</h3>`;
    const inLane = DATA.nodes.filter((n) => n.lane === l.id);
    [...new Set(inLane.map((n) => n.part + "\u0000" + n.section))].forEach((key) => {
      const [part, sec] = key.split("\u0000");
      const items = inLane.filter((n) => n.part === part && n.section === sec);
      const s = document.createElement("div");
      s.className = "section"; s.dataset.part = part;
      s.innerHTML = `<button type="button" class="sechead" aria-expanded="true"><span class="chev" aria-hidden="true">▸</span>${esc(sec)} <span class="num">${items.length}</span></button><div class="cards"></div>`;
      const box = s.querySelector(".cards");
      items.forEach((n) => box.appendChild(card(n)));
      s.querySelector(".sechead").addEventListener("click", (ev) => {
        const open = s.classList.toggle("shut") === false;
        ev.currentTarget.setAttribute("aria-expanded", String(open));
        if (current) drawLinks(current);
      });
      lane.appendChild(s);
    });
    laneEls[l.id] = lane;
    lanesEl.appendChild(lane);
  });

  function chipsFor(n) {
    const layout = (SCHEMA[n.kind] || { rows: [] }).rows;
    const skip = n.skip_rows || [];
    const rows = Object.fromEntries(layout.map((r) => [r.label, []]));
    DATA.edges.forEach((e) => {
      let other, side;
      if (e.from === n.id) { other = e.to; side = end(e, true); }
      else if (e.to === n.id) { other = e.from; side = end(e, false); }
      else return;
      if (e.hideChipOn && e.hideChipOn.includes(n.id)) return;
      const o = byId[other];
      const cert = e.certainty && e.certainty !== "established" ? e.certainty : "";
      const cls = [e.basis === "inferred" ? "inferred" : "", cert].join(" ");
      const goods = e.goods && e.chipGoods !== false ? ` <small>${esc(e.goods)}</small>` : "";
      const notes = [side.note, cert].filter(Boolean).join(", ");
      (rows[side.row] = rows[side.row] || []).push(`<span class="chip ${cls}" data-basis="${e.basis}" style="--dc:${nodeColor(o)}"><i></i>${esc(o.short || o.label)}${goods}${notes ? ` <small>(${esc(notes)})</small>` : ""}</span>`);
    });
    return layout.filter((r) => !skip.includes(r.label) && (rows[r.label].length || r.always)).map((r) =>
      `<span class="chiprow" data-rowpart="${esc(r.part)}"><b>${esc(r.label)}</b>${rows[r.label].length ? rows[r.label].join("") : `<span class="none">none stated</span>`}</span>`).join("");
  }
  function card(n) {
    const c = document.createElement("div");
    c.className = `card ${n.kind}${n.minor ? " minor" : ""}`;
    c.style.setProperty("--lc", nodeColor(n));
    c.dataset.id = n.id;
    const k = esc(DATA.kinds[n.kind]) + (n.when ? ` · ${esc(n.when)}` : "");
    const chips = chipsFor(n);
    const text = n.minor ? "" : `<span class="t">${esc(n.short_text || n.text)}</span>`;
    const hasBody = !!(text || chips);
    c.innerHTML = `<div class="head"><button type="button" class="pick"><span class="k">${k}</span><span class="n">${esc(n.label)}</span></button>` +
      (hasBody ? `<button type="button" class="tog" aria-expanded="false" aria-label="Show details for ${esc(n.label)}"><span class="chev" aria-hidden="true">▸</span></button>` : "") +
      `</div>` + (hasBody ? `<div class="body" hidden>${text}${chips ? `<span class="chips">${chips}</span>` : ""}</div>` : "");
    c.querySelector(".pick").addEventListener("click", () => select(n.id));
    if (hasBody) c.querySelector(".tog").addEventListener("click", () => { setOpen(c, c.querySelector(".body").hidden); if (current) drawLinks(current); });
    cardEls[n.id] = c;
    return c;
  }
  function setOpen(c, open) {
    const body = c.querySelector(".body"), tog = c.querySelector(".tog");
    if (!body) return;
    body.hidden = !open;
    tog.setAttribute("aria-expanded", String(open));
    tog.setAttribute("aria-label", `${open ? "Hide" : "Show"} details for ${byId[c.dataset.id].label}`);
  }
  let allOpen = false;
  function expandAll(open) {
    allOpen = open;
    Object.values(cardEls).forEach((c) => setOpen(c, open));
    $("expandAll").textContent = open ? "Close all cards" : "Open all cards";
    if (current) drawLinks(current);
  }
  window.atlasExpandAll = expandAll;
  $("expandAll").addEventListener("click", () => expandAll(!allOpen));

  // what's showing: parts, inferred links, search
  function refresh() {
    const q = $("q").value.trim().toLowerCase();
    document.querySelectorAll(".section").forEach((s) => { s.hidden = !partOn[s.dataset.part]; });
    Object.entries(cardEls).forEach(([id, el]) => {
      const n = byId[id];
      const hay = [n.label, n.text, n.when || "", ...Object.values(n.facts || {})].join(" ").toLowerCase();
      el.classList.toggle("dimmed", !!q && !hay.includes(q));
    });
    // tags describe their own card, so they stay when the other end's part is off; inferred ones wait for the box
    document.querySelectorAll(".chip").forEach((c) => { c.hidden = c.dataset.basis === "inferred" && !inferredOn(); });
    document.querySelectorAll(".chiprow").forEach((r) => {
      const hasChips = !!r.querySelector(".chip"), anyShown = !!r.querySelector(".chip:not([hidden])");
      r.hidden = hasChips ? !anyShown : !partOn[r.dataset.rowpart];
    });
    Object.values(laneEls).forEach((l) => { l.hidden = !l.querySelector(".section:not([hidden])"); });
    document.querySelectorAll("#gaps [data-part]").forEach((g) => { g.hidden = !partOn[g.dataset.part]; });
    if (current && !partOn[byId[current].part]) select(null); else if (current) select(current);
  }
  window.atlasShowOnly = (short) => { Object.keys(partOn).forEach((k) => { partOn[k] = k === short; }); document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; }); refresh(); };

  // lines for the selected card only
  const board = $("board"), svg = $("links");
  function drawLinks(id) {
    svg.innerHTML = "";
    if (!id) return;
    const W = lanesEl.scrollWidth, H = lanesEl.scrollHeight;
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const base = lanesEl.getBoundingClientRect();
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    const a = box(cardEls[id]);
    DATA.edges.forEach((e) => {
      if (e.from !== id && e.to !== id) return;
      if (!visibleEdge(e)) return;
      const other = e.from === id ? e.to : e.from;
      const el = cardEls[other];
      if (!el || el.offsetParent === null) return;
      const b = box(el);
      const right = b.x > a.x + a.w / 2;
      const sameLane = Math.abs(b.x - a.x) < 20;
      const ya = a.y + Math.min(a.h / 2, 24), yb = b.y + Math.min(b.h / 2, 24);
      let d;
      if (sameLane) {
        const x = a.x + a.w;
        d = `M${x},${ya} C${x + 40},${ya} ${x + 40},${yb} ${x},${yb}`;
      } else {
        const sx = right ? a.x + a.w : a.x, tx = right ? b.x : b.x + b.w;
        const dx = Math.max(40, Math.abs(tx - sx) / 2.5) * (right ? 1 : -1);
        d = `M${sx},${ya} C${sx + dx},${ya} ${tx - dx},${yb} ${tx},${yb}`;
      }
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("class", `${e.basis === "inferred" ? "inferred" : ""} ${e.certainty || ""}`);
      svg.appendChild(p);
    });
  }

  let current = null;
  const layerName = Object.fromEntries((DATA.layers || []).map((l) => [l.id, l.label]));
  const pageName = (s) => s.split("#")[0].split("/").pop().replace(/\.md$/, "").replace(/-/g, " ");
  function select(id) {
    current = id;
    Object.values(cardEls).forEach((c) => c.classList.remove("hot", "sel"));
    board.classList.toggle("focus", !!id);
    if (!id) { drawLinks(null); intro(); return; }
    const n = byId[id];
    cardEls[id].classList.add("hot", "sel");
    DATA.edges.filter((e) => (e.from === id || e.to === id) && visibleEdge(e)).forEach((e) => { const o = e.from === id ? e.to : e.from; cardEls[o] && cardEls[o].classList.add("hot"); });
    drawLinks(id);
    const groups = {};
    DATA.edges.filter((e) => e.from === id || e.to === id).forEach((e) => { (groups[e.group || e.layer] = groups[e.group || e.layer] || []).push(e); });
    const fs = n.fact_src || {}, fv = n.facts || {};
    const layout = ((SCHEMA[n.kind] || {}).facts || []).filter((f) => fv[f.key] || f.always);
    const facts = layout.length ? `<dl>${layout.map((f) => fv[f.key]
      ? `<dt>${esc(f.key)}</dt><dd>${esc(fv[f.key])}${fs[f.key] ? `<a class="src" href="${gh(fs[f.key])}" target="_blank" rel="noopener">source</a>` : ""}</dd>`
      : `<dt>${esc(f.key)}</dt><dd class="missing">Not in the wiki yet.</dd>`).join("")}</dl>` : "";
    const html = Object.entries(groups).map(([g, es]) => `<h4>${esc(layerName[g] || g)}</h4><ul>${es.map((e) => {
      const other = e.from === id ? e.to : e.from;
      const lab = e.from === id ? e.type : (e.chipBack || e.type);
      return `<li class="conn ${e.basis}"><span>${esc(lab)} </span><button type="button" data-go="${other}">${esc(byId[other].label)}</button>${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " (" + esc(a.note) + ")" : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    const see = (n.see || []).length ? ` · also on ${n.see.map((s) => `<a href="${gh(s)}" target="_blank" rel="noopener">${esc(pageName(s))}</a>`).join(", ")}` : "";
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])}${n.when ? " · " + esc(n.when) : ""} · ${esc(laneOf[n.lane].label)}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span><p>${esc(n.text)}</p>${facts}${html}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>${see}`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToCard(b.dataset.go); }));
  }
  function scrollToCard(id) {
    const el = cardEls[id]; if (!el) return;
    const sec = el.closest(".section");
    if (sec && sec.classList.contains("shut")) { sec.classList.remove("shut"); sec.querySelector(".sechead").setAttribute("aria-expanded", "true"); drawLinks(current); }
    const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.left < br.left || r.right > br.right || r.top < br.top || r.bottom > br.bottom)
      board.scrollBy({ left: r.left - br.left - br.width / 3, top: r.top - br.top - 60, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function intro() {
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2><p>${esc(DATA.intro || "")}</p>`;
  }
  board.addEventListener("click", (ev) => { if (!ev.target.closest(".card") && !ev.target.closest(".sechead")) select(null); });

  $("q").addEventListener("input", refresh);
  $("optInferred").addEventListener("change", refresh);
  document.querySelectorAll("input[data-part]").forEach((c) => c.addEventListener("change", () => { partOn[c.dataset.part] = c.checked; refresh(); }));
  window.addEventListener("resize", () => { if (current) drawLinks(current); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) drawLinks(current); });

  $("gaps").innerHTML = DATA.gaps.filter((g) => g.items.length).map((g) => `<div data-part="${esc(g.part)}"><h3>${esc(g.title)}</h3><ul>${g.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  select(null);
  refresh();
})();
</script>

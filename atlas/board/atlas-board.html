reted spiritually.", "short_text": "Perhaps collapse, disease or war, later read spiritually.", "facts": {"What's remembered": "Perhaps a period of ecological collapse, depopulation, warfare or disease later interpreted spiritually.", "Caution": "Should remain partly historical and partly religious."}, "part": "History"}, {"id": "hi-ver-ember-greenvale", "kind": "version", "label": "Ember Wars: Greenvale folk memory", "status": "Provisional", "lane": "greenvale", "section": "Memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "text": "Orchards and villages destroyed; families displaced.", "short_text": "Orchards and villages destroyed; families displaced.", "facts": {"Told as": "Orchards and villages destroyed; families displaced.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-ember-ironcrest", "kind": "version", "label": "Ember Wars: Ironcrest patriotic memory", "status": "Provisional", "lane": "ironcrest", "section": "Memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "text": "A period of expansion and hard-won security, with reversals blamed on logistics or weather.", "short_text": "A period of expansion and hard-won security, with reversals blamed on logistics or weather.", "facts": {"Told as": "A period of expansion and hard-won security, with reversals blamed on logistics or weather.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-ember-border", "kind": "version", "label": "Ember Wars: border memory", "status": "Provisional", "lane": "borderlands", "section": "Memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "text": "Several campaigns, changing alliances and mixed families that make both regional versions too simple.", "short_text": "Several campaigns, changing alliances and mixed families that make both regional versions too simple.", "facts": {"Told as": "Several campaigns, changing alliances and mixed families that make both regional versions too simple.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-salted-northwind", "kind": "version", "label": "Salted Coast: Northwind songs", "status": "Provisional", "lane": "northwind", "section": "Memory", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "text": "Songs about burned boats or coastal settlements.", "short_text": "Songs about burned boats or coastal settlements.", "facts": {"Told as": "Songs about burned boats or coastal settlements.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-salted-sunplains", "kind": "version", "label": "Salted Coast: Sunplains stories", "status": "Provisional", "lane": "sunplains", "section": "Memory", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "text": "Stories about raids and \"northern pirates\".", "short_text": "Stories about raids and \"northern pirates\".", "facts": {"Told as": "Stories about raids and \"northern pirates\".", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-salted-port", "kind": "version", "label": "Salted Coast: Port traditions", "status": "Provisional", "lane": "port", "section": "Memory", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "text": "Traditions that present negotiation and neutral anchorage as older than the Convergence.", "short_text": "Traditions that present negotiation and neutral anchorage as older than the Convergence.", "facts": {"Told as": "Traditions that present negotiation and neutral anchorage as older than the Convergence.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-timber-deepwood", "kind": "version", "label": "Timber Tithes: Deepwood memory", "status": "Provisional", "lane": "deepwood", "section": "Memory", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "text": "Outside extraction pushing too far into forests and sacred or protected areas.", "short_text": "Outside extraction pushing too far into forests and sacred or protected areas.", "facts": {"Told as": "Outside extraction pushing too far into forests and sacred or protected areas.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-timber-outsiders", "kind": "version", "label": "Timber Tithes: outsider traditions", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "text": "May remember the same period as sudden Deepwood violence against workers, caravans or settlers.", "short_text": "May remember the same period as sudden Deepwood violence against workers, caravans or settlers.", "facts": {"Told as": "May remember the same period as sudden Deepwood violence against workers, caravans or settlers.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-seizure-northwind", "kind": "version", "label": "Port Seizure: some Northwind families", "status": "Provisional", "lane": "northwind", "section": "Memory", "src": "History/Contested-Memory.md#the-port-seizure", "text": "They claim they built or maintained facilities that others later took from them.", "short_text": "They claim they built or maintained facilities that others later took from them.", "facts": {"Told as": "They claim they built or maintained facilities that others later took from them.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-seizure-port", "kind": "version", "label": "Port Seizure: some Port families", "status": "Provisional", "lane": "port", "section": "Memory", "src": "History/Contested-Memory.md#the-port-seizure", "text": "Foreign control remembered as occupation.", "short_text": "Foreign control remembered as occupation.", "facts": {"Told as": "Foreign control remembered as occupation.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "hi-ver-seizure-merchants", "kind": "version", "label": "Port Seizure: some merchants", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-port-seizure", "text": "A warning about allowing any one power to dominate the harbor.", "short_text": "A warning about allowing any one power to dominate the harbor.", "facts": {"Told as": "A warning about allowing any one power to dominate the harbor.", "Note": "One of the page's possible perspectives or surviving forms, not a settled account."}, "part": "History"}, {"id": "pp-wurdren", "kind": "core", "label": "Wurdren", "status": "No status label", "lane": "cast", "section": "Main cast", "src": "Story/Wurdren.md#core-role", "text": "An aging adventurer and the story's human-scale perspective. He once imagined heroism as grand deeds and recognition; his later life puts him in smaller situations, and those small acts begin changing a much larger conflict.", "short_text": "Aging adventurer; the human-scale view of the conflict.", "facts": {"Role": "The story's human-scale perspective: an aging adventurer who once imagined heroism as grand deeds, recognition and legendary importance, now escorting people, solving local conflicts, protecting a town, finding missing goods, helping refugees and investigating violence.", "What he sees": "Where the Council sees output, prices, stability and risk, and the Villain sees leverage, pressure, timing and strategic sacrifice, Wurdren sees the widow, the apprentice, the frightened child, the farmer whose storehouse is empty, the guard who doesn't know why war is starting. He converts abstraction back into human reality.", "Weaknesses": "Potential weaknesses to preserve: regret over an unremarkable career; desire to be needed; treating immediate problems before understanding systems; reluctance to accept that helping one group can harm another; nostalgia for simpler ideas of heroism.", "Arc": "Early, he believes local problems are local. Middle, he sees the same patterns recur. Later, he learns that both the Villain and the Council have, at different moments, benefited from his actions: good actions still enter political systems and create consequences. End: \"I cannot control the world, but I am responsible for what I do when the world reaches the person standing in front of me.\"", "Effect on the dominoes": "He doesn't knock the dominoes over backward; he changes relationships: proves an accusation false, rescues people who become witnesses, brings two groups into direct contact, returns stolen evidence, helps a character survive long enough to reconsider, makes cooperation possible where the plan required isolation.", "Don't": "Don't turn him into the smartest strategist, the rightful king, secretly chosen by prophecy, or the only morally decent person. His influence must stay believable because people remember what he did and trust him.", "Open questions": "Exact age and biography; why his earlier adventuring life failed to match his ambitions; family and relationships; what he initially believes about politics and the Council; where his journey begins."}, "fact_src": {"Role": "Story/Wurdren.md#core-role", "What he sees": "Story/Wurdren.md#why-he-matters", "Weaknesses": "Story/Wurdren.md#character-weakness", "Arc": "Story/Wurdren.md#arc", "Effect on the dominoes": "Story/Villains-Dominoes.md#wurdrens-effect", "Don't": "Story/Wurdren.md#narrative-rule", "Open questions": "Open-Questions.md#wurdren"}, "part": "People"}, {"id": "pp-villain", "kind": "core", "label": "The Villain", "status": "Core function established (identity and exact grievance open)", "lane": "cast", "section": "Main cast", "src": "Story/Villain.md#core-idea", "text": "The primary strategic mover of the plot. He believes the post-Convergence order can't give his people or cause what they need, identifies the hidden Council as the reason change keeps being neutralized, and sets out to make the existing equilibrium impossible to maintain.", "short_text": "Unnamed; drives the plot by making equilibrium impossible.", "facts": {"Role": "The primary strategic mover of the plot. He believes the post-Convergence order is structurally incapable of giving his people or cause what they need, identifies the hidden Economic Council as the reason meaningful change is repeatedly neutralized, and decides the only path forward is to make the existing equilibrium impossible to maintain.", "Method": "He manipulates conditions, not personalities: real corruption, selective leaks, staged or redirected attacks, economic shortages, guild factionalism, criminal networks, religious interpretations, old border claims, public fear and Council countermeasures. The best moves have two explanations: what participants believe is happening, and what strategic function the event serves for him.", "Moral trajectory": "He should begin with a grievance readers can understand. First he redirects events; then he accepts predictable civilian harm; then he causes harm deliberately because it produces leverage; eventually he begins treating people the way he accuses the Council of treating them. Caring about an end becomes permission to instrumentalize everyone between him and it.", "Ending": "He shouldn't simply be killed and invalidated. A satisfying resolution likely separates the legitimacy of his grievance from the destructiveness of his method. He may force real reform while personally failing, losing his coalition, accepting accountability, going into exile, or being defeated in the final escalation. His impact remains part of the new world.", "Open questions": "Name; homeland or people; exact grievance; exact territorial or political end-state; the point at which his methods become clearly unacceptable even to sympathetic readers; whether he knows the full Council structure at the story's beginning."}, "fact_src": {"Role": "Story/Villain.md#core-idea", "Method": "Story/Villain.md#method", "Moral trajectory": "Story/Villain.md#moral-trajectory", "Ending": "Story/Villain.md#ending", "Open questions": "Open-Questions.md#villain"}, "part": "People"}, {"id": "pp-families", "kind": "core", "label": "The Council houses", "status": "No status label", "lane": "cast", "section": "Main cast", "src": "Story/Character-Roster.md#the-economic-council-families", "text": "Six houses, one per seat: Marielle, Drathain, Veynor, Torradon, Luthain and Rhaelen (Working canon, 2026-09-29). Their named members come from earlier notes and are Provisional.", "short_text": "Marielle, Drathain, Veynor, Torradon, Luthain, Rhaelen.", "facts": {"Role": "Not a single character but a cast of powerful family representatives with conflicting economic domains: six houses, one per seat, each from a home region it doesn't represent.", "Factions": "Each family also has heirs, factions, clients and private ambitions.", "Open questions": "How seats are inherited, selected, purchased or contested."}, "fact_src": {"Role": "Politics/Economic-Council.md#the-six-houses", "Factions": "Politics/Economic-Council.md#internal-conflict", "Open questions": "Open-Questions.md#economic-council"}, "see": ["Politics/Economic-Council.md#the-six-houses"], "part": "People"}, {"id": "pp-orin", "kind": "domino", "label": "Orin Slatehallow", "status": "Provisional", "lane": "ironcrest", "section": "People", "src": "Story/Villains-Dominoes.md#orin-slatehallow--ironcrest", "text": "Talented young metalworker caught between innovation, guild restriction and patronage.", "short_text": "Young metalworker drawn into hidden patronage.", "facts": {"Role": "Talented young metalworker caught between innovation, guild restriction and patronage.", "Strategic value": "Access to production networks and information about strategic metal supply.", "Manipulation": "Anonymous funding, selective obstruction by rivals, and opportunities that make him dependent on a benefactor.", "Rule": "Orin should not invent fantasy super-steel. His value is organizational and technical: improved quality control, repair methods, production knowledge, or access."}, "fact_src": {"Role": "Story/Villains-Dominoes.md#orin-slatehallow--ironcrest", "Strategic value": "Story/Villains-Dominoes.md#orin-slatehallow--ironcrest", "Manipulation": "Story/Villains-Dominoes.md#orin-slatehallow--ironcrest", "Rule": "Story/Villains-Dominoes.md#orin-slatehallow--ironcrest"}, "see": ["Story/Character-Roster.md#orin-slatehallow--ironcrest"], "part": "People"}, {"id": "pp-maris", "kind": "domino", "label": "Maris Bleakshore", "status": "Provisional", "lane": "northwind", "section": "People", "src": "Story/Villains-Dominoes.md#maris-bleakshore--northwind", "text": "Respected coastal or clan leader shaped by piracy and loss.", "short_text": "Clan leader shaped by piracy; Northwind patrols get read as aggression.", "facts": {"Role": "Respected coastal or clan leader shaped by piracy and loss.", "Strategic value": "Can influence convoy behavior, harbor cooperation, and perceptions of maritime threats.", "Manipulation": "Credible but selectively framed intelligence makes defensive action look necessary.", "Domino": "Northwind patrol changes are interpreted elsewhere as aggression."}, "fact_src": {"Role": "Story/Villains-Dominoes.md#maris-bleakshore--northwind", "Strategic value": "Story/Villains-Dominoes.md#maris-bleakshore--northwind", "Manipulation": "Story/Villains-Dominoes.md#maris-bleakshore--northwind", "Domino": "Story/Villains-Dominoes.md#maris-bleakshore--northwind"}, "see": ["Story/Character-Roster.md#maris-bleakshore--northwind"], "part": "People"}, {"id": "pp-rosana", "kind": "domino", "label": "Rosana Meadowcroft", "status": "Provisional", "lane": "greenvale", "section": "People", "src": "Story/Villains-Dominoes.md#rosana-meadowcroft--greenvale", "text": "Agricultural researcher or seed steward working on crop resilience.", "short_text": "Seed steward; an innovation becomes a fight over control.", "facts": {"Role": "Agricultural researcher or seed steward working on crop resilience.", "Strategic value": "Her work changes expectations about harvest, land value, and dependence on existing seed and storage systems.", "Manipulation": "Fund research, create distribution bottlenecks, allow rivals to overreact.", "Domino": "An agricultural innovation becomes a political fight over control."}, "fact_src": {"Role": "Story/Villains-Dominoes.md#rosana-meadowcroft--greenvale", "Strategic value": "Story/Villains-Dominoes.md#rosana-meadowcroft--greenvale", "Manipulation": "Story/Villains-Dominoes.md#rosana-meadowcroft--greenvale", "Domino": "Story/Villains-Dominoes.md#rosana-meadowcroft--greenvale"}, "see": ["Story/Character-Roster.md#rosana-meadowcroft--greenvale"], "part": "People"}, {"id": "pp-samir", "kind": "domino", "label": "Samir Tareh", "status": "Provisional", "lane": "highridge", "section": "People", "src": "Story/Villains-Dominoes.md#samir-tareh--highridge", "text": "Caravan negotiator seeking fair and predictable routes.", "short_text": "Caravan negotiator whose route advice moves trade.", "facts": {"Role": "Caravan negotiator seeking fair and predictable routes.", "Strategic value": "His route recommendations can redirect enormous amounts of trade without appearing political.", "Manipulation": "Provide true information about dangers but omit who created them.", "Domino": "\"Safe\" trade concentration makes one route strategically vulnerable and impoverishes another."}, "fact_src": {"Role": "Story/Villains-Dominoes.md#samir-tareh--highridge", "Strategic value": "Story/Villains-Dominoes.md#samir-tareh--highridge", "Manipulation": "Story/Villains-Dominoes.md#samir-tareh--highridge", "Domino": "Story/Villains-Dominoes.md#samir-tareh--highridge"}, "see": ["Story/Character-Roster.md#samir-tareh--highridge"], "part": "People"}, {"id": "pp-naruin", "kind": "domino", "label": "Naruin Mossglade", "status": "Provisional", "lane": "deepwood", "section": "People", "src": "Story/Villains-Dominoes.md#naruin-mossglade--deepwood", "text": "Forest warden or sentinel defending local rights.", "short_text": "Forest warden; a local dispute becomes a sovereignty crisis.", "facts": {"Role": "Forest warden or sentinel defending local rights.", "Strategic value": "Can mobilize resistance to roads, logging, or outside extraction.", "Manipulation": "Leak real Council-backed expansion plans without context; encourage preemptive defense.", "Domino": "A local conservation dispute becomes an inter-regional sovereignty crisis."}, "fact_src": {"Role": "Story/Villains-Dominoes.md#naruin-mossglade--deepwood", "Strategic value": "Story/Villains-Dominoes.md#naruin-mossglade--deepwood", "Manipulation": "Story/Villains-Dominoes.md#naruin-mossglade--deepwood", "Domino": "Story/Villains-Dominoes.md#naruin-mossglade--deepwood"}, "see": ["Story/Character-Roster.md#naruin-mossglade--deepwood"], "part": "People"}, {"id": "pp-bahriyya", "kind": "domino", "label": "Bahriyya Nazar", "status": "Provisional", "lane": "sunplains", "section": "People", "src": "Story/Villains-Dominoes.md#bahriyya-nazar--sunplains", "text": "Reformist diplomat trying to coordinate city-states around water and trade.", "short_text": "Diplomat whose peace coalition is made to look like a threat.", "facts": {"Role": "Reformist diplomat trying to coordinate city-states around water and trade.", "Strategic value": "Successful cooperation could create a powerful bloc.", "Manipulation": "Secretly help her coordination, then ensure neighbors interpr /Registry.md#names", "text": "Permit clerk, in Three Pots at Three Moon.", "short_text": "Permit clerk.", "facts": {"Role": "Permit clerk.", "Story": "Three Pots at Three Moon (supporting cast).", "Note": "A Sunday Morning character: writing reference, not setting canon."}, "see": ["Sunday-Morning/Stories/Three-Pots-at-Three-Moon.md"], "part": "People"}, {"id": "sm-halloran", "kind": "sm", "label": "Halloran", "status": "Writing reference (not setting canon)", "lane": "sundaymorning", "section": "Three Pots at Three Moon", "src": "Sunday-Morning/Notes/Registry.md#names", "text": "Market inspector, in Three Pots at Three Moon.", "short_text": "Market inspector.", "facts": {"Role": "Market inspector.", "Story": "Three Pots at Three Moon (supporting cast).", "Note": "A Sunday Morning character: writing reference, not setting canon."}, "see": ["Sunday-Morning/Stories/Three-Pots-at-Three-Moon.md"], "part": "People"}, {"id": "sm-mrs-arden", "kind": "sm", "label": "Mrs. Arden", "status": "Writing reference (not setting canon)", "lane": "sundaymorning", "section": "Three Pots at Three Moon", "src": "Sunday-Morning/Notes/Registry.md#names", "text": "Greenvale newcomer, in Three Pots at Three Moon.", "short_text": "Greenvale newcomer.", "facts": {"Role": "Greenvale newcomer.", "Story": "Three Pots at Three Moon (supporting cast).", "Note": "A Sunday Morning character: writing reference, not setting canon."}, "see": ["Sunday-Morning/Stories/Three-Pots-at-Three-Moon.md"], "part": "People"}, {"id": "st-main", "kind": "overview", "label": "The main conflict", "status": "No status label", "lane": "conflict", "section": "Main conflict", "src": "Story/Main-Conflict.md#narrative-premise", "text": "The strongest current version treats the Villain's campaign as the principal plot engine, the Council as the antagonist to that campaign, and Wurdren as the human-scale perspective. That doesn't make the Villain secretly the hero; it means the plot moves on his decisions.", "short_text": "Villain drives, Council counters, Wurdren sees the cost.", "facts": {"Principle": "The strongest current version of the story treats the Villain's campaign as the principal plot engine. The Council functions as the antagonist to that campaign; Wurdren is the everyman through whom the audience sees what both sides' decisions do to people. This does not mean the Villain is secretly the hero.", "Scope": "A good chapter chain: the Villain needs a kingdom to distrust a neighbor; he manipulates a shipping or guild dispute; the Council notices instability and quietly intervenes; the intervention harms a border town; Wurdren helps that town; his solution restores a connection the Villain expected to stay broken; the Villain adapts; the Council misreads the adaptation; another region reacts; the viewpoint moves to someone living with the new consequence. The plot moves through causal handoffs rather than arbitrary quests.", "Villain": "Change through leverage: a goal the existing system won't permit, pursued through a chain of interlocking political and economic moves, each creating the conditions for the next.", "Council": "Stability through control: it detects instability and counters it with credit, food, routes, guild politics, infrastructure and information. Its countermeasures often solve one problem while creating another.", "Wurdren": "Humanity through intervention: he sees missing goods, frightened families, displaced communities, local violence and broken agreements, and acts because the immediate suffering is real. His solutions change variables neither side expected.", "Escalation": "From apparently independent local problems, to recognizable patterns, regional political crises, cross-regional suspicion, mobilization, near-war or actual limited war, revelation of hidden economic control, and the convergence of the three perspectives.", "Ending": "Two destructive systems, Council paternalism and Villain coercion, should both fail in their original form. A possible model: the Villain forces the Council into the open, but his final escalation fractures his coalition; Wurdren's relationships help produce public negotiations, exposure of some Council mechanisms, concessions addressing the legitimate grievance, reform, and no total victory for either side. Wurdren does not become ruler.", "Question": "Can a society preserve coordination without secret domination, and can oppressed people pursue change without reproducing domination themselves?"}, "fact_src": {"Principle": "Story/Main-Conflict.md#narrative-premise", "Scope": "Story/Main-Conflict.md#plot-movement", "Villain": "Story/Main-Conflict.md#villain--change-through-leverage", "Council": "Story/Main-Conflict.md#council--stability-through-control", "Wurdren": "Story/Main-Conflict.md#wurdren--humanity-through-intervention", "Escalation": "Story/Main-Conflict.md#escalation", "Ending": "Story/Main-Conflict.md#the-ending-problem", "Question": "Story/Main-Conflict.md#thematic-resolution"}, "part": "Story"}, {"id": "st-events", "kind": "overview", "label": "Current events", "status": "No status label", "lane": "conflict", "section": "Main conflict", "src": "Story/Current-Events.md#purpose", "text": "A snapshot of the world shortly before or during the story's opening movement. Many events are linked, but most participants don't know that: some are caused by the Villain, some are Council responses, and some are ordinary events used by both.", "short_text": "Linked events; most people can't see the links.", "facts": {"Principle": "A snapshot of the world shortly before or during the opening movement of the story. Many events are linked, but most participants do not know that.", "Scope": "Some are caused by the Villain. Some are Council responses. Some are ordinary events opportunistically used by both. That distinction is essential.", "Rule": "The example ripple chain (thirteen steps from Northwind piracy to local shocks read as proof of enemies) is \"the kind of causal chain the story should prefer\". It is one possible chain, not the plot."}, "fact_src": {"Principle": "Story/Current-Events.md#purpose", "Scope": "Story/Current-Events.md#purpose", "Rule": "Story/Current-Events.md#example-ripple-chain"}, "part": "Story"}, {"id": "st-nw-piracy", "kind": "current", "label": "Piracy rises", "status": "No status label", "lane": "northwind", "section": "Current events", "src": "Story/Current-Events.md#piracy-and-convoy-politics", "text": "Raids are increasing.", "short_text": "Raids are increasing along the coast.", "facts": {"What's happening": "Raids are increasing."}, "part": "Story"}, {"id": "st-nw-convoy", "kind": "current", "label": "Convoy politics", "status": "No status label", "lane": "northwind", "section": "Current events", "src": "Story/Current-Events.md#piracy-and-convoy-politics", "text": "A response that looks purely defensive to Northwind can look like maritime militarization to Sunplains or Port merchants.", "short_text": "Defense that looks like militarization.", "facts": {"What's happening": "A response that looks purely defensive to Northwind can look like maritime militarization to Sunplains or Port merchants."}, "part": "Story"}, {"id": "st-nw-fish", "kind": "current", "label": "Fish stocks shift", "status": "No status label", "lane": "northwind", "section": "Current events", "src": "Story/Current-Events.md#fish-stocks-and-access", "text": "Some fisheries are declining or shifting, creating price increases, clan disputes, illegal fishing and pressure for new agreements.", "short_text": "Fisheries decline or move.", "facts": {"What's happening": "Some fisheries are declining or shifting, creating price increases, clan disputes, illegal fishing and pressure for new agreements."}, "part": "Story"}, {"id": "st-pt-merchant", "kind": "current", "label": "Merchant conflict", "status": "No status label", "lane": "port", "section": "Current events", "src": "Story/Current-Events.md#merchant-conflict", "text": "Shipping losses, insurance disputes, warehouse fires or thefts, and political accusations are making neutral commerce harder.", "short_text": "Losses and disputes make neutral commerce harder.", "facts": {"What's happening": "Shipping losses, insurance disputes, warehouse fires or thefts, and political accusations are making neutral commerce harder."}, "part": "Story"}, {"id": "st-pt-smuggling", "kind": "current", "label": "Smuggling surge", "status": "No status label", "lane": "port", "section": "Current events", "src": "Story/Current-Events.md#smuggling-surge", "text": "Higher prices and route disruption increase demand for illegal transport.", "short_text": "Disruption raises demand for smuggling.", "facts": {"What's happening": "Higher prices and route disruption increase demand for illegal transport."}, "part": "Story"}, {"id": "st-pt-refugees", "kind": "current", "label": "Refugee and worker pressure", "status": "No status label", "lane": "port", "section": "Current events", "src": "Story/Current-Events.md#refugeeworker-pressure", "text": "Displaced people from border and economic crises arrive faster than housing and charity systems can absorb them.", "short_text": "Displaced people arrive faster than help.", "facts": {"What's happening": "Displaced people from border and economic crises arrive faster than housing and charity systems can absorb them."}, "part": "Story"}, {"id": "st-gv-abundance", "kind": "current", "label": "Abundance crisis", "status": "No status label", "lane": "greenvale", "section": "Current events", "src": "Story/Current-Events.md#abundance-crisis", "text": "A new strain, unusually good weather, or both have produced unexpectedly high yields in some districts. Instead of prosperity: prices fall, storage fills, poorer farmers can't cover debts, rumors spread that grain is unsafe, merchants delay purchases.", "short_text": "Big harvest, falling prices, unsafe-grain rumors.", "facts": {"What's happening": "A new strain, unusually good weather, or both have produced unexpectedly high yields in some districts. Instead of prosperity: prices fall, storage fills, poorer farmers can't cover debts, rumors spread that grain is unsafe, merchants delay purchases."}, "part": "Story"}, {"id": "st-gv-land", "kind": "current", "label": "Land and seed politics", "status": "No status label", "lane": "greenvale", "section": "Current events", "src": "Story/Current-Events.md#land-and-seed-politics", "text": "Large interests attempt to acquire distressed farms. Reformers accuse them of engineering the crisis.", "short_text": "Large interests buy distressed farms.", "facts": {"What's happening": "Large interests attempt to acquire distressed farms. Reformers accuse them of engineering the crisis."}, "part": "Story"}, {"id": "st-ic-metal", "kind": "current", "label": "Unusual metal movements", "status": "No status label", "lane": "ironcrest", "section": "Current events", "src": "Story/Current-Events.md#unusual-metal-movements", "text": "High-quality metal is disappearing into private contracts or being redirected.", "short_text": "Good metal vanishing into private contracts.", "facts": {"What's happening": "High-quality metal is disappearing into private contracts or being redirected.", "Blamed on": "Different observers blame smuggling, war preparation, corrupt guild masters or foreign buyers."}, "part": "Story"}, {"id": "st-ic-labor", "kind": "current", "label": "Labor unrest", "status": "No status label", "lane": "ironcrest", "section": "Current events", "src": "Story/Current-Events.md#labor-unrest", "text": "Mine and metalworking workers are organizing around wages, safety, debt and control of guild leadership.", "short_text": "Workers organize; strike talk.", "facts": {"What's happening": "Mine and metalworking workers are organizing around wages, safety, debt and control of guild leadership.", "Hidden layers": "Possible hidden layers: some grievances are entirely real; Council-linked owners are trying to prevent a production shock; Villain agents  label", "lane": "conflict", "section": "Ripple chain", "src": "Story/Current-Events.md#example-ripple-chain", "text": "Step 13 of one possible ripple chain: a local economic shock becomes proof, in several regions, that another group is acting against them.", "short_text": "A local economic shock becomes proof, in several regions, that another group is acting against them.", "facts": {"What's happening": "A local economic shock becomes proof, in several regions, that another group is acting against them.", "Note": "One possible chain, which Current Events calls \"the kind of causal chain the story should prefer\"; not a fixed sequence of events."}, "part": "Story"}, {"id": "story-one-square", "kind": "story", "label": "One Square, Two Harvests", "status": "Provisional", "lane": "borderlands", "section": "Stories", "src": "Sunday-Morning/Stories/One-Square-Two-Harvests.md#status", "text": "A provisional Sunday Morning story: writing reference, not setting canon. Its links show where the domino web touches one community, unseen by the people there.", "short_text": "The grain harvest is so large this year that it takes an extra week to bring in, and Harvest Home lands on the Wine Crush's weekend.", "facts": {"Premise": "The grain harvest is so large this year that it takes an extra week to bring in, and Harvest Home lands on the Wine Crush's weekend. The town square holds one festival. Everyone asks the retired water-arbiter to decide, and he insists, loudly and repeatedly, that he is retired.", "When": "Year 1, early autumn (provisional calendar)", "The nail": "A rumor that Meadowcroft-seed grain is unsafe, and a land agent circling the Vale's indebted farms.", "Behind it": "Rumor: Villain-amplified. Land agent: unknown (Council-linked finance or ordinary speculators) (a provisional attribution nobody inside the story knows).", "Holds here": "No Vale farm sells to the land agent.", "Still falls elsewhere": "Farms elsewhere in Greenvale do; the Ardens in Three Pots are one of them.", "Outward effect": "A Greenvale co-op and a Sunplains patron house now trade grain together, a precedent rivals could later read as a bloc forming."}, "fact_src": {"Premise": "Sunday-Morning/Stories/One-Square-Two-Harvests.md#premise", "When": "Sunday-Morning/Notes/Collection.md#reading-order", "The nail": "Sunday-Morning/Notes/Collection.md#the-threads", "Behind it": "Sunday-Morning/Notes/Collection.md#the-threads", "Holds here": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Still falls elsewhere": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Outward effect": "Sunday-Morning/Notes/Collection.md#the-threads"}, "see": ["Sunday-Morning/Drafts/One-Square-Two-Harvests.md", "Sunday-Morning/Notes/Collection.md#the-threads"], "when": "Year 1, early autumn", "part": "Story"}, {"id": "story-greenvale-man", "kind": "story", "label": "The Greenvale Man", "status": "Provisional", "lane": "northwind", "section": "Stories", "src": "Sunday-Morning/Stories/The-Greenvale-Man.md#status", "text": "A provisional Sunday Morning story: writing reference, not setting canon. Its links show where the domino web touches one community, unseen by the people there.", "short_text": "Kettle Cove's racing boat cracks a hull plank weeks before the Last Sail regatta against the rival cove.", "facts": {"Premise": "Kettle Cove's racing boat cracks a hull plank weeks before the Last Sail regatta against the rival cove. The boatbuilder has retired inland to live with his son in Greenvale. The only woodworker left is a Greenvale-born cooper who has lived in the cove for twenty years and is still called \"the Greenvale man.\"", "When": "Year 1, late autumn (provisional calendar)", "The nail": "\"It is said\" Narrow Sound shelters raiders; some want the regatta cancelled.", "Behind it": "Villain-amplified rumor (a provisional attribution nobody inside the story knows).", "Holds here": "Kettle Cove races Narrow Sound.", "Still falls elsewhere": "Other coves take the rumor and leave Narrow Sound out of their convoy.", "Outward effect": "Two coves still sailing together is one less \"credible\" report feeding the patrol push."}, "fact_src": {"Premise": "Sunday-Morning/Stories/The-Greenvale-Man.md#premise", "When": "Sunday-Morning/Notes/Collection.md#reading-order", "The nail": "Sunday-Morning/Notes/Collection.md#the-threads", "Behind it": "Sunday-Morning/Notes/Collection.md#the-threads", "Holds here": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Still falls elsewhere": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Outward effect": "Sunday-Morning/Notes/Collection.md#the-threads"}, "see": ["Sunday-Morning/Drafts/The-Greenvale-Man.md", "Sunday-Morning/Notes/Collection.md#the-threads"], "when": "Year 1, late autumn", "part": "Story"}, {"id": "story-goat-file", "kind": "story", "label": "The Goat File", "status": "Provisional", "lane": "highridge", "section": "Stories", "src": "Sunday-Morning/Stories/The-Goat-File.md#status", "text": "A provisional Sunday Morning story: writing reference, not setting canon. Its links show where the domino web touches one community, unseen by the people there.", "short_text": "Lenders in Port will renew Seven Wells' credit this year only if its books are clean, so a reforming administrator rules that every deferred dispute must be closed at this year's Ledger Closing.", "facts": {"Premise": "Lenders in Port will renew Seven Wells' credit this year only if its books are clean, so a reforming administrator rules that every deferred dispute must be closed at this year's Ledger Closing. The junior arbitration clerk is handed the oldest one as hazing: a forty-three-year feud between two respected houses over a goat.", "When": "Year 1, late autumn (provisional calendar)", "The nail": "Lenders will renew Seven Wells' credit only if deferred claims are cleared.", "Behind it": "Council finance stabilizing lenders (ordinary pressure, not a scheme) (a provisional attribution nobody inside the story knows).", "Holds here": "Seven Wells closes its file without ruin.", "Still falls elsewhere": "In other towns, forced closures ruin families; the tea seller has heard of two.", "Outward effect": "A joined house can offer caravans water and guides together, just as routes are being redrawn."}, "fact_src": {"Premise": "Sunday-Morning/Stories/The-Goat-File.md#premise", "When": "Sunday-Morning/Notes/Collection.md#reading-order", "The nail": "Sunday-Morning/Notes/Collection.md#the-threads", "Behind it": "Sunday-Morning/Notes/Collection.md#the-threads", "Holds here": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Still falls elsewhere": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Outward effect": "Sunday-Morning/Notes/Collection.md#the-threads"}, "see": ["Sunday-Morning/Drafts/The-Goat-File.md", "Sunday-Morning/Notes/Collection.md#the-threads"], "when": "Year 1, late autumn", "part": "Story"}, {"id": "story-inspected", "kind": "story", "label": "Inspected, Not Guaranteed", "status": "Provisional", "lane": "borderlands", "section": "Stories", "src": "Sunday-Morning/Stories/Inspected-Not-Guaranteed.md#status", "text": "A provisional Sunday Morning story: writing reference, not setting canon. Its links show where the domino web touches one community, unseen by the people there.", "short_text": "Wurdren brings the sword he has carried for decades to Stonefield Forge because its tang has cracked.", "facts": {"Premise": "Wurdren brings the sword he has carried for decades to Stonefield Forge because its tang has cracked. The forges are cold for winter maintenance, so nobody can weld it until the fires are relit. While he waits, the guild drafts him as the one judge the apprenticeship rules require who has no family, guild or debt tie to any apprentice. In a border town where everyone is related to someone, the stranger is the only one who qualifies.", "When": "Year 2, early spring (provisional calendar)", "The nail": "An anonymous patron offers Col funding \"should the guild fail to recognize\" his work.", "Behind it": "Villain (provisional): the same approach that took Orin (a provisional attribution nobody inside the story knows).", "Holds here": "Col never answers the letter.", "Still falls elsewhere": "Orin Slatehallow already answered his.", "Outward effect": "One skilled repairer stays independent; Wurdren has seen his first \"convenient offer\"."}, "fact_src": {"Premise": "Sunday-Morning/Stories/Inspected-Not-Guaranteed.md#premise", "When": "Sunday-Morning/Notes/Collection.md#reading-order", "The nail": "Sunday-Morning/Notes/Collection.md#the-threads", "Behind it": "Sunday-Morning/Notes/Collection.md#the-threads", "Holds here": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Still falls elsewhere": "Sunday-Morning/Notes/Collection.md#where-the-nail-still-fell", "Outward effect": "Sunday-Morning/Notes/Collection.md#the-threads"}, "see": ["Sunday-Morning/Drafts/Inspected-Not-Guaranteed.md", "Sunday-Morning/Notes/Collection.md#the-threads"], "when": "Year 2, early spring", "part": "Story"}, {"id": "story-heavy-scale", "kind": "story", "label": "The Heavy Scale at Icestep Summit", "status": "Provisional", "lane": "borderlands", "section": "Stories", "src": "Sunday-Morning/Stories/The-Heavy-Scale.md#status", "text": "A provisional Sunday Morning story: writing reference, not setting canon. Its links show where the domino web touches one community, unseen by the people there.", "short_text": "On his first posting, a painfully precise weights inspector runs the pre-season check on Icestep Summit's public scale and finds it reading heavy.", "facts": {"Premise": "On his first posting, a painfully precise weights inspector runs the pre-season check on Icestep Summit's public scale and finds it reading heavy. He has three days before the first caravan of the year weighs in publicly to find out since when and why, and to work out who is owed what.", e": "asks about", "basis": "stated", "quote": "How old the Council is relative to The Convergence.", "src": "Open-Questions.md#economic-council", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-which-parts-of-its-existence-are-rumor-versus-kn", "to": "pw-council", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Which parts of its existence are rumor versus known to elite rulers.", "src": "Open-Questions.md#economic-council", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-name", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Name.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-homeland-people", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Homeland/people.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-exact-grievance", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Exact grievance.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-exact-territorial-or-political-end-state-he-want", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Exact territorial or political end-state he wants.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-the-point-at-which-his-methods-become-clearly-un", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "The point at which his methods become clearly unacceptable even to sympathetic readers.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-whether-he-knows-the-full-council-structure-at-t", "to": "pp-villain", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Whether he knows the full Council structure at the story's beginning.", "src": "Open-Questions.md#villain", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-exact-age-and-biography", "to": "pp-wurdren", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Exact age and biography.", "src": "Open-Questions.md#wurdren", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-why-his-earlier-adventuring-life-failed-to-match", "to": "pp-wurdren", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Why his earlier adventuring life failed to match his ambitions.", "src": "Open-Questions.md#wurdren", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-family-and-relationships", "to": "pp-wurdren", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Family and relationships.", "src": "Open-Questions.md#wurdren", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-what-he-initially-believes-about-politics-and-th", "to": "pp-wurdren", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "What he initially believes about politics and the Council.", "src": "Open-Questions.md#wurdren", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-where-his-journey-begins", "to": "pp-wurdren", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Where his journey begins.", "src": "Open-Questions.md#wurdren", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-the-names-of-the-sunplains-and-deepwood-language", "to": "lang-sunplains", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "The names of the Sunplains and Deepwood languages, and what Old Spine speech was called.", "src": "Open-Questions.md#language-and-naming", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-the-names-of-the-sunplains-and-deepwood-language", "to": "lang-deepwood", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "The names of the Sunplains and Deepwood languages, and what Old Spine speech was called.", "src": "Open-Questions.md#language-and-naming", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-the-names-of-the-sunplains-and-deepwood-language", "to": "lang-oldspine", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "The names of the Sunplains and Deepwood languages, and what Old Spine speech was called.", "src": "Open-Questions.md#language-and-naming", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-name-and-self-name-of-the-appalachian-influenced", "to": "nomads", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Name and self-name of the Appalachian-influenced mobile network.", "src": "Open-Questions.md#nomadic-peoples", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-whether-it-is-one-people-or-a-cultural-economic", "to": "nomads", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Whether it is one people or a cultural/economic network containing multiple peoples.", "src": "Open-Questions.md#nomadic-peoples", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-seasonal-circuits-and-legal-status", "to": "nomads", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "Seasonal circuits and legal status.", "src": "Open-Questions.md#nomadic-peoples", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}, {"from": "oq-current-events-audit", "to": "st-events", "layer": "oq", "type": "asks about", "basis": "stated", "quote": "They should be audited once the map and villain plan are finalized.", "src": "Open-Questions.md#current-events", "chip": "Asks about", "chipBack": "Open questions", "part": "Questions"}], "gaps": [{"part": "Geography", "title": "Part 1: Regions and Geography", "items": ["No named cities inside any of the six regions. Port and the border towns are the only named settlements; every region page describes 'cities' only in general.", "Only one region is placed on a continent (Northwind, Northern Continent). Which regions sit on the Western and Eastern Continents is not stated.", "Port's site and territory are not fixed. The wiki lists conditions its site should meet (convenient to northern and southern sea routes, access to inland rivers or roads) and describes Frostbay Way 'if Port is territorially separate'.", "Five region borders aren't established: Ironcrest–Highridge (likely), Greenvale–Highridge (likely), Deepwood–Sunplains (likely), Highridge–Sunplains (possible), and Greenvale–Deepwood (treated as a direct border unless the map contradicts it). Deepwood–Ironcrest is established as a relationship but only as a 'direct or near-direct' frontier.", "The region pages and Geography and Connections disagree on certainty: the Greenvale and Ironcrest pages state their Highridge borders plainly, while Geography and Connections calls them likely.", "Five region pairs have no border town: Ironcrest–Highridge, Greenvale–Deepwood, Deepwood–Sunplains, Greenvale–Highridge and Highridge–Sunplains.", "The wiki doesn't say which regions the Spine touches (only Highridge is tied to it) or which kingdoms hold Underpass entrances.", "No rivers, passes or Underpass entrances are named (history mentions provisional 'Ridge Pass Toll Wars'). Geography and Connections lists what the finished map should show: rivers, passes, Underpass entrances, caravan roads, seasonal closures, sea routes, old roads, pilgrimage paths, smuggling corridors.", "Directions are thin: Ironcrest west, Northwind north, Sunplains south and east, and Greenvale as 'the eastern agricultural interior' (from Highridge's point of view).", "Border Towns and World Overview carry no status label; the Border Towns page calls its six towns 'established working examples'.", "Seven names sit in the border-town name bank, unplaced."]}, {"part": "Culture", "title": "Part 2: Culture", "items": ["Five culture pages carry no status label: Architecture, Language and Thought, Naming, Culture and Influence (whose title reads 'Cultural Inspiration'), and Border Towns.", "Region culture is written twice: each region page has its own inspiration, language and architecture sections, and the Culture pages repeat them across regions. It's two owners for one concept. They agree in substance, but the lists already differ in detail: Highridge is 'probably the most multilingual settled region' on its region page but only 'likely highly multilingual' in Language and Thought; Ironcrest's speech list differs (ordered, attempted, completed, inspected, guaranteed versus completed, inspected, merely claimed); Architecture lists Deepwood longhouses flatly where the region page says they may appear depending on climate.", "Half the festivals (14 of 28) are names in the calendar with no description.", "No named languages, dialects or scripts anywhere; naming languages and personal-name systems are still open, and several character names stay provisional until they're settled.", "The nomads have no name, no named circuits, families, camps or stopping places. The page says 'the nomads' shouldn't be one culture, but only one mobile people is sketched.", "Deepwood–Sunplains is the only culture mix described (forest raised floors with courtyard shade) where Part 1 found no border town.", "Three border towns have no speech, festival or building detail: Icestep Summit, Darkroot Gulch and Frostbay Way (Frostbay's identity items are listed: Northwind seafaring, Port credit and trade law, ship repair, immigrant merchants, seasonal labor). The Icestep building and speech links and the Stonefield building link are inferred from the general border examples in Architecture and Language and Thought.", "The Spine and Underpass have peoples (Underpass families born underground, pilgrimage traditions, old toll states) but no culture described.", "No in-world sayings about border towns, Spine or Underpass peoples, or the nomads; Greenvale and Sunplains have no hiring shortcut.", "Most region-and-season cells in the festival calendar are blank; the page says only that no major shared festival was defined there (Port has nothing from late spring to late summer).", "No festivals are named for border towns, nomads or fairs, though Harveston Vale keeps festivals built around several harvest calendars and the nomad page mentions moving between fairs and Port's major fairs.", "Port's 'occupations found nowhere else at the same scale' aren't named.", "Root Cellar Night remembers the Seven-year Blight; it will connect when Part 5 (History) is built.", "Religion (Part 4) is only hinted at here: Solstice Lanterns says different faiths explain it differently, Port has blended religious practice, and several festivals imply rites. They'll connect when Part 4 is built.", "**Languages now have families, but not full names or name systems.** The families (Northern, Heartland, Deepwood), Trade Tongue and Old Spine speech were settled on 2026-09-29. Still open: personal-name systems, the names of the Sunplains and Deepwood languages, and what Old Spine speech was called. Border towns have no stated language mix of their own beyond the families of their two sides."]}, {"part": "Food", "title": "Part 3: Food", "items": ["**No dish is tied to a named festival.** Four recipes mention unnamed \"festival versions\" (Braided Honey and Grain Loaf, Aurora Berry Preserve, Honey-Drizzled Nut Pastries, Blacksmith's / Forged Harvest Stew), and the festivals page names no dishes. Every dish card's Festival row says \"none stated\". The only festival links drawn are two inferred ones for Greenvale (Root Cellar Night, Harvest Home). The pairing of Forged Harvest Stew with Forge Reawakening exists only in the Sunday Morning stories, which are not canon. Name echoes (Aurora Berry Preserve and Aurora Nights; Harvest Stew and Harvest Home) are not links either.", "**Port has no dishes.** Food lists six kinds of Port kitchen (dock-worker, ship, merchant, immigrant neighborhood, street and religious), and the diaspora page gives Port a cooking bias (borrowing, ship food, imported condiments), but there is no Port recipe book and no Port staples, techniques, meals, celebrations or drinks on record. Lean Vigil \"can mark the anxiety of winter shipping and food supply\" but names no food.", "**Deepwood–Ironcrest border food has no dishes.** The Ironcrest page says its border food \"blends strongly with Greenvale and Deepwood\", and Darkroot Gulch sits on that border, but Border Fusions has no Deepwood–Ironcrest section.", "**Three border towns have no border dishes.** Twilighthollow (Deepwood / Highridge), Frostbay Way (Northwind / Port) and Darkroot Gulch (Deepwood / Ironcrest) have no matching section in Border Fusions.", "**Four fusion pairings have no named town, and their borders aren't settled.** Ironcrest–Highridge (likely a border or a short mountain corridor), Greenvale–Deepwood (a working border), Deepwood–Sunplains (likely) and Highridge–Sunplains (unsettled: a border, a corridor, or mediated through Greenvale or Deepwood) have dishes but no border town on record. Border Fusions says that where adjacency changes, those dishes should be treated as trade-route or diaspora dishes. Greenvale–Highridge has a likely border but no dishes.", "**Border-town links are inferred.** Border Fusions doesn't say which town eats which dish; the seven dishes linked to Stonefield Forge, Harveston Vale and Icestep Summit are matched by border pair only.", "**The diaspora model has no dishes of its own on the wiki.** Food Diaspora and Adaptation gives the three-stage model and two illustrative paths (Guardian Stew, Forgefire Roast), and says the host-region versions shouldn't be treated as automatically canonical dishes. Forgefire Roast has no recipe in the Ironcrest book. Diaspora dishes worked out in earlier sessions (such as Forager's Crock, Wildwood Turnover and Listening / Caravan Broth) aren't on any wiki page, so they aren't on the board.", "**Most food imports are unsourced.** Only three are named as imports (Greenvale grain to Ironcrest; Greenvale flour and Sunplains oils or fruit possibly reaching Northwind's wealthier ports), plus food moving both ways between Ironcrest and Greenvale. Border dishes name a few origins in passing (plateau spice in Icefire Brined Fish; Sunplains oil, figs and dried fruit in Sunlit Orchard Grain, Forest-Orchard Medley, Harvest Orchard Salad and Highridge Orchard Pilaf), but Highridge's markets, Sunplains' \"spices from trade\" and Deepwood's \"trade grain and salt\" don't say where the food comes from.", "**Deepwood has no class or variation note** comparable to the other regions', and Port and border cuisine lack most cuisine facts.", "**Food as plot mechanics is stated but not mapped.** Food says shortages, grain prices, fish seasons and road closures should be usable as plot; those links belong to Parts 4 and 7."]}, {"part": "Power", "title": "Part 4: Power", "items": ["**The Council's houses are named, but not how seats pass.** Six seats and six houses were settled on 2026-09-29 (Marielle, Drathain, Veynor, Torradon, Luthain, Rhaelen); their named members are Provisional. Still open: how seats are inherited, selected, bought or contested, how old the Council is relative to the Convergence, what rulers know versus rumor, and the domains' final titles.", "**Only two seats name the places they reach.** The Materials seat names five regions and the Routes seat names the Underpass. Every other region page names only \"the Council\"; the seat links drawn for them (\"food/finance networks\", \"shipping and finance\", \"Council-linked credit\", \"route costs\", \"infrastructure/resource interests\", \"credit panic\") match a domain word and are marked inferred, off by default. Sunplains names Council involvement but no domain.", "**Every government is still a sketch.** No ruler, capital, dynasty, council or court is named anywhere, and most shapes are hedged (\"likely\", \"could\", \"possible\"). The wiki's open questions ask whether the six regions are kingdoms in the same constitutional sense, how many Sunplains city-states remain, how centralized Deepwood is, what formally governs Highridge, and whether Port has its own citizenship.", "**Three governments have no list of political fights.** Highridge's Politics section lists who holds power but not what they fight over; Port and the Underpass have pressures but no fights section.", "**No faith is placed anywhere.** The nine traditions span borders by design, but none has a named institution, leader, school or holy site, and none is tied to a region, border town or Port (Port has \"blended religious practices\"; Highridge has \"religious institutions\"; Deepwood has \"sacred jurisdictions\", all unnamed).", "**Four faiths have no stated stance on the Council.** The Cyclic Order, the Eternal Forge, the Harmonious Path and the Dual Flame have schemes but no Council link; the Silent Whisper's \"elite secrecy\" link is inferred. The Harmonious Path's parallel arbitration and the Dual Flame's counselors spotting a shared source point at current events, which belong to Part 7.", "**Only three guilds have names, and they're flagged.** The Warrior's, Assassin's and Spy Guilds come from earlier notes and \"should be developed carefully\". No guild has the leadership, branches, reformers or funding model the guild rule asks for, the metalworking factions are unnamed, and only the Highridge caravan organizations are placed in a region (the other placements shown are inferred).", "**No criminal organization is named.** The Crime page gives regional opportunities and five scales, but no gang, syndicate or family; the cross-regional alliance (Port finances, Underpass moves goods, Highridge supplies documents, Northwind moves cargo) is an example. The Underpass has no section on the Crime page.", "**No elite unit is named.** Each region has an elite direction, but no formation has the recruitment tradition, reputation, speech, initiation, uniform, conduct rules or patrons the cultural-behavior rule asks for. Port and the Underpass have no everyday-arms list.", "**The Villain and Wurdren appear as facts, not links.** The Council, guild, underworld and politics pages all describe how each deals with them; those links wait for Part 6 (People), and the pressures and schemes that are really events wait for Part 7."]}, {"part": "History", "title": "Part 5: History", "items": ["**There is no timeline.** No page gives a date, a duration or an overall chronology for anything before or at the Convergence (the Council's rise is a six-step sequence and the Port Seizure tradition has an order, but neither is dated), and Contested Memory says exact dates, participants and outcomes are not locked; the source that supplied dates was deliberately kept provisional. How old the Council is relative to the Convergence is an open question.", "**The nine conflict names have no content.** Ore Scar Strife, Lowland Famine Raids, Coldwave Incursions, Ridge Pass Toll Wars, Orchard-Lord Feuds, Deepwood Edge Skirmishes, Iron-Field Conquest, Great Coastal Skirmish and Highridge Consolidation War are names from earlier brainstorming, flagged to be revised into overlapping campaigns. None has participants, place or outcome; five are placed here only by their names (inferred, off by default).", "**The four contested memories aren't tied to those nine names.** The Ember Wars, Salted Coast Disputes, Timber Tithes and Port Seizure may describe some of the same conflicts, but no page says which.", "**The Convergence's details are open.** Where it was negotiated (Highridge is only the strongest candidate), what its provisions actually said (the page says it \"likely included\" them), which goods gained protected movement, and which Underpass sections, if any, got access rules.", "**Deepwood and Sunplains have no stated legacy** from their pre-Convergence history on their region pages, unlike Ironcrest, Northwind, Greenvale and Highridge.", "**Port's early history is undated and unplaced.** How Port became central is described, but not whether it happened before, during or after the Convergence, and the Port Seizure is explicitly not settled chronology.", "**Name echoes are not links.** The Ages of Silence and the Deep Silence festival, and the Ember Wars and Ember Remembrance, share words, but no page connects them. Ember Remembrance is a solemn memorial with names on memorial walls; it names no conflict.", "**The Seven-year Blight and the Ages of Silence have only one side.** Each is one region's memory, with no neighbor's or border version yet, unlike the four contested memories.", "**The Spine's geologic history** (rifting and mountain-building) is left to Part 1's geography and is itself provisional."]}, {"part": "People", "title": "Part 6: People", "items": ["**The Villain has no identity yet.** Open Questions: his name, homeland or people, exact grievance, exact end-state, the point where his methods become unacceptable even to sympathetic readers, and whether he knows the full Council structure at the start.", "**Wurdren has no biography.** His age, history, why his adventuring life fell short, family and relationships, what he first believes about the Council, and where his journey begins are all open. His only concrete scene so far is a Sunday Morning story, which is not canon.", "**The Council houses have names but no stories.** Six houses were settled on 2026-09-29, and twelve earlier-note members are listed on the Economic Council page as Provisional, but none has a biography, an heir question or a link to any other person, and how seats pass between them is still open.", "**The six domino figures are provisional** \"pending final naming systems\", and none is tied to an office, guild or place beyond their region; their institution links here are inferred and off by default. Orin has a rule instead of a stated domino.", "**The three Underpass figures are not canon** (Mira Stonebridge, Gharic Coalveil, Ilya Dravencrest), from earlier brainstorming, with nothing else tying them to the Underpass's enclaves, guides or mining.", "**The roster's \"the world also needs\" list is filled only by non-canon people.** Clerks, cooks, builders, caravan hands, priests, teachers, farmers, sailors, shopkeepers, labor organizers, criminals, children, minor officials and refugees exist so far only as the Sunday Morning cast.", "**Canon characters have almost no ties of their own.** No canon character has a stated faith, guild membership or home town, and the only family hint is Maris Bleakshore as a \"matriarch\". The people tied to faiths are Sunday Morning characters (Oriel, a Silent Whisper observer; Maudie Vance, who keeps an Infinite Compass shrine).", "**Where each person appears waits for Part 7.** Ties between canon figures and the Sunday Morning cast are drawn only where a plan page states one (Tamsin and Oswin with Wurdren, Garro with Samir, Sessa with Naruin); simply appearing in a story comes with Part 7. Which stories the domino figures and the Sunday Morning cast appear in, and the stories' settings, come with the story layer. The Sunday Morning cast column is grouped by story for now.", "**Several Sunday Morning roles stay deliberately unnamed** (the senior arbiter, the tea seller, the land agent, the market master, the Weaver-path elder, the Quench's keeper), so they aren't on the board; the Registry says leaving them unnamed is a device."]}, {"part": "Story", "title": "Part 7: The story layer", "items": ["**The ripple chain is one possible chain, not the plot.** Current Events offers thirteen steps as \"the kind of causal chain the story should prefer\"; every chain link here is marked possible. Where other events feed the final step (Northwind convoys, Naruin's leak, the Sunplains coalition), the link is the Atlas's reading, inferred and off by default. So are links that join two separate entries without a page saying so (Highridge rerouting to Port smuggling, Deepwood's road plans to Naruin's leak, drought to coalition, the faiths to step 8, and Underpass route wars to Port smuggling, which the earlier Domino Map had marked canon). The chain steps have their own cards, so each event card keeps only the causes Current Events gives it.", "**Six current events touch no story yet:** Northwind's fish stocks, Highridge's patron-tied debates, the Spine earthquake, the faiths' reading of the crises, the Underpass route wars (only a seed) and Sunplains drought (only a seed). Of the cross-region chain steps, only Council finance steadying lenders sits behind a story (The Goat File, as ordinary pressure, provisional).", "**Nothing is dated.** The Sunday Morning calendar (Year 1 autumn to Year 2 autumn) is a provisional collection design, and Current Events is a snapshot \"shortly before or during the opening movement\", not a timeline.", "**Who is behind each nail is provisional.** The Collection's \"Behind it\" column is an out-of-story attribution that nobody in the stories knows; one land agent is marked unknown, and the Villain's identity and plan remain open questions.", "**Orin has no stated domino,** and **Rosana's strain isn't tied to the abundance crisis on any canon page.** Orin's link to the metal movements is inferred from his strategic value. Current Events says \"a new strain, unusually good weather, or both\"; only the Sunday Morning collection makes it her seed. That link is inferred here.", "**Two Sunday Morning settings aren't in the wiki.** Kettle Cove and Seven Wells are provisional names used only by their stories,

kmail; communication.", "Leverage": "It should not literally control all knowledge. Its strength is knowing who knows what, buying access, delaying information, and deciding which innovations receive funding or distribution.", "House": "House Rhaelen (Working canon).", "Home region": "Deepwood: origin only; the house doesn't represent it.", "Members": "Sorin Rhaelen, a reserved archivist; Lyra Rhaelen, who recovers lost knowledge. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-politics", "kind": "overview", "label": "How governments behave", "status": "No status label", "lane": "council", "section": "Kingdoms", "src": "Politics/Kingdoms-and-Politics.md#political-behavior", "text": "No two regions need share a political system, and every government answers to the same pressures. That is how the Villain can push states toward war even when the Council wants peace.", "short_text": "Same pressures on every ruler; how war starts against Council wishes.", "facts": {"Principle": "The six regions should not necessarily share identical political systems. \"Region\" is a cultural-geographic term: a region can contain a kingdom, confederation, city-states, autonomous districts, chartered towns, religious lands and old privileges.", "Scope": "Every government responds to domestic legitimacy, old borders, guild pressure, food, credit, military readiness, religion, public rumor and elite family interests.", "Council": "Rulers can't always follow Council preferences without appearing weak, corrupt or disloyal to their own populations.", "Villain": "A plausible escalation chain: a real grievance; evidence that seems to confirm a rival caused it; local politics punishing passive leaders; mobilization as deterrence, read as preparation for attack; border forces acting without full central control; deaths creating demand for retaliation; Council de-escalation looking suspicious; leaders fearing lost legitimacy if they compromise; limited conflict becoming self-sustaining. The Villain's genius is making each step locally rational.", "Open questions": "Are all six named regions kingdoms in the same constitutional sense? How many independent Sunplains city-states remain? How centralized is Deepwood? What formal institutions govern Highridge? Does Port have citizenship independent of kingdom citizenship?"}, "fact_src": {"Principle": "Politics/Kingdoms-and-Politics.md#principle", "Scope": "Politics/Kingdoms-and-Politics.md#political-behavior", "Council": "Politics/Kingdoms-and-Politics.md#political-behavior", "Villain": "Politics/Kingdoms-and-Politics.md#how-war-can-begin-against-council-wishes", "Open questions": "Open-Questions.md#political-structure"}, "part": "Power"}, {"id": "pw-gov-ironcrest", "kind": "government", "label": "Ironcrest government", "status": "No status label", "lane": "ironcrest", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#ironcrest", "text": "Likely more consolidated than before the Convergence, but power is divided among crown and state institutions, mine owners, guilds, town governments, labor organizations and old landed families.", "short_text": "Likely fairly consolidated; power split among crown, mines, guilds, labor, old families.", "facts": {"Shape": "Likely relatively consolidated compared with its pre-Convergence past.", "Power held by": "Crown and state institutions, mine owners, guilds, town governments, labor organizations and old landed families.", "Political fights": "Rulers must manage mine ownership, labor, guild privileges, food imports, forest and fuel rights, border roads, old land claims and Council-linked credit. A ruler can command soldiers but cannot simply order the economy to function.", "Current pressures": "Labor unrest in mining and metalworking; covert high-quality metal shipments; pressure to expand access to Underpass routes; fears of weapon stockpiling; Council efforts to prevent Ironcrest converting economic strength into unchecked military power; Villain efforts to turn guild grievances and elite rivalries into strategic disruption."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#ironcrest", "Power held by": "Politics/Kingdoms-and-Politics.md#ironcrest", "Political fights": "Regions/Ironcrest.md#politics", "Current pressures": "Regions/Ironcrest.md#current-pressures"}, "part": "Power"}, {"id": "pw-gov-northwind", "kind": "government", "label": "Northwind government", "status": "No status label", "lane": "northwind", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#northwind", "text": "Likely keeps strong clan, harbor and local rights even under larger regional leadership; maritime law may be partly separate from inland law.", "short_text": "Likely strong clan and harbor rights under regional leadership.", "facts": {"Shape": "Likely preserves strong clan, harbor and local rights even under larger regional leadership.", "Political fights": "Fishing rights, harbor control, convoy protection, privateering and piracy, clan autonomy, merchant investment, food dependence, and Council influence over shipping and finance.", "Current pressures": "Declining or shifting fish stocks; rising piracy; debate over convoy agreements with Port; accusations that some clans cooperate with raiders; Council attempts to stabilize shipping without letting one maritime bloc dominate; Villain efforts to make defensive actions look like aggression.", "Note": "Maritime law may be partially separate from inland law."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#northwind", "Political fights": "Regions/Northwind.md#politics", "Current pressures": "Regions/Northwind.md#current-pressures", "Note": "Politics/Kingdoms-and-Politics.md#northwind"}, "part": "Power"}, {"id": "pw-gov-greenvale", "kind": "government", "label": "Greenvale government", "status": "No status label", "lane": "greenvale", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#greenvale", "text": "Could combine a regional monarchy or central authority with estate power, village councils, irrigation associations, cooperatives and market towns.", "short_text": "Could mix a central authority with estates, villages and co-ops.", "facts": {"Shape": "Could combine a regional monarchy or central authority, estate power, village councils, irrigation associations, cooperatives and market towns.", "Political fights": "Land tenure, water rights, tenant obligations, storage, seed ownership, grain price, export rules, estate versus cooperative power. The Council's food and finance networks can exert enormous influence here without ruling Greenvale directly.", "Current pressures": "An unusually abundant harvest or new high-yield seed strain; suspicion about where innovations came from; collapsing farm prices despite high output; land consolidation; sabotage of irrigation or crops; conflict between co-ops and large estates; Villain attempts to turn abundance into distrust and scarcity elsewhere."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#greenvale", "Political fights": "Regions/Greenvale.md#politics", "Current pressures": "Regions/Greenvale.md#current-pressures"}, "part": "Power"}, {"id": "pw-gov-highridge", "kind": "government", "label": "Highridge government", "status": "No status label", "lane": "highridge", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#highridge", "text": "Could be a federation or confederation of cities, route districts, caravan houses, herding territories and old pass communities, whose legitimacy may come from negotiated compacts rather than a single dynasty.", "short_text": "Possibly a confederation held together by compacts.", "facts": {"Shape": "Could be a federation or confederation of cities, route districts, caravan houses, herding territories and old pass communities. Its legitimacy may come from negotiated compacts rather than a single dynasty.", "Power held by": "Route authorities, old families, merchant houses, caravan guilds, urban councils, religious institutions and herding communities.", "Current pressures": "Caravan attacks; manipulated route closures; accusations of corrupt militia or toll officials; intellectual disputes tied to actual commercial patrons; contested infrastructure projects; Council interference with route costs; Villain efforts to redirect flows without appearing to control them.", "Note": "The region's reputation for reasoned debate is partly ideal and partly institutional necessity."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#highridge", "Power held by": "Regions/Highridge-Plateau.md#politics", "Current pressures": "Regions/Highridge-Plateau.md#current-pressures", "Note": "Regions/Highridge-Plateau.md#politics"}, "part": "Power"}, {"id": "pw-gov-deepwood", "kind": "government", "label": "Deepwood government", "status": "No status label", "lane": "deepwood", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#deepwood", "text": "Likely the least centralized region, with possible layers of local councils, forest wardens, regional assemblies, sacred jurisdictions, market towns and hereditary authorities in some districts.", "short_text": "Likely the least centralized: councils, wardens, sacred lands.", "facts": {"Shape": "Likely the least centralized. Possible layers: local councils, forest wardens, regional assemblies, sacred jurisdictions, market towns, and hereditary authorities in some districts.", "Political fights": "Cutting rights, water, road access, hunting, sacred or restricted areas, border settlement, trade in high-value plants, local autonomy.", "Current pressures": "Illegal or politically authorized logging beyond accepted limits; fungal disease affecting food or trade species; conflict between isolationists and outward-looking reformers; criminal exploitation of hidden routes; Council infrastructure and resource interests; Villain attempts to turn legitimate conservation disputes into regional crisis."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#deepwood", "Political fights": "Regions/Deepwood.md#politics", "Current pressures": "Regions/Deepwood.md#current-pressures"}, "part": "Power"}, {"id": "pw-gov-sunplains", "kind": "government", "label": "Sunplains governments", "status": "No status label", "lane": "sunplains", "section": "Government", "src": "Politics/Kingdoms-and-Politics.md#sunplains", "text": "The most explicitly plural region: city-states, leagues, estates, ports and rural territories. The Convergence may recognize it externally though it contains several sovereign or semi-sovereign governments.", "short_text": "City-states and leagues; a union would alarm everyone.", "facts": {"Shape": "Most explicitly plural: city-states, leagues, estates, ports and rural territories. The Convergence may recognize the region externally even though it contains several sovereign or semi-sovereign governments.", "Political fights": "City-states compete for water, port access, prestige, trade, labor, alliances and cultural influence. A permanent Sunplains union would be powerful enough to worry both neighbors and the Council.", "Current pressures": "Drought fears; private control of canals; city-state blocs forming and breaking; merchant-family espionage; artistic and civic rivalry masking real political competition; Council efforts to prevent dangerous consolidation; Villain attempts to make defensive alliances appear expansionist."}, "fact_src": {"Shape": "Politics/Kingdoms-and-Politics.md#sunplains", "Political fights": "Regions/Sunplains.md#politics", "Current pressures": "Regions/Sunplains.md#current-pressures"}, "part": "Power"}, {"id": "pw-gov-port", "kind": "government", "label": "Port charter and watch", "status": "Working canon", "lane": "port", "section": "Government", "src": "Places/Port.md#neutrality", "text": "Port's neutrality is neither sentimental nor perfect: it survives because every major power fears what would happen if a rival controlled it.", "short_text": "Neutral because everyone fears a rival holding it.", "facts": {"Shape": "Neutrality that is neither sentimental nor perfect. It survives because every major power fears what would happen if a rival controlled it.", "Power held by": "Its governing charter should involve local citizens, merchant interests, guild influence, treaty guarantees, foreign enclaves, limits on kingdom troops inside the city, and a locally accountable watch or guard.", "Current pressures": "Competing smuggling networks are expanding; merchant families are sabotaging one another's routes; refugees and displaced workers are increasing pressure on poorer districts; suspicious ship losses feed accusations among kingdoms; Council-linked finance attempts to prevent a credit panic; the Villain can exploit Port because a rumor or shipping delay here propagates everywhere.", "Note": "The city needs harbor patrols, fire response, warehouse inspection, market regulation, neutral courts, multilingual clerks, quarantine rules, night watches and dock labor systems. Foreign militaries may protect outer sea lanes while being restricted inside Port itself."}, "fact_src": {"Shape": "Places/Port.md#neutrality", "Power held by": "Places/Port.md#neutrality", "Current pressures": "Places/Port.md#current-events", "Note": "Places/Port.md#governance-and-protection"}, "part": "Power"}, {"id": "pw-gov-underpass", "kind": "government", "label": "Underpass authority", "status": "Working canon", "lane": "spine", "section": "Government", "src": "Places/The-Underpass.md#politics", "text": "Authority is fragmented among possible enclave councils, guide families, mining fraternities, local militias, trade coalitions and criminal organizations. Surface kingdoms claim some entrances and sections but rarely control the whole network.", "short_text": "Fragmented; possible rulers include enclaves, guide families, militias, criminals.", "facts": {"Shape": "Fragmented. Surface kingdoms claim some entrances and sections but rarely control the entire network.", "Power held by": "Possible governing units: enclave councils, guide families, mining fraternities, local militias, trade coalitions, criminal organizations.", "Current pressures": "Rival enclaves are fighting over profitable corridors; new mineral finds have intensified claims; collapses have redirected trade; smugglers are exploiting official route closures; Council agents seek reliable route influence; the Villain can use the network to move people and goods where surface observers don't expect them."}, "fact_src": {"Shape": "Places/The-Underpass.md#politics", "Power held by": "Places/The-Underpass.md#politics", "Current pressures": "Places/The-Underpass.md#current-events"}, "part": "Power"}, {"id": "pw-faiths", "kind": "overview", "label": "The nine faiths", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#religions", "text": "Nine major trans-regional traditions that don't map neatly onto kingdoms. Each should have local schools, reform movements, institutions, charities, political interests and internal disputes.", "short_text": "Nine trans-regional traditions that don't map onto kingdoms.", "facts": {"Principle": "The world currently contains nine major trans-regional traditions. They do not map neatly onto kingdoms, and each should have local schools, reform movements, institutions, charities, political interests and internal disputes.", "Scope": "Faiths shouldn't behave like nine political parties. A member's faith may influence moral language, community obligation, charitable networks and interpretation of events, but class, region, family, guild and personal experience also matter.", "Main conflict": "Because the traditions span borders, they can show a crisis in one region understood completely differently elsewhere. Religious networks may also provide the first genuinely trans-regional response to the unfolding political crisis."}, "fact_src": {"Principle": "Politics/Religions.md#religions", "Scope": "Politics/Religions.md#religion-and-politics", "Main conflict": "Politics/Religions.md#religion-and-current-events"}, "part": "Power"}, {"id": "pw-faith-cyclic", "kind": "faith", "label": "The Cyclic Order", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#1-the-cyclic-order", "text": "Core: Existence moves through cycles of birth, death, renewal, time, balance and moral consequence.", "short_text": "Cycles; reformers want disruption to finish overdue ones.", "facts": {"Core": "Existence moves through cycles of birth, death, renewal, time, balance and moral consequence.", "Interests": "Calendars; rites of passage; mediation; burial; seasonal observance.", "Current scheme": "A reform movement argues that post-Convergence stability has become stagnation. Some members want deliberate social disruption to \"complete\" overdue cycles; traditional elders oppose them."}, "part": "Power"}, {"id": "pw-faith-weaver", "kind": "faith", "label": "Path of the Great Weaver", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#2-path-of-the-great-weaver", "text": "Core: Beings, places, ancestors, animals and actions are threads in a living weave.", "short_text": "Living weave; documenting land and water damage.", "facts": {"Core": "Beings, places, ancestors, animals and actions are threads in a living weave.", "Interests": "Stewardship; oral history; ancestry; ecological obligations; community memory.", "Current scheme": "Networks across several regions are documenting land and water damage, building a trans-regional moral case against large extraction and infrastructure projects. Some Council families see this as a threat to economic planning."}, "part": "Power"}, {"id": "pw-faith-radiant", "kind": "faith", "label": "The Radiant Path", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#3-the-radiant-path", "text": "Core: Moral life is struggle toward courage, justice, truth and wisdom against cruelty, lies and discord.", "short_text": "Courage, justice, truth; split over hidden Council rule.", "facts": {"Core": "Moral life is struggle toward courage, justice, truth and wisdom against cruelty, lies and discord.", "Interests": "Charity; public ethics; justice; moral testimony.", "Current scheme": "Different branches disagree over whether hidden Council rule is a necessary compromise or fundamentally a form of darkness through deception."}, "part": "Power"}, {"id": "pw-faith-forge", "kind": "faith", "label": "The Eternal Forge", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#4-the-eternal-forge", "text": "Core: Creation and destruction are linked; character and society are shaped through disciplined transformation.", "short_text": "Disciplined transformation; drifting into labor disputes.", "facts": {"Core": "Creation and destruction are linked; character and society are shaped through disciplined transformation.", "Interests": "Craft; apprenticeship; ethical labor; rebuilding.", "Current scheme": "Its guild-adjacent institutions are becoming active in labor and quality disputes, potentially turning a spiritual tradition into a cross-regional political force."}, "part": "Power"}, {"id": "pw-faith-illuminated", "kind": "faith", "label": "The Illuminated Circle", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#5-the-illuminated-circle", "text": "Core: Knowledge, reason, inquiry and intellectual freedom are sacred values.", "short_text": "Sacred reason; some scholars may be close to proving manipulation.", "facts": {"Core": "Knowledge, reason, inquiry and intellectual freedom are sacred values.", "Interests": "Libraries; schools; debate; archives; public reasoning.", "Current scheme": "Scholars are collecting contradictory trade and government records. Some may be close to proving systematic manipulation without yet understanding the Council."}, "part": "Power"}, {"id": "pw-faith-whisper", "kind": "faith", "label": "The Silent Whisper", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#6-the-silent-whisper", "text": "Core: Silence, uncertainty, hidden truths, patience and introspection.", "short_text": "Hidden truths; is withholding them complicity?", "facts": {"Core": "Silence, uncertainty, hidden truths, patience and introspection.", "Interests": "Preservation; contemplation; secret archives; lost knowledge.", "Current scheme": "Some custodians believe dangerous truths should be withheld until society can survive them. Others argue that this has become complicity with elite secrecy."}, "part": "Power"}, {"id": "pw-faith-harmonious", "kind": "faith", "label": "The Harmonious Path", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#7-the-harmonious-path", "text": "Core: Social responsibility, service, restraint, conflict resolution and balance.", "short_text": "Service and restraint; parallel arbitration growing power.", "facts": {"Core": "Social responsibility, service, restraint, conflict resolution and balance.", "Interests": "Mediation; community welfare; nonviolent conflict settlement.", "Current scheme": "Local Harmonious communities are building parallel mutual-aid and arbitration systems where official institutions have failed, unintentionally creating political power."}, "part": "Power"}, {"id": "pw-faith-dualflame", "kind": "faith", "label": "The Dual Flame", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#8-the-dual-flame", "text": "Core: Moral integrity comes from understanding and balancing constructive and destructive impulses.", "short_text": "Balanced impulses; counselors may see one source behind many crises.", "facts": {"Core": "Moral integrity comes from understanding and balancing constructive and destructive impulses.", "Interests": "Counseling; confession; mentorship; personal discipline.", "Current scheme": "Its counselors are seeing similar fear, anger and radicalization patterns across regions and may recognize that separate crises share a source before political leaders do."}, "part": "Power"}, {"id": "pw-faith-compass", "kind": "faith", "label": "The Infinite Compass", "status": "No status label", "lane": "faiths", "section": "Faiths", "src": "Politics/Religions.md#9-the-infinite-compass", "text": "Core: Life is journey, direction, exploration and self-discovery.", "short_text": "Pilgrims and road shrines; information moves fast.", "facts": {"Core": "Life is journey, direction, exploration and self-discovery.", "Interests": "Pilgrimage; maps; hospitality; travelers; road shrines.", "Current scheme": "Its pilgrim networks move information across borders faster than many governments expect. The Council, the Villain, spies and criminals all have reasons to influence these networks."}, "part": "Power"}, {"id": "pw-guilds", "kind": "overview", "label": "Guilds", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#core-role", "text": "Part economic institution, part professional community, part political lobby, part welfare system, and sometimes part coercive cartel. They matter because pre-modern governments can't directly administer every profession and service.", "short_text": "Lobby, welfare system, cartel: why guilds exist and how they're used.", "facts": {"Principle": "Guilds are part economic institution, part professional community, part political lobby, part welfare system, and sometimes part coercive cartel. They matter because pre-modern governments cannot directly administer every profession and service.", "Scope": "Four types: production and craft (smiths, builders, millers, shipwrights, weavers, potters, masons); trade and transport (merchants, caravan masters, navigators, warehouse operators, river pilots); service and learned professions (healers, scribes, teachers, surveyors, interpreters); armed and clandestine organizations. No guild wants only \"more power\": typical goals include monopoly or standards, stable member income, control of apprenticeship, legal privileges, trade secrets, taxation, routes, contracts, member welfare and stopping rival guilds.", "Council": "The Council does not \"own the guilds.\" It influences them through loans, contracts, access, leadership patronage, legal favors, information, insurance and selective enforcement. Guilds sometimes knowingly manipulate Council families in return.", "Villain": "He exploits legitimate guild grievances. He may fund reformers, expose corruption, arrange shortages that make one faction look incompetent, create demand for guild security, encourage strikes at strategically chosen moments, and leak real documents mixed with misleading conclusions.", "Wurdren": "He encounters guilds as people: an apprentice denied work, a caravan team abandoned after a contract dispute, a healer unable to get supplies, workers threatened by owners, owners threatened by a strike. He sees why the institution exists and why it can become harmful.", "Rule": "Every major guild should have leadership, ordinary members, regional branches, internal reformers, a funding model, benefits members would lose if it disappeared, and abuses outsiders resent."}, "fact_src": {"Principle": "Politics/Guilds.md#core-role", "Scope": "Politics/Guilds.md#types", "Council": "Politics/Guilds.md#guild-interaction-with-the-council", "Villain": "Politics/Guilds.md#guild-interaction-with-the-villain", "Wurdren": "Politics/Guilds.md#guild-interaction-with-wurdren", "Rule": "Politics/Guilds.md#rule"}, "part": "Power"}, {"id": "pw-guild-metal", "kind": "guild", "label": "Metalworking guild factions", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#metalworking-guild-factions", "text": "Some want controlled production and traditional apprenticeship; others want broader output and new methods. Council-linked investors may fund one faction to restrain another.", "short_text": "Tradition against output; Council money may pick a side.", "facts": {"Type": "Not stated; the page lists smiths under production and craft.", "At issue": "Some want controlled production and traditional apprenticeship; others want broader output and new methods. Council-linked investors may fund one faction to restrain another."}, "part": "Power"}, {"id": "pw-guild-agri", "kind": "guild", "label": "Agricultural guilds and cooperatives", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#agricultural-guildscooperatives", "text": "Fighting over seed control, storage, land consolidation, pricing and new crop strains.", "short_text": "Seed, storage, consolidation, prices, new strains.", "facts": {"Type": "Not stated.", "At issue": "Fighting over seed control, storage, land consolidation, pricing and new crop strains."}, "part": "Power"}, {"id": "pw-guild-nav", "kind": "guild", "label": "Navigator and shipping guilds", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#navigator-and-shipping-guilds", "text": "Debating convoy systems, piracy response, Port influence and route exclusivity.", "short_text": "Convoys, piracy, Port influence, route exclusivity.", "facts": {"Type": "Trade and transport (navigators are listed there).", "At issue": "Debating convoy systems, piracy response, Port influence and route exclusivity."}, "part": "Power"}, {"id": "pw-guild-caravan", "kind": "guild", "label": "Highridge caravan organizations", "status": "No status label", "lane": "highridge", "section": "Guilds", "src": "Politics/Guilds.md#highridge-caravan-organizations", "text": "Competing over safe-route certification, tolls, militia protection and maps.", "short_text": "Route certification, tolls, militia protection, maps.", "facts": {"Type": "Trade and transport (caravan masters are listed there).", "At issue": "Competing over safe-route certification, tolls, militia protection and maps."}, "part": "Power"}, {"id": "pw-guild-builders", "kind": "guild", "label": "Builders and infrastructure guilds", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#builders-and-infrastructure-guilds", "text": "Seeking long contracts and legal control over standards. Their delays can become political weapons even when caused by ordinary disputes.", "short_text": "Long contracts and standards; delays as weapons.", "facts": {"Type": "Production and craft (builders are listed there).", "At issue": "Seeking long contracts and legal control over standards. Their delays can become political weapons even when caused by ordinary disputes."}, "part": "Power"}, {"id": "pw-guild-warrior", "kind": "guild", "label": "Warrior's Guild", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#armed-and-clandestine-organizations", "text": "Named in earlier notes as an armed or clandestine organization.", "short_text": "From earlier notes; still to be developed.", "facts": {"Type": "Armed and clandestine organizations.", "Note": "Earlier notes include it. These should be developed carefully so they function as plausible institutions rather than game classes."}, "part": "Power"}, {"id": "pw-guild-assassin", "kind": "guild", "label": "Assassin's Guild", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#armed-and-clandestine-organizations", "text": "Named in earlier notes as an armed or clandestine organization.", "short_text": "From earlier notes; still to be developed.", "facts": {"Type": "Armed and clandestine organizations.", "Note": "Earlier notes include it. These should be developed carefully so they function as plausible institutions rather than game classes."}, "part": "Power"}, {"id": "pw-guild-spy", "kind": "guild", "label": "Spy Guild", "status": "No status label", "lane": "guilds", "section": "Guilds", "src": "Politics/Guilds.md#armed-and-clandestine-organizations", "text": "Named in earlier notes as an armed or clandestine organization.", "short_text": "From earlier notes; still to be developed.", "facts": {"Type": "Armed and clandestine organizations.", "Note": "Earlier notes include it. These should be developed carefully so they function as plausible institutions rather than game classes."}, "part": "Power"}, {"id": "pw-underworld", "kind": "overview", "label": "The underworld", "status": "No status label", "lane": "across", "section": "Underworld", "src": "Politics/Crime-and-Underworld.md#principle", "text": "Crime exists because law, markets, borders, poverty, opportunity, corruption and demand exist. Criminal groups give some members real benefits while imposing serious costs on victims and communities.", "short_text": "Five scales of crime; sometimes tolerated by the Council, exploitable by the Villain.", "facts": {"Principle": "Crime exists because law, markets, borders, poverty, opportunity, corruption and demand exist. Criminal organizations should provide real benefits to some members (protection, work, credit, belonging, dispute resolution) while imposing serious costs on victims and communities.", "Scope": "Five scales: street and neighborhood groups (a few blocks, a dock, a market, a mining camp); regional gangs working roads, river systems, forest routes, mining districts and coasts; trade-based syndicates (smuggling, forged documents, contraband, stolen goods, illegal labor recruitment, bribery); long-lived family-style networks offering loans, protection, arbitration, jobs and political access in exchange for loyalty, money, silence and sometimes violence; and cross-regional alliances of independent groups that cooperate without becoming one super-organization.", "Council": "The Council sometimes tolerates criminal networks because they provide deniable services or keep unofficial markets functioning.", "Villain": "He can exploit the same networks but cannot simply command them. Criminal leaders require profit, protection, revenge or leverage.", "Wurdren": "He is likely to meet crime at the human level, where a gang may at once be extorting shopkeepers, feeding members' families, protecting a neighborhood from worse outsiders, trafficking stolen goods and punishing people who refuse them.", "Rule": "That ambiguity should never erase victims."}, "fact_src": {"Principle": "Politics/Crime-and-Underworld.md#principle", "Scope": "Politics/Crime-and-Underworld.md#scale", "Council": "Politics/Crime-and-Underworld.md#underworld-and-the-main-conflict", "Villain": "Politics/Crime-and-Underworld.md#underworld-and-the-main-conflict", "Wurdren": "Politics/Crime-and-Underworld.md#underworld-and-the-main-conflict", "Rule": "Politics/Crime-and-Underworld.md#underworld-and-the-main-conflict"}, "part": "Power"}, {"id": "pw-crime-ironcrest", "kind": "crime", "label": "Ironcrest crime", "status": "No status label", "lane": "ironcrest", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#ironcrest", "text": "Common criminal opportunities: ore theft, illegal claims, tool and weapon diversion, labor intimidation, debt.", "short_text": "Ore theft, illegal claims, tool and weapon diversion, labor intimidation, debt.", "facts": {"Opportunities": "Ore theft, illegal claims, tool and weapon diversion, labor intimidation, debt."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#ironcrest"}, "part": "Power"}, {"id": "pw-crime-northwind", "kind": "crime", "label": "Northwind crime", "status": "No status label", "lane": "northwind", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#northwind", "text": "Common criminal opportunities: piracy, smuggling, stolen cargo, illegal fishing, harbor protection.", "short_text": "Piracy, smuggling, stolen cargo, illegal fishing, harbor protection.", "facts": {"Opportunities": "Piracy, smuggling, stolen cargo, illegal fishing, harbor protection.", "On the ground now": "Rising piracy; accusations that some clans cooperate with raiders."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#northwind", "On the ground now": "Regions/Northwind.md#current-pressures"}, "part": "Power"}, {"id": "pw-crime-greenvale", "kind": "crime", "label": "Greenvale crime", "status": "No status label", "lane": "greenvale", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#greenvale", "text": "Common criminal opportunities: grain theft, land fraud, illegal seed markets, livestock theft, debt enforcement.", "short_text": "Grain theft, land fraud, illegal seed markets, livestock theft, debt enforcement.", "facts": {"Opportunities": "Grain theft, land fraud, illegal seed markets, livestock theft, debt enforcement.", "On the ground now": "Sabotage of irrigation or crops."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#greenvale", "On the ground now": "Regions/Greenvale.md#current-pressures"}, "part": "Power"}, {"id": "pw-crime-highridge", "kind": "crime", "label": "Highridge crime", "status": "No status label", "lane": "highridge", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#highridge", "text": "Common criminal opportunities: caravan robbery, route extortion, document fraud, information brokerage.", "short_text": "Caravan robbery, route extortion, document fraud, information brokerage.", "facts": {"Opportunities": "Caravan robbery, route extortion, document fraud, information brokerage.", "On the ground now": "Caravan attacks; accusations of corrupt militia or toll officials."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#highridge", "On the ground now": "Regions/Highridge-Plateau.md#current-pressures"}, "part": "Power"}, {"id": "pw-crime-deepwood", "kind": "crime", "label": "Deepwood crime", "status": "No status label", "lane": "deepwood", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#deepwood", "text": "Common criminal opportunities: illegal timber, rare plant trade, poaching, hidden-route smuggling.", "short_text": "Illegal timber, rare plant trade, poaching, hidden-route smuggling.", "facts": {"Opportunities": "Illegal timber, rare plant trade, poaching, hidden-route smuggling.", "On the ground now": "Illegal or politically authorized logging beyond accepted limits; criminal exploitation of hidden routes."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#deepwood", "On the ground now": "Regions/Deepwood.md#current-pressures"}, "part": "Power"}, {"id": "pw-crime-sunplains", "kind": "crime", "label": "Sunplains crime", "status": "No status label", "lane": "sunplains", "section": "Crime", "src": "Politics/Crime-and-Underworld.md#sunplains", "text": "Common criminal opportunities: canal corruption, smuggling, merchant fraud, political bribery, protection around ports and markets.", "short_text": "Canal corruption, smuggling, merchant fraud, political bribery, protection around ports and markets.", "facts": {"Opportunities": "Canal corruption, smuggling, merchant fraud, political bribery, protection around ports and markets."}, "fact_src": {"Opportunities": "Politics/Crime-and-Underworld.md#sunplains"}, "part": "Power"}, {"id": "pw-crime-port", "kind": "crime", "label": "Port crime", "status": "Working canon", "lane": "port", "section": "Crime", "src": "Places/Port.md#crime", "text": "Port's scale and legal complexity make it ideal for smuggling, fencing, forgery, rackets, corruption, intelligence brokerage, contraband finance and pirate laundering. It isn't lawless: its underworld exists because its legal economy is enormous.", "short_text": "All the regional forms can converge here; the legal economy is huge.", "facts": {"Opportunities": "Smuggling, fencing stolen goods, forged documents, protection rackets, corruption, intelligence brokerage, contraband finance, pirate laundering. The Crime page adds that all the regional forms can converge here.", "On the ground now": "Competing smuggling networks are expanding.", "Note": "This doesn't mean the city is lawless. Its underworld exists because its legal economy is enormous."}, "fact_src": {"Opportunities": "Places/Port.md#crime", "On the ground now": "Places/Port.md#current-events", "Note": "Places/Port.md#crime"}, "see": ["Politics/Crime-and-Underworld.md#port"], "part": "Power"}, {"id": "pw-crime-underpass", "kind": "crime", "label": "Underpass crime", "status": "Working canon", "lane": "spine", "section": "Crime", "src": "Places/The-Underpass.md#politics", "text": "Criminal organizations are among the Underpass's possible governing units, and smugglers are exploiting official route closures.", "short_text": "Criminals among the possible authorities; smugglers use closures.", "facts": {"On the ground now": "Smugglers are exploiting official route closures.", "Note": "Criminal organizations are among the possible governing units."}, "fact_src": {"On the ground now": "Places/The-Underpass.md#current-events", "Note": "Places/The-Underpass.md#politics"}, "part": "Power"}, {"id": "pw-arms", "kind": "overview", "label": "Weapons and elite troops", "status": "No status label", "lane": "across", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#principle", "text": "Weapons should be reusable, maintainable, culturally plausible and suited to the environment. Elite troops stand out by training and discipline, not enormous weapons or supernatural competence.", "short_text": "Everyday arms are tools; elites stand out by training, not gear.", "facts": {"Principle": "Weapons should be reusable, maintainable, culturally plausible, and suitable for the environment.", "Scope": "Most people do not carry battlefield weapons all day. Self-defense often uses tools already present in daily life.", "Rule": "Elite troops should stand out by training, discipline, logistics, equipment quality, unit culture, communication and ability to operate in difficult terrain, not by enormous weapons, implausible armor or supernatural competence. Each elite formation should have a recruitment tradition, social reputation, distinctive speech or register, initiation, practical uniform differences, rules of conduct, a relationship with ordinary troops, and political patrons. A feared elite unit can be excellent at its specialty and still fail badly outside it."}, "fact_src": {"Principle": "Culture/Weapons-and-Elite-Troops.md#principle", "Scope": "Culture/Weapons-and-Elite-Troops.md#principle", "Rule": "Culture/Weapons-and-Elite-Troops.md#elite-troop-rule"}, "see": ["Culture/Weapons-and-Elite-Troops.md#cultural-behavior"], "part": "Power"}, {"id": "pw-arms-ironcrest", "kind": "troops", "label": "Ironcrest arms", "status": "No status label", "lane": "ironcrest", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#ironcrest", "text": "Elite direction: disciplined heavy infantry or engineering troops accustomed to fortifications, mines and confined terrain.", "short_text": "Heavy infantry and engineers for mines and forts.", "facts": {"Everyday arms": "Stout knives, hammers, short spears, axes, clubs; crossbows in some districts.", "Elite direction": "Disciplined heavy infantry or engineering troops accustomed to fortifications, mines and confined terrain.", "Stands out by": "Better helmets, standardized armor pieces, reliable tools, insignia tied to unit rather than flamboyant fantasy armor.", "Why": "Metal access makes durable fittings common, but good steel remains expensive."}, "part": "Power"}, {"id": "pw-arms-northwind", "kind": "troops", "label": "Northwind arms", "status": "No status label", "lane": "northwind", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#northwind", "text": "Elite direction: marines and coastal fighters skilled in shipboard combat, rough weather, landing operations and cold endurance.", "short_text": "Marines for shipboard fights and landings.", "facts": {"Everyday arms": "Utility knives, boat hooks, axes, short spears, bows, boarding weapons.", "Elite direction": "Marines and coastal fighters skilled in shipboard combat, rough weather, landing operations and cold endurance.", "Stands out by": "Waterproofed gear, layered clothing, rope skills, compact shields, superior boots."}, "part": "Power"}, {"id": "pw-arms-greenvale", "kind": "troops", "label": "Greenvale arms", "status": "No status label", "lane": "greenvale", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#greenvale", "text": "Elite direction: mobile local defense, scouts, or disciplined levy cadres whose strength is logistics and local terrain rather than exotic weaponry.", "short_text": "Scouts and levy cadres; strength is logistics.", "facts": {"Everyday arms": "Staff, billhook, sickle, knife, hunting bow, spear.", "Elite direction": "Mobile local defense, scouts, or disciplined levy cadres whose strength is logistics and local terrain rather than exotic weaponry."}, "part": "Power"}, {"id": "pw-arms-highridge", "kind": "troops", "label": "Highridge arms", "status": "No status label", "lane": "highridge", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#highridge", "text": "Elite direction: route guards and high-altitude scouts trained for ambush prevention, escort, signal systems and fighting around narrow passes.", "short_text": "Route guards and high-altitude scouts.", "facts": {"Everyday arms": "Staff, short spear, bow, sling, caravan knife.", "Elite direction": "Route guards and high-altitude scouts trained for ambush prevention, escort, signal systems and fighting around narrow passes."}, "part": "Power"}, {"id": "pw-arms-deepwood", "kind": "troops", "label": "Deepwood arms", "status": "No status label", "lane": "deepwood", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#deepwood", "text": "Elite direction: rangers and wardens who know terrain, tracking, concealment, river crossings and coordinated small-unit fighting.", "short_text": "Rangers and wardens; small-unit forest fighting.", "facts": {"Everyday arms": "Bows, spears, machete- or billhook-like cutting tools, knives, slings.", "Elite direction": "Rangers and wardens who know terrain, tracking, concealment, river crossings and coordinated small-unit fighting.", "Note": "No magical \"silent bows\" are required."}, "part": "Power"}, {"id": "pw-arms-sunplains", "kind": "troops", "label": "Sunplains arms", "status": "No status label", "lane": "sunplains", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#sunplains", "text": "Elite direction: city-state guards, cavalry where terrain and horse culture support it, professional household troops, or disciplined spear formations.", "short_text": "City guards, cavalry, household troops, spear lines.", "facts": {"Everyday arms": "Knives, staffs, short spears, slings, bows, city watch weapons.", "Elite direction": "City-state guards, cavalry where terrain and horse culture support it, professional household troops, or disciplined spear formations."}, "part": "Power"}, {"id": "pw-arms-port", "kind": "troops", "label": "Port arms", "status": "No status label", "lane": "port", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#port", "text": "Port's best forces are likely specialized: harbor watch, customs officers, fire brigades, marine patrols and riot or public-order units, trained for dense urban environments.", "short_text": "Likely specialized: harbor watch, customs, fire brigades, marine patrols.", "facts": {"Elite direction": "Likely specialized: harbor watch, customs officers, fire brigades, marine patrols, riot and public-order units.", "Why": "Their advantage is training for dense urban environments rather than superior weapon technology."}, "part": "Power"}, {"id": "pw-arms-underpass", "kind": "troops", "label": "Underpass arms", "status": "No status label", "lane": "spine", "section": "Arms", "src": "Culture/Weapons-and-Elite-Troops.md#underpass", "text": "Specialized troops use short spears, axes or picks, compact shields, crossbows, helmets, ropes and lamps; long weapons are often impractical.", "short_text": "Short spears, picks, compact shields, ropes and lamps.", "facts": {"Elite direction": "Specialized troops using short spears, axes or picks, compact shields, crossbows, helmets, ropes and lamps.", "Why": "Long weapons are often impractical."}, "part": "Power"}, {"id": "pw-magic", "kind": "overview", "label": "Magic and relics", "status": "Working canon", "lane": "faiths", "section": "Faiths", "src": "Magic.md#the-decision", "text": "Real but deniable: a handful of old community relics seem to do small, moral things, but every effect has an ordinary explanation within reach and the story never confirms it. No spellcasting.", "short_text": "Real but deniable: moral relics, never confirmed.", "facts": {"Principle": "Magic is real but deniable (the author, 2026-09-29). A handful of old relics really do something small and moral, like a lantern that dims when its holder lies, but every effect could have an ordinary explanation, and the story never confirms it.", "Scope": "Relics are kept by communities (temples, shrines, guild halls, villages) and belong to the faith traditions and regions that made them. Earlier notes' examples, Provisional: the Quill of Saint Othriel, whose ink smudges on deceit; the Chalice of Mother Amalthea, whose water turns bitter for anyone withholding care.", "Rule": "No spellcasting; small and moral effects only; always deniable; never confirmed by the narration; never load-bearing for the plot; never industrial. Illusions are legend, creatures are animals, spirits are belief; the earlier notes' mystical armies and forest mages are removed."}, "fact_src": {"Principle": "Magic.md#the-decision", "Scope": "Magic.md#relics", "Rule": "Magic.md#hard-limits"}, "part": "Power"}, {"id": "hi-before", "kind": "overview", "label": "Before the Convergence", "status": "No status label", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#core-rule", "text": "The pre-Convergence world was messy: modern regions shouldn't be projected backward as eternal states with fixed borders. Peace came as a bargain among tired, self-interested powers, not sudden enlightenment.", "short_text": "A messy world of shifting claims; peace came from exhaustion.", "facts": {"Principle": "The pre-Convergence world was messy. Modern regions should not be projected backward as eternal states with fixed borders; the modern labels describe cultural-geographic zones that emerged from many earlier peoples, towns, kingdoms, confederacies, warbands, guild networks and migrations.", "Scope": "Borders were poorly surveyed; control followed roads, rivers, fortresses, mines, fields, harbors and kinship; rulers claimed territory they didn't effectively govern; towns could change allegiance without the countryside; people paid taxes or tribute to several authorities; marriage could shift a valley more permanently than a battle; mercenaries changed sides; famine altered alliances; raids didn't always mean conquest; local elites survived regime changes by changing patrons.", "Why it ended": "Not because everyone became enlightened. Trade losses accumulated; wars repeatedly failed to secure permanent gains; famine and blight exposed interdependence; guilds wanted predictable markets; merchants wanted safe routes; rulers wanted borders recognized; local populations were exhausted; bandits and independent warlords profited from disorder; no major power could impose a durable settlement alone. The Convergence was a bargain among tired, self-interested powers that also happened to create real public benefits.", "Traces": "Modern landscapes should preserve it: ruined towers; roads to vanished markets; duplicate fortifications; abandoned terraces; boundary stones in the wrong kingdom; shrines kept by people now living across the border; towns with two legal traditions; noble claims based on ancient marriages; old canals still controlled under obsolete treaties.", "Rule": "History is messy: temporary victories, reversals, disputed claims, marriages, defections, raids, trade agreements, migrations, local exceptions and contradictory memories. Avoid \"Region A defeated Region B and owned this land until the Convergence.\""}, "fact_src": {"Principle": "History/Pre-Convergence.md#core-rule", "Scope": "History/Pre-Convergence.md#general-pattern", "Why it ended": "History/Pre-Convergence.md#why-the-convergence-became-possible", "Traces": "History/Pre-Convergence.md#material-traces", "Rule": "World-Rules.md#4-history-is-messy"}, "part": "History"}, {"id": "hi-before-ironcrest", "kind": "before", "label": "Ironcrest before the Convergence", "status": "No status label", "lane": "ironcrest", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#ironcrest-predecessor-politics", "text": "Wars over ore rarely produced permanent frontiers: one ruler might seize a mine while losing the road that made it profitable.", "short_text": "Ore wars rarely made lasting frontiers.", "facts": {"Powers": "Mine-holding clans, fortified smith towns, valley lordships, merchant-backed warbands and craft alliances. The region page adds smith-chiefs, mine holders, fortified towns, valley rulers, merchant families and warbands.", "How power worked": "Wars over ore rarely produced permanent frontiers: one ruler might seize a mine while losing the road that made it profitable. Towns changed allegiance through marriage or debt; Greenvale rulers periodically held western lowlands; Ironcrest powers periodically pushed into food-producing country; forest margins changed hands repeatedly.", "What it left": "Remembered as both achievement and warning. Its political culture values reliable agreements partly because its own history shows how ruinous resource warfare can become."}, "fact_src": {"Powers": "History/Pre-Convergence.md#ironcrest-predecessor-politics", "How power worked": "History/Pre-Convergence.md#ironcrest-predecessor-politics", "What it left": "Regions/Ironcrest.md#historical-identity"}, "see": ["Regions/Ironcrest.md#historical-identity"], "part": "History"}, {"id": "hi-before-northwind", "kind": "before", "label": "Northwind before the Convergence", "status": "No status label", "lane": "northwind", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#northwind-predecessor-politics", "text": "Maritime rights overlapped political territory.", "short_text": "Water and access often mattered more than land.", "facts": {"Powers": "Coastal clans, harbor confederacies, island rulers, fishing-right alliances and raiding fleets. The region page adds fishing confederacies, harbor towns, raiding bands and inland chiefs.", "How power worked": "Maritime rights overlapped political territory. Control of water and seasonal access often mattered more than land: a defeated clan could lose a town yet keep fishing from allied harbors, and a border on shore didn't decide who fished a bank or used a winter anchorage.", "What it left": "It explains why modern Northwind politics stay sensitive to access rights, clan obligation, shared rescue, maritime law, and outsiders buying control of harbors."}, "fact_src": {"Powers": "History/Pre-Convergence.md#northwind-predecessor-politics", "How power worked": "History/Pre-Convergence.md#northwind-predecessor-politics", "What it left": "Regions/Northwind.md#historical-identity"}, "see": ["Regions/Northwind.md#historical-identity"], "part": "History"}, {"id": "hi-before-greenvale", "kind": "before", "label": "Greenvale before the Convergence", "status": "No status label", "lane": "greenvale", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#greenvale-predecessor-politics", "text": "Crop failures repeatedly destabilized politics.", "short_text": "Crop failures made it both victim and raider.", "facts": {"Powers": "Estate rulers, village leagues, river towns, grain confederacies and irrigation associations. The region page adds small landholding communities and seed-sharing alliances.", "How power worked": "Crop failures repeatedly destabilized politics. In scarcity Greenvale was both victim and aggressor: its rulers raided neighbors for food, annexed or tried to expand into healthier land, fought internally, and sometimes invited foreign military support.", "What it left": "The Seven-year Blight left traditions of storage, crop diversity, communal aid, and suspicion of concentrated control over seed and grain."}, "fact_src": {"Powers": "History/Pre-Convergence.md#greenvale-predecessor-politics", "How power worked": "History/Pre-Convergence.md#greenvale-predecessor-politics", "What it left": "Regions/Greenvale.md#historical-identity"}, "see": ["Regions/Greenvale.md#historical-identity"], "part": "History"}, {"id": "hi-before-highridge", "kind": "before", "label": "Highridge before the Convergence", "status": "No status label", "lane": "highridge", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#highridge-predecessor-politics", "text": "Power followed route control rather than continuous land.", "short_text": "Power followed routes, not land.", "facts": {"Powers": "Toll lords, caravan families, herding confederacies, fortified pass towns and merchant coalitions. The region page adds pass lords, toll towns and fortress communities.", "How power worked": "Power followed route control rather than continuous land. A ruler could control a pass but not the valley below it, and a merchant league could effectively govern a route crossing several jurisdictions.", "What it left": "The shift from toll warfare toward negotiated passage is one of the foundations of modern Highridge identity."}, "fact_src": {"Powers": "History/Pre-Convergence.md#highridge-predecessor-politics", "How power worked": "History/Pre-Convergence.md#highridge-predecessor-politics", "What it left": "Regions/Highridge-Plateau.md#historical-identity"}, "see": ["Regions/Highridge-Plateau.md#historical-identity"], "part": "History"}, {"id": "hi-before-deepwood", "kind": "before", "label": "Deepwood before the Convergence", "status": "No status label", "lane": "deepwood", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#deepwood-predecessor-politics", "text": "Forest edges expanded and contracted as outsiders cleared land and local groups later reclaimed it.", "short_text": "Forest edges pushed back and reclaimed.", "facts": {"Powers": "Village alliances, forest clans, river settlements, warden networks, religious centers and hunting territories. The region page adds trade settlements and forest-edge petty rulers.", "How power worked": "Forest edges expanded and contracted as outsiders cleared land and local groups later reclaimed it. Outsiders pushed in for farmland, fuel, timber, hunting and roads; Deepwood groups sometimes united against them, sometimes fought each other, and sometimes profited from them."}, "fact_src": {"Powers": "History/Pre-Convergence.md#deepwood-predecessor-politics", "How power worked": "History/Pre-Convergence.md#deepwood-predecessor-politics"}, "see": ["Regions/Deepwood.md#historical-identity"], "part": "History"}, {"id": "hi-before-sunplains", "kind": "before", "label": "Sunplains before the Convergence", "status": "No status label", "lane": "sunplains", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#sunplains-predecessor-politics", "text": "Waterworks created unusual political maps: a city could control a canal crossing another ruler's land.", "short_text": "Borders often followed canals; betrayal was normal.", "facts": {"Powers": "City-states, irrigation leagues, merchant ports, noble estates and rural client territories. The region page adds port towns, noble houses and merchant dynasties.", "How power worked": "Waterworks created unusual political maps: a city could control a canal crossing another ruler's land. Wars could be fought over canal gates, springs, river diversions, orchard land, ports and trade rights; temporary alliances were common and betrayal was normal."}, "fact_src": {"Powers": "History/Pre-Convergence.md#sunplains-predecessor-politics", "How power worked": "History/Pre-Convergence.md#sunplains-predecessor-politics"}, "see": ["Regions/Sunplains.md#historical-identity"], "part": "History"}, {"id": "hi-before-port", "kind": "origin", "label": "How Port became central", "status": "Working canon", "lane": "port", "section": "Origins", "src": "Places/Port.md#why-port-became-central", "text": "Port likely began at a sheltered deep-water harbor, estuary or strait where several trade systems met; the key historical change was institutional, as merchants came to trust it.", "short_text": "A good harbor, then trust: contracts, storage, credit.", "facts": {"How it happened": "The key historical change was institutional. Merchants began trusting Port because contracts were enforced, foreign merchants could own or lease warehouses, weights and measures were standardized, currencies could be exchanged, disputes could be arbitrated, neutral storage existed, ships could be repaired, creditors and insurers had offices there, and foreign communities were protected. Once those systems existed, trade attracted more trade.", "Early advantages": "It likely began at a sheltered deep-water harbor, estuary or strait where several trade systems naturally met. Early advantages may have included reliable anchorage, access to inland rivers or roads, nearby fresh water and food, a position on both northern and southern sea routes, and a location hard for any one kingdom to monopolize without alarming the others."}, "part": "History"}, {"id": "hi-ep-ore-scar-strife", "kind": "episode", "label": "Ore Scar Strife", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-lowland-famine-raids", "kind": "episode", "label": "Lowland Famine Raids", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-coldwave-incursions", "kind": "episode", "label": "Coldwave Incursions", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-ridge-pass-toll-wars", "kind": "episode", "label": "Ridge Pass Toll Wars", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-orchard-lord-feuds", "kind": "episode", "label": "Orchard-Lord Feuds", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-deepwood-edge-skirmishes", "kind": "episode", "label": "Deepwood Edge Skirmishes", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-iron-field-conquest", "kind": "episode", "label": "Iron-Field Conquest", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-great-coastal-skirmish", "kind": "episode", "label": "Great Coastal Skirmish", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-ep-highridge-consolidation-war", "kind": "episode", "label": "Highridge Consolidation War", "status": "Provisional", "lane": "history", "section": "Before the Convergence", "src": "History/Pre-Convergence.md#working-conflict-traditions", "text": "A conflict named in earlier brainstorming; a provisional historical episode, not yet hard canon.", "short_text": "Provisional episode from earlier notes.", "facts": {"Note": "Useful as a provisional historical episode, not yet hard canon. The final history should revise these into overlapping campaigns with multiple participants, reversals and local consequences rather than clean one-on-one wars."}, "minor": true, "part": "History"}, {"id": "hi-convergence", "kind": "event", "label": "The Convergence", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#the-convergence", "text": "The historic settlement that turned fluid pre-modern frontiers into a more predictable political and economic order. It didn't create the regions from nothing; it recognized, regularized and froze many compromises that had already emerged from centuries of conflict.", "short_text": "The settlement that froze many old compromises.", "facts": {"What it was": "The historic settlement that transformed fluid pre-modern frontiers into a more predictable political and economic order. It recognized, regularized and froze many compromises that had already emerged from centuries of conflict.", "Why": "Trade routes were increasingly dangerous; several resource disputes had become economically pointless; food crises showed cross-regional dependence; piracy and banditry flourished; guilds and merchants wanted predictable law; rulers wanted recognition of claims they could actually hold.", "Where": "Highridge is the strongest candidate for the principal congress (geographic accessibility, trade culture, existing arbitration traditions, interest in keeping routes open). Port likely played an important role in maritime and commercial provisions even if the principal meetings were inland.", "What it didn't solve": "Class conflict, religious disagreement, guild rivalry, crime, competing interpretations of borders, local land disputes, old dynastic claims, unequal wealth, resentment toward outside influence.", "Cultural effect": "Paradoxically it made regional identities stronger: governments standardized law, schools and religious institutions spread regional norms, guilds organized regionally, elites cultivated shared histories, and old mixed frontier identities were sometimes suppressed. Some traditions now presented as ancient \"Ironcrest\" or \"Greenvale\" culture may be post-Convergence standardizations of more diverse older practices."}, "fact_src": {"What it was": "History/The-Convergence.md#status", "Why": "History/The-Convergence.md#why-it-happened", "Where": "History/The-Convergence.md#negotiation", "What it didn't solve": "History/The-Convergence.md#what-it-did-not-solve", "Cultural effect": "History/The-Convergence.md#cultural-effect"}, "part": "History"}, {"id": "hi-prov-border-recognition", "kind": "provision", "label": "Border recognition", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#border-recognition", "text": "Likely part of the settlement: not every line was measured precisely. The treaty could define boundaries by rivers, ridges, roads, settlements, watersheds, named stones and old forts, which creates later ambiguity.", "short_text": "Likely: borders by rivers, ridges and stones: later ambiguity.", "facts": {"What it did": "Not every line was measured precisely. The treaty could define boundaries by rivers, ridges, roads, settlements, watersheds, named stones and old forts, which creates later ambiguity.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-prov-trade-guarantees", "kind": "provision", "label": "Trade guarantees", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#trade-guarantees", "text": "Likely part of the settlement: certain categories of goods gained protected movement.", "short_text": "Likely: protected movement for some goods.", "facts": {"What it did": "Certain categories of goods gained protected movement.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-prov-route-rules", "kind": "provision", "label": "Route rules", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#route-rules", "text": "Likely part of the settlement: passes, major roads, and perhaps sections of The Underpass received agreed access rules.", "short_text": "Likely: agreed access to passes, roads, perhaps the Underpass.", "facts": {"What it did": "Passes, major roads, and perhaps sections of The Underpass received agreed access rules.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-prov-maritime-rules", "kind": "provision", "label": "Maritime rules", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#maritime-rules", "text": "Likely part of the settlement: neutral shipping and Port access became harder for one kingdom to monopolize.", "short_text": "Likely: shipping and Port access harder to monopolize.", "facts": {"What it did": "Neutral shipping and Port access became harder for one kingdom to monopolize.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-prov-arbitration", "kind": "provision", "label": "Arbitration", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#arbitration", "text": "Likely part of the settlement: some disputes could be taken to agreed courts or forums rather than immediately fought.", "short_text": "Likely: agreed courts instead of immediate war.", "facts": {"What it did": "Some disputes could be taken to agreed courts or forums rather than immediately fought.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-prov-neutral-port", "kind": "provision", "label": "Neutral Port", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#neutral-port", "text": "Likely part of the settlement: port's special status was formalized or significantly strengthened.", "short_text": "Likely: port's special status formalized or strengthened.", "facts": {"What it did": "Port's special status was formalized or significantly strengthened.", "Certainty": "The settlement likely included it; details are still developing."}, "part": "History"}, {"id": "hi-council-rise", "kind": "event", "label": "The Council's rise", "status": "Established concept (details still developing)", "lane": "history", "section": "The Convergence", "src": "History/The-Convergence.md#the-council-and-the-convergence", "text": "The Council likely emerged through the institutions the Convergence created rather than appearing fully formed beforehand. In \"a strong version of the history\", families who helped finance stabilization became a secret coordinating body that came to believe it was keeping the Convergence alive.", "short_text": "Likely grew out of the Convergence; a strong version, not settled.", "facts": {"What it was": "The Council likely emerged through the institutions created by the Convergence rather than appearing fully formed beforehand.", "Why": "A strong version of the history (not the only one): wealthy families helped finance stabilization; rulers increasingly depended on their grain stores, credit, ships, roads and information; informal coordination among these families prevented crises; coordination became institutional; secrecy grew because open economic rule would provoke resistance; the Council came to believe it was the hidden mechanism keeping the Convergence alive.", "Cultural effect": "It gives the Council a plausible historical reason to think its manipulation is necessary."}, "fact_src": {"What it was": "History/The-Convergence.md#the-council-and-the-convergence", "Why": "History/The-Convergence.md#the-council-and-the-convergence", "Cultural effect": "History/The-Convergence.md#the-council-and-the-convergence"}, "part": "History"}, {"id": "hi-memory", "kind": "overview", "label": "Contested memory", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#purpose", "text": "People don't inherit one neutral history. The same old campaign can survive as a patriotic victory in one region, an atrocity story in another, a family migration story at the border, a footnote in a Highridge archive, a legal precedent in a Port court, or a song no historian accepts literally.", "short_text": "One campaign, many histories.", "facts": {"Principle": "People do not inherit one neutral history. These disagreements create useful \"breath\" without requiring a hidden conspiracy.", "Scope": "The same old campaign may survive as a patriotic victory in one region, an atrocity story in another, a family migration story at the border, a footnote in a Highridge archive, a legal precedent in a Port court, or a song whose details no historian accepts literally.", "Rule": "Identify who is telling the story; separate the event from the later label; allow local exceptions and contradictory evidence; prefer \"my grandfather called it…\" over omniscient exposition; let ruins, treaties, family records and place names disagree with popular stories. A remembered history can be emotionally true to a community without being an objective account."}, "fact_src": {"Principle": "History/Contested-Memory.md#purpose", "Scope": "History/Contested-Memory.md#purpose", "Rule": "History/Contested-Memory.md#writing-rule"}, "part": "History"}, {"id": "hi-mem-ember-wars", "kind": "memory", "label": "The Ember Wars / The Burning Years", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "text": "A recurring Greenvale memory of Ironcrest-linked expansion, logging, burned settlements and disputed border land.", "short_text": "Greenvale's memory of burned orchards; Ironcrest's of expansion.", "facts": {"What's remembered": "A recurring Greenvale memory of Ironcrest-linked expansion, logging, burned settlements and disputed border land.", "Caution": "Treat the label as a later cultural shorthand until the actual campaigns are mapped."}, "part": "History"}, {"id": "hi-mem-salted-coast", "kind": "memory", "label": "The Salted Coast Disputes", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "text": "Northwind and Sunplains traditions remember old violence over fishing waters, ports and maritime access.", "short_text": "Old violence over fishing waters and ports.", "facts": {"What's remembered": "Northwind and Sunplains traditions remember old violence over fishing waters, ports and maritime access.", "Caution": "Don't assume this was one continuous war or that modern regional governments existed in their current form."}, "part": "History"}, {"id": "hi-mem-timber-tithes", "kind": "memory", "label": "The Timber Tithes / Deepwood closure traditions", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "text": "Deepwood memory holds older stories of outside extraction pushing too far into forests and sacred or protected areas; outsiders may remember the same period as sudden Deepwood violence.", "short_text": "Extraction pushed too far, or Deepwood violence.", "facts": {"What's remembered": "Deepwood memory holds older stories of outside extraction pushing too far into forests and sacred or protected areas; outsiders may remember the same period as sudden Deepwood violence.", "Caution": "The event should remain entangled with local factions, trade partners and ecological conditions.", "Story use": "A strong candidate for explaining later suspicion around logging rights."}, "part": "History"}, {"id": "hi-mem-port-seizure", "kind": "memory", "label": "The Port Seizure", "status": "Provisional", "lane": "history", "section": "Contested memory", "src": "History/Contested-Memory.md#the-port-seizure", "text": "One uploaded tradition proposed a period when Northwind interests controlled Port before coalition pressure produced withdrawal and neutral status.", "short_text": "Did Northwind once hold Port? Not settled.", "facts": {"What's remembered": "One uploaded tradition proposed a period when Northwind interests controlled Port before coalition pressure produced withdrawal and neutral status.", "Caution": "Not settled chronology."}, "part": "History"}, {"id": "hi-mem-blight", "kind": "memory", "label": "The Seven-year Blight", "status": "Working canon", "lane": "greenvale", "section": "Memory", "src": "Regions/Greenvale.md#historical-identity", "text": "A prolonged crop crisis, whether exactly seven years or later mythologized, that helped create Greenvale traditions of storage, crop diversity, communal aid, and suspicion of concentrated control over seed and grain.", "short_text": "A long crop crisis, maybe mythologized; why Greenvale stores seed.", "facts": {"What's remembered": "A prolonged crop crisis that helped create traditions of storage, crop diversity, communal aid, and suspicion of concentrated control over seed and grain.", "Caution": "An important working historical memory: whether it lasted exactly seven years or was later mythologized is open."}, "part": "History"}, {"id": "hi-mem-silence", "kind": "memory", "label": "The Ages of Silence", "status": "Working canon", "lane": "deepwood", "section": "Memory", "src": "Regions/Deepwood.md#historical-identity", "text": "A remembered Deepwood period that should stay partly historical and partly religious: perhaps ecological collapse, depopulation, warfare or disease, later interp

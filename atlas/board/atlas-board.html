d-Thought.md#language-families"}, "part": "Culture"}, {"id": "lang-oldspine", "kind": "language", "label": "Old Spine speech", "status": "Working canon", "lane": "spine", "section": "Languages", "src": "Culture/Language-and-Thought.md#language-families", "text": "An older language from before the present families, surviving only in place names along The Spine.", "short_text": "An older substrate.", "facts": {"Family": "none (an older substrate)", "Where": "only in place names along The Spine", "Intelligibility": "Nobody speaks it.", "Note": "Nobody speaks it now. It survives in mountain, pass, spring and Underpass names that no living language can explain, and in names each side of a border translates differently."}, "fact_src": {"Family": "Culture/Language-and-Thought.md#language-families", "Where": "Culture/Language-and-Thought.md#language-families", "Intelligibility": "Culture/Language-and-Thought.md#language-families", "Note": "Culture/Language-and-Thought.md#language-families"}, "part": "Culture"}, {"id": "ironcrest-food", "kind": "cuisine", "label": "Ironcrest cuisine", "status": "No status label", "lane": "ironcrest", "section": "Cuisine", "src": "Culture/Food.md#ironcrest", "text": "Hardy grains, roots, legumes, dairy, livestock and mushrooms, with orchard fruit in lower country and imported Greenvale grain. The recipe book's dishes are strongest in mining, smithing and upland working communities, but the region isn't only \"forge cuisine\".", "short_text": "Filling, durable working food: dense grains, smoke, browning, pickles.", "facts": {"Staples": "Barley, oats and other hardy grains; roots; legumes; dairy; mountain or valley livestock; mushrooms; orchard fruit in lower country; imported Greenvale grain.", "Techniques": "Stewing, baking, roasting, pickling, smoking, drying. The provisional recipe book adds heavy pots near hearths, kilns or forge-adjacent fires; roasting beside embers rather than in fuel meant for metalworking; dense breads on heated stones, griddles or lidded pots; hard browning; long simmering that can continue while people work.", "Everyday meals": "Breakfast: thick grain porridge with milk, cheese or leftovers; flatbread with onions, curds or preserves. Midday: filled breads; bean or root stew; cheese, pickles, cold meat. Dinner: grain, legumes and meat when affordable; roasted roots; soups thickened with bread.", "Celebrations": "Large roast animals or meat pies; sweetened breads; imported fruit and spices as status goods.", "Drinks": "Dark ales, small beer, cider in lower valleys, grain spirits in some districts. (The region page: plausible, \"but no single beverage defines the region\".)", "Cooking bias": "Filling, durable food; smoke, browning, pickling, dense grains and preserved components.", "Class and variation": "Workers favor portable, filling food; towns have breads, stews, roasted roots, sausages, cheeses, pickles and fried market foods; elites have greater access to imported spices, fruit, wine and coastal foods.", "Avoid": "Reducing the region to \"forge cuisine\": lower valleys, wealthier households, religious communities and trade towns can eat very differently."}, "fact_src": {"Staples": "Culture/Food.md#ironcrest", "Techniques": "Culture/Food.md#ironcrest", "Everyday meals": "Culture/Food.md#ironcrest", "Celebrations": "Culture/Food.md#ironcrest", "Drinks": "Culture/Food.md#ironcrest", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Regions/Ironcrest.md#food", "Avoid": "Culture/Recipes/Ironcrest.md#status"}, "see": ["Culture/Recipes/Ironcrest.md", "Regions/Ironcrest.md#food"], "part": "Food"}, {"id": "northwind-food", "kind": "cuisine", "label": "Northwind cuisine", "status": "No status label", "lane": "northwind", "section": "Cuisine", "src": "Culture/Food.md#northwind", "text": "Preservation first: fish and shellfish, sea greens, roots, hardy grains, dairy in pastoral zones, berries and preserved meat, dried, smoked, salted, fermented, pickled and cold-stored. It should show both scarcity management and trade.", "short_text": "Preservation first: brine, smoke, ferment, cold storage; not only fish.", "facts": {"Staples": "Fish and shellfish; sea greens; roots; hardy grains; dairy in pastoral zones; berries; preserved meat.", "Techniques": "Drying, smoking, salting, fermentation, pickling, cold storage. The provisional recipe book adds cold and warm smoking, drying in wind or protected racks, root-cellar and ice-cellar storage, all-day hearth pots, and ovens heated for both food and household warmth.", "Everyday meals": "Breakfast: porridge with smoked fish; rye or barley cakes; sour milk. Lunch: dried fish, broth, flatbread, pickles. Dinner: fish soups; shellfish pots; root dishes; dairy and grain where available.", "Celebrations": "Shared catches; rich stews; imported flour and sugar used for special pastries.", "Drinks": "Grain ales, berry ferments, honey drinks, imported spirits. (The region page: alcohol \"can include\" these.)", "Cooking bias": "Preservation first; brine, smoke, fermentation, cold-storage traditions, berries and sea or coastal ingredients.", "Class and variation": "Should show both scarcity management and trade; foods may include imported Greenvale flour and Sunplains oils or fruit in wealthier ports.", "Avoid": "Making it only fish: inland herding, dairy, grain, berries and preserved meat should stay visible."}, "fact_src": {"Staples": "Culture/Food.md#northwind", "Techniques": "Culture/Food.md#northwind", "Everyday meals": "Culture/Food.md#northwind", "Celebrations": "Culture/Food.md#northwind", "Drinks": "Culture/Food.md#northwind", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Regions/Northwind.md#food", "Avoid": "Culture/Recipes/Northwind.md#status"}, "see": ["Culture/Recipes/Northwind.md", "Regions/Northwind.md#food"], "part": "Food"}, {"id": "greenvale-food", "kind": "cuisine", "label": "Greenvale cuisine", "status": "No status label", "lane": "greenvale", "section": "Cuisine", "src": "Culture/Food.md#greenvale", "text": "The broadest everyday food base in the setting: grains, beans, vegetables, dairy, eggs, poultry, orchard fruit and herbs; the provisional recipe book builds it around communal ovens and shared pots. Abundance means diversity, not permanent plenty.", "short_text": "The broadest food base: grain, dairy, orchard fruit, communal ovens.", "facts": {"Staples": "Extremely broad: wheat, barley and other grains; beans; peas; vegetables; dairy; eggs; poultry; pork, goat or sheep depending on district; orchard fruit; herbs.", "Techniques": "From the provisional recipe book: Communal stone or brick ovens; farmhouse hearth stewing; fruitwood roasting; dairy culturing; pickling and preserving; cellar storage; grain fermentation; leftovers used across several meals.", "Everyday meals": "Breakfast: bread, cheese, eggs; porridge; fruit preserves. Lunch: soups; bean dishes; filled breads; cold farm meals. Dinner: grain or dumplings; vegetables; meat where affordable; sauces of herbs, dairy, fruit or vinegar. Snacks: hand pies; toasted grains and nuts; fresh fruit; cheese.", "Celebrations": "Enormous seasonal variety; communal baked goods; preserved foods opened from previous harvests; first-fruit and first-grain rites. The region page adds: celebrations center on abundance, storage, first harvests, seed exchange, and survival after bad years.", "Drinks": "Cider, ale, fruit wine, grain spirits. (The region page: \"plausible\".)", "Cooking bias": "Abundance and sharing; dairy, orchard fruit, grains, garden herbs, baked and communal foods.", "Class and variation": "Class and season matter greatly.", "Avoid": "Treating abundance as permanent plenty; it means diversity."}, "fact_src": {"Staples": "Culture/Food.md#greenvale", "Techniques": "Culture/Recipes/Greenvale.md#method-profile", "Everyday meals": "Culture/Food.md#greenvale", "Celebrations": "Culture/Food.md#greenvale", "Drinks": "Culture/Food.md#greenvale", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Regions/Greenvale.md#food", "Avoid": "Culture/Recipes/Greenvale.md#status"}, "see": ["Culture/Recipes/Greenvale.md", "Regions/Greenvale.md#food"], "part": "Food"}, {"id": "highridge-food", "kind": "cuisine", "label": "Highridge cuisine", "status": "No status label", "lane": "highridge", "section": "Cuisine", "src": "Culture/Food.md#highridge", "text": "Unusually mixed because caravans bring ingredients: hardy grains, legumes, dairy, herd animals, dried meat and roots at home, while markets introduce dried fruit, spices, oils, noodles, rice, wine, fish and sweets from elsewhere.", "short_text": "Portable and layered: dried goods, dumplings, breads, trade spice.", "facts": {"Staples": "Hardy grains; legumes; dairy; goat, sheep or yak-like animals; dried meat; roots; trade goods.", "Techniques": "From the provisional recipe book: Portable charcoal or dung-fueled braziers where wood is scarce; clay or stone ovens for flatbreads; steaming in stacked vessels; boiling and braising in heavy travel pots; drying meat, fruit and dairy for caravans; combining local staples with whatever trade goods are available.", "Everyday meals": "Breakfast: flatbread with butter or curd; grain porridge; tea or herbal infusion. Lunch: dumplings; noodles in market towns; meat or lentil stews; dried fruit and nuts. Dinner: thick soups; roasted or boiled meats; market dishes with foreign spices. Street food: skewers, filled breads, dumplings, roasted nuts, tea stalls.", "Celebrations": "Food intentionally assembled from multiple regions during caravan fairs.", "Drinks": "Grain beer; fermented dairy drinks in some communities; imported wines; herbal spirits.", "Cooking bias": "Portable and layered; dried goods, dairy, dumplings and breads, trade spices, market combinations.", "Class and variation": "There should be strong differences between local household food and cosmopolitan market food.", "Avoid": "Forgetting that a trade crossroads still has local food. Imported spice should vary by wealth, season and route access."}, "fact_src": {"Staples": "Culture/Food.md#highridge", "Techniques": "Culture/Recipes/Highridge-Plateau.md#method-profile", "Everyday meals": "Culture/Food.md#highridge", "Celebrations": "Culture/Food.md#highridge", "Drinks": "Culture/Food.md#highridge", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Regions/Highridge-Plateau.md#food", "Avoid": "Culture/Recipes/Highridge-Plateau.md#status"}, "see": ["Culture/Recipes/Highridge-Plateau.md", "Regions/Highridge-Plateau.md#food"], "part": "Food"}, {"id": "deepwood-food", "kind": "cuisine", "label": "Deepwood cuisine", "status": "No status label", "lane": "deepwood", "section": "Cuisine", "src": "Culture/Food.md#deepwood", "text": "More cultivated food than outsiders assume: grains and tubers from clearings alongside nuts, mushrooms, fish, game, greens, berries and honey, with trade grain and salt. Foraging supplements agriculture rather than replacing it everywhere.", "short_text": "Seasonality and restraint: fungi, nuts, roots, low-ember pots.", "facts": {"Staples": "Cultivated grains and tubers in clearings; nuts; mushrooms; greens; fish; game; domestic animals near settlements; berries; honey; trade grain and salt.", "Techniques": "From the provisional recipe book: Low-ember earthen-pot cooking; leaf wrapping; hot-stone and pit steaming; clay-sealed roasting; mushroom and nut broths; fermentation; drying and smoking in moderation; seasonal forest foods rather than constant mystical ingredients.", "Everyday meals": "Breakfast: root cakes; broth; grain packets steamed in leaves; fruit or nut paste. Lunch: smoked meat or fish; greens; breads of grain, nut or tuber flour. Dinner: mixed stews; roasted fish or game; mushrooms and vegetables; fermented condiments.", "Celebrations": "Seasonal foraging and harvest combinations; highly valued rare forest ingredients.", "Drinks": "Fruit ferments, honey drinks, grain beer, herbal infusions.", "Cooking bias": "Seasonality and restraint; fungi, nuts, roots, herbs, fermentation, forest and river foods alongside cultivation.", "Avoid": "Treating it as purely foraged: settlements cultivate grains, tubers and domestic foods in clearings and trade for salt and staples."}, "fact_src": {"Staples": "Culture/Food.md#deepwood", "Techniques": "Culture/Recipes/Deepwood.md#method-profile", "Everyday meals": "Culture/Food.md#deepwood", "Celebrations": "Culture/Food.md#deepwood", "Drinks": "Culture/Food.md#deepwood", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Avoid": "Culture/Recipes/Deepwood.md#status"}, "see": ["Culture/Recipes/Deepwood.md", "Regions/Deepwood.md#food"], "part": "Food"}, {"id": "sunplains-food", "kind": "cuisine", "label": "Sunplains cuisine", "status": "No status label", "lane": "sunplains", "section": "Cuisine", "src": "Culture/Food.md#sunplains", "text": "Diverse and bright: breads, pulses, vegetables, fruit, nuts, oils, cheeses and herd meat, with fish on the coasts and spices from trade. It varies by city, coast, irrigation district, faith and class, and cities use their own dishes as civic identity.", "short_text": "Brightness and balance: oils, fruit acids, pulses, clay pots, pastry.", "facts": {"Staples": "Wheat and barley; pulses; vegetables; fruit; nuts; oils; dairy; lamb, goat and poultry; coastal fish; dried fruit; spices from trade.", "Techniques": "From the provisional recipe book: Clay-pot braising; griddle and stone-oven flatbreads; open-air charcoal or orchard-wood grilling; oil-based cooking; sun drying; fruit, herb and vinegar sauces; pulses and grain dishes; layered and syruped festival pastry.", "Everyday meals": "Breakfast: flatbread, oil, cheese; fruit; yogurt or curds; tea. Lunch: lentil or chickpea dishes; grain salads; stuffed breads; grilled vegetables. Dinner: slow-cooked meat or vegetable pots; pilafs; fish in coastal areas; bread with many shared dishes. Snacks: nuts; dates, figs or similar fruit; fried or filled breads; honey pastries.", "Celebrations": "City-specific dishes used as civic identity.", "Drinks": "Wine in communities that permit it; beer; fruit ferments; distilled drinks in some areas; nonalcoholic mint, herb and fruit drinks.", "Cooking bias": "Brightness and balance; oils, fruit acids, pulses, grains, herbs, nuts, irrigated and orchard foods, and civic variation.", "Class and variation": "Varies by city, coast, irrigation district, faith and class; \"refined\" food is not the diet of every household.", "Avoid": "Making all Sunplains food uniformly \"Mediterranean.\""}, "fact_src": {"Staples": "Culture/Food.md#sunplains", "Techniques": "Culture/Recipes/Sunplains.md#method-profile", "Everyday meals": "Culture/Food.md#sunplains", "Celebrations": "Culture/Food.md#sunplains", "Drinks": "Culture/Food.md#sunplains", "Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Culture/Recipes/Sunplains.md#status", "Avoid": "Regions/Sunplains.md#food"}, "see": ["Culture/Recipes/Sunplains.md", "Regions/Sunplains.md#food"], "part": "Food"}, {"id": "port-food", "kind": "cuisine", "label": "Port cuisine", "status": "No status label", "lane": "port", "section": "Cuisine", "src": "Culture/Food.md#port", "text": "Not merely \"fusion.\" Port develops dock-worker food, preserved ship food, wealthy merchant cuisine, immigrant neighborhood dishes, street food for travelers and religiously specific kitchens. Borrowing is normal.", "short_text": "Many kitchens at once: dock, ship, merchant, neighborhood, street.", "facts": {"Cooking bias": "Borrowing as normal; ship food, immigrant kitchens, dock food, imported condiments and rapid hybridization.", "Class and variation": "Dock-worker food; preserved ship food; wealthy merchant cuisine; immigrant neighborhood dishes; street foods designed for travelers; religiously specific kitchens.", "Avoid": "Calling it merely \"fusion.\""}, "fact_src": {"Cooking bias": "Culture/Food-Diaspora-and-Adaptation.md#regional-cooking-biases", "Class and variation": "Culture/Food.md#port", "Avoid": "Culture/Food.md#port"}, "part": "Food"}, {"id": "borderlands-food", "kind": "cuisine", "label": "Border cuisine", "status": "No status label", "lane": "borderlands", "section": "Cuisine", "src": "Culture/Food.md#border-cuisine", "text": "Often the clearest sign of cultural blending, because ingredients and techniques combine faster than political identities. A mature border cuisine should eventually stop being described locally as \"fusion\": children born there know these as ordinary town food, and older recipes may survive only in names, preparation rituals or arguments about which side \"really\" invented them.", "short_text": "Where ingredients and techniques mix faster than identities.", "facts": {"Avoid": "Food that tastes like two flags on one plate: the strongest border dishes solve a local problem using habits inherited from both sides. Also avoid forcing a map fact: exact borders remain partly unresolved, and where adjacency changes a border dish should be treated as a trade-route or diaspora dish."}, "fact_src": {"Avoid": "Culture/Recipes/Border-Fusions.md#status"}, "see": ["Culture/Recipes/Border-Fusions.md"], "skip_rows": ["Border dishes", "Blends with", "Imports from"], "part": "Food"}, {"id": "d-miners-gruel", "kind": "dish", "label": "Miner's Gruel", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#1-miners-gruel", "text": "Cheap grain, scraps and leftovers become a hot meal that can be kept going with little attention.", "short_text": "A cheap grain pot kept going beside the work fire.", "facts": {"Why it exists": "Cheap grain, scraps and leftovers become a hot meal that can be kept going with little attention.", "Key ingredients": "Cracked barley, oats or another hardy grain; water, thin broth or whey; onion or leek; a little smoked cheese, cured pork, beans or yesterday's meat if available; salt and a pepper-like local pungency; optional malt or dark fruit syrup in households that favor sweet-salty breakfasts.", "Method": "Grain is soaked when fuel is scarce, then simmered in a heavy pot near a steady work fire, with scraps in early and cheese or cured meat near the end, thinned through the morning. Workers eat from bowls or carry a thick portion wrapped in bread.", "Variations": "Poorer versions are grain and onion; better-off crews add dairy, meat and pickles."}, "part": "Food"}, {"id": "d-smoked-ember-stew", "kind": "dish", "label": "Smoked Ember Stew", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#2-smoked-ember-stew", "text": "Tough preserved meat becomes tender during a workday without needing a dedicated cook.", "short_text": "Preserved meat left on low heat through the workday.", "facts": {"Why it exists": "Tough preserved meat becomes tender during a workday without needing a dedicated cook.", "Key ingredients": "Salted or smoked goat, mutton, beef-like livestock or game; onion and garlic-like alliums; roots; dried mushrooms; hardy grain or beans; broth, small beer or water; highland aromatics; vinegar or sour ale to finish.", "Method": "Meat is browned in rendered fat in an iron cauldron, the browned residue is loosened with liquid, mushrooms and grain go in, and the pot sits on low residual heat for several hours. Roots go in later so they stay whole, and sour vinegar or ale cuts the fat before serving.", "Real-world inspiration": "Working-class barley stews, goulash-like braises and northern European meat pots."}, "part": "Food"}, {"id": "d-ashen-stone-loaf", "kind": "dish", "label": "Ashen Stone Loaf", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#3-ashen-stone-loaf", "text": "A durable sour loaf suited to upland grain, irregular ovens and work travel.", "short_text": "A dark, dry sour loaf that keeps for days.", "facts": {"Why it exists": "A durable sour loaf suited to upland grain, irregular ovens and work travel.", "Key ingredients": "Rye-like and barley flour; sourdough starter; water; salt; malted or toasted grain; lard, tallow or butter when available.", "Method": "A stiff dough ferments in a warm corner. Small households cook flat rounds on a heated stone or iron plate; larger loaves bake in a lidded pot among cooling embers, dark and dry enough to keep several days. Stale bread thickens soup, is fried, or is soaked in broth.", "Note": "\"Ashen\" describes color and cooking environment; edible ash or coal is not required."}, "part": "Food"}, {"id": "d-coal-roasted-boar-with-root-mash", "kind": "dish", "label": "Coal-Roasted Boar with Root Mash", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#4-coal-roasted-boar-with-root-mash", "text": "A feast dish using the region's love of intense browning without pretending industrial fuel is a seasoning.", "short_text": "A feast roast, browned hard over clean embers.", "facts": {"Why it exists": "A feast dish using the region's love of intense browning without pretending industrial fuel is a seasoning.", "Key ingredients": "Boar, goat or pork-like shoulder; salt; rock thyme; crushed aromatic seed; onions; potatoes, turnips, rutabaga or parsnips; rendered fat; dark ale or broth.", "Method": "Meat is salted the day before and roasts slowly in a covered iron pan above or beside clean charcoal or hardwood embers, never buried in raw coal; the lid comes off near the end so the outside darkens. Roots are cooked separately and mashed with fat and roasting juices.", "Serving": "Large pieces are carved onto bread or root mash at communal tables."}, "part": "Food"}, {"id": "d-smoked-ash-marrow-broth", "kind": "dish", "label": "Smoked Ash-Marrow Broth", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#5-smoked-ash-marrow-broth", "text": "Bones, trimmings and stale bread become valuable calories.", "short_text": "Roasted bones simmered all day into a meal.", "facts": {"Why it exists": "Bones, trimmings and stale bread become valuable calories.", "Key ingredients": "Roasted marrow or joint bones; charred onion; dried mushroom; thyme or sage; water; salt; stale bread or grain.", "Method": "Bones are roasted by the hearth, then barely simmered for much of the day with water, onion and mushrooms. Laboring households don't skim all the fat, and bread crumbs or cooked grain turn it into a meal."}, "part": "Food"}, {"id": "d-forge-fired-sausages", "kind": "dish", "label": "Forge-Fired Sausages", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#6-forge-fired-sausages", "text": "Sausage turns scraps into portable, preservable protein.", "short_text": "Scraps turned into portable, smokable sausage.", "facts": {"Why it exists": "Sausage turns scraps into portable, preservable protein.", "Key ingredients": "Chopped goat, pork-like livestock or game; fat; salt; dried allium; rock thyme; pepper-like pungent seed; cleaned casing.", "Method": "Meat and fat are chopped rather than finely ground in poorer districts, seasoned, and poached or gently heated first. Some are eaten fresh; others hang in a smokehouse. Work stalls split smoked sausages and sear them on iron plates."}, "part": "Food"}, {"id": "d-smoked-meat-and-root-pie", "kind": "dish", "label": "Smoked Meat and Root Pie", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#7-smoked-meat-and-root-pie", "text": "A portable meal for shifts, travel and winter storage.", "short_text": "A sturdy hand pie for shifts, travel and winter.", "facts": {"Why it exists": "A portable meal for shifts, travel and winter storage.", "Key ingredients": "Coarse grain pastry; smoked meat; cooked roots; onion; thick broth or gravy; hard cheese if available.", "Method": "Leftover stew meat and roots are bound with reduced broth, shaped into thick hand pies and baked in a communal oven or lidded iron pan. The crust is meant to be sturdy, not delicate."}, "part": "Food"}, {"id": "d-ember-nuts", "kind": "dish", "label": "Ember Nuts", "status": "Provisional", "lane": "ironcrest", "section": "Dishes", "src": "Culture/Recipes/Ironcrest.md#8-ember-nuts", "text": "Roasted in a heavy pan near the hearth and tossed with salt, toasted grain dust and fat.", "short_text": "Hearth-roasted street nuts.", "facts": {"Key ingredients": "Nuts; salt; toasted grain dust; a little rendered fat.", "Method": "Roasted in a heavy pan near the hearth and tossed with salt, toasted grain dust and fat.", "Variations": "Imported spice makes this ordinary street food noticeably more expensive."}, "part": "Food"}, {"id": "d-salt-fish-and-barley-porridge", "kind": "dish", "label": "Salt-Fish and Barley Porridge", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#1-salt-fish-and-barley-porridge", "text": "Preserved fish stretches a grain breakfast through winter.", "short_text": "A winter breakfast stretched with preserved fish.", "facts": {"Why it exists": "Preserved fish stretches a grain breakfast through winter.", "Key ingredients": "Barley or oats; water or light fish broth; soaked salt fish; leek or onion; root vegetable; dill-like herb; rendered animal fat or butter.", "Method": "Salt fish is soaked and rinsed. Grain simmers until nearly soft, roots and alliums go in, and the fish is added near the end so it stays in flakes, with a little fat stirred through."}, "part": "Food"}, {"id": "d-hearthfire-fish-and-root-bake", "kind": "dish", "label": "Hearthfire Fish and Root Bake", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#2-hearthfire-fish-and-root-bake", "text": "The evening meal uses the same masonry hearth that warms the house.", "short_text": "Supper baked in the house-warming hearth's falling heat.", "facts": {"Why it exists": "The evening meal uses the same masonry hearth that warms the house.", "Key ingredients": "Whole cod-like fish, haddock-like fish or char; thin-sliced turnip, parsnip or potato-like roots; coarse grain crumbs; sea salt; kelp; dill-like herbs; tart berries or imported sour fruit.", "Method": "The oven is fired earlier for bread and heat. Roots go into a clay dish with fat and a little broth, the fish rests on top under crumbs and herbs, and it cooks in falling heat rather than fierce flame.", "Serving": "Tart berry mash is spooned over at the table."}, "part": "Food"}, {"id": "d-frostbound-fish-stew", "kind": "dish", "label": "Frostbound Fish Stew", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#3-frostbound-fish-stew", "text": "A communal pot turns small fish, kelp and roots into a substantial supper.", "short_text": "A communal hearth pot replenished all day.", "facts": {"Why it exists": "A communal pot turns small fish, kelp and roots into a substantial supper.", "Key ingredients": "Fresh and/or smoked fish; fish stock; kelp; roots; onion; barley; seal fat, butter or other local cooking fat; juniper-like herb.", "Method": "Roots and barley begin first, kelp and smoked fish flavor the broth, and fresh fish goes in only near the end. The pot stays hot at the central hearth and is replenished during the day.", "Note": "Correction to early brainstorming: chilling cooked stew in snow can preserve it but doesn't \"gelatinize\" fish broth. Thick versions come from barley, collagen-rich fish parts or reduction."}, "part": "Food"}, {"id": "d-frosted-mead-cakes", "kind": "dish", "label": "Frosted Mead Cakes", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#4-frosted-mead-cakes", "text": "A durable oat cake that turns scarce sweetness into travel food.", "short_text": "Honey-glazed oat cakes for travel.", "facts": {"Why it exists": "A durable oat cake that turns scarce sweetness into travel food.", "Key ingredients": "Coarse oats; honey; small beer or mead; butter or rendered fat; salt.", "Method": "A stiff oat batter is cooked on a griddle or baking stone and brushed with honey while hot. In winter they cool rapidly outdoors, setting the glaze.", "Serving": "They travel well with cheese, smoked fish or berry paste."}, "part": "Food"}, {"id": "d-snow-dried-fish-cakes", "kind": "dish", "label": "Snow-Dried Fish Cakes", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#5-snow-dried-fish-cakes", "text": "Fish is flaked into root mash, bound with grain meal, formed into patties, chilled and fried on a hearth griddle.", "short_text": "Salt fish and root mash fried as patties.", "facts": {"Key ingredients": "Soaked salt fish; mashed roots; oat or barley meal; egg when available; onion; herbs; cooking fat.", "Method": "Fish is flaked into root mash, bound with grain meal, formed into patties, chilled and fried on a hearth griddle.", "Serving": "Coastal households serve them with fermented berry relish or pickled kelp."}, "part": "Food"}, {"id": "d-kelp-crisps", "kind": "dish", "label": "Kelp Crisps", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#6-kelp-crisps", "text": "Rinsed, lightly salted, dried on racks and briefly toasted near the hearth.", "short_text": "Dried, toasted kelp for snacking and seasoning.", "facts": {"Key ingredients": "Clean kelp; a little salt.", "Method": "Rinsed, lightly salted, dried on racks and briefly toasted near the hearth.", "Serving": "A snack, soup garnish and travel seasoning."}, "part": "Food"}, {"id": "d-pickled-winter-roots", "kind": "dish", "label": "Pickled Winter Roots", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#7-pickled-winter-roots", "text": "Packed in salt brine and allowed to sour.", "short_text": "Roots soured in salt brine.", "facts": {"Key ingredients": "Turnip, beet-like roots, carrot-like roots and onion; salt brine.", "Method": "Packed in salt brine and allowed to sour.", "Variations": "Better-off households add berry vinegar, honey or imported spice."}, "part": "Food"}, {"id": "d-aurora-berry-preserve", "kind": "dish", "label": "Aurora Berry Preserve", "status": "Provisional", "lane": "northwind", "section": "Dishes", "src": "Culture/Recipes/Northwind.md#8-aurora-berry-preserve", "text": "Berries are simmered with honey or malt syrup until thick.", "short_text": "Berries cooked thick with honey or malt.", "facts": {"Key ingredients": "Berries; honey or malt syrup; festival jars may include mead.", "Method": "Berries are simmered with honey or malt syrup until thick.", "Variations": "In lean households the preserve stays sharply sour; festival jars use more sweetener and may include mead."}, "part": "Food"}, {"id": "d-fresh-morning-bread-and-milk", "kind": "dish", "label": "Fresh Morning Bread and Milk", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#1-fresh-morning-bread-and-milk", "text": "Bread ties the workday to the shared oven schedule.", "short_text": "Bread from the shared oven, eaten warm.", "facts": {"Why it exists": "Bread ties the workday to the shared oven schedule.", "Key ingredients": "Wheat-like flour, often blended with barley; starter or yeast; water or milk; salt; butter or nut oil.", "Method": "Dough is mixed before dawn or the night before, carried to a shared oven, and baked after the fire is raked down.", "Serving": "Eaten warm with milk, curds, butter or preserves. Day-old bread becomes soup thickener or field food."}, "part": "Food"}, {"id": "d-braided-honey-and-grain-loaf", "kind": "dish", "label": "Braided Honey and Grain Loaf", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#2-braided-honey-and-grain-loaf", "text": "Braiding makes a familiar loaf ceremonial without requiring luxury ingredients.", "short_text": "An everyday loaf made ceremonial by braiding.", "facts": {"Why it exists": "Braiding makes a familiar loaf ceremonial without requiring luxury ingredients.", "Key ingredients": "Wheat and barley flour; warm milk; honey; starter or yeast; butter; salt.", "Method": "A soft enriched dough is kneaded, risen, braided from three ropes, brushed with milk or butter and baked during a communal oven cycle.", "Variations": "Festival versions add nuts, dried fruit or seed."}, "part": "Food"}, {"id": "d-harvest-stew", "kind": "dish", "label": "Harvest Stew", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#3-harvest-stew", "text": "The recipe changes with whatever the village has in quantity.", "short_text": "Whatever the village has plenty of, in one pot.", "facts": {"Why it exists": "The recipe changes with whatever the village has in quantity.", "Key ingredients": "Beans or barley; onion; carrots, squash, greens, roots; chicken, goat or pork-like meat when affordable; garden herbs; broth; vinegar, cider or cultured dairy for acidity.", "Method": "Meat, if used, is browned. Beans or grain and sturdy vegetables simmer first, delicate vegetables and greens go in later, and fresh herbs finish the pot.", "Variations": "Communal versions accept contributions from multiple households."}, "part": "Food"}, {"id": "d-orchard-fire-roasted-fowl", "kind": "dish", "label": "Orchard-Fire Roasted Fowl", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#4-orchard-fire-roasted-fowl", "text": "A celebratory roast that makes direct use of orchard pruning wood and cider.", "short_text": "A celebratory bird roasted over pruning wood.", "facts": {"Why it exists": "A celebratory roast that makes direct use of orchard pruning wood and cider.", "Key ingredients": "Duck, goose, chicken or game bird; salt; sage, thyme or fennel-like herbs; cider; honey; apples, pears or plums.", "Method": "Orchard wood burns down to clean coals. The salted bird turns slowly over indirect heat, basted with cider, with honey added late so it doesn't burn, while fruit roasts in a pan beneath and catches the drippings."}, "part": "Food"}, {"id": "d-farmers-midday-mash", "kind": "dish", "label": "Farmer's Midday Mash", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#5-farmers-midday-mash", "text": "Barley cooks slowly until soft, milk and butter enrich it, and nuts and herbs are stirred in.", "short_text": "Buttered barley carried out to the fields.", "facts": {"Key ingredients": "Cracked barley; milk or water; butter; hazelnuts or walnuts; thyme or sage; salt.", "Method": "Barley cooks slowly until soft, milk and butter enrich it, and nuts and herbs are stirred in.", "Serving": "Carried to the fields in covered crocks or eaten at midday tables."}, "part": "Food"}, {"id": "d-orchard-hand-pies", "kind": "dish", "label": "Orchard Hand Pies", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#6-orchard-hand-pies", "text": "Filled, sealed and baked during the communal oven's falling heat.", "short_text": "Thick-crusted pies with sweet or savory fillings.", "facts": {"Key ingredients": "Thick pastry; fillings such as apple and soft cheese, pear and onion, beans and herbs, chicken and leek, or plum and honey.", "Method": "Filled, sealed and baked during the communal oven's falling heat.", "Variations": "Plum and honey for sweet versions."}, "part": "Food"}, {"id": "d-roasted-grain-clusters", "kind": "dish", "label": "Roasted Grain Clusters", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#7-roasted-grain-clusters", "text": "Mixed, pressed into clusters and dried in a cooling oven.", "short_text": "Honey-bound grain and nuts, a field snack.", "facts": {"Key ingredients": "Leftover cooked grain or toasted cereal; honey; nuts; seeds.", "Method": "Mixed, pressed into clusters and dried in a cooling oven.", "Serving": "A common field snack."}, "part": "Food"}, {"id": "d-herbed-farm-cheese", "kind": "dish", "label": "Herbed Farm Cheese", "status": "Provisional", "lane": "greenvale", "section": "Dishes", "src": "Culture/Recipes/Greenvale.md#8-herbed-farm-cheese", "text": "Curds are drained, salted and mixed with meadow herbs.", "short_text": "Fresh curds with meadow herbs.", "facts": {"Key ingredients": "Fresh curds; salt; meadow herbs.", "Method": "Curds are drained, salted and mixed with meadow herbs.", "Variations": "Some are eaten soft; others are pressed and aged for winter."}, "part": "Food"}, {"id": "d-caravan-flatbread-with-spiced-butter", "kind": "dish", "label": "Caravan Flatbread with Spiced Butter", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#1-caravan-flatbread-with-spiced-butter", "text": "A dough stiff enough to travel rests while camp is made. Thin rounds are slapped onto a hot stone, griddle or clay-oven wall and brushed while hot with fermented butter mixed with crushed spice.", "short_text": "Thin rounds slapped on a hot stone at camp.", "facts": {"Key ingredients": "Hardy plateau flour; water; salt; starter or yeast, or unleavened; fermented yak-like butter; cumin/coriander-like seeds, dried herbs or pungent spice.", "Method": "A dough stiff enough to travel rests while camp is made. Thin rounds are slapped onto a hot stone, griddle or clay-oven wall and brushed while hot with fermented butter mixed with crushed spice."}, "part": "Food"}, {"id": "d-caravan-curry-spiced-caravan-pot", "kind": "dish", "label": "Caravan Curry / Spiced Caravan Pot", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#2-caravan-curry--spiced-caravan-pot", "text": "\"Curry\" is a real-world analogy; in the setting it's better understood as a family of thick, spiced caravan stews.", "short_text": "A family of thick spiced stews cooked beside the camp brazier.", "facts": {"Why it exists": "\"Curry\" is a real-world analogy; in the setting it's better understood as a family of thick, spiced caravan stews.", "Key ingredients": "Goat, yak-like meat or legumes; onion/garlic-like aromatics; dried ginger-like root where traded; cumin/coriander-like seed; dried chile/pepper analogue depending on trade; cultured dairy, broth or nut paste; dried fruit in richer versions.", "Method": "Meat is browned in a heavy pot, whole spices toast in the fat, liquid and legumes or meat go in, and the pot simmers beside the brazier while camp work continues. Sour dairy or fruit brightens it at the end.", "Variations": "Richer versions add dried fruit."}, "part": "Food"}, {"id": "d-wind-dumplings", "kind": "dish", "label": "Wind Dumplings", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#3-wind-dumplings", "text": "Small filled rounds sit in stacked steam trays over one boiling pot, the lowest trays usually holding sturdier dumplings and the upper trays vegetables or lighter fillings.", "short_text": "Filled dumplings steamed in stacked trays.", "facts": {"Key ingredients": "Wheat or barley dough; minced goat/yak-like meat or lentils; onion; herbs; fermented dairy; optional imported spice.", "Method": "Small filled rounds sit in stacked steam trays over one boiling pot, the lowest trays usually holding sturdier dumplings and the upper trays vegetables or lighter fillings.", "Serving": "Served communally with sour dairy, broth or a chile-like condiment."}, "part": "Food"}, {"id": "d-plateau-noodle-soup", "kind": "dish", "label": "Plateau Noodle Soup", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#4-plateau-noodle-soup", "text": "Noodles cook in broth with dried meat, greens, onion and roots.", "short_text": "Hand-cut noodles in broth with dried meat.", "facts": {"Key ingredients": "Hand-cut or pulled noodles; broth; dried meat; greens; onion; root vegetables.", "Method": "Noodles cook in broth with dried meat, greens, onion and roots.", "Variations": "Market versions add trade spices and fresh herbs that remote villages don't have."}, "part": "Food"}, {"id": "d-caravan-skewers", "kind": "dish", "label": "Caravan Skewers", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#5-caravan-skewers", "text": "The point is speed and portability, not giant feast portions.", "short_text": "Small marinated skewers, fast and portable.", "facts": {"Why it exists": "The point is speed and portability, not giant feast portions.", "Key ingredients": "Small pieces of meat; sour dairy or vinegar; spice; salt.", "Method": "Marinated, then quickly cooked over a brazier."}, "part": "Food"}, {"id": "d-spice-rice-grain-pilaf", "kind": "dish", "label": "Spice Rice / Grain Pilaf", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#6-spice-rice--grain-pilaf", "text": "The grain is toasted in fat, simmered in broth, and dried fruit and nuts are folded in.", "short_text": "Toasted grain with fruit and nuts.", "facts": {"Key ingredients": "Imported rice or another long-grain cereal where affordable, otherwise local wheat berries, millet or barley; fat; broth; dried fruit; nuts.", "Method": "The grain is toasted in fat, simmered in broth, and dried fruit and nuts are folded in.", "Variations": "Where rice or another long-grain cereal isn't affordable, the same technique uses local wheat berries, millet or barley."}, "part": "Food"}, {"id": "d-lentil-fritters", "kind": "dish", "label": "Lentil Fritters", "status": "Provisional", "lane": "highridge", "section": "Dishes", "src": "Culture/Recipes/Highridge-Plateau.md#7-lentil-fritters", "text": "Common market food because the batter can be mixed in advance.", "short_text": "Small fried pulse cakes, common market food.", "facts": {"Why it exists": "Common market food because the batter can be mixed in advance.", "Key ingredients": "Soaked pulses; onion; herbs; spice.", "Method": "Mashed, shaped small and shallow-fried in a brazier pan."}, "part": "Food"}, {"id": "d-mushroom-simmered-broth", "kind": "dish", "label": "Mushroom-Simmered Broth", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#1-mushroom-simmered-broth", "text": "A ceramic pot is set beside, not over, fierce flame. Roots and alliums soften gently, mushrooms simmer only long enough to flavor the broth, and strong herbs are used sparingly.", "short_text": "A gentle mushroom broth cooked beside the flame.", "facts": {"Key ingredients": "Mixed edible mushrooms; leek/onion-like allium; light vegetable or game stock; wild thyme; root trimmings; salt.", "Method": "A ceramic pot is set beside, not over, fierce flame. Roots and alliums soften gently, mushrooms simmer only long enough to flavor the broth, and strong herbs are used sparingly.", "Serving": "May be served alone or over grain or root cakes."}, "part": "Food"}, {"id": "d-guardian-stew", "kind": "dish", "label": "Guardian Stew", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#2-guardian-stew", "text": "The name fits ceremonial or communal versions; ordinary households make simpler descendants.", "short_text": "A slow clay-pot stew; the name fits ceremonial or communal versions.", "facts": {"Why it exists": "The name fits ceremonial or communal versions; ordinary households make simpler descendants.", "Key ingredients": "Venison, boar or domestic meat; mushrooms; roots; onion; forest herbs; stock; a little honey or fermented fruit paste.", "Method": "Meat is lightly browned in a clay pot if fat is available, roots and stock go in, and the pot cooks for hours in low embers or a banked earth hearth. Mushrooms go in later, and fermented fruit or honey balances the broth."}, "part": "Food"}, {"id": "d-whispering-leaf-wraps", "kind": "dish", "label": "Whispering Leaf Wraps", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#3-whispering-leaf-wraps", "text": "Leaves are softened over steam or hot water and wrapped around a filling that is cooked or partially cooked first, then tied with fiber. The packets steam in a covered pit above hot stones, kept from the ash by leaves and brush.", "short_text": "Leaf packets steamed in a pit over hot stones.", "facts": {"Key ingredients": "Cooked grain; mushrooms; chestnuts or hazelnuts; greens; fish, fowl or shredded game when available; broad edible, non-toxic wrapping leaves.", "Method": "Leaves are softened over steam or hot water and wrapped around a filling that is cooked or partially cooked first, then tied with fiber. The packets steam in a covered pit above hot stones, kept from the ash by leaves and brush.", "Serving": "Packets are opened at the table."}, "part": "Food"}, {"id": "d-clay-sealed-forest-roast", "kind": "dish", "label": "Clay-Sealed Forest Roast", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#4-clay-sealed-forest-roast", "text": "Wrapped in leaves, coated in clean cooking clay and set among hot stones. The hardened clay is cracked away after cooking.", "short_text": "Meat or fish baked inside a clay shell.", "facts": {"Key ingredients": "A bird, fish or small cut of meat; leaves; clean cooking clay.", "Method": "Wrapped in leaves, coated in clean cooking clay and set among hot stones. The hardened clay is cracked away after cooking.", "Note": "The clay is a vessel, not an ingredient."}, "part": "Food"}, {"id": "d-night-ember-root-soup", "kind": "dish", "label": "Night-Ember Root Soup", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#5-night-ember-root-soup", "text": "Roots roast at the edge of the hearth, are peeled and mashed into mushroom broth, thickened with crushed chestnut and simmered overnight in banked heat. Berry ferment goes in just before serving.", "short_text": "Roasted-root soup simmered overnight in banked heat.", "facts": {"Key ingredients": "Roasted parsnip/turnip/carrot-like roots; chestnut; mushroom stock; mild wild herbs; fermented berry paste.", "Method": "Roots roast at the edge of the hearth, are peeled and mashed into mushroom broth, thickened with crushed chestnut and simmered overnight in banked heat. Berry ferment goes in just before serving.", "Note": "Replaces the earlier brainstorm name \"Nightshade Ember Soup,\" which implied unsafe ingredients."}, "part": "Food"}, {"id": "d-acorn-or-chestnut-cakes", "kind": "dish", "label": "Acorn or Chestnut Cakes", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#6-acorn-or-chestnut-cakes", "text": "Mixed and cooked on a stone or griddle.", "short_text": "Seasonal griddle cakes of nut meal.", "facts": {"Key ingredients": "Tannin-leached acorn meal or chestnut flour; grain flour; water; honey.", "Method": "Mixed and cooked on a stone or griddle.", "Note": "Seasonal foods, not universal staples."}, "part": "Food"}, {"id": "d-fermented-forest-fruit-paste", "kind": "dish", "label": "Fermented Forest Fruit Paste", "status": "Provisional", "lane": "deepwood", "section": "Dishes", "src": "Culture/Recipes/Deepwood.md#7-fermented-forest-fruit-paste", "text": "The paste works as acid, condiment and preservation method.", "short_text": "Soured fruit used as acid, condiment and preserve.", "facts": {"Why it exists": "The paste works as acid, condiment and preservation method.", "Key ingredients": "Berries or plums; a little salt or sweetener.", "Method": "Lightly salted or sweetened and allowed to sour in crocks."}, "part": "Food"}, {"id": "d-olive-flatbread-and-soft-cheese", "kind": "dish", "label": "Olive Flatbread and Soft Cheese", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#1-olive-flatbread-and-soft-cheese", "text": "Rested dough cooks in thin rounds on a griddle or hot oven floor and is brushed with oil after baking.", "short_text": "Oiled flatbread with cheese and olives alongside.", "facts": {"Key ingredients": "Wheat/barley flour; water; yeast or starter, or unleavened; olive-like oil; chopped olives where available; soft goat or sheep cheese; herbs.", "Method": "Rested dough cooks in thin rounds on a griddle or hot oven floor and is brushed with oil after baking.", "Serving": "Cheese, olives and herbs are served alongside rather than always baked in."}, "part": "Food"}, {"id": "d-orchard-pear-clay-pot-braise", "kind": "dish", "label": "Orchard-Pear Clay-Pot Braise", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#2-orchard-pear-clay-pot-braise", "text": "Meat is lightly browned in the clay pot, onion and spice cook in the oil, and meat, fruit and a little broth are layered. The covered pot sits over low heat so trapped steam does most of the work; honey goes in late.", "short_text": "Meat and fruit braised in trapped steam.", "facts": {"Key ingredients": "Lamb, goat or poultry; onion; pear or quince-like fruit; oil; cinnamon-like bark; cumin-like seed; saffron-like luxury spice only in wealthy versions; honey; broth.", "Method": "Meat is lightly browned in the clay pot, onion and spice cook in the oil, and meat, fruit and a little broth are layered. The covered pot sits over low heat so trapped steam does most of the work; honey goes in late.", "Variations": "Saffron-like luxury spice appears only in wealthy versions.", "Serving": "Served with bread or grain."}, "part": "Food"}, {"id": "d-honey-drizzled-nut-pastries", "kind": "dish", "label": "Honey-Drizzled Nut Pastries", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#3-honey-drizzled-nut-pastries", "text": "Dough is rolled or stretched thin, layered with fat and nuts, baked crisp in a communal or household oven, and warm honey syrup is poured over after baking.", "short_text": "Thin nut-filled layers soaked in honey syrup.", "facts": {"Key ingredients": "Thin rolled dough; nuts; honey; spicebark; butter or oil.", "Method": "Dough is rolled or stretched thin, layered with fat and nuts, baked crisp in a communal or household oven, and warm honey syrup is poured over after baking.", "Variations": "Festival versions can be elaborate; everyday versions are simpler folded pastries."}, "part": "Food"}, {"id": "d-grain-and-herb-salad", "kind": "dish", "label": "Grain and Herb Salad", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#4-grain-and-herb-salad", "text": "The cooked grain is cooled and tossed with the rest.", "short_text": "Cooled grain tossed with herbs, oil and fruit.", "facts": {"Key ingredients": "Cracked wheat, barley or couscous-like granules; cucumber-like vegetables; herbs; onion; oil; sour fruit or vinegar; dried or fresh orchard fruit.", "Method": "The cooked grain is cooled and tossed with the rest."}, "part": "Food"}, {"id": "d-herb-crusted-coastal-fish", "kind": "dish", "label": "Herb-Crusted Coastal Fish", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#5-herb-crusted-coastal-fish", "text": "Fish is rubbed with oil, herbs and crumbs, then baked in a clay dish or grilled over clean coals, and finished with sour fruit, vinegar or reduction.", "short_text": "Crumb-crusted fish with a sour finish.", "facts": {"Key ingredients": "Fish; oil; herbs; coarse grain crumbs; sour fruit, vinegar or pomegranate-like reduction.", "Method": "Fish is rubbed with oil, herbs and crumbs, then baked in a clay dish or grilled over clean coals, and finished with sour fruit, vinegar or reduction."}, "part": "Food"}, {"id": "d-fava-like-bean-purée", "kind": "dish", "label": "Fava-Like Bean Purée", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#6-fava-like-bean-purée", "text": "The pulses are mashed with oil, allium, salt and something sour.", "short_text": "Mashed pulses eaten with flatbread.", "facts": {"Key ingredients": "Cooked pulses; oil; garlic-like allium; salt; sour fruit or vinegar.", "Method": "The pulses are mashed with oil, allium, salt and something sour.", "Serving": "Eaten with flatbread and raw or grilled vegetables."}, "part": "Food"}, {"id": "d-orchard-pilaf", "kind": "dish", "label": "Orchard Pilaf", "status": "Provisional", "lane": "sunplains", "section": "Dishes", "src": "Culture/Recipes/Sunplains.md#7-orchard-pilaf", "text": "The grain is toasted in oil and cooked with broth, nuts and dried fruit.", "short_text": "Toasted grain with broth, nuts and dried fruit.", "facts": {"Key ingredients": "Rice where trade and irrigation support it, local grain elsewhere; oil; broth; nuts; dried fruit.", "Method": "The grain is toasted in oil and cooked with broth, nuts and dried fruit.", "Variations": "Wealthier versions use expensive aromatic spice."}, "part": "Food"}, {"id": "d-blacksmiths-forged-harvest-stew", "kind": "dish", "label": "Blacksmith's / Forged Harvest Stew", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#blacksmiths--forged-harvest-stew", "text": "Greenvale produce regularly feeds upland work towns; Ironcrest smoke and browning alter the farm stew.", "short_text": "Greenvale's farm stew, browned and smoked the Ironcrest way.", "facts": {"Why it exists": "Greenvale produce regularly feeds upland work towns; Ironcrest smoke and browning alter the farm stew.", "Key ingredients": "Smoked goat, pork-like meat or boar; barley; onion; carrots, parsnips, turnips; apple or pear; thyme; broth; cider vinegar; optional nuts.", "Method": "Meat is browned hard in an iron pot and onion charred at the hearth's edge; barley and broth simmer with the meat, Greenvale roots and orchard fruit go in later, and vinegar finishes the pot.", "Variations": "Nuts appear mainly in better-off or festival versions."}, "part": "Food"}, {"id": "d-iron-grain-herbed-bread", "kind": "dish", "label": "Iron-Grain Herbed Bread", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#iron-grain-herbed-bread", "text": "Greenvale bakers adapt their softer communal loaves to Ironcrest's darker flours, toasted grain and lidded-pot baking. Ironcrest households adopt Greenvale herbs and longer fermentation.", "short_text": "Each side's bread borrowing from the other.", "facts": {"Key ingredients": "Ironcrest's darker flours and toasted grain; Greenvale herbs.", "Method": "Greenvale bakers adapt their softer communal loaves to Ironcrest's darker flours, toasted grain and lidded-pot baking. Ironcrest households adopt Greenvale herbs and longer fermentation."}, "part": "Food"}, {"id": "d-forge-and-plateau-kebabs", "kind": "dish", "label": "Forge and Plateau Kebabs", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forge-and-plateau-kebabs", "text": "Highridge caravan cooks bring sour marinades and layered spice to Ironcrest's fast iron-plate and charcoal cooking.", "short_text": "Highridge marinades on Ironcrest skewers and charcoal.", "facts": {"Why it exists": "Highridge caravan cooks bring sour marinades and layered spice to Ironcrest's fast iron-plate and charcoal cooking.", "Key ingredients": "Goat, boar or other upland meat; sour dairy, vinegar or tart fruit; cumin/coriander-like seed; dried pungent spice; onion; salt; flatbread.", "Method": "Small pieces marinate in sour liquid and spice, are skewered tightly and grilled over a clean charcoal brazier on Ironcrest metal skewers with Highridge seasoning.", "Serving": "Wrapped in plateau-style flatbread with Ironcrest pickles."}, "part": "Food"}, {"id": "d-smoked-iron-grain-flatbread", "kind": "dish", "label": "Smoked Iron-Grain Flatbread", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#smoked-iron-grain-flatbread", "text": "The flatbread is topped and finished on a hot stone or iron plate.", "short_text": "Plateau flatbread topped with Ironcrest smoked meat.", "facts": {"Key ingredients": "Highridge-style flatbread; Ironcrest smoked meat; onions; curd cheese; a restrained amount of imported spice.", "Method": "The flatbread is topped and finished on a hot stone or iron plate."}, "part": "Food"}, {"id": "d-icefire-brined-fish", "kind": "dish", "label": "Icefire Brined Fish", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#icefire-brined-fish", "text": "Northwind fish preservation meets Highridge caravan seasoning and drying.", "short_text": "Northwind-cured fish with a crust of plateau spice.", "facts": {"Why it exists": "Northwind fish preservation meets Highridge caravan seasoning and drying.", "Key ingredients": "Firm fish; salt brine; kelp; juniper-like herb; crushed plateau spices; rendered fat or butter.", "Method": "Fish is brined cold, rinsed and air-dried until tacky, pressed with a thin layer of crushed spice, then cold- or warm-smoked depending on storage needs.", "Serving": "Highridge traders often brush it with spiced butter when reheating."}, "part": "Food"}, {"id": "d-icy-caravan-fish-pot", "kind": "dish", "label": "Icy Caravan Fish Pot", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#icy-caravan-fish-pot", "text": "The salt fish simmers briefly in the sauce, added late so it doesn't fall apart.", "short_text": "Salt fish simmered in a Highridge-style sauce.", "facts": {"Key ingredients": "Soaked salt fish; a Highridge-style aromatic legume or dairy sauce.", "Method": "The salt fish simmers briefly in the sauce, added late so it doesn't fall apart.", "Serving": "Eaten with flatbread or grain.", "Note": "It doesn't require modern coconut milk."}, "part": "Food"}, {"id": "d-frost-and-spice-fish-cakes", "kind": "dish", "label": "Frost and Spice Fish Cakes", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#frost-and-spice-fish-cakes", "text": "Shaped into cakes, seasoned with plateau spice and shallow-fried.", "short_text": "Northwind fish cakes seasoned with plateau spice.", "facts": {"Key ingredients": "Salt fish; mashed root; onion; barley meal; imported plateau spice.", "Method": "Shaped into cakes, seasoned with plateau spice and shallow-fried.", "Serving": "Sour dairy or fermented berry relish accompanies them."}, "part": "Food"}, {"id": "d-shadow-hearth-porridge", "kind": "dish", "label": "Shadow Hearth Porridge", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#shadow-hearth-porridge", "text": "Greenvale grain becomes the stable carbohydrate; Deepwood contributes mushrooms, nuts and low-ember technique.", "short_text": "Greenvale grain cooked the Deepwood way, with mushrooms and nuts.", "facts": {"Why it exists": "Greenvale grain becomes the stable carbohydrate; Deepwood contributes mushrooms, nuts and low-ember technique.", "Key ingredients": "Cracked wheat or barley; mushroom broth; roasted root; chestnut or hazelnut; thyme; optional milk or honey.", "Method": "Grain begins in a clay pot, ember-roasted root is mashed into the liquid, mushrooms and nuts go in, and the pot cooks slowly beside the fire.", "Variations": "Greenvale households may finish it with milk; Deepwood households more often use nut paste or broth."}, "part": "Food"}, {"id": "d-wild-orchard-tartlets", "kind": "dish", "label": "Wild Orchard Tartlets", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#wild-orchard-tartlets", "text": "The point is sweet-earthy balance, not dessert-level sweetness.", "short_text": "Greenvale pastry around Deepwood mushrooms and nuts.", "facts": {"Why it exists": "The point is sweet-earthy balance, not dessert-level sweetness.", "Key ingredients": "Greenvale pastry; Deepwood mushrooms, herbs and nuts; a little apple or pear.", "Method": "The pastry encloses the filling."}, "part": "Food"}, {"id": "d-forest-harvest-salad", "kind": "dish", "label": "Forest Harvest Salad", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-harvest-salad", "text": "The greens, roots and apple meet the mushrooms and nuts under a honey-vinegar dressing.", "short_text": "Farm greens and apple with forest mushrooms and nuts.", "facts": {"Key ingredients": "Cultivated greens; radish-like roots; orchard apple; lightly cooked forest mushrooms; nuts; honey-vinegar dressing.", "Method": "The greens, roots and apple meet the mushrooms and nuts under a honey-vinegar dressing."}, "part": "Food"}, {"id": "d-harvest-orchard-salad", "kind": "dish", "label": "Harvest Orchard Salad", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#harvest-orchard-salad", "text": "The greens and vegetables are combined with the fruit, oil and herbs and dressed with sour fruit.", "short_text": "Greenvale greens with Sunplains fruit and oil.", "facts": {"Key ingredients": "Fresh Greenvale greens and vegetables; Sunplains figs or pomegranate-like fruit; oil; mint-like herbs; sour-fruit dressing.", "Method": "The greens and vegetables are combined with the fruit, oil and herbs and dressed with sour fruit."}, "part": "Food"}, {"id": "d-sunlit-orchard-grain", "kind": "dish", "label": "Sunlit Orchard Grain", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#sunlit-orchard-grain", "text": "The grain is dressed in oil and sour fruit, then mixed with vegetables, herbs, dried fig and nuts.", "short_text": "Greenvale grain dressed Sunplains-style; travels to markets and crews.", "facts": {"Key ingredients": "Greenvale cracked grain or couscous-like wheat; Sunplains oil and sour fruit; cucumber-like vegetables; herbs; dried fig; nuts.", "Method": "The grain is dressed in oil and sour fruit, then mixed with vegetables, herbs, dried fig and nuts.", "Serving": "It travels well to markets and harvest crews."}, "part": "Food"}, {"id": "d-forest-blossom-tart", "kind": "dish", "label": "Forest Blossom Tart", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-blossom-tart", "text": "Sunplains pastry technique and orchard sweetness absorb Deepwood nuts, forest fruit and earthy aromatics.", "short_text": "Sunplains pastry with Deepwood nuts and forest fruit.", "facts": {"Why it exists": "Sunplains pastry technique and orchard sweetness absorb Deepwood nuts, forest fruit and earthy aromatics.", "Key ingredients": "Thin or short pastry; fig, pear or plum; chestnut or hazelnut; mild forest herb; honey; cinnamon-like spicebark.", "Method": "Fruit is chopped with toasted nuts and herbs, baked in a shallow pastry in a Sunplains oven or under a clay baking cover, and brushed with honey afterward.", "Variations": "Border versions may include a small savory mushroom component."}, "part": "Food"}, {"id": "d-forest-orchard-medley", "kind": "dish", "label": "Forest-Orchard Medley", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-orchard-medley", "text": "Mushrooms and wild greens are gently cooked in oil, then finished with orchard fruit, sour juice or vinegar, and herbs.", "short_text": "Mushrooms and greens in oil, finished with fruit and acid.", "facts": {"Key ingredients": "Mushrooms; wild greens; Sunplains oil; orchard fruit; sour citrus-like juice or vinegar; herbs.", "Method": "Mushrooms and wild greens are gently cooked in oil, then finished with orchard fruit, sour juice or vinegar, and herbs."}, "part": "Food"}, {"id": "d-forest-citrus-creamed-grain", "kind": "dish", "label": "Forest-Citrus Creamed Grain", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#forest-citrus-creamed-grain", "text": "The grain is slowly fed hot broth, mushrooms are added during cooking, and bright orchard acid goes in at the finish.", "short_text": "Grain slowly fed broth, with mushrooms and a bright finish.", "facts": {"Key ingredients": "A locally available grain; hot broth; mushrooms; orchard acid.", "Method": "The grain is slowly fed hot broth, mushrooms are added during cooking, and bright orchard acid goes in at the finish.", "Real-world inspiration": "Risotto-like technique, without requiring rice to be universal."}, "part": "Food"}, {"id": "d-plateau-orchard-clay-pot", "kind": "dish", "label": "Plateau Orchard Clay Pot", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#plateau-orchard-clay-pot", "text": "Highridge spice layering meets Sunplains steam-trapping clay braise.", "short_text": "Highridge spice layering in a Sunplains clay braise.", "facts": {"Why it exists": "Highridge spice layering meets Sunplains steam-trapping clay braise.", "Key ingredients": "Goat or lamb; onion; dried apricot or raisin-like fruit; pear or quince; cumin-like seed; cinnamon-like bark; broth; oil or butter.", "Method": "Meat is browned, spices toast in fat, fruit and broth are layered in a covered clay pot, and it cooks slowly until tender.", "Serving": "Plateau flatbread or grain accompanies it."}, "part": "Food"}, {"id": "d-highridge-orchard-pilaf", "kind": "dish", "label": "Highridge Orchard Pilaf", "status": "Provisional", "lane": "borderlands", "section": "Dishes", "src": "Culture/Recipes/Border-Fusions.md#highridge-orchard-pilaf", "text": "The grain is toasted in fat, simmered with broth and spice, then finished with dried Sunplains fruit and nuts.", "short_text": "Toasted grain with spice, finished with Sunplains fruit.", "facts": {"Key ingredients": "Long grain, millet, wheat berries or barley; fat; broth; spice; dried Sunplains fruit; nuts.", "Method": "The grain is toasted in fat, simmered with broth and spice, then finished with dried Sunplains fruit and nuts."}, "part": "Food"}, {"id": "a-guardian-stew", "kind": "adaptation", "label": "Guardian Stew, away from home", "short": "Guardian Stew abroad", "status": "Provisional (illustrative)", "lane": "deepwood", "section": "Away from home", "src": "Culture/Food-Diaspora-and-Adaptation.md#guardian-stew", "text": "A Deepwood stew whose identity comes from slow cooking, forest aromatics and a communal serving ritual. A diaspora version might keep the method and occasion while its pantry changes with each host region.", "short_text": "How the stew might change in each host region while its method and occasion survive.", "facts": {"What survives": "A diaspora version might keep the method and occasion.", "What changes": "The pantry might: cultivated roots, dairy or orchard acidity may enter in Greenvale; dried aromatics and portable grains may become normal in Highridge; preserved fish or brined vegetables may alter it in Northwind; pulses, oil and fresh herbs may reshape it in Sunplains; smoke and dense grain may make it heavier in Ironcrest; in Port, several of these descendants can coexist and eventually cross-pollinate.", "Caution": "None of these versions should be treated as automatically canonical dishes. The example demonstrates the mechanism."}, "part": "Food"}, {"id": "a-forgefire-roast", "kind": "adaptation", "label": "Forgefire Roast", "short": "Forgefire Roast", "status": "Provisional (illustrative)", "lane": "ironcrest", "section": "Away from home", "src": "Culture/Food-Diaspora-and-Adaptation.md#forgefire-roast", "text": "An Ironcrest preparation identified by hard browning, smoke and a communal work-day context, which might migrate into Sunplains.", "short_text": "Hard-browned Ironcrest work-day food that might move to Sunplains.", "facts": {"What survives": "The idea of the food: it should be deeply browned and served after collective labor.", "What changes": "The Sunplains host version could use a different meat, oil, acid and herb set.", "Caution": "Illustrative, on a page that is a working design method, not a fixed menu of canon dishes."}, "part": "Food"}, {"id": "pw-council", "kind": "council", "label": "The Economic Council", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#core-concept", "text": "A secret or semi-secret association of wealthy families whose power crosses regional borders. They represent no kingdom; they control economic systems on which all kingdoms depend, and govern through choice architecture rather than command.", "short_text": "Wealthy families, no kingdom: leverage over what everyone depends on.", "facts": {"Seats": "Six seats (Working canon, the author 2026-09-29), each held by one house: Marielle (Harvest), Drathain (Materials), Veynor (Routes), Torradon (Works), Luthain (Treasury), Rhaelen (Lore). Each house comes from a region but represents none. The domain titles are still working titles.", "How it governs": "Choice architecture rather than command. A kingdom may technically be free to refuse a treaty, but then credit becomes scarce, grain contracts disappear, insurers raise rates, caravans choose another route, bridge repairs are delayed, or a rival gains better terms. No single action proves conspiracy.", "Why rulers tolerate it": "Many rulers don't know the whole structure. Those who do may still tolerate it because it resolves shortages, provides emergency loans, coordinates trade, prevents financial panics, quietly restrains rivals, and helped preserve the post-Convergence order.", "Internal conflict": "Not unified. Potential fault lines: finance wants repayment while food wants famine relief; routes wants open trade while materials wants strategic embargo; infrastructure wants long investment while short-term political pressure demands cuts; knowledge may know a scheme is failing before others admit it. Each family also has heirs, factions, clients and private ambitions.", "Moral problem": "The Council may be correct that its coordination has prevented wars. The story's question is whether preventing catastrophe grants a private group the right to decide everyone else's future.", "Against the Villain": "He attacks dependencies and perceptions, wanting kingdoms to make moves the Council can't openly stop without exposing how much power it holds. His goal is not merely to defeat six families but to make their system unable to maintain equilibrium.", "With Wurdren": "Wurdren repeatedly fixes consequences the Council treats as acceptable losses. This can accidentally help the Council in the short term while morally undermining its worldview in the long term.", "Open questions": "How seats are inherited, selected, purchased or contested; how old the Council is relative to the Convergence; which parts of its existence are rumor and which are known to elite rulers; the domains' final titles."}, "fact_src": {"Seats": "Politics/Economic-Council.md#the-six-houses", "How it governs": "Politics/Economic-Council.md#how-the-council-governs-without-governing", "Why rulers tolerate it": "Politics/Economic-Council.md#why-rulers-tolerate-it", "Internal conflict": "Politics/Economic-Council.md#internal-conflict", "Moral problem": "Politics/Economic-Council.md#the-councils-moral-problem", "Against the Villain": "Politics/Economic-Council.md#relationship-to-the-villain", "With Wurdren": "Politics/Economic-Council.md#relationship-to-wurdren", "Open questions": "Open-Questions.md#economic-council"}, "part": "Power"}, {"id": "pw-seat-harvest", "kind": "seat", "label": "Harvest / Provision Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#1-food-and-biological-supply", "text": "The Council's Food and Biological Supply domain (working title: Harvest / Provision Seat). Power doesn't mean owning every farm. The family gains leverage by controlling bottlenecks: storage warehouses, seed credit, bulk contracts, mills, emergency reserves, and financing for large estates and co-ops.", "short_text": "House Marielle. Food bottlenecks: storage, seed credit, mills, reserves.", "facts": {"Domain": "Food and Biological Supply (working title)", "Controls": "Grain storage; seed networks; orchard stock; livestock movement; emergency reserves; large agricultural contracts; food transport coordination.", "Leverage": "Power doesn't mean owning every farm. The family gains leverage by controlling bottlenecks: storage warehouses, seed credit, bulk contracts, mills, emergency reserves, and financing for large estates and co-ops.", "House": "House Marielle (Working canon).", "Home region": "Greenvale: origin only; the house doesn't represent it.", "Members": "Halric Marielle, a charismatic head of house; Ellana Marielle, botanist and diplomat. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-seat-materials", "kind": "seat", "label": "Materials / Metal Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#2-materials-and-production", "text": "The Council's Materials and Production domain (working title: Materials / Metal Seat). Its power spans Ironcrest mines, Deepwood timber and fuel disputes, Highridge demand, Northwind ship fittings, and Sunplains construction.", "short_text": "House Drathain. Mines, ore, timber, fuel, foundries, weapon-grade metal.", "facts": {"Domain": "Materials and Production (working title)", "Controls": "Mines; ore contracts; timber and fuel supply; large foundries; strategic materials; weapon-grade metal; construction metal.", "Leverage": "Its power spans Ironcrest mines, Deepwood timber and fuel disputes, Highridge demand, Northwind ship fittings, and Sunplains construction.", "House": "House Drathain (Working canon).", "Home region": "Sunplains: origin only; the house doesn't represent it.", "Members": "Evelyne Drathain, diplomat and master of guild alliances; Dorian Drathain, organizer of large labor forces. In the earlier notes the house held Labor; its leverage over crews and building became leverage over what they build with. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-seat-routes", "kind": "seat", "label": "Routes / Navigation Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#3-routes-and-transport", "text": "The Council's Routes and Transport domain (working title: Routes / Navigation Seat). It can change an economy by making a route expensive rather than formally banning trade.", "short_text": "House Veynor. Shipping, caravans, passes, roads, Underpass connections.", "facts": {"Domain": "Routes and Transport (working title)", "Controls": "Maritime shipping; caravan networks; pass access; major roads; warehouses; Underpass connections; shipping schedules; convoy contracts.", "Leverage": "It can change an economy by making a route expensive rather than formally banning trade.", "House": "House Veynor (Working canon).", "Home region": "Port: origin only; the house doesn't represent it.", "Members": "Ilthea Veynor, matriarch of maritime and overland trade; Appan Veynor, the house's pragmatic, ambitious heir. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-seat-works", "kind": "seat", "label": "Works / Infrastructure Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#4-infrastructure", "text": "The Council's Infrastructure domain (working title: Works / Infrastructure Seat). Infrastructure decisions have long tails: a bridge not repaired can redirect trade for decades.", "short_text": "House Torradon. Roads, bridges, canals, irrigation, ports, repair contracts.", "facts": {"Domain": "Infrastructure (working title)", "Controls": "Roads; bridges; canals; irrigation; ports; fortifications; large public works; repair contracts.", "Leverage": "Infrastructure decisions have long tails: a bridge not repaired can redirect trade for decades.", "House": "House Torradon (Working canon).", "Home region": "Highridge Plateau: origin only; the house doesn't represent it.", "Members": "Vysera Torradon, visionary architect and leader; Sorvik Torradon, meticulous planner. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-seat-treasury", "kind": "seat", "label": "Treasury / Commerce Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#5-finance-and-exchange", "text": "The Council's Finance and Exchange domain (working title: Treasury / Commerce Seat). This may be the Council's most quietly powerful seat, because every other domain sometimes needs capital.", "short_text": "House Luthain. Credit, debt, banking, loans, insurance, emergency financing.", "facts": {"Domain": "Finance and Exchange (working title)", "Controls": "Credit; debt; banking houses; currency exchange; large loans; merchant insurance-like arrangements; investment syndicates; emergency financing.", "Leverage": "This may be the Council's most quietly powerful seat, because every other domain sometimes needs capital.", "House": "House Luthain (Working canon).", "Home region": "Ironcrest: origin only; the house doesn't represent it.", "Members": "Carric Luthain, a shrewd banker; Margil Luthain, a cold, precise adviser. (Provisional.)"}, "fact_src": {"House": "Politics/Economic-Council.md#the-six-houses", "Home region": "Politics/Economic-Council.md#the-six-houses", "Members": "Politics/Economic-Council.md#the-six-houses"}, "part": "Power"}, {"id": "pw-seat-lore", "kind": "seat", "label": "Lore / Intelligence Seat", "status": "No status label", "lane": "council", "section": "Economic Council", "src": "Politics/Economic-Council.md#6-knowledge-and-information", "text": "The Council's Knowledge and Information domain (working title: Lore / Intelligence Seat). It should not literally control all knowledge. Its strength is knowing who knows what, buying access, delaying information, and deciding which innovations receive funding or distribution.", "short_text": "House Rhaelen. Records, maps, guild secrets, market reports, intelligence.", "facts": {"Domain": "Knowledge and Information (working title)", "Controls": "Commercial records; maps; guild secrets; technical knowledge; scholars and scribes; market reports; intelligence networks; blac

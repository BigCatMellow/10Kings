es include:", "src": "Culture/Nomads.md#why-mobile-peoples-exist-here"}], "part": "History"}, {"from": "hi-ver-ember-greenvale", "to": "hi-mem-ember-wars", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Greenvale folk memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-ember-ironcrest", "to": "hi-mem-ember-wars", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Ironcrest patriotic memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-ember-border", "to": "hi-mem-ember-wars", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Border memory", "src": "History/Contested-Memory.md#the-ember-wars--the-burning-years", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-salted-northwind", "to": "hi-mem-salted-coast", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Northwind songs about burned boats or coastal settlements", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-salted-sunplains", "to": "hi-mem-salted-coast", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Sunplains stories about raids", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-salted-port", "to": "hi-mem-salted-coast", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Port traditions that present negotiation and neutral anchorage as older than the Convergence", "src": "History/Contested-Memory.md#the-salted-coast-disputes", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-timber-deepwood", "to": "hi-mem-timber-tithes", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Deepwood memory contains older stories about outside extraction", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-timber-outsiders", "to": "hi-mem-timber-tithes", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "Outsider traditions may remember the same period as sudden Deepwood violence", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-seizure-northwind", "to": "hi-mem-port-seizure", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "some Northwind families claim they built or maintained facilities others later took from them", "src": "History/Contested-Memory.md#the-port-seizure", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-seizure-port", "to": "hi-mem-port-seizure", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "some Port families remember foreign control as occupation", "src": "History/Contested-Memory.md#the-port-seizure", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-ver-seizure-merchants", "to": "hi-mem-port-seizure", "layer": "hi-memory", "type": "is one telling of", "basis": "stated", "quote": "some merchants use the story as a warning about allowing any one power to dominate the harbor", "src": "History/Contested-Memory.md#the-port-seizure", "chip": "Version of", "chipBack": "Versions", "part": "History"}, {"from": "hi-mem-blight", "to": "f-root-cellar-night", "layer": "hi-memory", "type": "is remembered at", "basis": "stated", "quote": "stored food, family stories and remembrance of old scarcity such as the Seven-year Blight.", "src": "Culture/Festivals-and-Seasonal-Life.md#greenvale", "chip": "Festival", "chipBack": "Remembers", "chipNote": "can be", "chipNoteBack": "can be", "part": "History"}, {"from": "hi-mem-timber-tithes", "to": "pw-gov-deepwood", "layer": "hi-memory", "type": "may explain suspicion in", "basis": "stated", "quote": "This is a strong candidate for explaining later suspicion around logging rights", "src": "History/Contested-Memory.md#the-timber-tithes--deepwood-closure-traditions", "chip": "May explain", "chipBack": "History", "certainty": "possible", "chipNote": "suspicion around logging rights", "chipNoteBack": "suspicion around logging rights", "part": "History"}, {"from": "hi-mem-port-seizure", "to": "port", "layer": "hi-memory", "type": "is told about", "basis": "stated", "quote": "One uploaded tradition proposed a period when Northwind interests controlled Port before coalition pressure produced withdrawal and neutral status.", "src": "History/Contested-Memory.md#the-port-seizure", "chip": "About", "chipBack": "Remembered", "certainty": "possible", "chipNote": "not settled chronology", "chipNoteBack": "the Port Seizure (not settled)", "also": [{"quote": "remains the owner for the city's current institutional history.", "src": "History/Contested-Memory.md#the-port-seizure"}], "part": "History"}], "gaps": [{"part": "Geography", "title": "Part 1: Regions and Geography", "items": ["No named cities inside any of the six regions. Port and the border towns are the only named settlements; every region page describes 'cities' only in general.", "Only one region is placed on a continent (Northwind, Northern Continent). Which regions sit on the Western and Eastern Continents is not stated.", "Port's site and territory are not fixed. The wiki lists conditions its site should meet (convenient to northern and southern sea routes, access to inland rivers or roads) and describes Frostbay Way 'if Port is territorially separate'.", "Five region borders aren't established: Ironcrest–Highridge (likely), Greenvale–Highridge (likely), Deepwood–Sunplains (likely), Highridge–Sunplains (possible), and Greenvale–Deepwood (treated as a direct border unless the map contradicts it). Deepwood–Ironcrest is established as a relationship but only as a 'direct or near-direct' frontier.", "The region pages and Geography and Connections disagree on certainty: the Greenvale and Ironcrest pages state their Highridge borders plainly, while Geography and Connections calls them likely.", "Five region pairs have no border town: Ironcrest–Highridge, Greenvale–Deepwood, Deepwood–Sunplains, Greenvale–Highridge and Highridge–Sunplains.", "The wiki doesn't say which regions the Spine touches (only Highridge is tied to it) or which kingdoms hold Underpass entrances.", "No rivers, passes or Underpass entrances are named (history mentions provisional 'Ridge Pass Toll Wars'). Geography and Connections lists what the finished map should show: rivers, passes, Underpass entrances, caravan roads, seasonal closures, sea routes, old roads, pilgrimage paths, smuggling corridors.", "Directions are thin: Ironcrest west, Northwind north, Sunplains south and east, and Greenvale as 'the eastern agricultural interior' (from Highridge's point of view).", "Border Towns and World Overview carry no status label; the Border Towns page calls its six towns 'established working examples'.", "Seven names sit in the border-town name bank, unplaced."]}, {"part": "Culture", "title": "Part 2: Culture", "items": ["Five culture pages carry no status label: Architecture, Language and Thought, Naming, Culture and Influence (whose title reads 'Cultural Inspiration'), and Border Towns.", "Region culture is written twice: each region page has its own inspiration, language and architecture sections, and the Culture pages repeat them across regions. It's two owners for one concept. They agree in substance, but the lists already differ in detail: Highridge is 'probably the most multilingual settled region' on its region page but only 'likely highly multilingual' in Language and Thought; Ironcrest's speech list differs (ordered, attempted, completed, inspected, guaranteed versus completed, inspected, merely claimed); Architecture lists Deepwood longhouses flatly where the region page says they may appear depending on climate.", "Half the festivals (14 of 28) are names in the calendar with no description.", "No named languages, dialects or scripts anywhere; naming languages and personal-name systems are still open, and several character names stay provisional until they're settled.", "The nomads have no name, no named circuits, families, camps or stopping places. The page says 'the nomads' shouldn't be one culture, but only one mobile people is sketched.", "Deepwood–Sunplains is the only culture mix described (forest raised floors with courtyard shade) where Part 1 found no border town.", "Three border towns have no speech, festival or building detail: Icestep Summit, Darkroot Gulch and Frostbay Way (Frostbay's identity items are listed: Northwind seafaring, Port credit and trade law, ship repair, immigrant merchants, seasonal labor). The Icestep building and speech links and the Stonefield building link are inferred from the general border examples in Architecture and Language and Thought.", "The Spine and Underpass have peoples (Underpass families born underground, pilgrimage traditions, old toll states) but no culture described.", "No in-world sayings about border towns, Spine or Underpass peoples, or the nomads; Greenvale and Sunplains have no hiring shortcut.", "Most region-and-season cells in the festival calendar are blank; the page says only that no major shared festival was defined there (Port has nothing from late spring to late summer).", "No festivals are named for border towns, nomads or fairs, though Harveston Vale keeps festivals built around several harvest calendars and the nomad page mentions moving between fairs and Port's major fairs.", "Port's 'occupations found nowhere else at the same scale' aren't named.", "Root Cellar Night remembers the Seven-year Blight; it will connect when Part 5 (History) is built.", "Religion (Part 4) is only hinted at here: Solstice Lanterns says different faiths explain it differently, Port has blended religious practice, and several festivals imply rites. They'll connect when Part 4 is built."]}, {"part": "Food", "title": "Part 3: Food", "items": ["**No dish is tied to a named festival.** Four recipes mention unnamed \"festival versions\" (Braided Honey and Grain Loaf, Aurora Berry Preserve, Honey-Drizzled Nut Pastries, Blacksmith's / Forged Harvest Stew), and the festivals page names no dishes. Every dish card's Festival row says \"none stated\". The only festival links drawn are two inferred ones for Greenvale (Root Cellar Night, Harvest Home). The pairing of Forged Harvest Stew with Forge Reawakening exists only in the Sunday Morning stories, which are not canon. Name echoes (Aurora Berry Preserve and Aurora Nights; Harvest Stew and Harvest Home) are not links either.", "**Port has no dishes.** Food lists six kinds of Port kitchen (dock-worker, ship, merchant, immigrant neighborhood, street and religious), and the diaspora page gives Port a cooking bias (borrowing, ship food, imported condiments), but there is no Port recipe book and no Port staples, techniques, meals, celebrations or drinks on record. Lean Vigil \"can mark the anxiety of winter shipping and food supply\" but names no food.", "**Deepwood–Ironcrest border food has no dishes.** The Ironcrest page says its border food \"blends strongly with Greenvale and Deepwood\", and Darkroot Gulch sits on that border, but Border Fusions has no Deepwood–Ironcrest section.", "**Three border towns have no border dishes.** Twilighthollow (Deepwood / Highridge), Frostbay Way (Northwind / Port) and Darkroot Gulch (Deepwood / Ironcrest) have no matching section in Border Fusions.", "**Four fusion pairings have no named town, and their borders aren't settled.** Ironcrest–Highridge (likely a border or a short mountain corridor), Greenvale–Deepwood (a working border), Deepwood–Sunplains (likely) and Highridge–Sunplains (unsettled: a border, a corridor, or mediated through Greenvale or Deepwood) have dishes but no border town on record. Border Fusions says that where adjacency changes, those dishes should be treated as trade-route or diaspora dishes. Greenvale–Highridge has a likely border but no dishes.", "**Border-town links are inferred.** Border Fusions doesn't say which town eats which dish; the seven dishes linked to Stonefield Forge, Harveston Vale and Icestep Summit are matched by border pair only.", "**The diaspora model has no dishes of its own on the wiki.** Food Diaspora and Adaptation gives the three-stage model and two illustrative paths (Guardian Stew, Forgefire Roast), and says the host-region versions shouldn't be treated as automatically canonical dishes. Forgefire Roast has no recipe in the Ironcrest book. Diaspora dishes worked out in earlier sessions (such as Forager's Crock, Wildwood Turnover and Listening / Caravan Broth) aren't on any wiki page, so they aren't on the board.", "**Most food imports are unsourced.** Only three are named as imports (Greenvale grain to Ironcrest; Greenvale flour and Sunplains oils or fruit possibly reaching Northwind's wealthier ports), plus food moving both ways between Ironcrest and Greenvale. Border dishes name a few origins in passing (plateau spice in Icefire Brined Fish; Sunplains oil, figs and dried fruit in Sunlit Orchard Grain, Forest-Orchard Medley, Harvest Orchard Salad and Highridge Orchard Pilaf), but Highridge's markets, Sunplains' \"spices from trade\" and Deepwood's \"trade grain and salt\" don't say where the food comes from.", "**Deepwood has no class or variation note** comparable to the other regions', and Port and border cuisine lack most cuisine facts.", "**Food as plot mechanics is stated but not mapped.** Food says shortages, grain prices, fish seasons and road closures should be usable as plot; those links belong to Parts 4 and 7."]}, {"part": "Power", "title": "Part 4: Power", "items": ["**The Council has no names yet.** The wiki's own open questions: the final number of seats, the domains' final names, the six families' names and origins, how seats are inherited, selected, bought or contested, how old the Council is relative to the Convergence, and what rulers know versus rumor. The seat titles on these cards are working titles.", "**Only two seats name the places they reach.** The Materials seat names five regions and the Routes seat names the Underpass. Every other region page names only \"the Council\"; the seat links drawn for them (\"food/finance networks\", \"shipping and finance\", \"Council-linked credit\", \"route costs\", \"infrastructure/resource interests\", \"credit panic\") match a domain word and are marked inferred, off by default. Sunplains names Council involvement but no domain.", "**Every government is still a sketch.** No ruler, capital, dynasty, council or court is named anywhere, and most shapes are hedged (\"likely\", \"could\", \"possible\"). The wiki's open questions ask whether the six regions are kingdoms in the same constitutional sense, how many Sunplains city-states remain, how centralized Deepwood is, what formally governs Highridge, and whether Port has its own citizenship.", "**Three governments have no list of political fights.** Highridge's Politics section lists who holds power but not what they fight over; Port and the Underpass have pressures but no fights section.", "**No faith is placed anywhere.** The nine traditions span borders by design, but none has a named institution, leader, school or holy site, and none is tied to a region, border town or Port (Port has \"blended religious practices\"; Highridge has \"religious institutions\"; Deepwood has \"sacred jurisdictions\", all unnamed).", "**Four faiths have no stated stance on the Council.** The Cyclic Order, the Eternal Forge, the Harmonious Path and the Dual Flame have schemes but no Council link; the Silent Whisper's \"elite secrecy\" link is inferred. The Harmonious Path's parallel arbitration and the Dual Flame's counselors spotting a shared source point at current events, which belong to Part 7.", "**Only three guilds have names, and they're flagged.** The Warrior's, Assassin's and Spy Guilds come from earlier notes and \"should be developed carefully\". No guild has the leadership, branches, reformers or funding model the guild rule asks for, the metalworking factions are unnamed, and only the Highridge caravan organizations are placed in a region (the other placements shown are inferred).", "**No criminal organization is named.** The Crime page gives regional opportunities and five scales, but no gang, syndicate or family; the cross-regional alliance (Port finances, Underpass moves goods, Highridge supplies documents, Northwind moves cargo) is an example. The Underpass has no section on the Crime page.", "**No elite unit is named.** Each region has an elite direction, but no formation has the recruitment tradition, reputation, speech, initiation, uniform, conduct rules or patrons the cultural-behavior rule asks for. Port and the Underpass have no everyday-arms list.", "**The Villain and Wurdren appear as facts, not links.** The Council, guild, underworld and politics pages all describe how each deals with them; those links wait for Part 6 (People), and the pressures and schemes that are really events wait for Part 7."]}, {"part": "History", "title": "Part 5: History", "items": ["**There is no timeline.** No page gives a date, a duration or an overall chronology for anything before or at the Convergence (the Council's rise is a six-step sequence and the Port Seizure tradition has an order, but neither is dated), and Contested Memory says exact dates, participants and outcomes are not locked; the source that supplied dates was deliberately kept provisional. How old the Council is relative to the Convergence is an open question.", "**The nine conflict names have no content.** Ore Scar Strife, Lowland Famine Raids, Coldwave Incursions, Ridge Pass Toll Wars, Orchard-Lord Feuds, Deepwood Edge Skirmishes, Iron-Field Conquest, Great Coastal Skirmish and Highridge Consolidation War are names from earlier brainstorming, flagged to be revised into overlapping campaigns. None has participants, place or outcome; five are placed here only by their names (inferred, off by default).", "**The four contested memories aren't tied to those nine names.** The Ember Wars, Salted Coast Disputes, Timber Tithes and Port Seizure may describe some of the same conflicts, but no page says which.", "**The Convergence's details are open.** Where it was negotiated (Highridge is only the strongest candidate), what its provisions actually said (the page says it \"likely included\" them), which goods gained protected movement, and which Underpass sections, if any, got access rules.", "**Deepwood and Sunplains have no stated legacy** from their pre-Convergence history on their region pages, unlike Ironcrest, Northwind, Greenvale and Highridge.", "**Port's early history is undated and unplaced.** How Port became central is described, but not whether it happened before, during or after the Convergence, and the Port Seizure is explicitly not settled chronology.", "**Name echoes are not links.** The Ages of Silence and the Deep Silence festival, and the Ember Wars and Ember Remembrance, share words, but no page connects them. Ember Remembrance is a solemn memorial with names on memorial walls; it names no conflict.", "**The Seven-year Blight and the Ages of Silence have only one side.** Each is one region's memory, with no neighbor's or border version yet, unlike the four contested memories.", "**The Spine's geologic history** (rifting and mountain-building) is left to Part 1's geography and is itself provisional."]}], "part (function () {
  if (!DATA) return;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gh = (p) => DATA.repo + p;
  const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
  const laneOf = Object.fromEntries(DATA.lanes.map((l) => [l.id, l]));
  const colorVar = (laneId) => `var(--r-${laneId}, var(--r-across))`;
  const nodeColor = (n) => colorVar(n.lane);
  const SCHEMA = DATA.schema || {};
  const partOn = Object.fromEntries(DATA.parts.map((p) => [p.short, true]));
  const inferredOn = () => $("optInferred").checked;
  const visibleEdge = (e) => partOn[byId[e.from].part] && partOn[byId[e.to].part] && (e.basis === "stated" || inferredOn());

  $("eyebrow").textContent = DATA.eyebrow || "Atlas";
  $("title").textContent = DATA.title;
  $("sub").textContent = DATA.subtitle || "";
  const stated = DATA.edges.filter((e) => e.basis === "stated").length;
  $("counts").innerHTML = DATA.parts.map((p) => `<span class="count"><b>${DATA.nodes.filter((n) => n.part === p.short).length}</b>${esc(p.short.toLowerCase())}</span>`).join("") +
    `<span class="count"><b>${DATA.edges.length}</b>connections (${stated} stated)</span>`;
  $("parts").innerHTML = DATA.parts.length > 1 ? `Show: <button type="button" class="only" data-all>all</button> ` + DATA.parts.map((p) => `<span class="partsw"><label title="Part ${p.part}: ${esc(p.title)}"><input type="checkbox" data-part="${esc(p.short)}" checked> ${esc(p.short)}</label><button type="button" class="only" data-only="${esc(p.short)}" aria-label="Show only ${esc(p.short)}">only</button></span>`).join("") : "";

  // each end of a connection: which row it sits in, and a short note
  const end = (e, fromSide) => fromSide ? { row: e.chip || e.type, note: e.chipNote } : { row: e.chipBack || e.chip || e.type, note: e.chipNoteBack };

  // Two layouts over the same cards. Region: a column per region (plus Port, the Spine, the border towns,
  // cross-border columns later parts add, and the world as a whole), a heading per part and section.
  // Kind: a column per kind of thing; long columns get a heading per region; a part's kinds with only one or two
  // cards share a "<Part>: other" column so the board doesn't sprawl sideways.
  const lanesEl = $("lanes");
  const cardEls = {};
  let mode = "region";
  const kindOrder = [];
  DATA.nodes.forEach((n) => { if (!kindOrder.includes(n.kind)) kindOrder.push(n.kind); });
  const laneRank = Object.fromEntries(DATA.lanes.map((l, i) => [l.id, i]));
  function makeLane(label, color, count) {
    const lane = document.createElement("div");
    lane.className = "lane"; lane.style.setProperty("--lc", color);
    lane.innerHTML = `<h3>${esc(label)}${count != null ? `<span class="num">${count}</span>` : ""}</h3>`;
    return lane;
  }
  function makeSection(part, title, items) {
    const s = document.createElement("div");
    s.className = "section" + (title ? "" : " flat"); s.dataset.part = part;
    s.innerHTML = (title ? `<button type="button" class="sechead" aria-expanded="true"><span class="chev" aria-hidden="true">▸</span>${esc(title)} <span class="num">${items.length}</span></button>` : "") + `<div class="cards"></div>`;
    const box = s.querySelector(".cards");
    items.forEach((n) => box.appendChild(cardEls[n.id]));
    if (title) s.querySelector(".sechead").addEventListener("click", (ev) => {
      const open = s.classList.toggle("shut") === false;
      ev.currentTarget.setAttribute("aria-expanded", String(open));
      if (current) drawLinks(current);
    });
    return s;
  }
  function kindLine(n, withKind) {
    const where = mode === "kind" ? (withKind ? `${DATA.kinds[n.kind]} · ${laneOf[n.lane].label}` : laneOf[n.lane].label) : DATA.kinds[n.kind];
    return where + (n.when ? ` · ${n.when}` : "");
  }
  function layout(m) {
    mode = m;
    lanesEl.querySelectorAll(".lane").forEach((l) => l.remove());
    const more = new Set();
    if (m === "region") {
      DATA.lanes.forEach((l) => {
        const inLane = DATA.nodes.filter((n) => n.lane === l.id);
        if (!inLane.length) return;
        const lane = makeLane(l.label, colorVar(l.id));
        [...new Set(inLane.map((n) => n.part + "\u0000" + n.section))].forEach((key) => {
          const [part, sec] = key.split("\u0000");
          lane.appendChild(makeSection(part, sec, inLane.filter((n) => n.part === part && n.section === sec)));
        });
        lanesEl.appendChild(lane);
      });
    } else {
      const byRegion = (a, b) => laneRank[a.lane] - laneRank[b.lane];
      DATA.parts.forEach((p) => {
        const kinds = kindOrder.filter((k) => DATA.nodes.some((n) => n.kind === k && n.part === p.short));
        const small = [];
        const tiny = kinds.filter((k) => DATA.nodes.filter((n) => n.kind === k && n.part === p.short).length < 3);
        kinds.forEach((k) => {
          const items = DATA.nodes.filter((n) => n.kind === k && n.part === p.short).sort(byRegion);
          if (tiny.length > 1 && tiny.includes(k)) { small.push(...items); return; }
          const lane = makeLane(DATA.kinds[k], "var(--muted)", items.length);
          if (items.length > 10) {
            DATA.lanes.forEach((l) => { const inL = items.filter((n) => n.lane === l.id); if (inL.length) lane.appendChild(makeSection(p.short, l.label, inL)); });
          } else lane.appendChild(makeSection(p.short, "", items));
          lanesEl.appendChild(lane);
        });
        if (small.length) {
          small.forEach((n) => more.add(n.id));
          const lane = makeLane(`${p.short}: other`, "var(--muted)", small.length);
          lane.appendChild(makeSection(p.short, "", small));
          lanesEl.appendChild(lane);
        }
      });
    }
    Object.entries(cardEls).forEach(([id, c]) => { c.querySelector(".k").textContent = kindLine(byId[id], more.has(id)); });
    document.querySelectorAll("#groupBy [data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  }

  function chipsFor(n) {
    const layout = (SCHEMA[n.kind] || { rows: [] }).rows;
    const skip = n.skip_rows || [];
    const rows = Object.fromEntries(layout.map((r) => [r.label, []]));
    DATA.edges.forEach((e) => {
      let other, side;
      if (e.from === n.id) { other = e.to; side = end(e, true); }
      else if (e.to === n.id) { other = e.from; side = end(e, false); }
      else return;
      if (e.hideChipOn && e.hideChipOn.includes(n.id)) return;
      const o = byId[other];
      const cert = e.certainty && e.certainty !== "established" ? e.certainty : "";
      const cls = [e.basis === "inferred" ? "inferred" : "", cert].join(" ");
      const goods = e.goods && e.chipGoods !== false ? ` <small>${esc(e.goods)}</small>` : "";
      const notes = [side.note, cert].filter(Boolean).join(", ");
      (rows[side.row] = rows[side.row] || []).push(`<span class="chip ${cls}" data-basis="${e.basis}" style="--dc:${nodeColor(o)}"><i></i><span>${esc(o.short || o.label)}${goods}${notes ? ` <small>(${esc(notes)})</small>` : ""}</span></span>`);
    });
    return layout.filter((r) => !skip.includes(r.label) && (rows[r.label].length || r.always)).map((r) =>
      `<span class="chiprow" data-rowpart="${esc(r.part)}"${r.always ? " data-always" : ""}><b>${esc(r.label)}</b>${rows[r.label].length ? rows[r.label].join("") + `<span class="none" hidden>none stated</span>` : `<span class="none">none stated</span>`}</span>`).join("");
  }
  function card(n) {
    const c = document.createElement("div");
    c.className = `card ${n.kind}${n.minor ? " minor" : ""}`;
    c.style.setProperty("--lc", nodeColor(n));
    c.dataset.id = n.id;
    const k = esc(DATA.kinds[n.kind]) + (n.when ? ` · ${esc(n.when)}` : "");
    const chips = chipsFor(n);
    const text = n.minor ? "" : `<span class="t">${esc(n.short_text || n.text)}</span>`;
    const hasBody = !!(text || chips);
    c.innerHTML = `<div class="head"><button type="button" class="pick"><span class="k">${k}</span><span class="n">${esc(n.label)}</span></button>` +
      (hasBody ? `<button type="button" class="tog" aria-expanded="false" aria-label="Show details for ${esc(n.label)}"><span class="chev" aria-hidden="true">▸</span></button>` : "") +
      `</div>` + (hasBody ? `<div class="body" hidden>${text}${chips ? `<span class="chips">${chips}</span>` : ""}</div>` : "");
    c.querySelector(".pick").addEventListener("click", () => select(n.id));
    if (hasBody) c.querySelector(".tog").addEventListener("click", () => { setOpen(c, c.querySelector(".body").hidden); if (current) drawLinks(current); });
    cardEls[n.id] = c;
    return c;
  }
  DATA.nodes.forEach((n) => card(n));
  function setOpen(c, open) {
    const body = c.querySelector(".body"), tog = c.querySelector(".tog");
    if (!body) return;
    body.hidden = !open;
    tog.setAttribute("aria-expanded", String(open));
    tog.setAttribute("aria-label", `${open ? "Hide" : "Show"} details for ${byId[c.dataset.id].label}`);
  }
  let allOpen = false;
  function expandAll(open) {
    allOpen = open;
    Object.values(cardEls).forEach((c) => setOpen(c, open));
    $("expandAll").textContent = open ? "Close all cards" : "Open all cards";
    if (current) drawLinks(current);
  }
  window.atlasExpandAll = expandAll;
  $("expandAll").addEventListener("click", () => expandAll(!allOpen));

  // what's showing: parts, inferred links, search
  function refresh() {
    const q = $("q").value.trim().toLowerCase();
    document.querySelectorAll(".section").forEach((s) => { s.hidden = !partOn[s.dataset.part]; });
    Object.entries(cardEls).forEach(([id, el]) => {
      const n = byId[id];
      const hay = [n.label, n.text, n.when || "", ...Object.values(n.facts || {})].join(" ").toLowerCase();
      el.classList.toggle("dimmed", !!q && !hay.includes(q));
    });
    // tags describe their own card, so they stay when the other end's part is off; inferred ones wait for the box
    document.querySelectorAll(".chip").forEach((c) => { c.hidden = c.dataset.basis === "inferred" && !inferredOn(); });
    document.querySelectorAll(".chiprow").forEach((r) => {
      const hasChips = !!r.querySelector(".chip"), anyShown = !!r.querySelector(".chip:not([hidden])");
      // an "always" row whose only tags are hidden inferred ones still says so, instead of vanishing
      r.hidden = !hasChips ? !partOn[r.dataset.rowpart] : anyShown ? false : !("always" in r.dataset) || !partOn[r.dataset.rowpart];
      const none = r.querySelector(".none");
      if (none && hasChips) none.hidden = anyShown;
    });
    lanesEl.querySelectorAll(".lane").forEach((l) => { l.hidden = !l.querySelector(".section:not([hidden])"); });
    writeHash();
    document.querySelectorAll("#gaps [data-part]").forEach((g) => { g.hidden = !partOn[g.dataset.part]; });
    if (current && !partOn[byId[current].part]) select(null); else if (current) select(current);
  }
  window.atlasShowOnly = (short) => showOnly([short]);

  // lines for the selected card only
  const board = $("board"), svg = $("links");
  function drawLinks(id) {
    svg.innerHTML = "";
    if (!id) return;
    const W = lanesEl.scrollWidth, H = lanesEl.scrollHeight;
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const base = lanesEl.getBoundingClientRect();
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    const a = box(cardEls[id]);
    DATA.edges.forEach((e) => {
      if (e.from !== id && e.to !== id) return;
      if (!visibleEdge(e)) return;
      const other = e.from === id ? e.to : e.from;
      const el = cardEls[other];
      if (!el || el.offsetParent === null) return;
      const b = box(el);
      const right = b.x > a.x + a.w / 2;
      const sameLane = Math.abs(b.x - a.x) < 20;
      const ya = a.y + Math.min(a.h / 2, 24), yb = b.y + Math.min(b.h / 2, 24);
      let d;
      if (sameLane) {
        const x = a.x + a.w;
        d = `M${x},${ya} C${x + 40},${ya} ${x + 40},${yb} ${x},${yb}`;
      } else {
        const sx = right ? a.x + a.w : a.x, tx = right ? b.x : b.x + b.w;
        const dx = Math.max(40, Math.abs(tx - sx) / 2.5) * (right ? 1 : -1);
        d = `M${sx},${ya} C${sx + dx},${ya} ${tx - dx},${yb} ${tx},${yb}`;
      }
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("class", `${e.basis === "inferred" ? "inferred" : ""} ${e.certainty || ""}`);
      svg.appendChild(p);
    });
  }

  let current = null;
  const layerName = Object.fromEntries((DATA.layers || []).map((l) => [l.id, l.label]));
  const pageName = (s) => s.split("#")[0].split("/").pop().replace(/\.md$/, "").replace(/-/g, " ");
  function select(id) {
    current = id;
    Object.values(cardEls).forEach((c) => c.classList.remove("hot", "sel"));
    board.classList.toggle("focus", !!id);
    if (!id) { drawLinks(null); intro(); return; }
    const n = byId[id];
    cardEls[id].classList.add("hot", "sel");
    DATA.edges.filter((e) => (e.from === id || e.to === id) && visibleEdge(e)).forEach((e) => { const o = e.from === id ? e.to : e.from; cardEls[o] && cardEls[o].classList.add("hot"); });
    drawLinks(id);
    const groups = {};
    DATA.edges.filter((e) => e.from === id || e.to === id).forEach((e) => { (groups[e.group || e.layer] = groups[e.group || e.layer] || []).push(e); });
    const fs = n.fact_src || {}, fv = n.facts || {};
    const layout = ((SCHEMA[n.kind] || {}).facts || []).filter((f) => fv[f.key] || f.always);
    const facts = layout.length ? `<dl>${layout.map((f) => fv[f.key]
      ? `<dt>${esc(f.key)}</dt><dd>${esc(fv[f.key])}${fs[f.key] ? `<a class="src" href="${gh(fs[f.key])}" target="_blank" rel="noopener">source</a>` : ""}</dd>`
      : `<dt>${esc(f.key)}</dt><dd class="missing">Not in the wiki yet.</dd>`).join("")}</dl>` : "";
    const html = Object.entries(groups).map(([g, es]) => `<h4>${esc(layerName[g] || g)}</h4><ul>${es.map((e) => {
      const other = e.from === id ? e.to : e.from;
      const lab = e.from === id ? e.type : (e.chipBack || e.type);
      return `<li class="conn ${e.basis}"><span>${esc(lab)} </span><button type="button" data-go="${other}">${esc(byId[other].label)}</button>${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " (" + esc(a.note) + ")" : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    const see = (n.see || []).length ? ` · also on ${n.see.map((s) => `<a href="${gh(s)}" target="_blank" rel="noopener">${esc(pageName(s))}</a>`).join(", ")}` : "";
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])}${n.when ? " · " + esc(n.when) : ""} · ${esc(laneOf[n.lane].label)}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span><p>${esc(n.text)}</p>${facts}${html}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>${see}`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToCard(b.dataset.go); }));
  }
  function scrollToCard(id) {
    const el = cardEls[id]; if (!el) return;
    const sec = el.closest(".section");
    if (sec && sec.classList.contains("shut")) { sec.classList.remove("shut"); sec.querySelector(".sechead").setAttribute("aria-expanded", "true"); drawLinks(current); }
    const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.left < br.left || r.right > br.right || r.top < br.top || r.bottom > br.bottom)
      board.scrollBy({ left: r.left - br.left - br.width / 3, top: r.top - br.top - 60, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function intro() {
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2><p>${esc(DATA.intro || "")}</p>`;
  }
  board.addEventListener("click", (ev) => { if (!ev.target.closest(".card") && !ev.target.closest(".sechead")) select(null); });

  // Shareable state: #part=Food (one or more parts, comma-separated) and #group=kind. The grouping is also
  // remembered per viewer; the link wins when it says something.
  function writeHash() {
    try {
      const on = DATA.parts.filter((p) => partOn[p.short]).map((p) => p.short);
      const q = [];
      if (on.length && on.length < DATA.parts.length) q.push("part=" + on.map(encodeURIComponent).join(","));
      if (mode === "kind") q.push("group=kind");
      history.replaceState(null, "", location.pathname + location.search + (q.length ? "#" + q.join("&") : ""));
    } catch (e) { /* some hosts don't allow it; the board still works */ }
  }
  function readHash() {
    const out = {};
    try {
      location.hash.slice(1).split("&").forEach((kv) => { const [k, v] = kv.split("="); if (k && v) out[k] = decodeURIComponent(v); });
    } catch (e) { /* ignore */ }
    return out;
  }
  function setGroup(m) {
    const keep = current;
    layout(m);
    try { localStorage.setItem("atlas-group", m); } catch (e) { /* per-viewer nicety only */ }
    refresh();
    if (allOpen) expandAll(true);
    if (keep && byId[keep] && partOn[byId[keep].part]) { select(keep); scrollToCard(keep); }
  }
  function showOnly(shorts) {
    Object.keys(partOn).forEach((k) => { partOn[k] = shorts.includes(k); });
    document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; });
    refresh();
  }
  document.querySelectorAll("#groupBy [data-mode]").forEach((b) => b.addEventListener("click", () => setGroup(b.dataset.mode)));
  document.querySelectorAll("[data-only]").forEach((b) => b.addEventListener("click", () => showOnly([b.dataset.only])));
  document.querySelectorAll("[data-all]").forEach((b) => b.addEventListener("click", () => showOnly(Object.keys(partOn))));
  window.atlasGroupBy = (m) => { layout(m); refresh(); };

  $("q").addEventListener("input", refresh);
  $("optInferred").addEventListener("change", refresh);
  document.querySelectorAll("input[data-part]").forEach((c) => c.addEventListener("change", () => { partOn[c.dataset.part] = c.checked; refresh(); }));
  window.addEventListener("resize", () => { if (current) drawLinks(current); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) drawLinks(current); });

  $("gaps").innerHTML = DATA.gaps.filter((g) => g.items.length).map((g) => `<div data-part="${esc(g.part)}"><h3>${esc(g.title)}</h3><ul>${g.items.map((x) => `<li>${esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`).join("")}</ul></div>`).join("");
  const start = readHash();
  let group = start.group === "kind" || start.group === "region" ? start.group : null;
  if (!group) { try { group = localStorage.getItem("atlas-group"); } catch (e) { group = null; } }
  layout(group === "kind" ? "kind" : "region");
  if (start.part) {
    const want = start.part.split(",").map((x) => x.trim().toLowerCase());
    const hit = Object.keys(partOn).filter((k) => want.includes(k.toLowerCase()));
    if (hit.length) Object.keys(partOn).forEach((k) => { partOn[k] = hit.includes(k); });
    document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; });
  }
  select(null);
  refresh();
})();
</script>

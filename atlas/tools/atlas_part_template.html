<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: an atlas plate. A schematic network on the left (positions are not geography), a reading panel on the right, gaps and unplaced names below. Region colors are shared by every Atlas part. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1c2420; --muted: #5c6863; --line: #d3d9d5; --plate: #fbfcfa;
  --focus: #0f766e; --inferred: #9a6b1f; --sea: #3b6ea8; --rock: #7b6f64;
  --r-northwind: #3f6f9f; --r-ironcrest: #a4522f; --r-greenvale: #5f9433; --r-highridge: #b98f22; --r-deepwood: #2e6a4d; --r-sunplains: #d0702a; --r-port: #6c4f9c; --r-none: #7b6f64;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --plate: #151a18;
    --focus: #3cc4b3; --inferred: #e0a852; --sea: #79a8dc; --rock: #b3a699;
    --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-none: #b3a699; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --plate: #151a18;
  --focus: #3cc4b3; --inferred: #e0a852; --sea: #79a8dc; --rock: #b3a699;
  --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-none: #b3a699; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 20px 40px; max-width: 1480px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; margin-bottom: 10px; }
.eyebrow { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.count { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.count b { font-family: var(--font-display); font-size: 1.3rem; margin-right: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 10px 0 12px; font-size: 13px; color: var(--muted); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.controls input { accent-color: var(--focus); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.plate { background: var(--plate); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.plate svg { display: block; width: 100%; min-width: 760px; height: auto; }
.hint { font-size: 12px; color: var(--muted); padding: 8px 12px 10px; border-top: 1px solid var(--line); }
svg text { font-family: var(--font-body); fill: var(--ink); }
svg .lbl { font-weight: 600; font-size: 13px; paint-order: stroke; stroke: var(--plate); stroke-width: 4px; stroke-linejoin: round; }
svg .lbl.big { font-family: var(--font-display); font-size: 17px; letter-spacing: .02em; font-weight: 700; }
svg .lbl.land { font-family: var(--font-display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; fill: var(--muted); font-weight: 600; }
svg .node { cursor: pointer; }
svg .node:focus { outline: none; }
svg .node:focus-visible .shape { stroke: var(--focus); stroke-width: 4; }
svg .edge { fill: none; stroke-linecap: round; transition: opacity .15s; }
svg .edge.border { stroke: var(--ink); }
svg .edge.town { stroke: var(--muted); stroke-width: 1.2; opacity: .55; }
svg .edge.sea { stroke: var(--sea); stroke-width: 2; stroke-dasharray: 8 5; }
svg .edge.mountain { stroke: var(--rock); stroke-width: 2; stroke-dasharray: 2 5; }
svg .edge.trade { stroke: var(--focus); stroke-width: 1.8; opacity: .75; }
svg .edge.inferred { stroke: var(--inferred); stroke-dasharray: 3 4; opacity: .85; }
svg .edge.landmass { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 1 4; }
svg.focus .edge { opacity: .08; }
svg.focus .edge.hot { opacity: 1; stroke-width: 3; }
svg.focus .node { opacity: .3; }
svg.focus .node.hot { opacity: 1; }
svg .node.sel .shape { stroke: var(--focus); stroke-width: 4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); padding: 10px 12px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 30px; height: 10px; min-width: 0; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 86vh; overflow: auto; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 2px 0 6px; line-height: 1.05; text-wrap: balance; }
.panel h4 { font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.panel dl { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0 0; }
.panel dt { font-size: 12px; color: var(--muted); }
.panel dd { margin: 0 0 4px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conn { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
.conn.inferred { border-left-color: var(--inferred); }
.conn button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.conn button:hover { text-decoration-color: var(--focus); }
.conn q { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.conn a { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.tag.inferred { color: var(--inferred); border-color: var(--inferred); }
.panel a { color: var(--focus); }
.status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.below section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.below h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 8px; }
.below ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px dashed var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip:hover { border-style: solid; }
@media (prefers-reduced-motion: reduce) { svg .edge { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow" id="eyebrow">Atlas</span>
      <h1 id="title">Atlas</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="controls" id="controls"></div>
  <div class="layout">
    <div class="plate">
      <svg id="map" viewBox="0 0 1000 700" role="img" aria-label="Schematic network"></svg>
      <div class="legend" id="legend"></div>
      <div class="hint">Click anything to read about it and see every connection with the wiki text behind it. Positions are schematic, not geography.</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <div class="below">
    <section><h2>Gaps this part exposes</h2><ul id="gaps"></ul></section>
    <section><h2>Unplaced names</h2><div class="chips" id="unplaced"></div><p class="hint" style="border:0;padding:8px 0 0">Names from earlier brainstorming, kept until the map and naming systems are settled.</p></section>
  </div>
</div>

<script>
const DATA = /*ATLAS_DATA*/null;
(function () {
  if (!DATA) return;
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
  const gh = (p) => DATA.repo + p;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const REGION_VAR = { northwind: "--r-northwind", ironcrest: "--r-ironcrest", greenvale: "--r-greenvale", highridge: "--r-highridge", deepwood: "--r-deepwood", sunplains: "--r-sunplains", port: "--r-port" };

  $("eyebrow").textContent = `Atlas · Part ${DATA.part}`;
  $("title").textContent = DATA.title;
  $("sub").textContent = DATA.subtitle || "";
  const kc = {}; DATA.nodes.forEach((n) => { kc[n.kind] = (kc[n.kind] || 0) + 1; });
  const stated = DATA.edges.filter((e) => e.basis === "stated").length;
  $("counts").innerHTML = Object.entries(kc).map(([k, v]) => `<span class="count"><b>${v}</b>${esc(DATA.kinds[k].toLowerCase())}${v > 1 ? "s" : ""}</span>`).join("") +
    `<span class="count"><b>${DATA.edges.length}</b>connections (${stated} stated)</span>`;

  // layer toggles
  const on = {};
  $("controls").innerHTML = "<span>Show:</span>" + DATA.layers.map((l) => {
    on[l.id] = l.default; return `<label><input type="checkbox" data-layer="${l.id}" ${l.default ? "checked" : ""}> ${esc(l.label)}</label>`;
  }).join("");

  // color for a node: its own region, or the region it borders first, else neutral
  function colorOf(n) {
    if (REGION_VAR[n.id]) return `var(${REGION_VAR[n.id]})`;
    return "var(--r-none)";
  }

  const svg = $("map");
  const gEdges = document.createElementNS(NS, "g");
  const gNodes = document.createElementNS(NS, "g");
  svg.innerHTML = `<defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--focus)"/></marker>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--inferred)"/></marker></defs>`;
  svg.appendChild(gEdges); svg.appendChild(gNodes);

  const R = { region: 34, hub: 24, mountains: 26, underground: 22, "border-town": 9, landmass: 0 };
  const placed = DATA.nodes.filter((n) => typeof n.x === "number");

  // edges, with parallel edges between the same pair fanned out
  const pairIdx = {};
  const edgeEls = [];
  DATA.edges.forEach((e) => {
    const a = byId[e.from], b = byId[e.to];
    if (typeof a.x !== "number" || typeof b.x !== "number") return;
    const key = [e.from, e.to].sort().join("|");
    pairIdx[key] = (pairIdx[key] || 0) + 1;
    const k = pairIdx[key] - 1;
    const curved = e.layer === "trade" || e.layer === "trade-inferred";
    const dir = e.from < e.to ? 1 : -1;
    const bend = curved ? (18 + 16 * k) * dir : 0;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const ra = (R[a.kind] || 10) + 4, rb = (R[b.kind] || 10) + (curved ? 8 : 4);
    const sx = a.x + dx / len * ra, sy = a.y + dy / len * ra, tx = b.x - dx / len * rb, ty = b.y - dy / len * rb;
    const mx = (sx + tx) / 2 + nx * bend, my = (sy + ty) / 2 + ny * bend;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", curved ? `M${sx},${sy} Q${mx},${my} ${tx},${ty}` : `M${sx},${sy} L${tx},${ty}`);
    let cls = `edge ${e.layer === "trade-inferred" ? "trade inferred" : e.layer}`;
    if (e.layer === "border") {
      const c = e.certainty || "established";
      p.style.strokeWidth = c === "established" ? 4 : c === "possible" ? 1.6 : 2.2;
      if (c !== "established") p.style.strokeDasharray = c === "possible" ? "2 5" : "9 5";
      p.style.opacity = c === "established" ? .55 : .5;
    }
    p.setAttribute("class", cls);
    if (curved) p.setAttribute("marker-end", e.basis === "inferred" ? "url(#aI)" : "url(#aT)");
    const t = document.createElementNS(NS, "title");
    t.textContent = `${a.label} ${e.type} ${b.label}${e.goods ? ": " + e.goods : ""}${e.certainty ? " (" + e.certainty + ")" : ""}`;
    p.appendChild(t);
    gEdges.appendChild(p);
    edgeEls.push({ e, p });
  });

  // nodes
  const nodeEls = {};
  placed.forEach((n) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node");
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", `${n.label}, ${DATA.kinds[n.kind]}`);
    g.dataset.id = n.id;
    const col = colorOf(n);
    let shape = "";
    if (n.kind === "region") shape = `<circle class="shape" cx="${n.x}" cy="${n.y}" r="34" style="fill:${col};fill-opacity:.9;stroke:var(--plate);stroke-width:3"/>`;
    else if (n.kind === "hub") shape = `<rect class="shape" x="${n.x - 24}" y="${n.y - 24}" width="48" height="48" rx="10" style="fill:${col};stroke:var(--plate);stroke-width:3"/>`;
    else if (n.kind === "mountains") shape = `<path class="shape" d="M${n.x - 30},${n.y + 20} L${n.x - 8},${n.y - 22} L${n.x + 4},${n.y - 4} L${n.x + 14},${n.y - 18} L${n.x + 32},${n.y + 20} Z" style="fill:var(--rock);stroke:var(--plate);stroke-width:2"/>`;
    else if (n.kind === "underground") shape = `<rect class="shape" x="${n.x - 24}" y="${n.y - 14}" width="48" height="28" rx="14" style="fill:var(--plate);stroke:var(--rock);stroke-width:2.5;stroke-dasharray:4 3"/>`;
    else if (n.kind === "border-town") shape = `<path class="shape" d="M${n.x},${n.y - 10} L${n.x + 10},${n.y} L${n.x},${n.y + 10} L${n.x - 10},${n.y} Z" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>`;
    const isBig = n.kind === "region" || n.kind === "hub";
    let ly = n.y + (R[n.kind] || 10) + (isBig ? 20 : 16);
    if (n.kind === "landmass") ly = n.y;
    const cls = n.kind === "landmass" ? "lbl land" : isBig ? "lbl big" : "lbl";
    g.innerHTML = shape + `<text class="${cls}" x="${n.x}" y="${ly}" text-anchor="middle">${esc(n.label)}</text>`;
    g.addEventListener("click", () => select(n.id));
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
    g.addEventListener("mouseenter", () => hover(n.id));
    g.addEventListener("mouseleave", () => hover(null));
    gNodes.appendChild(g);
    nodeEls[n.id] = g;
  });

  function visible(e) { return on[e.layer]; }
  function applyLayers() {
    edgeEls.forEach(({ e, p }) => { p.style.display = visible(e) ? "" : "none"; });
    placed.forEach((n) => { if (n.kind === "landmass") nodeEls[n.id].style.display = on.landmass ? "" : "none"; });
  }
  document.querySelectorAll("[data-layer]").forEach((c) => c.addEventListener("change", () => { on[c.dataset.layer] = c.checked; applyLayers(); if (current) select(current); }));
  applyLayers();

  let current = null;
  function light(id) {
    svg.classList.add("focus");
    Object.values(nodeEls).forEach((g) => g.classList.remove("hot", "sel"));
    edgeEls.forEach(({ p }) => p.classList.remove("hot"));
    if (nodeEls[id]) nodeEls[id].classList.add("hot", "sel");
    edgeEls.forEach(({ e, p }) => {
      if (!visible(e)) return;
      if (e.from === id || e.to === id) { p.classList.add("hot"); [e.from, e.to].forEach((x) => nodeEls[x] && nodeEls[x].classList.add("hot")); }
    });
  }
  function clear() { svg.classList.remove("focus"); Object.values(nodeEls).forEach((g) => g.classList.remove("hot", "sel")); edgeEls.forEach(({ p }) => p.classList.remove("hot")); }
  function hover(id) { if (current) return; if (id) light(id); else clear(); }

  function select(id) {
    current = id;
    if (!id) { clear(); intro(); return; }
    light(id);
    const n = byId[id];
    const conns = DATA.edges.filter((e) => e.from === id || e.to === id);
    const groups = {};
    conns.forEach((e) => { (groups[e.layer] = groups[e.layer] || []).push(e); });
    const layerName = Object.fromEntries(DATA.layers.map((l) => [l.id, l.label]));
    const facts = n.facts ? `<dl>${Object.entries(n.facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
    const groupHtml = DATA.layers.filter((l) => groups[l.id]).map((l) => `<h4>${esc(layerName[l.id])}${on[l.id] ? "" : " (hidden on map)"}</h4><ul>${groups[l.id].map((e) => {
      const other = e.from === id ? e.to : e.from;
      const phrase = e.from === id ? `${esc(e.type)} <button type="button" data-go="${other}">${esc(byId[other].label)}</button>` : `<button type="button" data-go="${other}">${esc(byId[other].label)}</button> ${esc(e.type)} this`;
      return `<li class="conn ${e.basis}">${phrase}${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " — " + esc(a.note) : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span>
      <p>${esc(n.text)}</p>${facts}
      ${groupHtml || "<p class='hint' style='border:0;padding:0'>No connections in this part.</p>"}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => select(b.dataset.go)));
  }
  function intro() {
    const swatch = (v, l) => `<li><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:var(${v});vertical-align:-1px;margin-right:6px"></span>${l}</li>`;
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2>
      <p>${esc(DATA.intro || "")}</p>
      <h4>Regions</h4><ul>${swatch("--r-northwind", "Northwind")}${swatch("--r-ironcrest", "Ironcrest")}${swatch("--r-greenvale", "Greenvale")}${swatch("--r-highridge", "Highridge Plateau")}${swatch("--r-deepwood", "Deepwood")}${swatch("--r-sunplains", "Sunplains")}${swatch("--r-port", "Port")}</ul>
      <p class="hint" style="border:0;padding:10px 0 0">Every connection shows the wiki sentence behind it. Amber dotted arrows are inferred from the wiki, not stated by it.</p>`;
  }
  svg.addEventListener("click", (ev) => { if (ev.target === svg) select(null); });

  // legend
  const leg = (style, label, marker) => `<span><svg viewBox="0 0 30 10"><path d="M2,5 L28,5" style="${style}" ${marker ? `marker-end="url(#${marker})"` : ""}/></svg>${label}</span>`;
  $("legend").innerHTML = [
    leg("stroke:var(--ink);stroke-width:4;opacity:.55", "established border"),
    leg("stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 3;opacity:.6", "likely or working border"),
    leg("stroke:var(--ink);stroke-width:1.6;stroke-dasharray:2 4;opacity:.6", "possible border"),
    leg("stroke:var(--sea);stroke-width:2;stroke-dasharray:6 4", "sea partner"),
    leg("stroke:var(--rock);stroke-width:2;stroke-dasharray:2 4", "Spine and Underpass"),
    leg("stroke:var(--focus);stroke-width:2", "trade (stated)"),
    leg("stroke:var(--inferred);stroke-width:2;stroke-dasharray:3 3", "trade (inferred)"),
  ].join("");

  // below
  $("gaps").innerHTML = (DATA.gaps || []).map((g) => `<li>${esc(g)}</li>`).join("");
  const unplaced = DATA.nodes.filter((n) => typeof n.x !== "number");
  $("unplaced").innerHTML = unplaced.length ? unplaced.map((n) => `<button type="button" class="chip" data-go="${n.id}">${esc(n.label)}</button>`).join("") : "<span class='hint'>None.</span>";
  $("unplaced").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => select(b.dataset.go)));

  select(null);
})();
</script>

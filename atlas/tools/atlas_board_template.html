<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: an atlas board. One column per region (plus Port, the Spine, the border towns and the world as a whole); cards grouped under headings that later parts add to, so the board grows downward.
   Cards collapse to kind + name; open, they show a summary and connection rows. Every card of a kind shows the same rows in the same order (the part's card_schema), with "none stated" where the wiki gives nothing.
   Lines are drawn only for the selected card. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1c2420; --muted: #5c6863; --line: #d3d9d5; --lane: #e8ece8;
  --focus: #0f766e; --inferred: #9a6b1f;
  --r-northwind: #3f6f9f; --r-ironcrest: #a4522f; --r-greenvale: #5f9433; --r-highridge: #b98f22; --r-deepwood: #2e6a4d; --r-sunplains: #d0702a; --r-port: #6c4f9c; --r-spine: #7b6f64; --r-borderlands: #5c6863; --r-across: #5c6863;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
    --focus: #3cc4b3; --inferred: #e0a852;
    --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e3e9e5; --muted: #9ba8a2; --line: #303b36; --lane: #161b19;
  --focus: #3cc4b3; --inferred: #e0a852;
  --r-northwind: #78a7d6; --r-ironcrest: #df8a64; --r-greenvale: #9bcf6c; --r-highridge: #e3bf57; --r-deepwood: #6fbf94; --r-sunplains: #f2a066; --r-port: #ad92dc; --r-spine: #b3a699; --r-borderlands: #9ba8a2; --r-across: #9ba8a2; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.wrap { padding-inline: 16px; padding-block: 20px 40px; max-width: 1640px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; margin-bottom: 10px; }
.eyebrow { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.count { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.count b { font-family: var(--font-display); font-size: 1.3rem; margin-right: 4px; }
@media (max-width: 600px) { .counts { gap: 4px; } .count { padding: 2px 7px; font-size: 12px; } .count b { font-size: 1rem; } h1 { font-size: 1.8rem; } }
.controls { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 10px 0 12px; font-size: 13px; color: var(--muted); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.controls input[type=checkbox] { accent-color: var(--focus); }
.controls input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--focus); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.parts { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.partsw { display: inline-flex; align-items: center; gap: 2px; }
.only { font: inherit; font-size: 11px; border: 0; background: none; color: var(--focus); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 2px 3px; border-radius: 3px; }
.only:focus-visible, .seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.seg { display: inline-flex; align-items: center; gap: 6px; }
.seg span.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: 0; background: var(--surface); color: var(--ink); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--focus); color: var(--surface); }
.lane > h3 .num { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; font-size: 12px; color: var(--muted); margin-left: 4px; }
.section.flat { margin-top: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 82vh; }
.lanes { position: relative; display: flex; gap: 12px; padding: 10px; width: max-content; align-items: stretch; }
.lane { width: 208px; flex: none; background: var(--lane); border-radius: 8px; padding: 0 8px 10px; position: relative; } /* no z-index: cards must stack above the link lines, which sit above the lanes */
.lane > h3 { position: sticky; top: 0; z-index: 3; margin: 0 -8px 4px; padding: 9px 10px 7px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; background: var(--lane); border-radius: 8px 8px 0 0; border-top: 4px solid var(--lc); }
.section { margin-top: 8px; }
.sechead { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 2px 0 6px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; }
.sechead:hover { color: var(--ink); }
.sechead:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sechead .num { font-family: var(--font-body); letter-spacing: 0; font-weight: 400; font-size: 11px; }
.chev { display: inline-block; width: 10px; transition: transform .15s; flex: none; }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.section.shut .cards { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; margin-bottom: 6px; position: relative; z-index: 2; transition: opacity .15s, box-shadow .15s; }
.card:hover { box-shadow: 0 2px 10px rgb(0 0 0 / .1); }
.card .head { display: flex; align-items: stretch; }
.card .pick { flex: 1; min-width: 0; display: block; text-align: left; background: none; border: 0; padding: 7px 4px 7px 9px; cursor: pointer; border-radius: 6px 0 0 6px; }
.card .pick:focus-visible, .card .tog:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.card .tog { flex: none; width: 30px; background: none; border: 0; border-left: 1px solid transparent; cursor: pointer; color: var(--muted); border-radius: 0 6px 6px 0; font-size: 12px; }
.card .tog:hover { color: var(--ink); background: var(--bg); }
.card .k { display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .n { display: block; font-weight: 700; font-size: 14px; line-height: 1.25; margin-top: 1px; }
.card .body { padding: 0 9px 9px; }
.card .t { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
.card.region .n { font-family: var(--font-display); font-size: 19px; letter-spacing: .01em; }
.card.minor { border-style: dashed; border-left-style: solid; }
.card.minor .pick { padding-block: 5px; }
.card.minor .n { font-weight: 600; font-size: 13px; }
.card.minor .k { font-size: 10px; }
.card.saying .n { font-style: italic; font-weight: 600; }
.chip[hidden], .chiprow[hidden], .section[hidden], .lane[hidden], .card .body[hidden], [data-part][hidden] { display: none; }
.chips { display: grid; gap: 4px; margin-top: 7px; }
.chiprow { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
.chiprow b { font-weight: 600; color: var(--muted); margin-right: 2px; }
.chiprow .none { font-style: italic; opacity: .8; }
.chip { display: inline-flex; align-items: flex-start; max-width: 100%; gap: 4px; font-size: 11px; line-height: 1.2; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.chip small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.chip.inferred small { color: inherit; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dc); flex: none; margin-top: 3px; }
.chip > span { min-width: 0; }
.chip small { white-space: normal; }
.chip.likely, .chip.working { border-style: dashed; }
.chip.possible { border-style: dotted; }
.chip.inferred { border: 1px dashed var(--inferred); color: var(--inferred); background: transparent; }
svg.links { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg.links path { fill: none; stroke: var(--focus); stroke-width: 2; opacity: .85; }
svg.links path.inferred { stroke: var(--inferred); stroke-dasharray: 4 4; }
svg.links path.likely, svg.links path.working { stroke-dasharray: 8 5; }
svg.links path.possible { stroke-dasharray: 2 5; }
.board.focus .card:not(.hot) { opacity: .28; }
.card.sel { box-shadow: 0 0 0 3px var(--focus); }
.card.dimmed { display: none; }
aside.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 86vh; overflow: auto; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 2px 0 6px; line-height: 1.05; text-wrap: balance; }
.panel h4 { font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.panel dl { margin: 8px 0 0; }
.panel dt { font-size: 12px; color: var(--muted); }
.panel dd { margin: 0 0 6px; }
.panel dd.missing { color: var(--muted); font-style: italic; }
.panel .src { font-size: 12px; margin-left: 4px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conn { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
.conn.inferred { border-left-color: var(--inferred); }
.conn button { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.conn button:hover { text-decoration-color: var(--focus); }
.conn q { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.conn a { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.tag.inferred { color: var(--inferred); border-color: var(--inferred); }
.panel a { color: var(--focus); }
.status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.below section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.below h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 8px; }
.below h3 { font-family: var(--font-display); font-size: 1rem; margin: 12px 0 6px; letter-spacing: .02em; }
.below h3:first-of-type { margin-top: 0; }
.below ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
/* project health: status is ordinal (how settled), so one hue light-to-dark; non-canon is hatched, no label is gray */
:root { --h-est: var(--focus); --h-work: color-mix(in oklab, var(--focus) 62%, var(--surface)); --h-prov: color-mix(in oklab, var(--focus) 30%, var(--surface));
  --h-none: color-mix(in oklab, var(--muted) 38%, var(--surface)); --h-ref: repeating-linear-gradient(135deg, var(--muted) 0 1.5px, transparent 1.5px 5px); }
.below section.health { grid-column: 1 / -1; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-width: 120px; }
.tile b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.hgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.legend i, .seg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; align-items: center; margin-bottom: 7px; font-size: 12px; }
.srow .lbl { color: var(--ink); font-weight: 600; }
.sbar { display: flex; gap: 2px; height: 14px; }
.sbar span { display: block; height: 100%; min-width: 2px; }
.sbar span:first-child { border-radius: 4px 0 0 4px; } .sbar span:last-child { border-radius: 0 4px 4px 0; } .sbar span:only-child { border-radius: 4px; }
.srow small { grid-column: 2; color: var(--muted); font-size: 11px; }
table.cov { border-collapse: separate; border-spacing: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
table.cov th { font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; white-space: nowrap; }
table.cov thead th { font-family: var(--font-display); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; text-align: center; }
table.cov td { text-align: center; padding: 3px 6px; border-radius: 4px; color: var(--ink); min-width: 34px; }
table.cov td.zero { color: var(--muted); background: transparent; outline: 1px dashed var(--line); outline-offset: -1px; }
.covwrap { overflow-x: auto; }
.hlist { display: flex; flex-wrap: wrap; gap: 4px; }
.hdet { margin: 0 0 4px; } .hdet summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0; } .hdet summary small { color: var(--muted); font-weight: 400; margin-left: 4px; } .hdet .hlist { margin: 4px 0 6px; }
.hlist button { text-align: left; font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 8px; cursor: pointer; color: var(--ink); }
.hlist button:hover { border-color: var(--focus); }
.hlist button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hlist button small { color: var(--muted); }
.health h3 { font-family: var(--font-display); font-size: 1rem; margin: 4px 0 6px; }
.lonelyOn .card.lonely { outline: 2px dashed var(--inferred); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .card, .chev { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow" id="eyebrow">Atlas</span>
      <h1 id="title">Atlas</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="controls" id="controls">
    <input type="search" id="q" placeholder="Find anything…" aria-label="Find anything">
    <span class="seg" id="groupBy">Group by <span class="segs" role="group" aria-label="Group cards by"><button type="button" data-mode="region" aria-pressed="true">Region</button><button type="button" data-mode="kind" aria-pressed="false">Kind</button></span></span>
    <span class="parts" id="parts"></span>
    <label><input type="checkbox" id="optInferred"> Show inferred connections</label>
    <label><input type="checkbox" id="optLonely"> Mark unconnected cards</label>
    <button type="button" class="btn" id="expandAll">Open all cards</button>
  </div>
  <div class="layout">
    <div class="board" id="board"><div class="lanes" id="lanes"><svg class="links" id="links"></svg></div></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <div class="below">
    <section class="health" id="health" aria-labelledby="healthTitle"><h2 id="healthTitle">Project health</h2><div id="healthBody"></div><p class="note">Counted from the cards themselves, so it updates whenever the Atlas is rebuilt. Status is each card's wiki page label.</p></section>
    <section><h2>Gaps the wiki leaves open</h2><div id="gaps"></div><p class="note">What the wiki doesn't settle yet. Listed for decisions, never filled in.</p></section>
  </div>
</div>

<script>
const DATA = /*ATLAS_DATA*/null;
(function () {
  if (!DATA) return;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gh = (p) => DATA.repo + p;
  const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
  const laneOf = Object.fromEntries(DATA.lanes.map((l) => [l.id, l]));
  const colorVar = (laneId) => `var(--r-${laneId}, var(--r-across))`;
  const nodeColor = (n) => colorVar(n.lane);
  const SCHEMA = DATA.schema || {};
  const partOn = Object.fromEntries(DATA.parts.map((p) => [p.short, true]));
  const inferredOn = () => $("optInferred").checked;
  const visibleEdge = (e) => partOn[byId[e.from].part] && partOn[byId[e.to].part] && (e.basis === "stated" || inferredOn());

  $("eyebrow").textContent = DATA.eyebrow || "Atlas";
  $("title").textContent = DATA.title;
  $("sub").textContent = DATA.subtitle || "";
  const stated = DATA.edges.filter((e) => e.basis === "stated").length;
  $("counts").innerHTML = DATA.parts.map((p) => `<span class="count"><b>${DATA.nodes.filter((n) => n.part === p.short).length}</b>${esc(p.short.toLowerCase())}</span>`).join("") +
    `<span class="count"><b>${DATA.edges.length}</b>connections (${stated} stated)</span>`;
  $("parts").innerHTML = DATA.parts.length > 1 ? `Show: <button type="button" class="only" data-all>all</button> ` + DATA.parts.map((p) => `<span class="partsw"><label title="Part ${p.part}: ${esc(p.title)}"><input type="checkbox" data-part="${esc(p.short)}" checked> ${esc(p.short)}</label><button type="button" class="only" data-only="${esc(p.short)}" aria-label="Show only ${esc(p.short)}">only</button></span>`).join("") : "";

  // each end of a connection: which row it sits in, and a short note
  const end = (e, fromSide) => fromSide ? { row: e.chip || e.type, note: e.chipNote } : { row: e.chipBack || e.chip || e.type, note: e.chipNoteBack };

  // Two layouts over the same cards. Region: a column per region (plus Port, the Spine, the border towns,
  // cross-border columns later parts add, and the world as a whole), a heading per part and section.
  // Kind: a column per kind of thing; long columns get a heading per region; a part's kinds with only one or two
  // cards share a "<Part>: other" column so the board doesn't sprawl sideways.
  const lanesEl = $("lanes");
  const cardEls = {};
  let mode = "region";
  const kindOrder = [];
  DATA.nodes.forEach((n) => { if (!kindOrder.includes(n.kind)) kindOrder.push(n.kind); });
  const laneRank = Object.fromEntries(DATA.lanes.map((l, i) => [l.id, i]));
  function makeLane(label, color, count) {
    const lane = document.createElement("div");
    lane.className = "lane"; lane.style.setProperty("--lc", color);
    lane.innerHTML = `<h3>${esc(label)}${count != null ? `<span class="num">${count}</span>` : ""}</h3>`;
    return lane;
  }
  function makeSection(part, title, items) {
    const s = document.createElement("div");
    s.className = "section" + (title ? "" : " flat"); s.dataset.part = part;
    s.innerHTML = (title ? `<button type="button" class="sechead" aria-expanded="true"><span class="chev" aria-hidden="true">▸</span>${esc(title)} <span class="num">${items.length}</span></button>` : "") + `<div class="cards"></div>`;
    const box = s.querySelector(".cards");
    items.forEach((n) => box.appendChild(cardEls[n.id]));
    if (title) s.querySelector(".sechead").addEventListener("click", (ev) => {
      const open = s.classList.toggle("shut") === false;
      ev.currentTarget.setAttribute("aria-expanded", String(open));
      if (current) drawLinks(current);
    });
    return s;
  }
  function kindLine(n, withKind) {
    const where = mode === "kind" ? (withKind ? `${DATA.kinds[n.kind]} · ${laneOf[n.lane].label}` : laneOf[n.lane].label) : DATA.kinds[n.kind];
    return where + (n.when ? ` · ${n.when}` : "");
  }
  function layout(m) {
    mode = m;
    lanesEl.querySelectorAll(".lane").forEach((l) => l.remove());
    const more = new Set();
    if (m === "region") {
      DATA.lanes.forEach((l) => {
        const inLane = DATA.nodes.filter((n) => n.lane === l.id);
        if (!inLane.length) return;
        const lane = makeLane(l.label, colorVar(l.id));
        [...new Set(inLane.map((n) => n.part + "\u0000" + n.section))].forEach((key) => {
          const [part, sec] = key.split("\u0000");
          lane.appendChild(makeSection(part, sec, inLane.filter((n) => n.part === part && n.section === sec)));
        });
        lanesEl.appendChild(lane);
      });
    } else {
      const byRegion = (a, b) => laneRank[a.lane] - laneRank[b.lane];
      DATA.parts.forEach((p) => {
        const kinds = kindOrder.filter((k) => DATA.nodes.some((n) => n.kind === k && n.part === p.short));
        const small = [];
        const tiny = kinds.filter((k) => DATA.nodes.filter((n) => n.kind === k && n.part === p.short).length < 3);
        kinds.forEach((k) => {
          const items = DATA.nodes.filter((n) => n.kind === k && n.part === p.short).sort(byRegion);
          if (tiny.length > 1 && tiny.includes(k)) { small.push(...items); return; }
          const lane = makeLane(DATA.kinds[k], "var(--muted)", items.length);
          if (items.length > 10 && new Set(items.map((n) => n.lane)).size > 1) {
            DATA.lanes.forEach((l) => { const inL = items.filter((n) => n.lane === l.id); if (inL.length) lane.appendChild(makeSection(p.short, l.label, inL)); });
          } else if (items.length > 10) {
            // all in one column already (e.g. the Sunday Morning cast): keep that column's own headings
            [...new Set(items.map((n) => n.section))].forEach((sec) => lane.appendChild(makeSection(p.short, sec, items.filter((n) => n.section === sec))));
          } else lane.appendChild(makeSection(p.short, "", items));
          lanesEl.appendChild(lane);
        });
        if (small.length) {
          small.forEach((n) => more.add(n.id));
          const lane = makeLane(`${p.short}: other`, "var(--muted)", small.length);
          lane.appendChild(makeSection(p.short, "", small));
          lanesEl.appendChild(lane);
        }
      });
    }
    Object.entries(cardEls).forEach(([id, c]) => { c.querySelector(".k").textContent = kindLine(byId[id], more.has(id)); });
    document.querySelectorAll("#groupBy [data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  }

  function chipsFor(n) {
    const layout = (SCHEMA[n.kind] || { rows: [] }).rows;
    const skip = n.skip_rows || [];
    const rows = Object.fromEntries(layout.map((r) => [r.label, []]));
    DATA.edges.forEach((e) => {
      let other, side;
      if (e.from === n.id) { other = e.to; side = end(e, true); }
      else if (e.to === n.id) { other = e.from; side = end(e, false); }
      else return;
      if (e.hideChipOn && e.hideChipOn.includes(n.id)) return;
      const o = byId[other];
      const cert = e.certainty && e.certainty !== "established" ? e.certainty : "";
      const cls = [e.basis === "inferred" ? "inferred" : "", cert].join(" ");
      const goods = e.goods && e.chipGoods !== false ? ` <small>${esc(e.goods)}</small>` : "";
      const notes = [side.note, cert].filter(Boolean).join(", ");
      (rows[side.row] = rows[side.row] || []).push(`<span class="chip ${cls}" data-basis="${e.basis}" style="--dc:${nodeColor(o)}"><i></i><span>${esc(o.short || o.label)}${goods}${notes ? ` <small>(${esc(notes)})</small>` : ""}</span></span>`);
    });
    return layout.filter((r) => !skip.includes(r.label) && (rows[r.label].length || r.always)).map((r) =>
      `<span class="chiprow" data-rowpart="${esc(r.part)}"${r.always ? " data-always" : ""}><b>${esc(r.label)}</b>${rows[r.label].length ? rows[r.label].join("") + `<span class="none" hidden>none stated</span>` : `<span class="none">none stated</span>`}</span>`).join("");
  }
  function card(n) {
    const c = document.createElement("div");
    c.className = `card ${n.kind}${n.minor ? " minor" : ""}`;
    c.style.setProperty("--lc", nodeColor(n));
    c.dataset.id = n.id;
    const k = esc(DATA.kinds[n.kind]) + (n.when ? ` · ${esc(n.when)}` : "");
    const chips = chipsFor(n);
    const text = n.minor ? "" : `<span class="t">${esc(n.short_text || n.text)}</span>`;
    const hasBody = !!(text || chips);
    c.innerHTML = `<div class="head"><button type="button" class="pick"><span class="k">${k}</span><span class="n">${esc(n.label)}</span></button>` +
      (hasBody ? `<button type="button" class="tog" aria-expanded="false" aria-label="Show details for ${esc(n.label)}"><span class="chev" aria-hidden="true">▸</span></button>` : "") +
      `</div>` + (hasBody ? `<div class="body" hidden>${text}${chips ? `<span class="chips">${chips}</span>` : ""}</div>` : "");
    c.querySelector(".pick").addEventListener("click", () => select(n.id));
    if (hasBody) c.querySelector(".tog").addEventListener("click", () => { setOpen(c, c.querySelector(".body").hidden); if (current) drawLinks(current); });
    cardEls[n.id] = c;
    return c;
  }
  DATA.nodes.forEach((n) => card(n));
  function setOpen(c, open) {
    const body = c.querySelector(".body"), tog = c.querySelector(".tog");
    if (!body) return;
    body.hidden = !open;
    tog.setAttribute("aria-expanded", String(open));
    tog.setAttribute("aria-label", `${open ? "Hide" : "Show"} details for ${byId[c.dataset.id].label}`);
  }
  let allOpen = false;
  function expandAll(open) {
    allOpen = open;
    Object.values(cardEls).forEach((c) => setOpen(c, open));
    $("expandAll").textContent = open ? "Close all cards" : "Open all cards";
    if (current) drawLinks(current);
  }
  window.atlasExpandAll = expandAll;
  $("expandAll").addEventListener("click", () => expandAll(!allOpen));

  // what's showing: parts, inferred links, search
  function refresh() {
    const q = $("q").value.trim().toLowerCase();
    document.querySelectorAll(".section").forEach((s) => { s.hidden = !partOn[s.dataset.part]; });
    Object.entries(cardEls).forEach(([id, el]) => {
      const n = byId[id];
      const hay = [n.label, n.text, n.when || "", ...Object.values(n.facts || {})].join(" ").toLowerCase();
      el.classList.toggle("dimmed", !!q && !hay.includes(q));
    });
    // tags describe their own card, so they stay when the other end's part is off; inferred ones wait for the box
    document.querySelectorAll(".chip").forEach((c) => { c.hidden = c.dataset.basis === "inferred" && !inferredOn(); });
    document.querySelectorAll(".chiprow").forEach((r) => {
      const hasChips = !!r.querySelector(".chip"), anyShown = !!r.querySelector(".chip:not([hidden])");
      // an "always" row whose only tags are hidden inferred ones still says so, instead of vanishing
      r.hidden = !hasChips ? !partOn[r.dataset.rowpart] : anyShown ? false : !("always" in r.dataset) || !partOn[r.dataset.rowpart];
      const none = r.querySelector(".none");
      if (none && hasChips) none.hidden = anyShown;
    });
    lanesEl.querySelectorAll(".lane").forEach((l) => { l.hidden = !l.querySelector(".section:not([hidden])"); });
    writeHash();
    document.querySelectorAll("#gaps [data-part]").forEach((g) => { g.hidden = !partOn[g.dataset.part]; });
    if (current && !partOn[byId[current].part]) select(null); else if (current) select(current);
  }
  window.atlasShowOnly = (short) => showOnly([short]);

  // lines for the selected card only
  const board = $("board"), svg = $("links");
  function drawLinks(id) {
    svg.innerHTML = "";
    if (!id) return;
    const W = lanesEl.scrollWidth, H = lanesEl.scrollHeight;
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const base = lanesEl.getBoundingClientRect();
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    const a = box(cardEls[id]);
    DATA.edges.forEach((e) => {
      if (e.from !== id && e.to !== id) return;
      if (!visibleEdge(e)) return;
      const other = e.from === id ? e.to : e.from;
      const el = cardEls[other];
      if (!el || el.offsetParent === null) return;
      const b = box(el);
      const right = b.x > a.x + a.w / 2;
      const sameLane = Math.abs(b.x - a.x) < 20;
      const ya = a.y + Math.min(a.h / 2, 24), yb = b.y + Math.min(b.h / 2, 24);
      let d;
      if (sameLane) {
        const x = a.x + a.w;
        d = `M${x},${ya} C${x + 40},${ya} ${x + 40},${yb} ${x},${yb}`;
      } else {
        const sx = right ? a.x + a.w : a.x, tx = right ? b.x : b.x + b.w;
        const dx = Math.max(40, Math.abs(tx - sx) / 2.5) * (right ? 1 : -1);
        d = `M${sx},${ya} C${sx + dx},${ya} ${tx - dx},${yb} ${tx},${yb}`;
      }
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("class", `${e.basis === "inferred" ? "inferred" : ""} ${e.certainty || ""}`);
      svg.appendChild(p);
    });
  }

  let current = null;
  const layerName = Object.fromEntries((DATA.layers || []).map((l) => [l.id, l.label]));
  const pageName = (s) => s.split("#")[0].split("/").pop().replace(/\.md$/, "").replace(/-/g, " ");
  function select(id) {
    current = id;
    Object.values(cardEls).forEach((c) => c.classList.remove("hot", "sel"));
    board.classList.toggle("focus", !!id);
    if (!id) { drawLinks(null); intro(); return; }
    const n = byId[id];
    cardEls[id].classList.add("hot", "sel");
    DATA.edges.filter((e) => (e.from === id || e.to === id) && visibleEdge(e)).forEach((e) => { const o = e.from === id ? e.to : e.from; cardEls[o] && cardEls[o].classList.add("hot"); });
    drawLinks(id);
    const groups = {};
    DATA.edges.filter((e) => e.from === id || e.to === id).forEach((e) => { (groups[e.group || e.layer] = groups[e.group || e.layer] || []).push(e); });
    const fs = n.fact_src || {}, fv = n.facts || {};
    const layout = ((SCHEMA[n.kind] || {}).facts || []).filter((f) => fv[f.key] || f.always);
    const facts = layout.length ? `<dl>${layout.map((f) => fv[f.key]
      ? `<dt>${esc(f.key)}</dt><dd>${esc(fv[f.key])}${fs[f.key] ? `<a class="src" href="${gh(fs[f.key])}" target="_blank" rel="noopener">source</a>` : ""}</dd>`
      : `<dt>${esc(f.key)}</dt><dd class="missing">Not in the wiki yet.</dd>`).join("")}</dl>` : "";
    const html = Object.entries(groups).map(([g, es]) => `<h4>${esc(layerName[g] || g)}</h4><ul>${es.map((e) => {
      const other = e.from === id ? e.to : e.from;
      const lab = e.from === id ? e.type : (e.chipBack || e.type);
      return `<li class="conn ${e.basis}"><span>${esc(lab)} </span><button type="button" data-go="${other}">${esc(byId[other].label)}</button>${e.goods ? `: ${esc(e.goods)}` : ""}${e.certainty && e.certainty !== "established" ? `<span class="tag">${esc(e.certainty)}</span>` : ""}${e.basis === "inferred" ? `<span class="tag inferred">inferred</span>` : ""}<q>${esc(e.quote)}</q><a href="${gh(e.src)}" target="_blank" rel="noopener">source</a>${(e.also || []).map((a) => `<q>Also: ${esc(a.quote)}${a.note ? " (" + esc(a.note) + ")" : ""}</q><a href="${gh(a.src)}" target="_blank" rel="noopener">source</a>`).join("")}</li>`;
    }).join("")}</ul>`).join("");
    const see = (n.see || []).length ? ` · also on ${n.see.map((s) => `<a href="${gh(s)}" target="_blank" rel="noopener">${esc(pageName(s))}</a>`).join(", ")}` : "";
    $("panel").innerHTML = `<span class="eyebrow">${esc(DATA.kinds[n.kind])}${n.when ? " · " + esc(n.when) : ""} · ${esc(laneOf[n.lane].label)}</span><h2>${esc(n.label)}</h2>
      <span class="status">${esc(n.status)}</span><p>${esc(n.text)}</p>${facts}${html}
      <h4>Source</h4><a href="${gh(n.src)}" target="_blank" rel="noopener">Read it on the wiki</a>${see}`;
    $("panel").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToCard(b.dataset.go); }));
  }
  function scrollToCard(id) {
    const el = cardEls[id]; if (!el) return;
    const sec = el.closest(".section");
    if (sec && sec.classList.contains("shut")) { sec.classList.remove("shut"); sec.querySelector(".sechead").setAttribute("aria-expanded", "true"); drawLinks(current); }
    const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.left < br.left || r.right > br.right || r.top < br.top || r.bottom > br.bottom)
      board.scrollBy({ left: r.left - br.left - br.width / 3, top: r.top - br.top - 60, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function intro() {
    $("panel").innerHTML = `<span class="eyebrow">How to read it</span><h2>${esc(DATA.title)}</h2><p>${esc(DATA.intro || "")}</p>`;
  }
  board.addEventListener("click", (ev) => { if (!ev.target.closest(".card") && !ev.target.closest(".sechead")) select(null); });

  // Shareable state: #part=Food (one or more parts, comma-separated) and #group=kind. The grouping is also
  // remembered per viewer; the link wins when it says something.
  function writeHash() {
    try {
      const on = DATA.parts.filter((p) => partOn[p.short]).map((p) => p.short);
      const q = [];
      if (on.length && on.length < DATA.parts.length) q.push("part=" + on.map(encodeURIComponent).join(","));
      if (mode === "kind") q.push("group=kind");
      history.replaceState(null, "", location.pathname + location.search + (q.length ? "#" + q.join("&") : ""));
    } catch (e) { /* some hosts don't allow it; the board still works */ }
  }
  function readHash() {
    const out = {};
    try {
      location.hash.slice(1).split("&").forEach((kv) => { const [k, v] = kv.split("="); if (k && v) out[k] = decodeURIComponent(v); });
    } catch (e) { /* ignore */ }
    return out;
  }
  function setGroup(m) {
    const keep = current;
    layout(m);
    try { localStorage.setItem("atlas-group", m); } catch (e) { /* per-viewer nicety only */ }
    refresh();
    if (allOpen) expandAll(true);
    if (keep && byId[keep] && partOn[byId[keep].part]) { select(keep); scrollToCard(keep); }
  }
  function showOnly(shorts) {
    Object.keys(partOn).forEach((k) => { partOn[k] = shorts.includes(k); });
    document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; });
    refresh();
  }
  document.querySelectorAll("#groupBy [data-mode]").forEach((b) => b.addEventListener("click", () => setGroup(b.dataset.mode)));
  document.querySelectorAll("[data-only]").forEach((b) => b.addEventListener("click", () => showOnly([b.dataset.only])));
  document.querySelectorAll("[data-all]").forEach((b) => b.addEventListener("click", () => showOnly(Object.keys(partOn))));
  window.atlasGroupBy = (m) => { layout(m); refresh(); };

  $("q").addEventListener("input", refresh);
  $("optInferred").addEventListener("change", refresh);
  document.querySelectorAll("input[data-part]").forEach((c) => c.addEventListener("change", () => { partOn[c.dataset.part] = c.checked; refresh(); }));
  window.addEventListener("resize", () => { if (current) drawLinks(current); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current) drawLinks(current); });

  $("gaps").innerHTML = DATA.gaps.filter((g) => g.items.length).map((g) => `<div data-part="${esc(g.part)}"><h3>${esc(g.title)}</h3><ul>${g.items.map((x) => `<li>${esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`).join("")}</ul></div>`).join("");
  // ---- project health, computed from the same data the cards use ----
  const degree = {};
  DATA.edges.forEach((e) => { degree[e.from] = (degree[e.from] || 0) + 1; degree[e.to] = (degree[e.to] || 0) + 1; });
  function blanks(n) {
    const sch = SCHEMA[n.kind] || { rows: [], facts: [] };
    const have = new Set();
    DATA.edges.forEach((e) => { if (e.from === n.id) have.add(end(e, true).row); if (e.to === n.id) have.add(end(e, false).row); });
    const rows = sch.rows.filter((r) => r.always && !(n.skip_rows || []).includes(r.label) && !have.has(r.label)).map((r) => r.label);
    const facts = (sch.facts || []).filter((f) => f.always && !(n.facts || {})[f.key]).map((f) => f.key);
    return rows.concat(facts);
  }
  const BUCKETS = [["Established", "var(--h-est)"], ["Working canon", "var(--h-work)"], ["Provisional", "var(--h-prov)"], ["No status label", "var(--h-none)"], ["Writing reference", "var(--h-ref)"]];
  const BUCKET_NOTE = { "Writing reference": "Writing reference (Sunday Morning, not canon)" };
  const bucketOf = (s) => { s = s.toLowerCase(); return s.startsWith("established") || s.startsWith("core function established") ? "Established" : s.startsWith("working canon") ? "Working canon" : s.startsWith("provisional") ? "Provisional" : s.startsWith("writing reference") ? "Writing reference" : "No status label"; };
  const swatch = (c) => `<i style="background:${c}"></i>`;
  function health() {
    const N = DATA.nodes, stated = DATA.edges.filter((e) => e.basis === "stated").length;
    const qs = N.filter((n) => n.kind === "question").length;
    const gapCount = DATA.gaps.reduce((a, g) => a + g.items.length, 0);
    const lonely = N.filter((n) => !degree[n.id]);
    const tiles = [[N.length, "things mapped"], [DATA.edges.length, `connections (${Math.round(100 * stated / DATA.edges.length)}% stated in the wiki)`],
      [qs, "open questions"], [gapCount, "gaps listed"], [lonely.length, "cards with no connection yet"]];
    const status = DATA.parts.map((p) => {
      const inP = N.filter((n) => n.part === p.short), c = {};
      inP.forEach((n) => { const b = bucketOf(n.status); c[b] = (c[b] || 0) + 1; });
      const segs = BUCKETS.filter(([b]) => c[b]).map(([b, col]) => `<span style="flex:${c[b]};background:${col}" title="${esc(p.short)}: ${c[b]} ${esc(b)}"></span>`).join("");
      const words = BUCKETS.filter(([b]) => c[b]).map(([b]) => `${c[b]} ${b.toLowerCase()}`).join(" · ");
      return `<div class="srow"><span class="lbl">${esc(p.short)}</span><span class="sbar" role="img" aria-label="${esc(p.short)}: ${esc(words)}">${segs}</span><small>${esc(words)}</small></div>`;
    }).join("");
    const lanesUsed = DATA.lanes.filter((l) => N.some((n) => n.lane === l.id));
    let max = 0;
    const cnt = (l, p) => N.filter((n) => n.lane === l && n.part === p).length;
    lanesUsed.forEach((l) => DATA.parts.forEach((p) => { max = Math.max(max, cnt(l.id, p.short)); }));
    const cov = `<div class="covwrap"><table class="cov"><caption class="note" style="caption-side:bottom;text-align:left">Cards per column and part. Dashed cells are empty: nothing from that part lives in that column yet.</caption><thead><tr><th></th>${DATA.parts.map((p) => `<th scope="col">${esc(p.short)}</th>`).join("")}</tr></thead><tbody>` +
      lanesUsed.map((l) => `<tr><th scope="row">${esc(l.label)}</th>${DATA.parts.map((p) => { const v = cnt(l.id, p.short);
        return v ? `<td style="background:color-mix(in oklab, var(--focus) ${Math.round(8 + 40 * v / max)}%, var(--surface))" title="${esc(l.label)} · ${esc(p.short)}: ${v}">${v}</td>` : `<td class="zero" title="${esc(l.label)} · ${esc(p.short)}: none">·</td>`; }).join("")}</tr>`).join("") + `</tbody></table></div>`;
    const btn = (n, extra) => `<button type="button" data-hgo="${esc(n.id)}">${esc(n.label)}${extra ? ` <small>${esc(extra)}</small>` : ""}</button>`;
    const lonelyHtml = DATA.parts.map((p) => { const xs = lonely.filter((n) => n.part === p.short); return xs.length ? `<details class="hdet"><summary>${esc(p.short)} <small>${xs.length}</small></summary><div class="hlist">${xs.map((n) => btn(n)).join("")}</div></details>` : ""; }).join("") || `<p class="note">Every card has at least one connection.</p>`;
    const blanky = N.map((n) => [n, blanks(n)]).filter(([, b]) => b.length).sort((a, b) => b[1].length - a[1].length).slice(0, 18);
    const blankHtml = `<div class="hlist">${blanky.map(([n, b]) => btn(n, `${b.length} blank`)).join("")}</div>`;
    $("healthBody").innerHTML = `<div class="tiles">${tiles.map(([v, t]) => `<div class="tile"><b>${v}</b><span>${esc(t)}</span></div>`).join("")}</div>
      <div class="hgrid"><div><h3>How settled each part is</h3><div class="legend">${BUCKETS.map(([b, c]) => `<span>${swatch(c)}${esc(BUCKET_NOTE[b] || b)}</span>`).join("")}</div>${status}</div>
      <div><h3>Where the cards are</h3>${cov}</div></div>
      <div class="hgrid" style="margin-top:10px"><div><h3>No connections yet</h3>${lonelyHtml}<p class="note">Some are fine on their own (a saying, a festival); others are things the wiki hasn't tied to anything yet. "Mark unconnected cards" outlines them on the board.</p></div>
      <div><h3>Most "none stated" rows and missing facts</h3>${blankHtml}<p class="note">A card's always-shown rows and facts that the wiki leaves empty.</p></div></div>`;
    $("healthBody").querySelectorAll("[data-hgo]").forEach((b) => b.addEventListener("click", () => {
      const n = byId[b.dataset.hgo];
      if (!partOn[n.part]) { partOn[n.part] = true; document.querySelectorAll(`input[data-part="${n.part}"]`).forEach((c) => { c.checked = true; }); refresh(); }
      select(n.id); scrollToCard(n.id); board.scrollIntoView({ block: "nearest" });
    }));
  }
  Object.entries(cardEls).forEach(([id, c]) => c.classList.toggle("lonely", !degree[id]));
  $("optLonely").addEventListener("change", () => document.body.classList.toggle("lonelyOn", $("optLonely").checked));
  health();

  const start = readHash();
  let group = start.group === "kind" || start.group === "region" ? start.group : null;
  if (!group) { try { group = localStorage.getItem("atlas-group"); } catch (e) { group = null; } }
  layout(group === "kind" ? "kind" : "region");
  if (start.part) {
    const want = start.part.split(",").map((x) => x.trim().toLowerCase());
    const hit = Object.keys(partOn).filter((k) => want.includes(k.toLowerCase()));
    if (hit.length) Object.keys(partOn).forEach((k) => { partOn[k] = hit.includes(k); });
    document.querySelectorAll("input[data-part]").forEach((c) => { c.checked = partOn[c.dataset.part]; });
  }
  select(null);
  refresh();
})();
</script>

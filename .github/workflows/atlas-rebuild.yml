name: Rebuild Atlas for reconciliation
on:
  push:
    branches:
      - reconcile-structural-systems-20261022
    paths:
      - "atlas/systems/systems.json"
      - ".github/workflows/atlas-rebuild.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconcile-structural-systems-20261022
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Atlas rendering dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate Atlas sources and regenerate derived files
        run: python3 atlas/tools/atlas_part.py
      - name: Commit regenerated derived views to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/
          if ! git diff --cached --quiet; then
            git commit -m "atlas: regenerate views from validated part data"
            git push origin HEAD:reconcile-structural-systems-20261022
          fi
